<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>ころり、ことん！毛糸玉のひっくりかえる椅子工房</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#efe6d3;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;outline:none}
#sa{position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
// ====================================================================
//  helpers / palette  (yarn: ecru cloth, mustard / teal / dark-brown yarn, pink accent only)
// ====================================================================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const C={
  ecru:'#efe6d3',lin:'#e2d5bb',lin2:'#d8c9ab',cream:'#f8f1e0',cream2:'#eadcbc',
  mus:'#d6a02a',musD:'#a07014',musL:'#efcf78',
  tea:'#2c8a85',teaD:'#1b5d59',teaL:'#8ec8bf',
  bro:'#6a4630',broD:'#3f2819',broL:'#a27c5d',broM:'#86603f',
  pink:'#e1889a',ink:'#2f1d12',floor:'#8a6446',floorD:'#6d4d34'
};
const INK=[C.mus,C.tea,C.bro];
const INKD=[C.musD,C.teaD,C.broD];
const LAYC=[C.tea,C.mus,C.broM];
const LAYD=[C.teaD,C.musD,C.broD];

// oblique orthographic camera (tilt about X), assembly rotates about the depth axis (Z)
const CA=Math.cos(38*Math.PI/180),SA=Math.sin(38*Math.PI/180);
// assembly geometry (units)
const R0=95;                 // ball radius
const BX=460,BT=25,BD=230;   // board half length / half thickness / half depth
const CUX=230,CUZ=160,CUY=95,CUF=170; // cushion half width, half depth, top(under seat panel), front-face z
const CORE=34,LAYH=16,MAXL=10;
const STX=-300,STZ=10;      // stamp
const ANX0=-405,ANX1=-195,ANY=-335;
const SPX=310,SPY=-150,SPZ=200; // spool (= backrest hinge)
const BRL=230,BRT=70;         // backrest length/thickness
const NEST={x:-372,z:-128};
const DIM={x:0,z:-50,r0:85,r1:170};
const HANDX=-470;

// ====================================================================
//  canvas / layout
// ====================================================================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
let W=1,H=1,DPR=1;
const L={s:0.5,ox:0,oy:0,rowY:0,basket:{x:0,y:0},cloth:{x:0,y:0},mini:{x:0,y:0},sa:{t:0,r:0,b:0,l:0},gy:0};
let bgC=null;
function layout(){
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  const cs=getComputedStyle(saEl);
  const sa={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
  L.sa=sa;
  const avW=W-sa.l-sa.r-12,avH=H-sa.t-sa.b-12;
  const needTop=420,needBot=720,needW=1110;
  let s=Math.min(avW/needW,avH/(needTop+needBot));
  s=Math.max(0.12,Math.min(s,1.15));
  L.s=s;
  const blockH=(needTop+needBot)*s;
  const extra=avH-blockH;
  L.ox=sa.l+6+avW/2-14*s;
  L.oy=sa.t+6+extra*0.5+needTop*s;
  L.rowY=Math.min(H-sa.b-14*s-8, L.oy+640*s+extra*0.22);
  L.hoop=(L.oy-330*s-sa.t>150)?{x:L.ox,y:sa.t+(L.oy-330*s-sa.t)*0.58,r:Math.min(110,(L.oy-330*s-sa.t)*0.3)}:null;
  L.basket={x:L.ox,y:L.rowY};
  L.cloth={x:L.ox-455*s,y:L.rowY};
  L.mini={x:L.ox+470*s,y:L.rowY};
  L.gy=sa.t+Math.max(10,Math.min(40*s+8,(L.oy-330*s-sa.t)*0.35));
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  makeBg();
}
function linenPattern(){
  const c=document.createElement('canvas');c.width=48;c.height=48;const x=c.getContext('2d');
  x.fillStyle=C.ecru;x.fillRect(0,0,48,48);
  x.globalAlpha=0.55;
  for(let i=0;i<48;i+=3){x.fillStyle=(i%6)?C.lin:C.lin2;x.fillRect(0,i,48,1);x.fillRect(i,0,1,48);}
  x.globalAlpha=0.25;x.fillStyle='#fff';
  for(let i=0;i<40;i++){x.fillRect(Math.random()*48|0,Math.random()*48|0,2,1);}
  return c;
}
function feltPattern(base,dot){
  const c=document.createElement('canvas');c.width=40;c.height=40;const x=c.getContext('2d');
  x.fillStyle=base;x.fillRect(0,0,40,40);x.globalAlpha=0.18;x.strokeStyle=dot;x.lineWidth=1;
  for(let i=0;i<70;i++){const a=Math.random()*40,b=Math.random()*40,r=Math.random()*TAU;x.beginPath();x.moveTo(a,b);x.lineTo(a+Math.cos(r)*3,b+Math.sin(r)*3);x.stroke();}
  return c;
}
let floorPat=null;
function makeBg(){
  bgC=document.createElement('canvas');bgC.width=cv.width;bgC.height=cv.height;
  const x=bgC.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);
  const lp=x.createPattern(linenPattern(),'repeat');
  x.fillStyle=lp;x.fillRect(0,0,W,H);
  // floor plane: wall/floor boundary is the floor line far behind the stand
  const fy=L.oy+(440*CA-260*SA)*L.s;
  const fp=x.createPattern(feltPattern(C.floor,C.floorD),'repeat');
  x.fillStyle=fp;x.fillRect(0,fy,W,H-fy);
  const g=x.createLinearGradient(0,fy,0,fy+60*L.s+10);g.addColorStop(0,'rgba(60,35,20,0.35)');g.addColorStop(1,'rgba(60,35,20,0)');
  x.fillStyle=g;x.fillRect(0,fy,W,60*L.s+10);
  // stitched skirting edge
  x.strokeStyle=C.mus;x.lineWidth=Math.max(2,6*L.s);x.setLineDash([Math.max(4,16*L.s),Math.max(3,10*L.s)]);
  x.beginPath();x.moveTo(0,fy+Math.max(3,8*L.s));x.lineTo(W,fy+Math.max(3,8*L.s));x.stroke();x.setLineDash([]);
  x.strokeStyle=C.broD;x.lineWidth=Math.max(1.5,4*L.s);x.beginPath();x.moveTo(0,fy);x.lineTo(W,fy);x.stroke();
  // soft rug in front
  x.save();x.translate(L.ox,L.rowY+8*L.s);x.scale(1,0.22);
  x.fillStyle='rgba(239,207,120,0.35)';x.beginPath();x.arc(0,0,560*L.s,0,TAU);x.fill();
  x.strokeStyle='rgba(160,112,20,0.5)';x.lineWidth=Math.max(2,8*L.s);x.setLineDash([18*L.s+4,12*L.s+3]);x.stroke();x.setLineDash([]);
  x.restore();
  floorPat=fp;
}

// ====================================================================
//  audio (Web Audio synthesis only)
// ====================================================================
let AC=null,MG=null,NB=null;
function audioStart(){
  try{
    if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();
      MG=AC.createGain();MG.gain.value=0.7;
      const cp=AC.createDynamicsCompressor();cp.threshold.value=-16;cp.ratio.value=4;
      MG.connect(cp);cp.connect(AC.destination);
      NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(AC.state==='suspended')AC.resume().catch(()=>{});
  }catch(e){AC=null;}
}
function osc(type,f0,f1,dur,vol,delay,att){
  if(!AC)return;try{
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(att||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+0.05);}catch(e){}
}
function nz(dur,ft,f0,f1,q,vol,delay){
  if(!AC||!NB)return;try{
  const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;f.type=ft;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*0.4);s.stop(t+dur+0.05);}catch(e){}
}
const SND={
  stamp(d){const m=1.25-0.35*clamp(d,0,1);osc('sine',165*m,62*m,0.24,0.6);osc('sine',330*m,120*m,0.08,0.12);nz(0.07,'lowpass',700,180,0.8,0.25);},
  spool(th){const p=1+th*0.05;nz(0.26,'bandpass',1250*p,2300*p,2.4,0.22);osc('triangle',300*p,270*p,0.14,0.035);},
  bell(lv){const f=1480*Math.pow(1.12,lv);osc('sine',f,f,1.3,0.2);osc('sine',f*1.5,f*1.497,0.8,0.08);osc('sine',f*2.76,f*2.75,0.35,0.035);},
  tick(){osc('triangle',500+rnd(-50,50),440,0.05,0.04);},
  thud(v){v=v||1;osc('sine',150,58,0.22,0.36*v);nz(0.09,'lowpass',520,140,0.8,0.16*v);},
  whoosh(){nz(0.8,'bandpass',260,1700,1.1,0.2);osc('triangle',220,440,0.7,0.05);},
  stretch(){nz(0.14,'bandpass',420,640,5,0.07);},
  fluff(){nz(0.4,'lowpass',1500,260,0.7,0.24);osc('sine',520,820,0.22,0.06);},
  seam(){osc('triangle',360,290,0.09,0.09);nz(0.04,'lowpass',400,200,1,0.06);},
  cover(){[523,659,784].forEach((f,i)=>osc('triangle',f,f,0.28,0.12,i*0.07));},
  success(){[523,659,784,1047,1319].forEach((f,i)=>osc('triangle',f,f*1.003,0.55,0.13,i*0.085));},
  pick(){osc('sine',420,580,0.09,0.08);},
  wiggle(){osc('triangle',700,640,0.06,0.03);},
  full(){osc('sine',880,1320,0.18,0.06);}
};

// ====================================================================
//  state
// ====================================================================
function newChair(){return{marks:[],anvil:[],cover:{p:0,w:0.55},layers:[],level:0,rows:[],cords:0,flaps:0,reuse:0,sat:false};}
function cloneChair(c){return JSON.parse(JSON.stringify(c));}
function progress(c){return c.marks.length>0||c.layers.length>0||c.level>0||c.cover.p>0;}
const S={
  mode:'work',theta:0,flip:null,pull:0,
  chair:newChair(),floor:null,
  t:0,idle:0,anyInput:false,everPress:false,everFlip:false,everSat:false,everSeam:false,everReuse:false,everNew:false,everPrevSit:false,
  demo:null,demoDone:false,
  lastTool:null,stampSince:false,bellSince:false,
  sinkA:0,sinkV:0,bump:0,
  storageOK:true,loadStatus:'none',
  frame:0,
  coverFx:0,sewFx:[],
  target:null,
  wig:{},
};
const T={st:{a:0,on:false,ph:0,anim:0,ev:0},be:{a:0,on:false,ph:0,sw:0,swv:0,ev:0},sp:{a:0,on:false,ph:0,rot:0,spin:0,jig:0,ev:0}};
const MT={be:{sw:0,swv:0},sp:{rot:0,spin:0},st:{anim:0}}; // mini chair tools
const ball={st:'board',bx:NEST.x,bz:NEST.z,vx:0,vz:0,wob:0,wph:0,held:false,sq:0,sqv:0,roll:0,
  tuft:{x:0,y:0,vx:0,vy:0},look:{x:0,y:0},sx:0,sy:0,fx:0,fy:0,hop:null,sit:null,dist:0,lastWobSide:0,mood:0,blink:0,face:0};
const handle={drag:false,sw:0,swv:0,fx:0,fy:0};
const objs={cloth:{x:0,y:0,drag:false,ox:0,oy:0,ret:0},mini:{drag:false,x:0,y:0,ox:0,oy:0}};
const parts=[];const MAXP=60;

// ====================================================================
//  storage (validated, in-memory fallback)
// ====================================================================
const KEY='gf261106-21-chair';
function isNum(v,a,b){return typeof v==='number'&&isFinite(v)&&v>=a&&v<=b;}
function validChair(c){
  if(!c||typeof c!=='object')return null;
  try{
    const o=newChair();
    if(!Array.isArray(c.marks)||c.marks.length>40)return null;
    for(const m of c.marks){if(!m||!isNum(m.u,0,1)||!isNum(m.v,0,1)||!isNum(m.s,0.3,2)||!isNum(m.c,0,2)||!isNum(m.k,0,1))return null;o.marks.push({u:m.u,v:m.v,s:m.s,c:Math.round(m.c),k:Math.round(m.k)});}
    if(!Array.isArray(c.layers)||c.layers.length>MAXL)return null;
    for(const l of c.layers){if(!isNum(l,0,2))return null;o.layers.push(Math.round(l));}
    if(!c.cover||!isNum(c.cover.p,0,1)||!isNum(c.cover.w,0.3,1))return null;
    o.cover={p:c.cover.p,w:c.cover.w};
    if(!isNum(c.level,0,4))return null;o.level=Math.round(c.level);
    if(!Array.isArray(c.rows)||c.rows.length>4)return null;
    for(const r of c.rows){if(r!=='d'&&r!=='s'&&r!=='p')return null;o.rows.push(r);}
    if(o.rows.length>o.level)o.rows.length=o.level;while(o.rows.length<o.level)o.rows.push('p');
    if(!isNum(c.cords,0,6)||!isNum(c.flaps,0,6))return null;
    o.cords=Math.round(c.cords);o.flaps=Math.round(c.flaps);o.sat=true;
    return o;
  }catch(e){return null;}
}
function loadKeep(){
  let raw=null;
  try{raw=window.localStorage.getItem(KEY);}catch(e){S.storageOK=false;S.loadStatus='blocked';return null;}
  if(raw==null){S.loadStatus='none';return null;}
  let o=null;try{o=JSON.parse(raw);}catch(e){o=null;}
  const c=(o&&o.v===1)?validChair(o.chair):null;
  if(!c){S.loadStatus='broken';try{window.localStorage.removeItem(KEY);}catch(e){}return null;}
  S.loadStatus='restored';return c;
}
function saveKeep(c){
  if(!S.storageOK)return false;
  try{const k=cloneChair(c);k.anvil=[];window.localStorage.setItem(KEY,JSON.stringify({v:1,chair:k}));return true;}
  catch(e){S.storageOK=false;return false;}
}

// ====================================================================
//  projection
// ====================================================================
const MV={ox:0,oy:0,s:1,th:0,k:1};
const MiniV={ox:0,oy:0,s:1,th:Math.PI,k:1};
function P(V,X,Y,Z){const c=Math.cos(V.th),n=Math.sin(V.th),se=V.s*V.k;const xr=X*c-Y*n,yr=X*n+Y*c;return[V.ox+se*xr,V.oy-se*(yr*CA-Z*SA)];}
function setXY(V,Z){const c=Math.cos(V.th),n=Math.sin(V.th),se=V.s*V.k;
  ctx.setTransform(DPR*se*c,DPR*(-se*CA*n),DPR*(-se*n),DPR*(-se*CA*c),DPR*V.ox,DPR*(V.oy+se*Z*SA));}
function setXZ(V,Y){const c=Math.cos(V.th),n=Math.sin(V.th),se=V.s*V.k;
  ctx.setTransform(DPR*se*c,DPR*(-se*CA*n),0,DPR*se*SA,DPR*(V.ox-se*Y*n),DPR*(V.oy-se*CA*Y*c));}
function scr(){ctx.setTransform(DPR,0,0,DPR,0,0);}
function cushH(c){return CORE+LAYH*c.layers.length;}

// ====================================================================
//  particles (fibre bits)
// ====================================================================
function fibres(x,y,n,cols,spd){
  for(let i=0;i<n;i++){
    if(parts.length>=MAXP)parts.shift();
    const a=rnd(0,TAU),v=rnd(0.3,1)*(spd||160)*L.s+20;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40*L.s,life:rnd(0.6,1.1),t:0,r:rnd(0,TAU),vr:rnd(-6,6),c:cols[i%cols.length],len:rnd(6,14)*Math.max(0.6,L.s*1.6)});
  }
}
function updParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;if(p.t>=p.life){parts.splice(i,1);continue;}
    p.vx*=Math.exp(-2.2*dt);p.vy=p.vy*Math.exp(-2.2*dt)+90*L.s*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;}
}
function drawParts(){
  scr();ctx.lineCap='round';
  for(const p of parts){const a=1-p.t/p.life;ctx.globalAlpha=a;ctx.strokeStyle=p.c;ctx.lineWidth=Math.max(1.5,3*L.s*1.4);
    ctx.beginPath();const dx=Math.cos(p.r)*p.len,dy=Math.sin(p.r)*p.len;
    ctx.moveTo(p.x-dx/2,p.y-dy/2);ctx.quadraticCurveTo(p.x+dy*0.4,p.y-dx*0.4,p.x+dx/2,p.y+dy/2);ctx.stroke();}
  ctx.globalAlpha=1;
}

// ====================================================================
//  board sink field
// ====================================================================
function ballDispX(){return ball.bx+ball.wob;}
function sinkAt(X,Z){
  if(ball.st!=='board'&&ball.st!=='hopOn')return S.sinkA>0.3?S.sinkA*Math.exp(-((X-ball.bx)*(X-ball.bx))/(260*260)-((Z-ball.bz)*(Z-ball.bz))/(300*300)):0;
  const dx=X-ballDispX(),dz=Z-ball.bz;
  return S.sinkA*Math.exp(-(dx*dx)/(260*260)-(dz*dz)/(300*300));
}
function inNest(){const dx=ball.bx-NEST.x,dz=ball.bz-NEST.z;return dx*dx+dz*dz<55*55;}

// ====================================================================
//  drawing: small yarn primitives
// ====================================================================
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function runStitch(x0,y0,x1,y1,col,lw,dash,gap){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash([dash,gap]);ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.stroke();ctx.setLineDash([]);}
// knit "V" texture over a local rectangle (in current transform)
function knit(x0,y0,x1,y1,step,col,lw){
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();
  const sx=Math.sign(x1-x0)||1,sy=Math.sign(y1-y0)||1;
  for(let y=y0+step*0.5*sy;(y-y1)*sy<0;y+=step*sy){
    for(let x=x0+step*0.5*sx;(x-x1)*sx<0;x+=step*sx){
      ctx.moveTo(x-step*0.32,y-step*0.28*sy);ctx.lineTo(x,y+step*0.28*sy);ctx.lineTo(x+step*0.32,y-step*0.28*sy);
    }
  }
  ctx.stroke();
}
// rosette mark (stamped knit flower) in XZ or XY plane
function mark(x,y,r,c,k){
  if(k===1){ // sewn version: running stitch outlines
    ctx.strokeStyle=INK[c];ctx.lineWidth=r*0.16;ctx.setLineDash([r*0.28,r*0.18]);
    ctx.beginPath();ctx.arc(x,y,r*0.85,0,TAU);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();for(let i=0;i<4;i++){const a=i*Math.PI/4;ctx.moveTo(x+Math.cos(a)*r*0.45,y+Math.sin(a)*r*0.45);ctx.lineTo(x-Math.cos(a)*r*0.45,y-Math.sin(a)*r*0.45);}ctx.stroke();
    return;
  }
  ctx.fillStyle=INK[c];

function addMark(depth){
  const ch=S.chair;const c=S.lastTool==='sp'?1:(S.lastTool==='be'?2:0);
  const sz=clamp(0.75+0.55*(depth-0.4),0.7,1.35);
  if(ch.cover.p<=0){
    const n=ch.marks.filter(m=>m.k===0).length;
    if(ch.marks.length>=30){ch.marks.shift();}
    const slot=n%15,layer=Math.floor(n/15)%2;
    ch.marks.push({u:clamp(((slot%5)+0.5+layer*0.5)/5.4+rnd(-0.015,0.015),0.04,0.96),v:clamp((Math.floor(slot/5)+0.5+layer*0.4)/3.3+rnd(-0.02,0.02),0.05,0.95),s:sz,c,k:0});
    ch.cover.w=Math.min(1,ch.cover.w+0.045);
  }else{
    // continuation: stamp on the fresh strip and sew the same mark onto the stretched cover
    if(ch.anvil.length>=8)ch.anvil.shift();
    const n=ch.anvil.length;ch.anvil.push({u:clamp(((n%4)+0.5)/4+rnd(-0.02,0.02),0.05,0.95),v:n<4?0.3:0.72,s:sz,c,k:0});
    const sewn=ch.marks.filter(m=>m.k===1).length;
    if(ch.marks.length>=40){const i=ch.marks.findIndex(m=>m.k===1);ch.marks.splice(i>=0?i:0,1);}
    ch.marks.push({u:clamp(((sewn%6)+0.5)/6+rnd(-0.02,0.02),0.04,0.96),v:clamp(sewn%2?0.12:0.88,0,1),s:sz*0.9,c,k:1});
    ch.cover.w=Math.min(1,ch.cover.w+0.02);
    S.sewFx.push({t:0,c});if(S.sewFx.length>4)S.sewFx.shift();
  }
}
function fireStamp(){
  const tl=T.st;tl.anim=0.0001;tl.ev++;

  const p=P(MV,STX,ANY+10,STZ);fibres(p[0],p[1],5,[C.cream,C.mus,C.broL],140);
  ball.sqv+=1.2;S.lastTool='st';S.stampSince=true;S.stampCount=(S.stampCount||0)+1;lookAt(P(MV,STX,-200,STZ),0.6);
}
function fireBell(){

  SND.bell(ch.level);

function fireSpool(){

function toolStep(tl,a,dt,rate,fire){
  tl.a=a;

    if(!tl.on){tl.on=true;if(ballSpeed()<260){tl.ph=0;fire();}else tl.ph=0.3;}
    else{tl.ph+=dt*rate*(a>1.05?1.35:1);if(tl.ph>=1){tl.ph-=1;fire();}}

function ballSpeed(){return ball.held?Math.hypot(ball.vx||0,ball.vz||0):0;}
function updateTools(dt){
  let aSt=0,aBe=0,aSp=0;

    const load=(ball.held?1.75:1)+S.bump;

  const sp=T.sp;const target=sp.a>0.42?5.5*Math.min(1.3,sp.a):0;sp.spin=lerp(sp.spin,Math.max(target,sp.wel||0),1-Math.exp(-6*dt));sp.rot+=sp.spin*dt;sp.jig=Math.max(0,sp.jig-dt*4);sp.wel=Math.max(0,(sp.wel||0)-dt*2);
  const mb=MT.be;mb.swv+=(-mb.sw*60-mb.swv*4)*dt;mb.sw+=mb.swv*dt;mb.ring=Math.max(0,(mb.ring||0)-dt*1.4);
  MT.sp.spin=Math.max(0,MT.sp.spin-dt*2);MT.sp.rot+=MT.sp.spin*dt;MT.sway=Math.max(0,(MT.sway||0)-dt*0.8);
  if(MT.st.anim>0){MT.st.anim+=dt/0.5;if(MT.st.anim>=1)MT.st.anim=0;}

  S.lvDisp=lerp(S.lvDisp,S.chair.level,1-Math.exp(-5*dt));

}

function landOnBoard(bx,bz){ball.st='board';ball.bx=clamp(bx,-400,400);ball.bz=clamp(bz,-165,165);ball.vx=0;ball.vz=0;S.bump=0.55;ball.sqv+=3;SND.thud(0.8);}
function hopTo(to,then,h,dur){

}
function hopToBoard(bx,bz){
  const tx=clamp(bx,-400,400),tz=clamp(bz,-165,165);
  hopTo(()=>{const sk=0;const p=P(MV,tx,BT,tz);return[p[0],p[1]-R0*L.s*0.98];},()=>landOnBoard(tx,tz));
}
function hopToBasket(){hopTo(basketPos,()=>{ball.st='basket';SND.thud(0.6);ball.sqv+=3;});}
function sitOn(which){
  const ch=which==='main'?S.chair:S.floor;if(!ch)return;
  const n=ch.layers.length;
  ball.st=which==='main'?'seat':'mini';
  const thick=n>=6;
  ball.sit={t:0,n,depth:12+7.2*n,thick,rings:thick?[0.12,0.62]:[0.12],ri:0,dentNow:0,sway:0,which};
  SND.success();
  const p=which==='main'?mainSeatBall():miniSeatBall();
  fibres(p[0],p[1]+R0*L.s*0.7,thick?14:8,[C.mus,C.tea,C.cream,C.pink],thick?220:140);
  if(which==='main'){T.sp.wel=6;S.sway=1;}else{MT.sp.spin=6;MT.sway=1;}
  ch.sat=true;saveKeep(ch);S.everSat=true;if(which==='mini')S.everPrevSit=true;

function updateSit(dt){
  const s=ball.sit;if(!s)return;s.t+=dt;
  const t=s.t;
  let osc;
  if(s.thick){osc=Math.exp(-1.5*t)*Math.sin(TAU*1.25*t)*0.38;s.sway=Math.exp(-1.1*t)*Math.sin(TAU*0.8*t)*14;}
  else{osc=Math.exp(-5.5*t)*Math.sin(TAU*4.2*t)*0.22;s.sway=Math.exp(-4*t)*Math.sin(TAU*3*t)*4;}
  const settle=1-Math.exp(-(s.thick?4:12)*t);
  s.dentNow=s.depth*settle*(1+osc);
  ball.sq=clamp((s.thick?0.16:0.06)*settle+osc*0.25,-0.1,0.3);
  if(s.ri<s.rings.length&&t>=s.rings[s.ri]){
    s.ri++;const ch=s.which==='main'?S.chair:S.floor;if(ch){SND.bell(ch.level+(s.ri-1)*2);}
    if(s.which==='main'){T.be.swv+=8;T.be.ring=1;}else{MT.be.swv+=8;MT.be.ring=1;}
  }
}
function updateBall(dt){
  // squash spring
  const sqT=ball.held?0.16:0;
  if(!ball.sit){ball.sqv+=((sqT-ball.sq)*160-ball.sqv*12)*dt;ball.sq+=ball.sqv*dt;ball.sq=clamp(ball.sq,-0.25,0.4);}
  else ball.sqv=0;
  if(ball.st==='board'){
    const px=ball.bx,pz=ball.bz;
    if(ball.held){
      const k=1-Math.exp(-22*dt);ball.bx=lerp(ball.bx,clamp(ball.tx,-400,400),k);ball.bz=lerp(ball.bz,clamp(ball.tz,-165,165),k);
      ball.vx=(ball.bx-px)/Math.max(dt,1e-3);ball.vz=(ball.bz-pz)/Math.max(dt,1e-3);
      ball.wob=lerp(ball.wob,0,1-Math.exp(-10*dt));
    }else{
      ball.vx*=Math.exp(-5*dt);ball.vz*=Math.exp(-5*dt);
      // tilt rolls the ball downhill
      ball.vx+=-Math.sin(S.theta)*2200*dt;
      // gentle adhesion into the bell dimple and onto the front seam
      const dd=Math.hypot(ball.bx-DIM.x,ball.bz-DIM.z);
      if(dd<110&&!S.pull){ball.vx+=(DIM.x-ball.bx)*7*dt*10;ball.vz+=(DIM.z-ball.bz)*7*dt*10;}
      const onSeam=Math.abs(ball.bx)<110&&ball.bz>95&&dd>150;
      if(onSeam&&!S.pull){ball.vz+=(150-ball.bz)*4*dt*10;}
      ball.bx+=ball.vx*dt;ball.bz+=ball.vz*dt;
      if(ball.bx<-400){ball.bx=-400;ball.vx=Math.abs(ball.vx)*0.3;}if(ball.bx>400){ball.bx=400;ball.vx=-Math.abs(ball.vx)*0.3;}
      if(ball.bz<-165){ball.bz=-165;ball.vz=0;}if(ball.bz>165){ball.bz=165;ball.vz=0;}
      // rocking on the seam ridge: alternate left / right
      if(onSeam&&!S.pull){ball.wph+=dt*TAU/1.2;ball.wob=lerp(ball.wob,62*Math.sin(ball.wph),1-Math.exp(-8*dt));
        const side=Math.sign(ballDispX());if(side!==ball.lastWobSide&&side!==0){ball.lastWobSide=side;SND.seam();S.seamCount=(S.seamCount||0)+1;if(S.seamCount>4)S.everSeam=true;}}
      else{ball.wob=lerp(ball.wob,0,1-Math.exp(-6*dt));S.seamCount=0;}
    }
    const mv=Math.hypot(ball.bx-px,ball.bz-pz);ball.roll+=(ball.bx-px)/R0*1.0+(ball.bz-pz)/R0*0.4;
    ball.dist+=mv;if(ball.dist>80){ball.dist=0;SND.tick();}
  }else if(ball.st==='free'){
    const k=1-Math.exp(-25*dt);const ox=ball.fx;ball.fx=lerp(ball.fx,ball.tfx,k);ball.fy=lerp(ball.fy,ball.tfy,k);
    ball.vx=(ball.fx-ox)/Math.max(dt,1e-3)/L.s;ball.roll+=(ball.fx-ox)/(R0*L.s);
  }else if(ball.st==='hop'){
    const h=ball.hop;h.t+=dt/h.dur;ball.roll+=dt*6;if(h.t>=1){ball.hop=null;h.then();}
  }
  if(ball.sit)updateSit(dt);
  // board sink amplitude spring (fast down, slow bouncy recovery)
  let tgt=0;
  if(S.mode==='work'&&ball.st==='board'){tgt=34*((ball.held?1.75:1)+S.bump)*(inNest()?0.38:1);}
  const kk=tgt>S.sinkA?900:110,cc=tgt>S.sinkA?50:8;
  S.sinkV+=((tgt-S.sinkA)*kk-S.sinkV*cc)*dt;S.sinkA+=S.sinkV*dt;
  S.bump=Math.max(0,S.bump-dt*1.6);
  // tuft spring lag
  const tf=ball.tuft;const vx=ball.st==='board'?ball.vx:ball.vx;
  tf.vx+=((-clamp(vx,-1500,1500)*0.02*L.s)-tf.x)*90*dt-tf.vx*8*dt;tf.x+=tf.vx*dt;

  // eyes
  ball.blink=(S.t%3.7)<0.12;
  if(ball.lookT>0){ball.lookT-=dt;}
  if(ball.mood&&!ball.sit)ball.mood=0;
}

function nextTarget(){
  if(S.mode==='flip')return null;
  if(objs.cloth.drag||objs.mini.drag)return 'assembly';
  if(!S.everPress)return 'ball';
  const ch=S.chair;
  if(S.mode==='work'){
    if(ball.st!=='board')return ball.held?'zoneL':'ball';
    if(ch.marks.length+ch.anvil.length<2)return 'zoneL';
    if(ch.level<1)return 'dimple';
    if(ch.cover.p<1||ch.layers.length<4)return 'zoneR';
    if(!S.everFlip)return 'handle';
    if(S.everSat&&!S.everSeam)return 'seam';
    if(S.everSat&&S.floor&&!S.everPrevSit&&!S.everReuse)return 'mini';
    if(S.everSat&&!S.everNew)return 'cloth';
    return 'handle';
  }
  if(S.mode==='seat'){
    if(ball.st==='seat'){return(ball.sit&&ball.sit.t>2.5)?'handle':null;}
    if(ball.held)return 'seat';
    if(ball.st==='mini')return(ball.sit&&ball.sit.t>2.5)?'handle':null;
    return 'ball';
  }
  return null;
}
function targetPoint(t){

function startFlip(){
  if(S.mode==='flip')return;
  const toSeat=S.mode==='work';
  S.flip={from:S.theta,to:toSeat?Math.PI:0,t:0,dur:1.15,toSeat};
  S.mode='flip';S.everFlip=true;S.pull=0;
  SND.whoosh();
  if(toSeat){if(ball.st==='board'||ball.st==='hop'){ball.held=false;hopToBasket();}}
  else{if(ball.st==='seat'){ball.sit=null;hopToBasket();}}

}
function updateFlip(dt){

  f.t+=dt/f.dur;const t=clamp(f.t,0,1);
  const e=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const over=Math.sin(t*Math.PI)*0.0+(t>0.85?Math.sin((t-0.85)/0.15*Math.PI)*0.06*(f.to>f.from?1:-1):0);
  S.theta=lerp(f.from,f.to,e)+over;
  if(f.t>=1){
    S.theta=f.to;S.mode=f.toSeat?'seat':'work';S.flip=null;SND.thud(1);
    const p=P(MV,0,0,0);fibres(p[0],p[1],10,[C.mus,C.tea,C.pink,C.cream],220);
    if(!f.toSeat){if(ball.st==='basket'||ball.st==='hop'){const go=()=>hopToBoard(NEST.x,NEST.z);if(ball.st==='hop'){const h=ball.hop;const th=h.then;h.then=()=>{th();go();};}else go();}}
  }
}

// ====================================================================
//  replace chair: new plain cloth / reuse previous chair
// ====================================================================
function applyNewCloth(){
  const cur=S.chair;
  if(progress(cur)){const k=cloneChair(cur);k.anvil=[];S.floor=k;}
  S.chair=newChair();S.lvDisp=0;S.lastTool=null;S.stampSince=S.bellSince=false;
  S.everNew=true;afterReplace();
}
function applyReuse(){
  const old=S.floor;if(!old)return;
  const cur=S.chair;
  const c=newChair();
  c.marks=old.marks.map(m=>({u:m.u,v:m.v,s:m.s,c:m.c,k:0})).slice(-30);
  c.cover={p:0,w:old.cover.w};
  c.layers=old.layers.slice();
  c.reuse=old.layers.length+1;
  c.flaps=Math.min(6,1+Math.floor(old.layers.length/3)+Math.floor(old.cords/2));
  S.floor=progress(cur)?(()=>{const k=cloneChair(cur);k.anvil=[];return k;})():null;
  S.chair=c;S.lvDisp=0;S.lastTool=null;S.everReuse=true;afterReplace();
}
function afterReplace(){
  SND.fluff();
  const p=P(MV,0,-CUY,CUF);fibres(p[0],p[1],16,[C.cream,C.mus,C.tea,C.broL],260);
  if(S.mode==='seat'){if(ball.st==='seat'){ball.sit=null;}startFlip();}
}

// ====================================================================
//  input (single pointer, robust to extra fingers / cancel)
// ====================================================================
let act=null;
function evPt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function hitBall(px,py){computeBallScreen();const r=Math.max(R0*L.s*1.45,46);return(px-ball.sx)**2+(py-ball.sy)**2<r*r&&ball.st!=='hop';}
function hitCloth(px,py){return Math.abs(px-L.cloth.x)<Math.max(48,130*L.s)&&py<L.cloth.y+30*L.s+10&&py>L.cloth.y-150*L.s-20;}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioStart();
  S.anyInput=true;S.idle=0;if(S.demo){S.demo=null;}
  if(act)return;
  const [px,py]=evPt(e);
  if(S.mode==='flip')return;
  let kind=null;
  if(hitBall(px,py))kind='ball';
  else if(handleHit(px,py))kind='handle';
  else if(S.floor&&overMini(px,py)&&ball.st!=='mini')kind='mini';
  else if(hitCloth(px,py))kind='cloth';
  if(!kind){
    // unrelated things only wiggle a little
    if(L.hoop&&Math.hypot(px-L.hoop.x,py-L.hoop.y)<L.hoop.r*1.1){S.wig.hoop=1;SND.wiggle();}
    else if(py<L.gy+90*L.s+30){S.wig.garland=1;SND.wiggle();}
    else if(Math.abs(px-L.basket.x)<140*L.s&&Math.abs(py-L.basket.y+50*L.s)<90*L.s){S.wig.basket=1;SND.wiggle();}
    return;
  }
  act={id:e.pointerId,kind,sx:px,sy:py};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(kind==='ball'){
    S.everPress=true;ball.held=true;ball.sqv+=3.5;
    computeBallScreen();act.offx=ball.sx-px;act.offy=ball.sy-py;
    if(ball.st==='board'){ball.tx=ball.bx;ball.tz=ball.bz;ball.wob=0;
      // instant response: weight goes on, board and tools react this frame
      S.sinkV+=900;updateTools(0);}
    else{ball.fx=ball.sx;ball.fy=ball.sy;ball.tfx=ball.sx;ball.tfy=ball.sy;
      if(ball.st==='seat'||ball.st==='mini'){ball.sit=null;}
      ball.st='free';SND.pick();}
  }else if(kind==='handle'){handle.drag=true;handle.fx=px;handle.fy=py;SND.stretch();}
  else if(kind==='mini'){objs.mini.drag=true;objs.mini.x=L.mini.x;objs.mini.y=L.mini.y;act.offx=L.mini.x-px;act.offy=L.mini.y-py;SND.pick();}
  else if(kind==='cloth'){objs.cloth.drag=true;objs.cloth.x=L.cloth.x;objs.cloth.y=L.cloth.y;act.offx=L.cloth.x-px;act.offy=L.cloth.y-py;SND.pick();}
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(!act||e.pointerId!==act.id)return;e.preventDefault();
  const [px,py]=evPt(e);S.idle=0;
  if(act.kind==='ball'){
    const cx=px+act.offx,cy=py+act.offy;
    if(S.mode==='work'&&overBoard(cx,cy)){
      const b=screenToBoard(cx,cy);
      if(ball.st!=='board'){ball.st='board';ball.bx=clamp(b[0],-400,400);ball.bz=clamp(b[1],-165,165);}
      ball.tx=b[0];ball.tz=b[1];
    }else{
      if(ball.st==='board'){computeBallScreen();ball.fx=ball.sx;ball.fy=ball.sy;ball.st='free';}
      ball.tfx=cx;ball.tfy=cy;if(ball.st!=='free'){ball.st='free';ball.fx=cx;ball.fy=cy;}
    }
  }else if(act.kind==='handle'){
    handle.fx=px;handle.fy=py;
    const pull=Math.max(0,py-act.sy)/L.s;
    S.pull=pull;
    if(S.mode==='work'||S.mode==='seat'){
      const base=S.mode==='work'?0:Math.PI,dir=S.mode==='work'?1:-1;
      S.theta=base+dir*Math.min(pull,170)/170*0.32;
      if(pull>150||Math.max(0,py-act.sy)>Math.max(70,0.11*Math.min(W,H))){handle.drag=false;act.done=true;startFlip();}
    }
  }else if(act.kind==='mini'){objs.mini.x=px+act.offx;objs.mini.y=py+act.offy;}
  else if(act.kind==='cloth'){objs.cloth.x=px+act.offx;objs.cloth.y=py+act.offy;}
},{passive:false});
function endPointer(e,cancel){
  if(!act||e.pointerId!==act.id)return;
  const [px,py]=evPt(e);const a=act;act=null;
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  if(a.kind==='ball'){
    ball.held=false;
    if(ball.st==='board'){S.bump=0.35;ball.sqv-=2;ball.vx=(clamp(ball.tx,-400,400)-ball.bx)*5;ball.vz=(clamp(ball.tz,-165,165)-ball.bz)*5;}
    else if(ball.st==='free'){
      const cx=ball.fx,cy=ball.fy;
      if(!cancel&&S.floor&&overMini(cx,cy)){hopTo(miniSeatBall,()=>sitOn('mini'),40*L.s,0.3);}
      else if(S.mode==='seat'&&!cancel&&overMainSeat(cx,cy)){hopTo(mainSeatBall,()=>sitOn('main'),40*L.s,0.3);}
      else if(S.mode==='work'){const b=screenToBoard(cx,cy);hopToBoard(b[0],b[1]);}
      else if(S.mode==='seat'&&overMainSeat(cx,cy)){hopTo(mainSeatBall,()=>sitOn('main'),40*L.s,0.3);}
      else hopToBasket();
    }
  }else if(a.kind==='handle'){
    handle.drag=false;handle.swv+=3;
    if(S.mode!=='flip'){S.pull=0;S.relaxTheta=true;}
  }else if(a.kind==='mini'){
    objs.mini.drag=false;
    if(!cancel&&overAssembly(objs.mini.x,objs.mini.y-120*L.s)){applyReuse();}
  }else if(a.kind==='cloth'){
    objs.cloth.drag=false;
    if(!cancel&&overAssembly(objs.cloth.x,objs.cloth.y-60*L.s)){applyNewCloth();}
  }
}
cv.addEventListener('pointerup',e=>endPointer(e,false));
cv.addEventListener('pointercancel',e=>endPointer(e,true));
cv.addEventListener('lostpointercapture',e=>{if(act&&e.pointerId===act.id)endPointer(e,true);});
['contextmenu','selectstart','dragstart','gesturestart','gesturechange','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
window.addEventListener('resize',()=>{layout();});
window.addEventListener('orientationchange',()=>setTimeout(layout,120));

// ====================================================================
//  main loop
// ====================================================================
let raf=0,last=0,running=false;
function update(dt){
  S.t+=dt;S.idle+=dt;S.frame++;
  for(const k in S.wig)S.wig[k]=Math.max(0,S.wig[k]-dt*2.5);
  // relax tilt after a partial pull
  if(S.mode!=='flip'&&!handle.drag){const base=S.mode==='seat'?Math.PI:0;S.theta=lerp(S.theta,base,1-Math.exp(-8*dt));if(Math.abs(S.theta-base)<1e-4)S.theta=base;S.pull=0;}
  handle.swv+=(-handle.sw*30-handle.swv*3)*dt;handle.sw+=handle.swv*dt;
  updateFlip(dt);
  updateBall(dt);
  updateTools(dt);
  animTools(dt);
  updParts(dt);
  // demo hand: only once, the first time the player has been idle ~4 s
  if(!S.demoDone&&S.idle>4&&!act&&S.mode==='work'&&ball.st==='board'){S.demoDone=true;S.demo={t:0};}
  if(S.demo){S.demo.t+=dt;if(S.demo.t>2.5)S.demo=null;}
  // floor objects spring back home
  if(!objs.cloth.drag){objs.cloth.x=lerp(objs.cloth.x||L.cloth.x,L.cloth.x,1-Math.exp(-10*dt));objs.cloth.y=lerp(objs.cloth.y||L.cloth.y,L.cloth.y,1-Math.exp(-10*dt));}
  if(!objs.mini.drag){objs.mini.x=lerp(objs.mini.x||L.mini.x,L.mini.x,1-Math.exp(-10*dt));objs.mini.y=lerp(objs.mini.y||L.mini.y,L.mini.y,1-Math.exp(-10*dt));}
  S.target=nextTarget();
}
function draw(){
  scr();
  if(bgC){ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bgC,0,0);scr();}
  drawGarland();drawHoop();
  const tgt=S.target;
  MV.ox=L.ox;MV.oy=L.oy;MV.s=L.s;MV.th=S.theta;MV.k=1-0.22*Math.abs(Math.sin(S.theta));
  // mini view (previous chair on the floor)
  MiniV.s=L.s*0.42;MiniV.k=1;MiniV.th=Math.PI;
  const mx=objs.mini.drag?objs.mini.x:(objs.mini.x||L.mini.x),my=objs.mini.drag?objs.mini.y:(objs.mini.y||L.mini.y);
  MiniV.ox=mx;MiniV.oy=my-260*MiniV.s*CA;
  drawStand(MV);
  const work=Math.cos(S.theta)>=0;
  const ch=S.chair;
  const dent=(ball.st==='seat'&&ball.sit)?ball.sit.dentNow:0;
  const uopts={lv:S.lvDisp,dent,dentX:ball.sit?ball.sit.sway:0,main:true,sway:S.sway||0,bellGlow:false};
  if(work){
    drawUnder(MV,ch,T,uopts);
    drawSewFx();
    drawBoardFront(MV,tgt);
    drawBoardTop(MV,tgt);
  }else{
    drawBoardBottom(MV);
    drawBoardFront(MV,tgt);
    drawUnder(MV,ch,T,uopts);
    if(tgt==='seat'){scr();const p=seatTop(MV,ch);glowRing(p[0],p[1]-20*L.s,210*L.s);}
  }
  drawHandle(tgt==='handle');
  // floor row
  drawClothBundle(objs.cloth.drag?objs.cloth.x:(objs.cloth.x||L.cloth.x),objs.cloth.drag?objs.cloth.y:(objs.cloth.y||L.cloth.y),L.s,tgt==='cloth');
  drawBasket(L.basket.x,L.basket.y,L.s,false);
  if(S.floor&&(ball.st!=='mini'||true))drawMiniChair(tgt==='mini');
  if(tgt==='assembly'){scr();glowRing(L.ox,L.oy+40*L.s,330*L.s);}
  // ball
  const bp=computeBallScreen();
  const r=R0*L.s;
  let shadow=null,shS=1;
  if(ball.st==='board'){const p=P(MV,ballDispX(),BT-sinkAt(ballDispX(),ball.bz),ball.bz);shadow=[p[0],p[1]];shS=1-ball.sq*0.3;}
  // look direction
  let lp=null;if(ball.lookT>0&&ball.lookP)lp=ball.lookP;else{const tp=targetPoint(tgt==='ball'?(S.mode==='seat'?'seat':'zoneL'):tgt);if(tp)lp=tp;}
  if(lp){const dx=lp[0]-bp[0],dy=lp[1]-bp[1],d=Math.hypot(dx,dy)||1;ball.look.x=lerp(ball.look.x,dx/d,0.15);ball.look.y=lerp(ball.look.y,dy/d,0.15);}
  else{ball.look.x=lerp(ball.look.x,Math.sin(S.t*0.7)*0.3,0.05);ball.look.y=lerp(ball.look.y,0.1,0.05);}
  const sp=Math.min(0.16,Math.abs(ball.vx||0)/2600);
  const hopBob=(tgt==='ball'&&!ball.held&&ball.st!=='hop')?Math.abs(Math.sin(S.t*4.2))*-12*L.s-2:0;
  drawBall(bp[0],bp[1]+hopBob+ball.sq*r*0.45,r,{sx:1+ball.sq*0.6+sp,sy:1-ball.sq*0.75-sp*0.4,roll:ball.roll,look:ball.look,tuft:ball.tuft,
    mood:ball.mood,blink:ball.blink&&!ball.mood,mouth:ball.held?'o':'',shadow,shScale:shS,glow:tgt==='ball'});
  drawParts();
  drawDemo();
}
function drawSewFx(){
  // thread travelling from the anvil to the stretched cover while sewing the continuation
  if(!S.sewFx.length)return;scr();
  const a=P(MV,(ANX0+ANX1)/2,ANY,0),b=P(MV,0,-CUY-cushH(S.chair),CUF);
  for(const f of S.sewFx){const e=f.t;ctx.strokeStyle=INK[f.c];ctx.lineWidth=Math.max(1.5,6*L.s);ctx.setLineDash([Math.max(3,12*L.s),Math.max(2,8*L.s)]);ctx.lineDashOffset=-e*80;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);const mx=(a[0]+b[0])/2,my=Math.max(a[1],b[1])+50*L.s;ctx.quadraticCurveTo(mx,my,lerp(a[0],b[0],Math.min(1,e*1.4)),lerp(a[1],b[1],Math.min(1,e*1.4)));ctx.stroke();ctx.setLineDash([]);
    const q=e<0.7?null:b;if(q){ctx.fillStyle=INK[f.c];ctx.beginPath();ctx.arc(q[0],q[1],Math.max(3,12*L.s)*(1-e)*3,0,TAU);ctx.fill();}}
}
function frame(now){
  if(!running)return;
  let dt=(now-last)/1000;last=now;
  if(!(dt>0))dt=0;dt=Math.min(dt,1/30);
  try{update(dt);draw();}catch(err){if(!S.err){S.err=String(err&&err.stack||err);}}
  raf=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;last=performance.now();raf=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else start();});
window.addEventListener('pagehide',stop);
window.addEventListener('pageshow',()=>{if(!document.hidden)start();});

// boot
S.floor=loadKeep();
layout();
objs.cloth.x=L.cloth.x;objs.cloth.y=L.cloth.y;objs.mini.x=L.mini.x;objs.mini.y=L.mini.y;
if(!document.hidden)start();
// read-only probe for automated checks (no UI)
window.__gf={
  state:()=>({mode:S.mode,theta:S.theta,ball:{st:ball.st,bx:ball.bx,bz:ball.bz,sq:ball.sq,held:ball.held,sx:ball.sx,sy:ball.sy,wob:ball.wob},
    sit:ball.sit?{depth:ball.sit.depth,rings:ball.sit.ri,thick:ball.sit.thick,dent:ball.sit.dentNow}:null,sinkA:S.sinkA,stamp:{a:T.st.a,anim:T.st.anim,ev:T.st.ev},bell:{a:T.be.a,ev:T.be.ev},spool:{a:T.sp.a,ev:T.sp.ev},
    chair:cloneChair(S.chair),floor:S.floor?cloneChair(S.floor):null,target:S.target,demo:!!S.demo,demoDone:S.demoDone,
    err:S.err||null,storageOK:S.storageOK,loadStatus:S.loadStatus,parts:parts.length,running,t:S.t}),
  pos:{ball:()=>{computeBallScreen();return[ball.sx,ball.sy];},handle:()=>handleGrip(),board:(X,Z)=>{const p=P(MV,X,BT,Z);return[p[0],p[1]-R0*L.s*0.98];},
    seat:()=>{const p=seatTop(MV,S.chair);return[p[0],p[1]-R0*L.s*0.8];},mini:()=>[L.mini.x,L.mini.y-150*L.s],cloth:()=>[L.cloth.x,L.cloth.y-40*L.s],
    assembly:()=>[L.ox,L.oy]},
  stampPt:()=>P(MV,STX,-230,STZ),
  layout:()=>({s:L.s,ox:L.ox,oy:L.oy,rowY:L.rowY,W,H,sa:L.sa})
};
})();
</script>
