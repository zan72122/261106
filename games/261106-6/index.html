  ink(w,COL.red,OFF.r,0.6,function(c){c.beginPath();for(var yy=g,row=0;yy<wl.h;yy+=g,row++){for(var xx=(row%2?g*0.5:g);xx<wl.w;xx+=g){var s=k*0.009;c.moveTo(xx,yy-s*1.6);c.lineTo(xx+s,yy);c.lineTo(xx,yy+s*1.6);c.lineTo(xx-s,yy);c.closePath();}}c.fill();});

  w.strokeStyle=COL.navy;w.lineWidth=3;w.strokeRect(1.5,1.5,wl.w-3,wl.h-1.5);

   WINDOW GEOMETRY
   ============================================================ */
function wb(src){var x0=X(src.x0),x1=X(src.x1),y0=Y(src.y0),y1=Y(src.y1);return {x0:x0,x1:x1,y0:y0,y1:y1,cx:(x0+x1)/2,cy:(y0+y1)/2,hx:(x1-x0)/2,hy:(y1-y0)/2};}
var DIAG=[Math.PI/4,3*Math.PI/4,5*Math.PI/4,7*Math.PI/4];
function winPts(w,b,N,wob){
  N=N||64;var out=new Array(N*2);var floor=(L.floorY-b.y1)<1.5;
  for(var i=0;i<N;i++){
    var th=i/N*TAU,c=Math.cos(th),s=Math.sin(th);
    var q=c>=0?(s>=0?0:3):(s>=0?1:2);
    var n=(floor&&q<2)?8:2.4,ex=2/n;
    var x=(c<0?-1:1)*Math.pow(Math.abs(c),ex)*b.hx,y=(s<0?-1:1)*Math.pow(Math.abs(s),ex)*b.hy;
    var dd=th-DIAG[q];var bump=Math.exp(-(dd*dd)/(0.08));
    var f=1+w.p[q]*bump;
    var torn=1+0.016*Math.sin(th*7+w.sd)+0.01*Math.sin(th*13+w.sd*3)+(wob||0)*Math.sin(th*5+NOW*30);
    var px=x*f*torn,py=y*f*torn;
    if(floor&&q<2&&py>b.hy)py=b.hy;
    out[i*2]=b.cx+px;out[i*2+1]=b.cy+py;
  }
  return out;
}
function polySD(p,x,y){
  var n=p.length/2,ins=false,md=1e18;
  for(var i=0,j=n-1;i<n;j=i++){
    var xi=p[i*2],yi=p[i*2+1],xj=p[j*2],yj=p[j*2+1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;
    var ex=xj-xi,ey=yj-yi,l2=ex*ex+ey*ey,t=l2>0?clamp(((x-xi)*ex+(y-yi)*ey)/l2,0,1):0;
    var dx=xi+ex*t-x,dy=yi+ey*t-y,d2=dx*dx+dy*dy;if(d2<md)md=d2;
  }
  var d=Math.sqrt(md);return ins?-d:d;
}
function slitPts(sl,open){
  var x=X(sl.u),y=Y(sl.v),len=L.k*0.12,hw=Math.max(1.5,L.k*0.012*open),out=[],N=16;
  if(sl.floor){y=L.floorY-hw;}
  var ca=Math.cos(sl.a),sa=Math.sin(sl.a);
  for(var i=0;i<N;i++){var t=i/N*TAU,lx=Math.cos(t)*len/2,ly=Math.sin(t)*hw*(sl.floor&&Math.sin(t)>0?1:1);
    out.push(x+lx*ca-ly*sa,y+lx*sa+ly*ca);}
  return out;
}

function ptOf(e){var rc=cv.getBoundingClientRect();return {x:e.clientX-rc.left,y:e.clientY-rc.top};}

function onDown(e){

  drag.p=p;handleMove(p);lastInput=NOW;
}

cv.addEventListener('pointerdown',onDown,{passive:false});

function handleDown(p){
  if(newSheet||seq){minorTap(p,true);return;}
  // roll paper tab
  var tb=rollTab();
  if(Math.abs(p.x-tb.x)<tb.w/2&&p.y>tb.y-tb.h*0.5&&p.y<tb.y+tb.h*0.7){drag.type='roll';drag.pull0=roll.pull;SFX.unroll();return;}
  var tol=Math.max(30,L.k*0.08);
  var best=null,bd=1e9;
  for(var i=0;i<S.wins.length;i++){var w=S.wins[i];var b=wb(w);var pts=winPts(w,b,48);var sd=polySD(pts,p.x,p.y);if(sd<tol&&sd<bd){bd=sd;best=w;}}
  // unused slit
  var sR=Math.max(46,L.k*0.13),bs=-1,bsd=1e9;
  for(i=0;i<6;i++){if(winBySlit(i))continue;var sl=world.slits[i];var sx=X(sl.u),sy=sl.floor?L.floorY-L.k*0.03:Y(sl.v);var dd=Math.hypot(p.x-sx,p.y-sy);if(dd<sR&&dd<bsd){bsd=dd;bs=i;}}
  if(bs>=0&&(!best||bd>0&&bsd<sR*0.7)){openSlit(bs,p);return;}
  if(best){grabWin(best,p);return;}
  minorTap(p,false);
}
function openSlit(i,p){
  var sl=world.slits[i],k=L.k,r0=k*0.1;
  var cx=X(sl.u),cy=sl.floor?L.floorY-r0:Y(sl.v);
  var ru=r0/L.wall.w,rv=r0/L.wall.h,cu=UU(cx),cvv=VV(cy);
  cu=clamp(cu,ru+0.01,1-ru-0.01);cvv=clamp(cvv,rv+0.01,1-rv);
  var w=mkWin({x0:cu-ru,x1:cu+ru,y0:cvv-rv,y1:sl.floor?1:cvv+rv,p:[0,0,0,0],dx:sl.u<0.5?1:-1,dy:-1,slit:i,ink:(i+world.palette)%3});
  // display starts as the slit (pressed-in), springs open

  w.d.x0=cu-su;w.d.x1=cu+su;w.d.y0=(sl.floor?1-sv*2:cvv-sv);w.d.y1=sl.floor?1:cvv+sv;
  w.g.x0=w.d.x0;w.g.x1=w.d.x1;w.g.y0=w.d.y0;w.g.y1=w.d.y1;

function grabWin(w,p,fresh){

  drag.b0={x0:b.x0,x1:b.x1,y0:b.y0,y1:b.y1};drag.p00=p;drag.pp0=w.p.slice();drag.moved=0;
  drag.q=(ax!==0&&ay!==0)?(ax>0?(ay>0?0:3):(ay>0?1:2)):-1;

  // front balls

function handleMove(p){
  if(!drag)return;
  var dx0=p.x-drag.lp.x,dy0=p.y-drag.lp.y;drag.spd=lerp(drag.spd,Math.hypot(dx0,dy0)*60,0.3);drag.lp=p;
  if(drag.type==='roll'){
    var mp=rollMax();roll.pull=clamp(drag.pull0+(p.y-drag.p0.y),0,mp);
    if(Math.random()<0.15)SFX.unroll();return;}
  if(drag.type!=='win')return;
  var w=drag.w,b0=drag.b0,dx=p.x-drag.p00.x,dy=p.y-drag.p00.y;
  var wl=L.wall,k=L.k,mn=k*0.09;
  var x0=b0.x0,x1=b0.x1,y0=b0.y0,y1=b0.y1;
  if(drag.ax>0)x1=b0.x1+dx;else if(drag.ax<0)x0=b0.x0+dx;else{if(dx>0)x1=b0.x1+dx;else x0=b0.x0+dx;}
  if(drag.ay>0)y1=b0.y1+dy;else if(drag.ay<0)y0=b0.y0+dy;else{if(dy>0)y1=b0.y1+dy;else y0=b0.y0+dy;}
  var lx=wl.x+6,rx=wl.x+wl.w-6,ty=wl.y+6,by=L.floorY;
  x0=clamp(x0,lx,rx-mn);x1=clamp(x1,lx+mn,rx);y0=clamp(y0,ty,by-mn);y1=clamp(y1,ty+mn,by);
  var mx=wl.w*0.92,my=wl.h*0.9;

  if(y1-y0<mn){if(drag.ay<0||(drag.ay===0&&dy<0))y0=y1-mn;else y1=y0+mn;}
  if(x1-x0>mx){if(drag.ax<0||(drag.ax===0&&dx<0))x0=x1-mx;else x1=x0+mx;}
  if(y1-y0>my){if(drag.ay<0||(drag.ay===0&&dy<0))y0=y1-my;else y1=y0+my;}
  if(by-y1<wl.h*0.035)y1=by;

  if(Math.abs(dy)>14&&(drag.ay===0||drag.ay===Math.sign(dy)))w.dy=dy>0?1:-1;

function handleUp(d,cancel){

    if(roll.pull>rollMax()*0.72&&!cancel){startNewWall();}
    else{roll.v=-2;}
    return;}

    var w=d.w,b=wb(w);var sz=clamp(Math.max(b.hx,b.hy)/(L.k*0.45),0,1);

function rollMax(){return clamp(L.bot-(L.roll.y+L.roll.r+18)-36,90,220);}

   NEW WALL

/* ============================================================
   UNCLE
   ============================================================ */

/* ============================================================
   WINDS
   ============================================================ */
function computeWinds(){
  winds=[];var k=L.k;
  for(var i=0;i<S.wins.length;i++){var w=S.wins[i],b=wb(w);
    var hor=b.hx>=b.hy,lo=Math.max(b.hx,b.hy),sh=Math.max(1,Math.min(b.hx,b.hy)),asp=lo/sh;
    if(asp<1.5){winds.push({w:w,round:true,b:b,str:0});continue;}
    var d=hor?{x:w.dx,y:0}:{x:0,y:w.dy};
    var o={x:b.cx+d.x*b.hx,y:b.cy+d.y*b.hy};
    var str=clamp((asp-1.3)/1.4,0.3,1)*clamp(lo*2/(k*0.35),0.5,1.25);
    var reach=k*0.3+lo*2*1.7;

function windAt(wd,tx,ty,tr){
  if(wd.round)return 0;
  // measured from the hole centre: anything in front of the opening or downstream of it
  var b=wd.b,rx=tx-b.cx,ry=ty-b.cy,s0=rx*wd.d.x+ry*wd.d.y;
  if(s0<-tr*0.5||s0>wd.lo+wd.reach+tr)return 0;
  var s=Math.max(0,s0-wd.lo);

/* ============================================================
   PARTICLES
   ============================================================ */
function addP(o){if(P.length>=PMAX)return null;P.push(o);return o;}
function burst(x,y,n,big){for(var i=0;i<n;i++){var a=Math.random()*TAU,s=(big?220:120)*(0.4+Math.random());addP({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:0,max:0.7+Math.random()*0.6,sz:3+Math.random()*4,col:(Math.random()*3)|0,rot:Math.random()*6,vr:(Math.random()-0.5)*12,type:'spark'});}}

/* ============================================================
   INVITATION
   ============================================================ */
function edgePt(w,side){var b=wb(w);
  if(side==='R')return {x:b.x1,y:b.cy,dx:1,dy:0};if(side==='L')return {x:b.x0,y:b.cy,dx:-1,dy:0};
  if(side==='T')return {x:b.cx,y:b.y0,dx:0,dy:-1};return {x:b.cx,y:b.y1,dx:0,dy:1};}

function edgeInv(w,side){var e=edgePt(w,side);return {type:'edge',w:w,side:side,x:e.x,y:e.y,dx:e.dx,dy:e.dy};}
function chooseInvite(){
  if(seq||newSheet)return null;
  var w0=winBySlit(0);
  if(!w0)return slitInv(0);
  var b0=wb(w0);
  if(!S.D.longFace){return edgeInv(w0,(UU(b0.cx)<0.5)?'R':'L');}
  // ball waiting at a too-small hole: widen
  if(ball&&ball.st==='stopped'&&ball.win){var bw=wb(ball.win);var need=ball.r*2*1.1;return edgeInv(ball.win,(bw.hy*2<need)?'T':(ball.side>0?'R':'L'));}
  if(!S.D.hStrip){var hw=null;for(var i=0;i<winds.length;i++){if(!winds[i].round&&winds[i].hor){hw=winds[i];break;}}
    if(hw)return edgeInv(hw.w,hw.d.x>0?'R':'L');return edgeInv(w0,UU(b0.cx)<0.5?'L':'R');}
  if(!S.D.vGar){var tw=w0,ty=1e9;for(i=0;i<S.wins.length;i++){var bb=wb(S.wins[i]);if(bb.y0<ty&&!(L.floorY-bb.y1<2)){ty=bb.y0;tw=S.wins[i];}}return edgeInv(tw,'T');}
  if(!S.D.ballPass){if(!winBySlit(2))return slitInv(2);}
  if(!S.D.gesture){if(!winBySlit(1))return slitInv(1);
    var ra=R[0],rb=R[1];if(ra.vis&&rb.vis){var wa=S.wins[ra.win],wbb=S.wins[rb.win];if(wa&&wbb&&wa!==wbb){return edgeInv(wbb,(Y(rb.v)>Y(ra.v))?'T':'B');}}
    var w1=winBySlit(1);if(!rb.vis&&w1)return edgeInv(w1,UU(wb(w1).cx)<UU(X(rb.hu))?'R':'L');}
  if(!S.D.ballStop&&!winBySlit(2))return slitInv(2);
  // spinner work
  var si=spinInvite();if(si)return si;
  if(S.flights>=3&&S.flights%3===0)return {type:'roll',x:rollTab().x,y:rollTab().y,dx:0,dy:1};
  // default: reshape most recent window
  var lw=S.wins[(Math.floor(NOW/8))%S.wins.length];var sides=['R','T','L','B'];return edgeInv(lw,sides[Math.floor(NOW/8)%4]);
}
function spinInvite(){
  var ord=[0,1];if(spins[1].hits.length>spins[0].hits.length)ord=[1,0];
  for(var oi=0;oi<2;oi++){var si=ord[oi],sp=spins[si],sx=X(sp.u),sy=Y(sp.v);
    var cand=si===0?[0,3,4]:[2,5];
    for(var c=0;c<cand.length;c++){if(!winBySlit(cand[c]))return slitInv(cand[c]);}
    var hitW=sp.hits.map(function(h){return h.w;});
    for(var i=0;i<S.wins.length;i++){var w=S.wins[i];if(hitW.indexOf(w)>=0)continue;var b=wb(w);
      if(Math.abs(b.cy-sy)<Math.max(b.hy,L.k*0.1)&&Math.abs(b.cx-sx)>b.hx)return edgeInv(w,sx>b.cx?'R':'L');
      if(Math.abs(b.cx-sx)<Math.max(b.hx,L.k*0.1)&&Math.abs(b.cy-sy)>b.hy)return edgeInv(w,sy<b.cy?'T':'B');}
  }
  return null;
}

/* ============================================================
   DISCOVERY
   ============================================================ */
function disc(key,x,y){if(S.D[key])return false;S.D[key]=true;
  var big=['d1','d2','d3','spin2','gesture','flight'].indexOf(key)>=0;
  if(big){SFX.success();burst(x,y,14,true);uncle.happy=1.6;uncle.hop=1;}
  saveSoon();return true;}

/* ============================================================
   UPDATE
   ============================================================ */
function spring(o,tgt,v,i,k,d,dt){var a=(tgt-o)*k-v[i]*d;v[i]+=a*dt;return o+v[i]*dt;}
function update(dt){
  var k=L.k,i,j;
  if(saveT>0){saveT-=dt;if(saveT<=0)save();}
  /* window springs */
  for(i=0;i<S.wins.length;i++){var w=S.wins[i],dd=w.d,gg=w.g;var keys=['x0','x1','y0','y1'];var moving=false;
    for(j=0;j<4;j++){var kk=keys[j];var before=dd[kk];
      dd[kk]=spring(dd[kk],w[kk],dd.v,j,520,15,dt);
      gg[kk]=spring(gg[kk],dd[kk],gg.v,j,140,13,dt);
      if(Math.abs(dd[kk]-w[kk])>0.0004||Math.abs(dd.v[j])>0.002||Math.abs(gg[kk]-dd[kk])>0.0006)moving=true;}
    if(w.boing>0){w.boing=Math.max(0,w.boing-dt*1.6);moving=true;}
    if(moving)wallDirty=true;}
  computeWinds();
  var totalWind=0,maxLo=0;for(i=0;i<winds.length;i++){totalWind+=winds[i].str;if(winds[i].lo)maxLo=Math.max(maxLo,winds[i].lo);}
  var inSeq=!!seq;

  /* strips (side hanging papers) */
  for(i=0;i<strips.length;i++){var st=strips[i],sx=X(st.u),f=0,dir=0;
    if(!inSeq)for(j=0;j<winds.length;j++){var wd=winds[j];if(wd.round||!wd.hor)continue;
      var ty=clamp(wd.o.y,L.garY,Y(st.len));var a=windAt(wd,sx,ty,10);if(a>0){f+=a;dir+=wd.d.x*a;}}
    var tgt=clamp(dir*0.55,-0.55,0.55);
    st.om+=(-(st.th-tgt)*18-st.om*3.2+(f>0?Math.sin(NOW*17+i)*Math.min(f,1)*22:0))*dt;st.th=clamp(st.th+st.om*dt,-0.8,0.8);
    if(f>0.05){if(st.hit<=0.05){SFX.chime(i,f);st.chimeT=0.8;burst(sx,Y(st.len),3,false);}st.chimeT-=dt;if(st.chimeT<=0){SFX.chime(i+1,f*0.7);st.chimeT=0.9;}
      if(disc('hStrip',sx,Y(st.len))){} }
    st.hit=f;}
  /* garland flags */
  var garHit=0;
  for(i=0;i<flags.length;i++){var fl=flags[i],fx=L.wall.x+fl.f*L.wall.w,lt=0;
    if(!inSeq)for(j=0;j<winds.length;j++){var wd2=winds[j];if(wd2.round||wd2.hor||wd2.d.y>0)continue;var a2=windAt(wd2,fx,L.garY+k*0.04,k*0.05);lt+=a2;}
    if(inSeq)lt=0.6+0.4*Math.sin(NOW*6+i);
    fl.lv+=(-(fl.lift-clamp(lt,0,1.2))*14-fl.lv*3)*dt;fl.lift+=fl.lv*dt;if(lt>0.05&&!inSeq)garHit=Math.max(garHit,lt);}
  if(garHit>0.05){if(!uncle._garT||NOW-uncle._garT>1.4){SFX.flutter();uncle._garT=NOW;}disc('vGar',X(0.5),L.garY);}
  if(S.D.hStrip&&S.D.vGar)disc('d2',X(0.5),Y(0.3));
  /* spinners */
  for(i=0;i<spins.length;i++){var sp=spins[i],spx=X(sp.u),spy=Y(sp.v);sp.hits=[];var tq=0,tilt=0,sum=0;
    if(!inSeq)for(j=0;j<winds.length;j++){var wd3=winds[j];var a3=windAt(wd3,spx,spy,k*0.065);if(a3>0){sp.hits.push({w:wd3.w,d:wd3.d,a:a3});
      var cr=(spx-wd3.o.x)*wd3.d.y-(spy-wd3.o.y)*wd3.d.x;tq+=(cr>=0?1:-1)*a3*(0.5+Math.min(1,Math.abs(cr)/(k*0.05)));tilt+=wd3.d.x*a3;sum+=a3;}}
    var distinct=false;for(j=0;j<sp.hits.length;j++)for(var m=j+1;m<sp.hits.length;m++){var d1=sp.hits[j].d,d2=sp.hits[m].d;if(d1.x*d2.x+d1.y*d2.y<0.5)distinct=true;}

    var tav=0;if(sp.spinning){if(Math.abs(tq)<0.2)tq=(sp.hits[0].d.x*sp.hits[1].d.y-sp.hits[0].d.y*sp.hits[1].d.x)>=0?0.6:-0.6;tav=clamp(tq,-2.5,2.5)*(3+sum*2.5);}

    if(inSeq&&seq&&seq.sp===i)sp.av=lerp(sp.av,14,1-Math.exp(-dt*2));
    var pa=sp.ang;sp.ang+=sp.av*dt;
    if(Math.floor(pa/(TAU/6))!==Math.floor(sp.ang/(TAU/6))&&Math.abs(sp.av)>1)SFX.tick(Math.min(2,Math.abs(sp.av)/8));
    sp.tilt=lerp(sp.tilt,clamp(tilt*0.5,-0.6,0.6)+Math.sin(NOW*1.3+i)*0.04,1-Math.exp(-dt*3));

  }

    if(!inSeq)for(j=0;j<winds.length;j++){var wd4=winds[j];if(wd4.round||wd4.hor||wd4.d.y<0)continue;if(Math.abs(cfp.x-wd4.o.x)<wd4.half+k*0.2&&L.floorY-wd4.o.y<wd4.reach)up+=wd4.str;}
    if(up>0&&cf.y>=0&&Math.random()<dt*4*up){cf.vy=-k*(0.5+Math.random()*0.5);}
    cf.vy+=k*2.2*dt;cf.y=Math.min(0,cf.y+cf.vy*dt);if(cf.y>=0)cf.vy=0;cf.rot+=dt*(cf.y<0?8:0);}
  for(i=0;i<fballs.length;i++){var fb=fballs[i];var fpp=frontPos(fb);
    if(!inSeq)for(j=0;j<winds.length;j++){var wd5=winds[j];if(wd5.round||wd5.hor||wd5.d.y<0)continue;if(Math.abs(fpp.x-wd5.o.x)<wd5.half+k*0.25&&L.floorY-wd5.o.y<wd5.reach)fb.vx+=(fpp.x<wd5.o.x?-1:1)*k*0.4*dt*wd5.str;}
    fb.vx*=Math.exp(-dt*2.5);var nfu=fb.fu+fb.vx*dt/(L.fx1-L.fx0);if(nfu<0||nfu>1){fb.vx*=-0.5;nfu=clamp(nfu,0,1);}

    for(var q=0;q<fballs.length;q++){if(q===i)continue;var ob=fballs[q];if(Math.abs(ob.fv-fb.fv)>0.45)continue;var span=(L.fx1-L.fx0),ddx=(fb.fu-ob.fu)*span,need=(fb.r+ob.r)*k*FBS*1.05;
      if(Math.abs(ddx)<need){var push=(need-Math.abs(ddx))*(ddx>=0?1:-1);fb.vx+=push*4*dt*10;}}}

  updGame(dt);

    while(ww._acc>=1){ww._acc-=1;
      if(wd6.round){var bb2=wd6.b;addP({x:bb2.cx+(Math.random()-0.5)*bb2.hx,y:bb2.cy+(Math.random()-0.5)*bb2.hy,vx:(Math.random()-0.5)*20,vy:10+Math.random()*12,life:0,max:0.8,sz:2+Math.random()*2,col:(Math.random()*3)|0,rot:Math.random()*6,vr:3,type:'wind'});continue;}
      var off=(Math.random()*2-1)*wd6.half*0.9,spd=k*(0.5+0.45*wd6.str)*(0.8+Math.random()*0.4);

  var canGather=junction>=0&&S.armed&&hadInput&&!seq&&!newSheet&&NOW-lastFlightEnd>3;
  if(canGather){if(gatherP<=0.01){SFX.gather();}gatherP=Math.min(1,gatherP+dt/1.7);}

  for(i=P.length-1;i>=0;i--){var p=P[i];p.life+=dt;if(p.life>=p.max){P.splice(i,1);continue;}
    if(p.type==='wind'){p.vx+=Math.sin(NOW*3+p.ph+p.y*0.02)*30*dt;p.vy+=Math.cos(NOW*2.6+p.ph+p.x*0.02)*30*dt;
      for(j=0;j<spins.length;j++){var sp3=spins[j];if(!sp3.spinning)continue;var ox=p.x-X(sp3.u),oy=p.y-Y(sp3.v),dd2=Math.hypot(ox,oy);if(dd2<k*0.16&&dd2>1){var tw2=Math.sign(sp3.av)*k*1.6*dt;p.vx+=-oy/dd2*tw2;p.vy+=ox/dd2*tw2;p.vx-=ox*2*dt;p.vy-=oy*2*dt;}}

function updResidents(dt){

function updGame(dt){

  var wl=L.wall;var cs=[[wl.x,wl.y],[wl.x+wl.w,wl.y],[wl.x,L.floorY],[wl.x+wl.w,L.floorY]];var mr=0;
  for(var i=0;i<4;i++)mr=Math.max(mr,Math.hypot(cs[i][0]-seq.jx,cs[i][1]-seq.jy));seq.maxR=mr+L.k*0.1;
  var ws=S.wins.slice().sort(function(a,b){var A1=wb(a),B1=wb(b);return Math.hypot(A1.cx-seq.jx,A1.cy-seq.jy)-Math.hypot(B1.cx-seq.jx,B1.cy-seq.jy);});
  var taken=[];

    var sheet=winPts(w,b,48),loc=[];for(var j=0;j<sheet.length;j+=4){loc.push(sheet[j]-b.cx,sheet[j+1]-b.cy);}
    var pl=planePts(pp);

function updSeq(dt){
  seq.t+=dt;var t=seq.t;
  if(seq.phase==='lace'){seq.laceP=ease(t/1.3);if(t>1.3)seq.phase='fly';}
  wallDirty=true;
  var allDone=true;
  for(var i=0;i<flying.length;i++){var f=flying[i];
    if(f.st==='wait'){allDone=false;if(t>=f.t0){f.st='fold';f.t=0;SFX.fold();}continue;}
    if(f.st==='fold'){allDone=false;f.t+=dt/0.75;if(f.t>=1){f.st='fly';f.t=0;SFX.launch();var inAir=0;for(var q2=0;q2<flying.length;q2++){if(flying[q2]!==f&&flying[q2].st==='fly'&&flying[q2].spot===f.spot)inAir++;}f.stack=spotCount(f.spot)+inAir;
        var sp=spotPos(f.spot,f.stack);f.ex=sp.x;f.ey=sp.y;f.erot=sp.rot;
        var side=f.ex>f.sx?1:-1;f.cx=(f.sx+f.ex)/2-side*L.k*0.15;f.cy=Math.min(f.sy,f.ey)-H*(0.2+0.15*f.wide);
        f.rot0=Math.atan2(f.cy-f.sy,f.cx-f.sx);}continue;}
    if(f.st==='fly'){allDone=false;f.t+=dt/f.dur;var e=ease(f.t),u=1-e;
      var x=u*u*f.sx+2*u*e*f.cx+e*e*f.ex,y=u*u*f.sy+2*u*e*f.cy+e*e*f.ey;
      var tx=2*u*(f.cx-f.sx)+2*e*(f.ex-f.cx),ty=2*u*(f.cy-f.sy)+2*e*(f.ey-f.cy);
      y+=Math.sin(f.t*12)*f.wide*6*(1-e);
      var ang=Math.atan2(ty,tx);if(f.t>0.85){var tg=f.erot+(f.ex<f.sx?Math.PI:0),da=tg-ang;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;ang+=da*clamp((f.t-0.85)/0.15,0,1);}
      f.x=x;f.y=y;f.rot=ang;
      if(Math.random()<dt*30)addP({x:x,y:y,vx:(Math.random()-0.5)*30,vy:(Math.random()-0.5)*30,life:0,max:0.5,sz:2+Math.random()*2,col:f.pp.ink,rot:0,vr:5,type:'trail'});
      if(f.t>=1){f.st='done';S.planes.push({a:f.pp.a,p:f.pp.p.slice(),ink:f.pp.ink,spot:f.spot});if(S.planes.length>12)S.planes.shift();
        SFX.land();burst(f.ex,f.ey,5,false);if(f.spot===0){uncle.happy=1.5;uncle.hop=0.6;}}
      continue;}
  }
  if(seq.phase==='fly'&&allDone){if(!seq.endT)seq.endT=t;if(t-seq.endT>0.8){seq.phase='refill';seq.rt=0;}}
  if(seq.phase==='refill'){seq.rt+=dt;seq.laceP=1-ease(seq.rt/1.6);if(seq.rt>1.6){
      seq=null;flying=[];S.flights++;S.armed=false;lastFlightEnd=NOW;disc('flight',X(0.5),Y(0.5));save();wallDirty=true;}}
}

function renderWall(){

    for(var si=0;si<3;si++){var r=R[si],fp=facePx(r);x.moveTo(fp.x+fr*1.08,fp.y);x.arc(fp.x,fp.y,fr*1.08,0,TAU);
      var feet=r.i<2?mezzY:L.floorY;var bt=fp.y+fr*0.8,bh=Math.max(fr,Math.min(feet,fp.y+fr*3.6)-bt);x.rect(fp.x-fr*0.8,bt,fr*1.6,bh);}

    x.fill('nonzero');x.restore();}

  for(i=0;i<6;i++){if(winBySlit(i))continue;var op=1+(inv&&inv.type==='slit'&&inv.i===i?bounceAmt()*1.4:0);pathPts(x,slitPts(world.slits[i],op));x.fill();}

  x.restore();wallDirty=false;
}
function bounceAmt(){var t=(NOW%1.6)/1.6;return t<0.25?Math.sin(t/0.25*Math.PI):0;}
function render(){
  var c=ctx,k=L.k,wl=L.wall,i;

  c.clearRect(0,0,W,H);

  c.save();c.beginPath();
  if(seq||newSheet){c.rect(wl.x,wl.y,wl.w,wl.h);}
  else{for(i=0;i<S.wins.length;i++){var wbx=wb(S.wins[i].d),wgx=wb(S.wins[i].g),pad=k*0.04;
      var x0=Math.max(wl.x,Math.min(wbx.x0,wgx.x0)-wbx.hx*0.35-pad),x1=Math.min(wl.x+wl.w,Math.max(wbx.x1,wgx.x1)+wbx.hx*0.35+pad),y0=Math.max(wl.y,Math.min(wbx.y0,wgx.y0)-wbx.hy*0.35-pad),y1=Math.min(L.floorY,Math.max(wbx.y1,wgx.y1)+wbx.hy*0.35+pad);
      if(x1>x0&&y1>y0)c.rect(x0,y0,x1-x0,y1-y0);}

  for(i=0;i<3;i++)drawRes(c,R[i]);

  /* ripples, press dents */
  for(i=0;i<ripples.length;i++){var rp=ripples[i];c.save();c.globalAlpha=0.35*(1-rp.t/0.6);c.strokeStyle=COL.navy;c.lineWidth=2;circle(c,rp.x,rp.y,8+rp.t*40);c.stroke();c.restore();}
  if(press){c.save();c.globalCompositeOperation='multiply';c.globalAlpha=0.22*(1-press.t/0.5);c.fillStyle=COL.navy;circle(c,press.x,press.y,k*0.12*(1-press.t*0.6));c.fill();c.restore();}
  /* window lips + outlines */

function expand(pts,cx,cy,d){var o=new Array(pts.length);for(var i=0;i<pts.length;i+=2){var dx=pts[i]-cx,dy=pts[i+1]-cy,l=Math.hypot(dx,dy)||1;o[i]=pts[i]+dx/l*d;o[i+1]=pts[i+1]+dy/l*d;}return o;}
function drawWinEdge(c,w){

function drawGarland(c){
