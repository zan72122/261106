];

/* ===== レイアウト ===== */
function layout(){
 W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
 let st=0,sr=0,sb=0,sl=0;
 try{const cs=getComputedStyle(saEl);st=parseFloat(cs.paddingTop)||0;sr=parseFloat(cs.paddingRight)||0;sb=parseFloat(cs.paddingBottom)||0;sl=parseFloat(cs.paddingLeft)||0;}catch(e){}
 wide=W/H>=1.1;
 if(wide){SCW=1560;SCH=1000;BX0=280;BY0=100;BOWL={L:{x:80,y:832},R:{x:920,y:832}};CAM={x:500,y:836};}
 else{SCW=1000;SCH=1450;BX0=0;BY0=30;BOWL={L:{x:400,y:818},R:{x:600,y:818}};CAM={x:500,y:905};}
 const aw=W-sl-sr-8,ah=H-st-sb-8;
 S=Math.min(aw/SCW,ah/SCH);
 OX=sl+4+(aw-SCW*S)/2;OY=st+4+(ah-SCH*S)/2;
 const mk=(o)=>({L:o,R:{hx:SCW-o.hx,hy:o.hy,hr:o.hr,bx:SCW-o.bx,by:o.by,bw:o.bw,bh:o.bh,sx:SCW-o.sx,sy:o.sy}});
 GEO=wide?mk({hx:150,hy:395,hr:88,bx:150,by:705,bw:190,bh:330,sx:212,sy:565})
         :mk({hx:240,hy:985,hr:95,bx:240,by:1270,bw:210,bh:380,sx:160,sy:1110});
 PHOTO_SLOTS=wide?[{x:70,y:70,a:-0.08},{x:165,y:95,a:0.06},{x:250,y:68,a:-0.03}]
                :[{x:390,y:1130,a:-0.07},{x:500,y:1150,a:0.05},{x:610,y:1128,a:-0.04}];
 prerender();
}
/* ===== PARTS ===== */

/* ===== 音（Web Audio 合成） ===== */
let AC=null,master=null,noiseBuf=null,stretch=null,lastKnock=0;
function audioInit(){
 if(!AC){
  try{
   const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
   AC=new A(); master=AC.createGain(); master.gain.value=0.75;
   const comp=AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
   noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
   const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
   const src=AC.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
   const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=260; bp.Q.value=2.2;
   const g=AC.createGain(); g.gain.value=0; src.connect(bp); bp.connect(g); g.connect(master); src.start();
   const osc=AC.createOscillator(); osc.type='triangle'; osc.frequency.value=90;
   const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=400;
   const og=AC.createGain(); og.gain.value=0; osc.connect(lp); lp.connect(og); og.connect(master); osc.start();
   stretch={bp,g,osc,og};
  }catch(e){AC=null;return;}
 }
 if(AC&&AC.state!=='running'){try{const pr=AC.resume(); if(pr&&pr.catch) pr.catch(()=>{});}catch(e){}}
}
function tone(f0,f1,dur,type,vol,delay){
 if(!AC||AC.state!=='running') return;
 try{
  const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t);
  if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03);
 }catch(e){}
}
function noise(dur,freq,q,vol,type,delay,f1){
 if(!AC||AC.state!=='running') return;
 try{
  const t=AC.currentTime+(delay||0), s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.setValueAtTime(freq,t); f.Q.value=q;
  if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(Math.max(0.0002,vol),t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random()*0.5); s.stop(t+dur+0.02);
 }catch(e){}
}
const SFX={
 knock(p,v){const now=performance.now(); if(now-lastKnock<35) return; lastKnock=now; v=clamp(v,0.08,1);
  tone(p,p*0.9,0.07,'triangle',0.2*v); tone(p*2.7,p*2.5,0.03,'sine',0.05*v); noise(0.025,p*3,4,0.07*v);},
 clack(v){v=clamp(v,0.1,1); tone(820,760,0.05,'square',0.04*v); tone(610,590,0.1,'triangle',0.18*v); noise(0.03,2400,3,0.08*v);},
 petan(){tone(180,60,0.2,'sine',0.38); noise(0.14,500,1,0.28,'lowpass',0,120);},
 snap(){tone(520,900,0.08,'sine',0.16); tone(170,60,0.2,'sine',0.32,0.03); noise(0.12,480,1,0.22,'lowpass',0.03,120);},
 squish(){tone(250,140,0.17,'sine',0.22); noise(0.09,350,1.5,0.1,'lowpass');},
 tick(){tone(1300,1200,0.035,'sine',0.05);},
 puni(){tone(380,250,0.1,'sine',0.1);},
 success(){[523,659,784,1047].forEach((f,i)=>{tone(f,f,0.26,'triangle',0.17,i*0.09);tone(f*2,f*2,0.18,'sine',0.04,i*0.09);});
  tone(2093,2093,0.6,'sine',0.05,0.38); tone(230,200,0.16,'sine',0.13,0.5); tone(230,200,0.16,'sine',0.13,0.75);},
 small(){tone(587,587,0.14,'triangle',0.12); tone(784,784,0.18,'triangle',0.12,0.1);},
 twang(){tone(300,560,0.3,'triangle',0.17); tone(600,1100,0.22,'sine',0.06);},
 hop(){tone(500,800,0.08,'sine',0.09);},
 pop(){tone(300,720,0.14,'sine',0.2); tone(720,900,0.1,'triangle',0.06,0.1);},
 creak(){tone(95,72,0.45,'sawtooth',0.035); noise(0.5,300,0.8,0.12,'bandpass',0,1600);},
 pakon(){tone(420,300,0.08,'triangle',0.25); tone(200,110,0.18,'sine',0.32); noise(0.06,900,1,0.15,'bandpass');},
 shutter(){noise(0.04,3000,1,0.3,'highpass'); noise(0.05,2200,1,0.25,'highpass',0.09); tone(1500,1500,0.06,'sine',0.06,0.1);},
 giggle(){tone(700,900,0.06,'sine',0.08); tone(820,1040,0.07,'sine',0.08,0.08);},
 gura(){tone(140,90,0.3,'sawtooth',0.04); tone(330,250,0.2,'triangle',0.1);}
};
function stretchSound(on,speed,len){
 if(!stretch||!AC||AC.state!=='running') return;
 const t=AC.currentTime;
 try{
  if(on){
   const sp=Math.min(speed,1600);
   stretch.bp.frequency.setTargetAtTime(150+sp*0.35+len*0.1,t,0.05);
   stretch.g.gain.setTargetAtTime(Math.min(0.2,0.015+sp*0.00018),t,0.05);
   stretch.osc.frequency.setTargetAtTime(62+len*0.05+sp*0.03,t,0.06);
   stretch.og.gain.setTargetAtTime(Math.min(0.12,0.01+sp*0.0001),t,0.06);
  }else{stretch.g.gain.setTargetAtTime(0,t,0.06);stretch.og.gain.setTargetAtTime(0,t,0.06);}
 }catch(e){}
}

/* ===== 状態 ===== */
const stats={handoffs:0,taut:0,slackRest:0,dipRest:0,bend:0,chain:0,links:0,twoBall:0,reverse:0,flips:0,backCatch:0,photos:0,sends:0,taps:0};
const balls=BALLDEF.map((d,i)=>({id:i,d,x:0,y:0,vx:0,vy:0,ang:0,st:'bowl',side:'L',sup:null,supNew:null,onG:false,restT:0,ign:null,ignT:0,
 wob:0,last:null,relT:-9,roll:0,fly:null,tries:0,pocketT:0,pocketKey:'',pv:null,liveSlowT:0,liveWasSlow:false,dentDone:false}));
function mkP(s){return {side:s,cradle:null,cradleRes:null,bowl:[],hx:HAND[s].x,hy:HAND[s].y,tx:HAND[s].x,ty:HAND[s].y,
 happy:0,surp:0,nod:0,wig:0,blink:2+Math.random()*2,blinkT:0,lx:500,ly:380,refillT:0,launchT:1.2,reach:null,reachT:0};}
const P={L:mkP('L'),R:mkP('R')};
function mkG(s){return {side:s,x:HAND[s].x,y:HAND[s].y,st:'home',ball:null,sq:0,sqV:0,press:false,fly:null,rot:0,wig:0,pref:null};}
const G={L:mkG('L'),R:mkG('R')};
let shelves=[],shelfSeq=0,grooves=[],drag=null,parts=[],lastReceiver=null,lastSender=null,firstTouch=false;
const flip={p:0,face:'front',target:0,drag:false,unlocked:false,raise:0,collected:false,visitCatch:0,photoThisVisit:false};
let cameraOn=false,camSq=0,flash=0,guide=null,idleT=0,demo=null,demoShown=false,gutterRecv='R',gutLY=0,gutRY=0;
const gutter={id:0,gut:true,n:3,px:new Float32Array(3),py:new Float32Array(3),cs:new Float32Array(3),t:20,L:0,minx:0,maxx:BW,miny:600,maxy:BH};
// 初期配置：左の人の受け台に大玉、小さな玉はかごに
P.L.cradle=0; balls[0].st='cradle'; balls[0].side='L';
P.L.bowl=[1,2]; balls[1].side='L'; balls[2].side='L';

/* ===== 帯・棚の幾何 ===== */
function newShelf(side){return {id:++shelfSeq,side,live:true,n:0,bx:null,by:null,px:null,py:null,dy:null,vy:null,cs:null,L:0,t:30,
 tilt:0,tiltV:0,flat:0,flatV:0,startLink:null,endLink:null,dents:[],born:T,fade:0,fading:false,minx:0,maxx:0,miny:0,maxy:0,
 nOn:0,tiltOn:false,tiltSet:[],lowT:0,gx:null,gy:null,wob:0,wobS:0};}
function setShelfPts(sh,pts){
 const n=pts.length;
 if(sh.n!==n||!sh.bx){
  const ody=sh.dy,ovy=sh.vy;
  sh.bx=new Float32Array(n);sh.by=new Float32Array(n);sh.px=new Float32Array(n);sh.py=new Float32Array(n);
  sh.dy=new Float32Array(n);sh.vy=new Float32Array(n);sh.cs=new Float32Array(n);
  if(ody){for(let i=0;i<Math.min(n,ody.length);i++){sh.dy[i]=ody[i];sh.vy[i]=ovy[i];}}
  sh.n=n;
 }
 let acc=0;
 for(let i=0;i<n;i++){sh.bx[i]=pts[i].x;sh.by[i]=pts[i].y;if(i>0)acc+=hyp(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);sh.cs[i]=acc;}
 sh.L=acc;
 sh.t=clamp(34*Math.sqrt(430/Math.max(acc,1)),17,34);
}
function smooth(a){
 if(a.length<3) return a.map(p=>({x:p.x,y:p.y}));
 let b=a;
 for(let pass=0;pass<2;pass++){const o=[{x:b[0].x,y:b[0].y}];for(let i=1;i<b.length-1;i++)o.push({x:(b[i-1].x+b[i].x*2+b[i+1].x)/4,y:(b[i-1].y+b[i].y*2+b[i+1].y)/4});o.push({x:b[b.length-1].x,y:b[b.length-1].y});b=o;}
 return b;
}
function resample(a,SP){
 const out=[{x:a[0].x,y:a[0].y}];let need=SP;
 for(let i=1;i<a.length;i++){
  let x0=a[i-1].x,y0=a[i-1].y;const x1=a[i].x,y1=a[i].y;let seg=hyp(x1-x0,y1-y0);
  while(seg>=need){const t=need/seg;x0+=(x1-x0)*t;y0+=(y1-y0)*t;out.push({x:x0,y:y0});seg-=need;need=SP;}
  need-=seg;
 }
 const L=a[a.length-1],lo=out[out.length-1];
 if(out.length<2||hyp(L.x-lo.x,L.y-lo.y)>SP*0.35) out.push({x:L.x,y:L.y}); else {lo.x=L.x;lo.y=L.y;}
 return out;
}
function segIdx(sh,s){let lo=0,hi=sh.n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(sh.cs[m]<=s)lo=m;else hi=m;}return lo;}
function pointAt(sh,s){
 s=clamp(s,0,sh.L);const i=segIdx(sh,s);const j=Math.min(i+1,sh.n-1);const l=sh.cs[j]-sh.cs[i];const t=l>0?(s-sh.cs[i])/l:0;
 const x=lerp(sh.px[i],sh.px[j],t),y=lerp(sh.py[i],sh.py[j],t);
 let tx=sh.px[j]-sh.px[i],ty=sh.py[j]-sh.py[i];const tl=hyp(tx,ty)||1;tx/=tl;ty/=tl;
 let nx=ty,ny=-tx;if(ny>0){nx=-nx;ny=-ny;}
 return {x,y,tx,ty,nx,ny};
}
function shelfById(id){for(const s of shelves) if(s.id===id) return s; return null;}
function handShelf(side){for(let i=shelves.length-1;i>=0;i--){const s=shelves[i];if(!s.live&&!s.fading&&s.startLink&&s.startLink.hand===side)return s;}return null;}
function distToShelf(sh,x,y){let best=1e9,bs=0;for(let i=0;i<sh.n-1;i++){const ax=sh.px[i],ay=sh.py[i],ex=sh.px[i+1]-ax,ey=sh.py[i+1]-ay,l2=ex*ex+ey*ey;if(l2<1e-6)continue;let t=((x-ax)*ex+(y-ay)*ey)/l2;t=clamp(t,0,1);const d=hyp(x-ax-ex*t,y-ay-ey*t);if(d<best){best=d;bs=sh.cs[i]+t*(sh.cs[i+1]-sh.cs[i]);}}return {d:best,s:bs};}

/* 棚のたわみ・傾き */
function deform(sh,dt){
 const n=sh.n;if(n<2)return;
 let cnt=0,wsum=0;
 for(const b of balls) if(b.st==='free'&&b.sup&&b.sup.sh===sh){cnt++;wsum+=b.d.w;}
 sh.nOn=cnt;
 const dir=(sh.bx[n-1]-sh.bx[0])>=0?1:-1;
 let tT=0,fT=0;
 if(!sh.live&&!sh.groove){
  if(cnt>=2){tT=dir*0.21;fT=0.62;if(!sh.tiltOn){sh.tiltOn=true;sh.tiltSet=[];SFX.gura();for(const s of SIDES)P[s].surp=0.8;}
   for(const b of balls) if(b.st==='free'&&b.sup&&b.sup.sh===sh&&sh.tiltSet.indexOf(b.id)<0) sh.tiltSet.push(b.id);
   sh.lowT=0;}
  else{ if(cnt===1) tT=dir*0.022*wsum; if(sh.tiltOn){sh.lowT+=dt;if(sh.lowT>0.9){sh.tiltOn=false;}}}
 }
 sh.tiltV+=((tT-sh.tilt)*55-sh.tiltV*7)*dt;sh.tilt+=sh.tiltV*dt;
 sh.flatV+=((fT-sh.flat)*40-sh.flatV*8)*dt;sh.flat=clamp(sh.flat+sh.flatV*dt,0,0.9);
 const k=sh.live?520:700,c=sh.live?12:13;
 const sg=60,sg2=2*sg*sg;
 for(let i=0;i<n;i++){
  let tg=0;
  for(const b of balls){if(b.st!=='free'||!b.sup||b.sup.sh!==sh)continue;const ds=sh.cs[i]-b.sup.s;if(ds>130||ds<-130)continue;
   tg+=7*b.d.w*clamp(Math.sqrt(sh.L/600),0.6,1.4)*Math.exp(-ds*ds/sg2);}
  if(sh.wob>0){const ds=sh.cs[i]-sh.wobS;tg+=sh.wob*10*Math.exp(-ds*ds/(2*60*60))*Math.sin(T*30);}
  sh.vy[i]+=((tg-sh.dy[i])*k-sh.vy[i]*c)*dt;sh.dy[i]+=sh.vy[i]*dt;
 }
 if(sh.wob>0) sh.wob=Math.max(0,sh.wob-dt*2.5);
 const x0=sh.bx[0],y0=sh.by[0],xe=sh.bx[n-1],ye=sh.by[n-1],L=sh.L||1,co=Math.cos(sh.tilt),si=Math.sin(sh.tilt);
 let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
 for(let i=0;i<n;i++){
  let x=sh.bx[i],y=sh.by[i];
  if(sh.flat>0.001){const f=sh.cs[i]/L;x=lerp(x,x0+(xe-x0)*f,sh.flat);y=lerp(y,y0+(ye-y0)*f,sh.flat);}
  const rx=x-x0,ry=y-y0;x=x0+rx*co-ry*si;y=y0+rx*si+ry*co+sh.dy[i];
  sh.px[i]=x;sh.py[i]=y;if(x<mnx)mnx=x;if(x>mxx)mxx=x;if(y<mny)mny=y;if(y>mxy)mxy=y;
 }
 const m=sh.t+4;sh.minx=mnx-m;sh.maxx=mxx+m;sh.miny=mny-m;sh.maxy=mxy+m;
 if(sh.fading){sh.fade+=dt*1.6;}
}
function setGutter(dt){
 let yl=728,ym=694,yr=728;
 if(flip.face==='back'){const lo=744,hi=702;if(gutterRecv==='R'){yl=hi;yr=lo;}else{yl=lo;yr=hi;}ym=(yl+yr)/2;}
 gutLY=lerp(gutLY||yl,yl,Math.min(1,dt*3));gutRY=lerp(gutRY||yr,yr,Math.min(1,dt*3));
 const gm=flip.face==='back'?(gutLY+gutRY)/2:ym;
 gutter.px[0]=14;gutter.py[0]=gutLY;gutter.px[1]=500;gutter.py[1]=gm;gutter.px[2]=986;gutter.py[2]=gutRY;
 gutter.cs[0]=0;gutter.cs[1]=hyp(486,gm-gutLY);gutter.cs[2]=gutter.cs[1]+hyp(486,gutRY-gm);gutter.L=gutter.cs[2];
 gutter.miny=Math.min(gutLY,gm,gutRY)-20;gutter.maxy=BH;
}

/* ===== 物理 ===== */
function collideShelf(b,sh,r){
 const R=r+sh.t*0.5;let bd=R*R,bi=-1,bt=0,bqx=0,bqy=0,bnux=0,bnuy=-1;
 const px=sh.px,py=sh.py,n=sh.n;
 for(let i=0;i<n-1;i++){
  const ax=px[i],ay=py[i],ex=px[i+1]-ax,ey=py[i+1]-ay,l2=ex*ex+ey*ey;if(l2<1e-6)continue;
  let t=((b.x-ax)*ex+(b.y-ay)*ey)/l2;t=t<0?0:t>1?1:t;
  const qx=ax+ex*t,qy=ay+ey*t,dx=b.x-qx,dy=b.y-qy,d2=dx*dx+dy*dy;
  if(d2>=bd)continue;
  const l=Math.sqrt(l2);let nux=ey/l,nuy=-ex/l;if(nuy>0){nux=-nux;nuy=-nuy;}
  if(Math.abs(nuy)>0.2){const sd=dx*nux+dy*nuy;const inner=(t>0&&t<1)||(i>0&&t===0)||(i<n-2&&t===1);
   if(inner){if(sd<0)continue;}else{if(sd<0.35*Math.sqrt(d2))continue;}}
  bd=d2;bi=i;bt=t;bqx=qx;bqy=qy;bnux=nux;bnuy=nuy;
 }
 if(bi<0)return;
 const d=Math.sqrt(bd);let nx,ny;
 if(d<1e-4){nx=bnux;ny=bnuy;}else{nx=(b.x-bqx)/d;ny=(b.y-bqy)/d;}
 const pen=R-d;b.x+=nx*pen;b.y+=ny*pen;
 const vn=b.vx*nx+b.vy*ny;
 if(vn<0){b.vx-=1.14*vn*nx;b.vy-=1.14*vn*ny;
  if(-vn>160){SFX.knock(b.d.pitch*0.8,-vn/700);if(-vn>320)crumbs(bqx,bqy,sh.gut?C.tealD:(sh.side?SIDECOL[sh.side].b:C.tealD),3);}}
 if(ny<-0.3){b.onG=true;if(!b.supNew||ny<b.supNew.ny){b.supNew={sh,s:sh.cs[bi]+bt*(sh.cs[bi+1]-sh.cs[bi]),nx,ny};}}
}
function physGeo(){
 const g=[];
 if(flip.face==='front'){for(const s of shelves) if(s.n>1&&!(s.fading&&s.fade>0.5)) g.push(s);}
 else{for(const s of grooves) g.push(s);}
 g.push(gutter);return g;
}
function stepBalls(dt){
 const geo=physGeo(),NS=4,h=dt/NS;

 for(const b of fb){b.supNew=null;}
 for(let k=0;k<NS;k++){
  for(const b of fb){
   if(b.pocketT>0)continue;
   b.onG=false;b.vy+=GRAV*h;if(back&&b.last)b.vx+=(b.last==='L'?1:-1)*(380+b.tries*90)*h;b.x+=b.vx*h;b.y+=b.vy*h;
   const r=b.d.r;
   for(const sh of geo){
    if(b.ign&&b.ign.indexOf(sh)>=0)continue;
    if(b.x+r<sh.minx||b.x-r>sh.maxx||b.y+r<sh.miny||b.y-r>sh.maxy)continue;
    collideShelf(b,sh,r);
   }
   if(drag&&drag.kind==='band'&&drag.shelf.L>r+40){ // 手袋が帯の先で玉を受け止める
    const gx=drag.tipX,gy=drag.tipY,dx=b.x-gx,dy=b.y-gy,dd=hyp(dx,dy),RR=r+34;
    if(dd<RR&&dd>0.01){const nx=dx/dd,ny=dy/dd;b.x=gx+nx*RR;b.y=gy+ny*RR;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.3*vn*nx;b.vy-=1.3*vn*ny;if(-vn>120){SFX.knock(b.d.pitch,-vn/600);G[drag.side].sq=0.6;}}}
   }
   if(b.x<r){b.x=r;if(b.vx<0)b.vx=-b.vx*0.35;}
   if(b.x>BW-r){b.x=BW-r;if(b.vx>0)b.vx=-b.vx*0.35;}
   if(b.y>BH-r){b.y=BH-r;if(b.vy>0)b.vy=0;b.onG=true;}
   if(b.onG&&b.supNew&&b.supNew.sh.live){const sp=hyp(b.vx,b.vy);if(sp>190){const f=1-10*h*(sp-190)/sp;b.vx*=f;b.vy*=f;}}
   if(b.onG){const f=1-b.d.fr*h;b.vx*=f;b.vy*=f;const sp=hyp(b.vx,b.vy);if(sp<7){b.vx*=0.6;b.vy*=0.6;}}
  }
  for(let i=0;i<fb.length;i++)for(let j=i+1;j<fb.length;j++){
   const a=fb[i],c=fb[j];const dx=c.x-a.x,dy=c.y-a.y,rr=a.d.r+c.d.r,d2=dx*dx+dy*dy;
   if(d2<rr*rr&&d2>1e-6){const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,pen=rr-d,ma=a.d.w,mc=c.d.w,tot=ma+mc;
    a.x-=nx*pen*mc/tot;a.y-=ny*pen*mc/tot;c.x+=nx*pen*ma/tot;c.y+=ny*pen*ma/tot;
    const rv=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;
    if(rv<0){const jj=-(1.55)*rv/(1/ma+1/mc);a.vx-=jj*nx/ma;a.vy-=jj*ny/ma;c.vx+=jj*nx/mc;c.vy+=jj*ny/mc;
     if(-rv>50){SFX.clack(-rv/500);a.wob=Math.max(a.wob,0.5);c.wob=Math.max(c.wob,0.5);}}}
  }
 }
 for(const b of fb){
  const prev=b.sup;b.sup=b.supNew;
  // 粘土はねばる：凸のところで少し浮いても帯に吸い戻す
  if(prev&&!b.sup&&!prev.sh.gut&&!(b.ign&&b.ign.indexOf(prev.sh)>=0)&&prev.sh.n>1&&(shelves.indexOf(prev.sh)>=0||grooves.indexOf(prev.sh)>=0)){
   const r=distToShelf(prev.sh,b.x,b.y),R=b.d.r+prev.sh.t*0.5;
   if(r.d<R+16&&r.s>2&&r.s<prev.sh.L-2){const q=pointAt(prev.sh,r.s);
    if((b.x-q.x)*q.nx+(b.y-q.y)*q.ny>0){b.x=q.x+q.nx*R;b.y=q.y+q.ny*R;const vn=b.vx*q.nx+b.vy*q.ny;if(vn>0){b.vx-=vn*q.nx;b.vy-=vn*q.ny;}
     b.sup={sh:prev.sh,s:r.s,nx:q.nx,ny:q.ny};}}
  }
  const sp=hyp(b.vx,b.vy);
  if(b.pocketT>0){b.pocketT-=dt;if(b.pocketT<=0&&b.pv){b.vx=b.pv.x;b.vy=b.pv.y;b.pv=null;}continue;}
  if(b.sup&&sp<14)b.restT+=dt;else b.restT=0;
  if(b.sup){b.roll+=sp*dt;if(b.roll>b.d.r*1.25){b.roll=0;if(sp>25)SFX.knock(b.d.pitch,sp/420);}}
  b.ang+=(b.sup?b.vx:b.vx*0.3)/b.d.r*dt;
  if(b.ign){b.ignT-=dt;if(b.ignT<=0)b.ign=null;else if(b.ignT<3.6){b.ign=b.ign.filter(x=>shelves.indexOf(x)>=0&&distToShelf(x,b.x,b.y).d<=b.d.r+x.t+8);if(!b.ign.length)b.ign=null;}}
  // 二玉で傾いた棚から押し出された
  if(prev&&prev.sh.tiltOn&&(!b.sup||b.sup.sh!==prev.sh)&&prev.sh.tiltSet.indexOf(b.id)>=0&&!prev.sh.pushCounted){
   prev.sh.pushCounted=true;stats.twoBall++;b.wob=1;}
  if(b.sup&&!b.sup.sh.tiltOn&&b.sup.sh.pushCounted&&b.sup.sh.nOn<2)b.sup.sh.pushCounted=false;
  // 発見記録：生きている帯の上で一度止まり再び進む
  if(b.sup&&b.sup.sh.live){if(sp<20){b.liveSlowT+=dt;if(b.liveSlowT>0.25)b.liveWasSlow=true;}else if(sp>70&&b.liveWasSlow){b.liveWasSlow=false;b.liveSlowT=0;stats.bend++;}}
  else{b.liveSlowT=0;b.liveWasSlow=false;}
  // 押し跡（停止位置の記憶）
  if(flip.face==='front'&&b.sup&&!b.sup.sh.gut&&!b.sup.sh.live&&b.restT>1.0&&!b.dentDone){
   b.dentDone=true;const sh=b.sup.sh;
   if(sh.dents.every(s=>Math.abs(s-b.sup.s)>50)&&sh.dents.length<4){sh.dents.push(b.sup.s);
    if(sh.endLink&&!sh.endLink.shelf)stats.slackRest++;else stats.dipRest++;}}
  if(b.restT===0)b.dentDone=false;
  // 裏側：くぼみで一瞬止まる・止まりすぎたら傾けて送る
  if(flip.face==='back'&&b.sup&&b.sup.sh.groove){
   const g=b.sup.sh;
   for(const ps of g.pockets){const key=g.id+':'+Math.round(ps);if(Math.abs(b.sup.s-ps)<16&&b.pocketKey!==key){b.pocketKey=key;b.pocketT=0.38;
    const keep=Math.max(sp,140);const vl=sp||1;b.pv={x:b.vx/vl*keep*0.85,y:b.vy/vl*keep*0.85};b.vx=0;b.vy=0;SFX.knock(b.d.pitch*1.2,0.6);b.wob=0.6;break;}}
   if(b.restT>1.0){const dir=b.last?(b.last==='L'?1:-1):(gutterRecv==='R'?1:-1);b.vx+=dir*(200+b.tries*150);b.vy-=b.tries>=2?520:100;b.tries++;b.restT=0;g.wob=1;g.wobS=b.sup.s;b.wob=1;SFX.hop();}
  }
  if(b.y>BH+80||!isFinite(b.x)||!isFinite(b.y)){b.x=500;b.y=600;b.vx=0;b.vy=0;}
 }
}
/* 受け取り・拾い */
function checkCatches(){
 for(const b of balls){
  if(b.st!=='free'||b.pocketT>0)continue;
  // 樋の端
  const bk=flip.face==='back',rcv=bk?(b.last?OTHER[b.last]:gutterRecv):null;
  if(b.sup&&b.sup.sh===gutter){
   if(b.x<78&&(!bk||rcv==='L')){catchBall(b,'L',!bk);continue;}
   if(b.x>922&&(!bk||rcv==='R')){catchBall(b,'R',!bk);continue;}
  }
  for(const s of SIDES){
   const h=HAND[s],dx=b.x-h.x,dy=b.y-h.y,d=hyp(dx,dy);
   if(b.sup&&b.sup.sh.live&&b.sup.sh.startLink&&b.sup.sh.startLink.hand===s)continue;
   if(drag&&drag.kind==='band'&&drag.side===s&&b.last===s)continue;
   let near=d<125;
   if(!near&&b.sup&&b.sup.sh.endLink===s&&b.sup.s>b.sup.sh.L-80)near=true;
   if(!near)continue;
   if(b.last===s&&(bk||T-b.relT<1.2))continue;
   if(d>1&&(b.vx*dx+b.vy*dy)/d>90)continue;
   catchBall(b,s,false);break;
  }
 }
}
function destFor(side){const p=P[side];if(p.cradle==null&&p.cradleRes==null){p.cradleRes=-1;return 'cradle';}return 'bowl';}

function bowlPos(side,idx){const o=BOWL[side];const dx=[-26,24,0][idx%3],dy=[-6,-4,-28][idx%3];return {x:o.x+dx*DIRX[side],y:o.y+dy-20};}
function startFly(b,side,dest,dur){

 if(dest==='cradle')P[side].cradleRes=b.id;

function catchBall(b,side,fromGutter){

  if(success&&!fromGutter){stats.handoffs++;lastReceiver=side;cheer(side,true);SFX.success();confetti(HAND[side].x,HAND[side].y-20);}
  else{p.happy=Math.max(p.happy,0.7);SFX.small();}
 }else{
  if(success){stats.backCatch++;flip.visitCatch++;cheer(side,true);SFX.success();confetti(HAND[side].x,HAND[side].y-20);
   if(!cameraOn){cameraOn=true;setTimeout(()=>SFX.pop(),700);}}

function cheer(side,both){P[side].happy=1.8;P[side].nod=1;if(both){P[OTHER[side]].happy=1.5;P[OTHER[side]].nod=1;}}
function updFly(dt){

  if(b.st!=='fly')continue;const f=b.fly;f.t+=dt/f.d;const t=Math.min(1,f.t);

}

function startBand(d,b){

  fromBall=balls[g.ball];const sp=fromBall.sup;

 }else{anchor={x:ANCH[side].x,y:ANCH[side].y};startLink={hand:side};relBall=P[side].cradle;}

function bandMove(bx,by){

 let fx=d.anchor.x+(bx-d.f0x),fy=d.anchor.y+(by-d.f0y);
 if(d.touch)fy-=Math.min(26,d.moved*0.3);
 fx=clamp(fx,8,BW-8);fy=clamp(fy,-20,690);

function rebuildLive(dt){

  if(hyp(gx-PH.tx,gy-PH.ty)<115)conn=true;}
 else{PH.tx=home.x;PH.ty=home.y;}

   const r=distToShelf(s,gx,gy);

   d.mag={sh:best.sh,s:best.s,x:mx,y:my};gx=lerp(gx,mx,0.75);gy=lerp(gy,my,0.75);}
 }
 if(conn&&!d.conn){SFX.pop();PH.surp=0.6;}
 if(!conn&&d.conn){d.flicked=false;}
 d.conn=conn;d.tipX=gx;d.tipY=gy;
 // 形を作る
 const src=d.path.slice();src.push({x:gx,y:gy});
 let pts=resample(smooth(src),16);
 let L=0;const cs=[0];for(let i=1;i<pts.length;i++){L+=hyp(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);cs.push(L);}

  if(taut){pts[i].x=lerp(pts[i].x,a.x+(e.x-a.x)*f,0.85);pts[i].y=lerp(pts[i].y,a.y+(e.y-a.y)*f,0.85);}

 for(const b of balls) if(b.st==='free'&&b.sup&&b.sup.sh===sh&&sh.n>1){const q=pointAt(sh,b.sup.s);carry.push([b,q.x,q.y]);}
 setShelfPts(sh,pts);deform(sh,dt);
 for(const [b,ox,oy] of carry){if(b.sup.s>sh.L){continue;}const q=pointAt(sh,b.sup.s);const ddx=q.x-ox,ddy=q.y-oy;if(hyp(ddx,ddy)<60){b.x+=ddx;b.y+=ddy;}}
 // ぴんと張ったら勢いよく

  if(!d.flicked){d.flicked=true;SFX.twang();}
  for(const b of balls) if(b.st==='free'&&b.sup&&b.sup.sh===sh&&b.flk!==sh.id){b.flk=sh.id;b.vx=ux*600;b.vy=uy*600-40;stats.taut++;b.wob=0.6;}}
 // 玉を帯へ送り出す

  if(d.relBall!=null&&sh.L>150&&P[side].cradle===d.relBall){

   if(b.st==='free'){b.ign=b.sup?[b.sup.sh]:null;b.ignT=4;const q=pointAt(sh,8);b.vx+=q.tx*150;b.vy+=q.ty*150;b.last=side;b.relT=T;b.restT=0;stats.sends++;if(side==='R')stats.reverse++;}

/* ===== 誘導（ひとつだけ目立たせる） ===== */
function computeGuide(){
 if(drag&&drag.kind!=='none')return null;
 if(flip.p!==0&&flip.p!==1)return null;
 if(flip.face==='front'){
  if(flip.unlocked&&stats.flips===0){const t=tabPos();return {k:'tab',x:t.x,y:t.y};}
  const order=lastReceiver?[lastReceiver,OTHER[lastReceiver]]:['L','R'];
  if(stats.chain===0)for(const s of order){const g=G[s];if(g.st==='atBall'&&!g.fly)return {k:'glove',side:s,x:g.x,y:g.y};}
  if(stats.twoBall===0)for(const s of order){const id=P[s].cradle;const hs=handShelf(s);
   if(id!=null&&hs&&hs.nOn===1){const b=balls[id],cp=cradlePos(s,b);return {k:'cradle',side:s,x:cp.x,y:cp.y};}}
  for(const s of order){const g=G[s];if(g.st==='atBall'&&!g.fly)return {k:'glove',side:s,x:g.x,y:g.y};}
  for(const s of order){if(canDrag(s)){const g=G[s];return {k:'glove',side:s,x:g.x,y:g.y};}}
  if(flip.unlocked){const t=tabPos();return {k:'tab',x:t.x,y:t.y};}
  return null;
 }
 if(cameraOn&&!flip.photoThisVisit)return {k:'cam',x:CAM.x,y:CAM.y};
 if(flip.visitCatch>=3||flip.photoThisVisit){const t=tabPos();return {k:'tab',x:t.x,y:t.y};}
 return null;
}

}

}

 for(let i=0;i<N;i++){const p=pts[i],q=m(p,pts[(i+1)%N]);c.quadraticCurveTo(p[0],p[1],q[0],q[1]);}c.closePath();
}

 c.globalAlpha=0.5;c.fillStyle=light;blobPath(c,cx-rx*0.25,cy-ry*0.3,rx*0.45,ry*0.32,seed+5,0.15);c.fill();c.globalAlpha=1;

  c.globalAlpha=0.4;c.strokeStyle=C.grnL;c.lineWidth=4;c.beginPath();c.arc(hx,hy-r*0.2,r*0.8,-2.6,-1.2);c.stroke();c.globalAlpha=1;
 }else{ // 茶色の短い髪と深緑の帽子
  c.fillStyle=C.hairR;c.beginPath();c.ellipse(hx,hy-r*0.45,r*0.95,r*0.5,0,PI,0);c.fill();
  c.fillStyle=C.grn;c.beginPath();c.ellipse(hx,hy-r*0.62,r*0.9,r*0.55,0,PI,0);c.fill();
  c.fillStyle=C.grnD;c.beginPath();c.ellipse(hx-r*0.55,hy-r*0.6,r*0.62,r*0.16,-0.1,0,7);c.fill();
  c.fillStyle=C.milk;c.beginPath();c.arc(hx,hy-r*1.12,r*0.16,0,7);c.fill();
 }
 // 顔
 const lx=p.lx+BX0-hx,ly=p.ly+BY0-hy,ll=hyp(lx,ly)||1,ox=lx/ll*r*0.08,oy=ly/ll*r*0.06;
 const ex=hx+dx*r*0.1,ey=hy+r*0.05,sp=r*0.36;
 c.fillStyle=C.cheek;c.globalAlpha=0.35+(p.happy>0?0.25:0);c.beginPath();c.ellipse(ex-sp-r*0.05,ey+r*0.32,r*0.17,r*0.11,0,0,7);c.ellipse(ex+sp+r*0.05,ey+r*0.32,r*0.17,r*0.11,0,0,7);c.fill();c.globalAlpha=1;
 c.fillStyle=C.ink;c.strokeStyle=C.ink;c.lineCap='round';
 const happy=p.happy>0.15,surp=!happy&&p.surp>0.1;
 for(const e of [-1,1]){const x=ex+e*sp,y=ey;
  if(happy){c.lineWidth=r*0.07;c.beginPath();c.arc(x,y+r*0.05,r*0.12,PI*1.1,PI*1.9);c.stroke();}
  else if(p.blinkT>0){c.lineWidth=r*0.05;c.beginPath();c.moveTo(x-r*0.1,y);c.lineTo(x+r*0.1,y);c.stroke();}
  else{const er=surp?r*0.16:r*0.12;c.fillStyle='#fffaf0';c.beginPath();c.ellipse(x,y,er*1.15,er*1.3,0,0,7);c.fill();
   c.fillStyle=C.ink;c.beginPath();c.arc(x+ox,y+oy,er*0.75,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x+ox-er*0.25,y+oy-er*0.3,er*0.25,0,7);c.fill();}
 }
 // 口
 const mx=ex,my=ey+r*0.42;c.lineWidth=r*0.06;c.strokeStyle='#7a2a1a';
 if(happy){c.fillStyle='#8a2c1c';c.beginPath();c.moveTo(mx-r*0.24,my-r*0.04);c.quadraticCurveTo(mx,my+r*0.36,mx+r*0.24,my-r*0.04);c.closePath();c.fill();
  c.fillStyle=C.redL;c.beginPath();c.ellipse(mx,my+r*0.12,r*0.1,r*0.06,0,0,7);c.fill();}
 else if(surp){c.fillStyle='#8a2c1c';c.beginPath();c.ellipse(mx,my+r*0.02,r*0.08,r*0.11,0,0,7);c.fill();}
 else{c.beginPath();c.arc(mx,my-r*0.1,r*0.16,PI*0.2,PI*0.8);c.stroke();}
 c.restore();
}
function drawGlove(c,g){
 const col=SIDECOL[g.side],dx=DIRX[g.side];
 const isGuide=guide&&guide.k==='glove'&&guide.side===g.side;
 const bob=isGuide&&g.st!=='drag'&&!g.press&&g.sq<0.2?-Math.abs(Math.sin(T*5))*12:0,wig=Math.sin(T*35)*g.wig*0.25;
 const sq=clamp(g.sq,-0.4,1);
 c.save();c.translate(g.x,g.y+bob);
 if(isGuide){c.globalAlpha=0.3+0.18*Math.sin(T*6);c.fillStyle='#fff7d6';c.beginPath();c.arc(0,0,74,0,7);c.fill();c.globalAlpha=1;}
 c.fillStyle='rgba(5,35,32,0.25)';c.beginPath();c.ellipse(8,40-bob,46,13,0,0,7);c.fill();
 if(g.press){c.fillStyle='rgba(255,247,214,0.9)';c.beginPath();c.arc(0,4,62,0,7);c.fill();c.strokeStyle=SIDECOL[g.side].b;c.lineWidth=7;c.beginPath();c.arc(0,4,62,0,7);c.stroke();}
 c.scale(dx,1);c.rotate((g.st==='drag'?Math.atan2(Math.sin(g.rot),Math.cos(g.rot)*dx):g.rot*dx)+wig);
 c.scale(1+sq*0.22,1-sq*0.3);
 clay(c,10,0,46,38,C.milk,C.milkD,C.milkL,g.side==='L'?61:62,0.07);
 clay(c,-2,-30,17,13,C.milk,C.milkD,C.milkL,63,0.1);
 c.strokeStyle=C.milkD;c.lineWidth=2.5;c.beginPath();c.moveTo(30,-14);c.quadraticCurveTo(44,-4,30,8);c.moveTo(34,12);c.quadraticCurveTo(46,20,32,28);c.stroke();
 prints(c,14,4,18,'rgba(140,115,80,0.35)',g.side==='L'?5:6);
 clay(c,-38,2,15,34,col.b,col.d,col.l,64,0.06);
 c.restore();
}
function drawCamera(c){
 if(!cameraOn)return;
 const isG=guide&&guide.k==='cam',bob=isG?-Math.abs(Math.sin(T*5))*10:0,sq=camSq;
 c.save();c.translate(CAM.x,CAM.y+bob);c.scale(1+sq*0.15,1-sq*0.2);
 if(isG){c.globalAlpha=0.3+0.18*Math.sin(T*6);c.fillStyle='#fff7d6';c.beginPath();c.arc(0,0,72,0,7);c.fill();c.globalAlpha=1;}
 c.fillStyle='rgba(0,0,0,0.25)';c.beginPath();c.ellipse(6,36,56,12,0,0,7);c.fill();
 clay(c,0,4,56,36,C.grn,C.grnD,C.grnL,81,0.05);
 clay(c,-26,-30,16,10,C.red,C.redD,C.redL,82,0.1);
 c.fillStyle=C.milk;c.beginPath();c.arc(4,4,24,0,7);c.fill();c.fillStyle=C.ink;c.beginPath();c.arc(4,4,15,0,7);c.fill();
 c.fillStyle='#8fd0ff';c.globalAlpha=0.7;c.beginPath();c.arc(-1,-1,5,0,7);c.fill();c.globalAlpha=1;
 c.restore();
}
function drawPhotos(c){
 const list=photos.slice(0,3);
 for(let i=list.length-1;i>=0;i--){const ph=list[i],sl=PHOTO_SLOTS[i];if(!sl)continue;
  let x=sl.x,y=sl.y,sc=1;
  if(i===0&&photoFly){const t=photoFly.t,e=1-Math.pow(1-t,3);x=lerp(CAM.x+BX0,sl.x,e);y=lerp(CAM.y+BY0,sl.y,e)-Math.sin(PI*t)*80;sc=lerp(0.4,1,e);}
  c.save();c.translate(x,y);c.rotate(sl.a);c.scale(sc,sc);
  c.fillStyle='rgba(0,0,0,0.25)';c.fillRect(-52,-38,110,86);
  c.fillStyle=C.milk;c.fillRect(-56,-44,112,88);
  if(ph.ok){try{c.drawImage(ph.img,-48,-36,96,72);}catch(e){}}else{c.fillStyle=C.tealD;c.fillRect(-48,-36,96,72);}
  clay(c,0,-44,9,8,C.red,C.redD,C.redL,90+i,0.1);
  c.restore();}
}
function drawDemo(c){
 if(!demo)return;const d=demo,t=d.t/d.d;let x=d.fx,y=d.fy,press=0,al=1;
 if(d.k==='drag'){if(t<0.2){press=t/0.2;}else if(t<0.75){const u=(t-0.2)/0.55,e=u*u*(3-2*u);x=lerp(d.fx,d.tx,e);y=lerp(d.fy,d.ty,e)+Math.sin(PI*e)*30;press=1;}else{x=d.tx;y=d.ty;press=1-(t-0.75)/0.25;}
  if(t>0.2){c.globalAlpha=0.35*Math.min(1,(1-t)*4);c.strokeStyle=d.side?SIDECOL[d.side].b:C.milk;c.lineWidth=22;c.lineCap='round';c.beginPath();c.moveTo(d.fx,d.fy);c.quadraticCurveTo((d.fx+x)/2,(d.fy+y)/2+30,x,y);c.stroke();c.globalAlpha=1;}}
 else{press=Math.abs(Math.sin(t*PI*2));}
 al=Math.min(1,Math.min(t,1-t)*6);
 c.save();c.globalAlpha=0.92*al;c.translate(x+10,y+8-press*12);c.rotate(-0.25);
 c.fillStyle='rgba(0,0,0,0.2)';c.beginPath();c.ellipse(16,92,44,16,0,0,7);c.fill();
 c.fillStyle=C.skinL;c.strokeStyle='#8a6243';c.lineWidth=4;
 c.beginPath();c.ellipse(4,70,42,46,0,0,7);c.fill();c.stroke();
 c.beginPath();c.ellipse(-6,10,15,42,-0.08,0,7);c.fill();c.stroke();
 c.beginPath();c.ellipse(-6,40,13,10,0,0,7);c.fill();
 c.fillStyle=C.skin;c.beginPath();c.ellipse(-8,-20,9,7,0,0,7);c.fill();
 c.restore();c.globalAlpha=1;
 if(press>0.6){c.globalAlpha=0.4*al;c.strokeStyle='#fff7d6';c.lineWidth=4;c.beginPath();c.arc(x,y,30+press*14,0,7);c.stroke();c.globalAlpha=1;}
}
function drawParts(c){for(const p of parts){const a=1-p.life/p.max;
 if(p.k==='r'){c.globalAlpha=a*0.7;c.strokeStyle=p.col;c.lineWidth=4;c.beginPath();c.arc(p.x,p.y,p.r+p.life*80,0,7);c.stroke();}
 else{c.globalAlpha=a;c.fillStyle=p.col;c.beginPath();c.ellipse(p.x,p.y,p.r,p.r*0.8,p.life*4,0,7);c.fill();}}c.globalAlpha=1;}

/* ===== 描画：まとめ ===== */
function render(){
 const c=ctx;c.setTransform(1,0,0,1,0,0);
 if(bgImg)c.drawImage(bgImg,0,0);else{c.fillStyle=C.bench;c.fillRect(0,0,cv.width,cv.height);}
 c.setTransform(DPR*S,0,0,DPR*S,DPR*OX,DPR*OY);
 c.save();c.translate(BX0,BY0);
 // 台（裏返しの変換）
 const p=flip.p,cs=Math.cos(PI*p),sn=Math.sin(PI*p);
 c.save();c.translate(BW/2,BH/2-sn*40);c.transform(cs,sn*0.08,0,1,0,0);c.translate(-BW/2,-BH/2);
 if(cs>=0){drawFace(c,'front',1);
  if(p>0.08){drawGrooves(c,sstep(0.08,0.5,p)*0.55);}
  drawShelves(c,1,p>0.02?0.4+0.4*Math.sin(T*10):0);}
 else{drawFace(c,'back',1);drawGrooves(c,1);if(p<0.92)drawGhostShelves(c,(1-sstep(0.5,0.92,p))*0.55);}
 drawTab(c);
 c.restore();
 if(sn>0.02){const xe=BW/2+BW/2*cs;c.fillStyle=cs>=0?C.tealDD:C.backD;c.globalAlpha=0.9;c.fillRect(Math.min(xe,xe+30*sn*(cs>=0?1:-1)),-sn*40+(xe-BW/2)*sn*0.08,Math.abs(30*sn),BH);c.globalAlpha=1;}
 drawHeldBalls(c);
 drawFreeBalls(c);
 for(const b of balls)if(b.st==='fly')drawBall(c,b,b.x,b.y,false);
 drawCamera(c);
 c.restore();
 // 人
 for(const s of SIDES)drawPerson(c,s);
 for(const s of SIDES)drawArm(c,s);
 c.save();c.translate(BX0,BY0);
 for(const s of SIDES)drawGlove(c,G[s]);
 drawParts(c);
 drawDemo(c);
 c.restore();
 drawPhotos(c);
 if(flash>0){c.setTransform(1,0,0,1,0,0);c.globalAlpha=flash*0.7;c.fillStyle='#fffdf2';c.fillRect(0,0,cv.width,cv.height);c.globalAlpha=1;}
}

window.__gf={
 toScreen:(x,y)=>({x:OX+(BX0+x)*S,y:OY+(BY0+y)*S}),
 glove:s=>({x:G[s].x,y:G[s].y,st:G[s].st}),

 bal:i=>{const b=balls[i];return {x:b.x,y:b.y,vx:b.vx,vy:b.vy,sup:b.sup?[b.sup.sh.id,Math.round(b.sup.s),+b.sup.nx.toFixed(2),+b.sup.ny.toFixed(2)]:null,ign:b.ign?b.ign.map(x=>x.id):null,ignT:b.ignT};},dbg:()=>shelves.map(s=>({id:s.id,live:s.live,t:s.t,ign:null,p:Array.from(s.px).map((x,i)=>[Math.round(x),Math.round(s.py[i])]).filter((_,i)=>i<9)})),ign:i=>balls[i].ign?balls[i].ign.map(x=>x.id):null,tab:()=>tabPos(),testCam:()=>{cameraOn=true;},cam:()=>({x:CAM.x,y:CAM.y,on:cameraOn}),
 hand:s=>({x:P[s].hx,y:P[s].hy}),
 state:()=>({stats:Object.assign({},stats),face:flip.face,p:flip.p,unlocked:flip.unlocked,cameraOn,photos:photos.length,lastSaveOk,
  shelves:shelves.map(s=>({id:s.id,side:s.side,L:Math.round(s.L),live:s.live,end:s.endLink,start:s.startLink,nOn:s.nOn,tilt:+s.tilt.toFixed(3),dents:s.dents.length})),
  balls:balls.map(b=>({id:b.id,st:b.st,x:Math.round(b.x),y:Math.round(b.y),v:Math.round(hyp(b.vx,b.vy)),rest:+b.restT.toFixed(2),pk:+b.pocketT.toFixed(2),last:b.last,sup:b.sup?(b.sup.sh.gut?'gut':b.sup.sh.id):null,side:b.side})),
  guide:guide?guide.k+(guide.side||''):null,demo:!!demo,P:{L:{c:P.L.cradle,b:P.L.bowl.length},R:{c:P.R.cradle,b:P.R.bowl.length}},parts:parts.length})
};
