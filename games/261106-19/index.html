<body>

<script>
'use strict';
(function(){
// ============================================================ constants
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const saEl=document.getElementById('sa');
// palette: indigo-black / black-purple / plum + 4 light colors + cream
const C={bg:'#0b0d26',wall:'#22132f',floor:'#1a1028',plum:'#4a2a58',ink:'#120a1a',
  amber:'#f2a531',peach:'#f38c9c',teal:'#2cbfae',gold:'#f7d45c',cream:'#f6e6ca'};
const RGB={};
for(const k in C){const h=C[k];RGB[k]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
const LIGHT_COLS=['amber','peach','teal'];
const TYPES=['round','stripe','thick'];
const KINDS=['girl','boy','mom','grandpa'];
const RAD={round:0.34,stripe:0.31,thick:0.36};
const DZ=0.8;
const SPOTS=[
  {x:0.5,z:0.1,reach:0.6,back:true},
  {x:0.25,z:0.42,reach:0.3},
  {x:0.75,z:0.42,reach:0.3},
  {x:0.3,z:0.8,reach:0.25},
  {x:0.7,z:0.8,reach:0.25},
  {x:0.5,z:0.6,reach:0.3,living:true}
];
const SEATS=[{x:0.085,z:0.17,f:1},{x:0.915,z:0.17,f:-1},{x:0.085,z:0.31,f:1},{x:0.915,z:0.31,f:-1}];
const CHAIR_POS=[{x:0.1,z:0.62},{x:0.9,z:0.62},{x:0.5,z:0.3},{x:0.5,z:0.92},{x:0.18,z:0.55},{x:0.82,z:0.5},{x:0.52,z:0.78}];
const STORE='gf261106_19_v1';
const KIND_H={girl:0.82,boy:0.86,mom:1,grandpa:0.97,keeper:1.02};
const TAU=Math.PI*2;

// ============================================================ helpers
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const outBack=t=>{t=clamp(t,0,1);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function rgba(k,a){const c=RGB[k];return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
function mix(k1,k2,t,a){const c1=RGB[k1],c2=RGB[k2];
  return 'rgba('+Math.round(lerp(c1[0],c2[0],t))+','+Math.round(lerp(c1[1],c2[1],t))+','+Math.round(lerp(c1[2],c2[2],t))+','+(a==null?1:a)+')';}
function pd(ax,az,bx,bz){const dx=ax-bx,dz=(az-bz)*DZ;return Math.sqrt(dx*dx+dz*dz);}
function mdir(ax,az,bx,bz){ // metric unit vector from b to a
  let dx=ax-bx,dz=(az-bz)*DZ;const d=Math.sqrt(dx*dx+dz*dz)||1;return {x:dx/d,z:dz/d};}
function mkRng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);
  t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
let R=mkRng(1);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function clampPos(p){return {x:clamp(p.x,0.03,0.97),z:clamp(p.z,0.03,1.15)};}

// ============================================================ layout
const L={W:390,H:844,dpr:1,u:100};
function readSafe(){try{const cs=getComputedStyle(saEl);
  return{t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
  catch(e){return{t:0,r:0,b:0,l:0};}}
function widthAt(z){return L.backW+(L.frontW-L.backW)*z;}
function SX(x,z){return L.cx+(x-0.5)*widthAt(z);}
function SY(z){return L.floorTop+z*L.band;}
function toPX(sx,z){return 0.5+(sx-L.cx)/widthAt(z);}
function scl(z){return L.u*(0.72+0.3*z)/100;}
function slotX(i){return L.cx+(i-1)*L.slotDX;}
function slotSz(i){return L.u*(i===1?1.12:0.92);}
function queuePos(q){const qsx=L.s.l+L.qUnit*(0.62+q*1.0);return {x:toPX(qsx,L.queueZ+q*0.03),z:L.queueZ+q*0.03};}
let bgCanvas=null;
const sprites={};
function resize(){
  const W=Math.max(200,window.innerWidth|0),H=Math.max(200,window.innerHeight|0);
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  L.W=W;L.H=H;L.dpr=dpr;
  const s=readSafe();L.s=s;
  const iw=W-s.l-s.r;
  const u=Math.min(iw*0.28,H*0.19);L.u=u;
  L.cx=s.l+iw/2;
  const top=s.t+6;
  // vertical slack (tall phones): move the whole shop down a little so the floor fills the screen
  const band0=Math.min(0.6*iw,(H-s.b-(top+2.58*u))*0.7);
  const slack=Math.max(0,(H-s.b-(top+2.58*u))-band0*1.7);
  const top2=top+Math.min(slack*0.5,0.7*u);
  L.lampX=L.cx;L.lampY=top2+0.52*u;L.lampR=0.34*u;
  L.shelfTop=top2+1.02*u;L.shelfBase=top2+2.5*u;L.wallTop=top;
  L.slotDX=Math.min(iw*0.315,1.32*u);
  L.shelfHalf=L.slotDX+0.6*u;
  L.floorTop=L.shelfBase+0.08*u;
  const avail=H-s.b-L.floorTop;
  L.band=Math.max(80,Math.min(0.6*iw,avail*0.7));
  L.planeW=Math.min(iw-6,L.band*2.4);
  L.backW=L.planeW*0.84;L.frontW=L.planeW;
  L.queueZ=clamp((H-s.b-L.floorTop-0.04*u)/L.band-0.14,1.06,1.85);
  L.qUnit=Math.min(iw*0.14,0.75*u);
  // shopkeeper home
  const room=L.cx+L.shelfHalf+0.42*u;
  if(room<W-s.r-0.3*u){keeperHome={x:toPX(room,0.08),z:0.08};}
  else{const kz=0.3;keeperHome={x:toPX(W-s.r-0.36*u,kz),z:kz};}
  buildBG();buildSprites();
  // reposition queued customers
  if(customers)for(const c of customers){if(c.pose==='wait'&&c.q>=0&&!c.path.length){const p=queuePos(c.q);c.x=p.x;c.z=p.z;}}
  if(keeper&&!keeper.busy&&!keeper.path.length){const h=kHome();keeper.x=h.x;keeper.z=h.z;}
}

// ---------------------------------------------------------- kaleido primitives
function starPath(g,n,r1,r2,rot){g.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1;const a=rot+i*Math.PI/n;
  const x=Math.cos(a)*r,y=Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y);}g.closePath();}
function kite(g,r0,r1,w,rm){g.beginPath();g.moveTo(0,-r0);g.lineTo(w,-rm);g.lineTo(0,-r1);g.lineTo(-w,-rm);g.closePath();}
function rosette(g,r,n,colA,colB,colC){
  g.save();
  for(let k=0;k<n;k++){g.save();g.rotate(k*TAU/n);g.fillStyle=colA;kite(g,r*0.3,r*0.98,r*0.17,r*0.62);g.fill();g.restore();}
  for(let k=0;k<n;k++){g.save();g.rotate((k+0.5)*TAU/n);g.fillStyle=colB;kite(g,r*0.25,r*0.66,r*0.1,r*0.45);g.fill();g.restore();}
  g.fillStyle=colC;starPath(g,n,r*0.3,r*0.14,-Math.PI/2);g.fill();
  g.restore();
}
function buildBG(){
  const W=L.W,H=L.H,d=L.dpr,u=L.u;
  bgCanvas=document.createElement('canvas');bgCanvas.width=Math.round(W*d);bgCanvas.height=Math.round(H*d);
  const g=bgCanvas.getContext('2d');g.setTransform(d,0,0,d,0,0);
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  // shop wall (black-purple), with arched top
  const wl=L.cx-Math.max(L.shelfHalf+0.5*u,widthAt(0)/2+0.3*u),wr=2*L.cx-wl;
  g.fillStyle=C.wall;g.beginPath();g.moveTo(wl,L.floorTop);g.lineTo(wl,L.s.t+0.5*u);
  g.quadraticCurveTo(L.cx,L.s.t-0.35*u,wr,L.s.t+0.5*u);g.lineTo(wr,L.floorTop);g.closePath();g.fill();
  // faint repeating rosettes (background pattern, independent of the lanterns)
  g.save();g.beginPath();g.rect(wl,0,wr-wl,L.floorTop);g.clip();
  const step=0.95*u;let row=0;
  for(let y=L.s.t+0.2*u;y<L.floorTop+step;y+=step*0.86,row++){
    for(let x=wl+(row%2?step/2:0);x<wr+step;x+=step){
      g.save();g.translate(x,y);rosette(g,step*0.36,8,rgba('plum',0.32),rgba('plum',0.2),rgba('gold',0.07));g.restore();}
  }
  g.restore();
  // floor
  g.fillStyle=C.floor;g.beginPath();g.moveTo(0,L.floorTop);g.lineTo(W,L.floorTop);g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();
  g.strokeStyle=rgba('plum',0.45);g.lineWidth=1.2;
  for(let i=-6;i<=16;i++){const x=i/10;g.beginPath();g.moveTo(SX(x,0),SY(0));g.lineTo(SX(x,2.2),SY(2.2));g.stroke();}
  for(let z=0;z<2.2;z+=0.16){g.beginPath();g.moveTo(0,SY(z));g.lineTo(W,SY(z));g.stroke();}
  // floor diamonds (static kaleido grains)
  for(let i=0;i<10;i++)for(let j=0;j<14;j++){const x=i/9,z=j*0.16+0.08;const px=SX(x,z),py=SY(z);if(py>H)continue;
    g.fillStyle=rgba('plum',0.35);g.beginPath();const r=0.05*u*(0.7+0.3*z);g.moveTo(px,py-r*0.5);g.lineTo(px+r,py);g.lineTo(px,py+r*0.5);g.lineTo(px-r,py);g.closePath();g.fill();}
  g.strokeStyle=rgba('gold',0.25);g.lineWidth=2;g.beginPath();g.moveTo(wl,L.floorTop);g.lineTo(wr,L.floorTop);g.stroke();
  // doorway (left, foreground)
  const dz=L.queueZ,dy=SY(dz)+0.05*u,dx=Math.max(L.s.l,0)-0.05*u,dh=1.45*u*(0.72+0.3*dz),dw=0.55*u;
  g.fillStyle=rgba('bg',1);g.strokeStyle=rgba('gold',0.35);g.lineWidth=3;
  g.beginPath();g.moveTo(dx,dy);g.lineTo(dx,dy-dh+dw);g.arc(dx+dw*0.5,dy-dh+dw,dw*0.5,Math.PI,0);g.lineTo(dx+dw,dy);g.closePath();g.fill();g.stroke();
  g.save();g.translate(dx+dw*0.5,dy-dh+dw);rosette(g,dw*0.32,6,rgba('teal',0.25),rgba('peach',0.2),rgba('gold',0.3));g.restore();
}
function buildSprites(){
  const px=Math.min(512,Math.round(0.8*L.planeW*L.dpr));
  for(const t of TYPES)for(const c of LIGHT_COLS.concat(['gold']))sprites[t+c]=makeSprite(t,c,px);
}
function makeSprite(type,col,px){
  const cn=document.createElement('canvas');cn.width=cn.height=px;const g=cn.getContext('2d');const r=px/2;g.translate(r,r);
  if(type==='round'){
    g.fillStyle=rgba(col,0.16);g.beginPath();g.arc(0,0,r*0.98,0,TAU);g.fill();
    g.fillStyle=rgba(col,0.9);g.beginPath();g.arc(0,0,r*0.97,0,TAU);g.arc(0,0,r*0.84,0,TAU,true);g.fill();
    for(let k=0;k<8;k++){g.save();g.rotate(k*TAU/8);g.fillStyle=rgba(col,0.7);kite(g,r*0.44,r*0.8,r*0.11,r*0.62);g.fill();
      g.fillStyle=rgba('gold',0.55);g.beginPath();g.arc(0,-r*0.9,r*0.035,0,TAU);g.fill();g.restore();}
    g.fillStyle=rgba('cream',0.5);g.beginPath();g.arc(0,0,r*0.4,0,TAU);g.fill();
    g.fillStyle=rgba('gold',0.65);starPath(g,8,r*0.3,r*0.13,-Math.PI/2);g.fill();
  }else if(type==='stripe'){
    g.fillStyle=rgba(col,0.1);g.beginPath();g.arc(0,0,r*0.98,0,TAU);g.fill();
    for(let k=0;k<6;k++){g.save();g.rotate(k*TAU/6);
      g.fillStyle=rgba(col,0.8);g.beginPath();g.moveTo(-r*0.03,-r*0.16);g.lineTo(-r*0.13,-r*0.98);g.lineTo(r*0.13,-r*0.98);g.lineTo(r*0.03,-r*0.16);g.closePath();g.fill();
      g.fillStyle=rgba('gold',0.55);for(const s of[-1,1]){g.save();g.rotate(s*0.5);g.fillRect(-r*0.018,-r*0.9,r*0.036,r*0.55);g.restore();}
      g.restore();}
    g.strokeStyle=rgba('cream',0.4);g.lineWidth=r*0.05;g.beginPath();g.arc(0,0,r*0.58,0,TAU);g.stroke();
    g.fillStyle=rgba('gold',0.6);starPath(g,6,r*0.22,r*0.1,-Math.PI/2);g.fill();
  }else{
    g.fillStyle=rgba(col,0.6);g.beginPath();g.arc(0,0,r*0.96,0,TAU);g.arc(0,0,r*0.8,0,TAU,true);g.fill();
    for(let k=0;k<12;k++){g.save();g.rotate(k*TAU/12);g.fillStyle=rgba(col,0.75);g.beginPath();g.arc(0,-r*0.4,r*0.045,0,TAU);g.fill();g.restore();}
    g.fillStyle=rgba('cream',0.7);g.beginPath();g.arc(0,0,r*0.3,0,TAU);g.fill();
    g.fillStyle=rgba('gold',0.85);starPath(g,6,r*0.26,r*0.12,-Math.PI/2);g.fill();
  }
  return cn;
}

// ============================================================ audio (Web Audio synth)
let AC=null,master=null,noiseBuf=null,audioOK=false;
const lastS={};
function audioUnlock(){
  try{
    if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();
      master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
      const b=AC.createBuffer(1,1,AC.sampleRate);const s=AC.createBufferSource();s.buffer=b;s.connect(master);s.start(0);}
    if(AC.state==='suspended'&&!document.hidden)AC.resume().catch(()=>{});
    audioOK=true;
  }catch(e){AC=null;}
}
function can(n,gap){if(!AC||!audioOK||document.hidden)return false;const t=AC.currentTime;if(lastS[n]!=null&&t-lastS[n]<gap)return false;lastS[n]=t;return true;}
function envG(t0,a,d,v){const g=AC.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);return g;}
function osc(type,f0,f1,dl,dur,vol){const t0=AC.currentTime+dl;const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);const g=envG(t0,0.008,dur,vol);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.06);}
function nz(ft,fr,q,dl,dur,vol){const t0=AC.currentTime+dl;const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=ft;f.frequency.value=fr;f.Q.value=q;
  const g=envG(t0,0.003,dur,vol);s.connect(f);f.connect(g);g.connect(master);s.start(t0,Math.random()*0.5,dur+0.05);}
const SCALE=[392,440,523.25,587.33,659.25,783.99,880,1046.5,1174.7,1318.5];
function pitch(){let n=0;for(const l of lanterns)if(l.st==='placed')n++;return SCALE[clamp(n*2+(phase==='living'?3:0),0,SCALE.length-1)];}
const sfx={
  katan(){if(!can('katan',0.05))return;nz('bandpass',1900,5,0,0.05,0.35);osc('triangle',210,120,0,0.09,0.25);nz('bandpass',1300,6,0.07,0.04,0.18);},
  paper(){if(!can('paper',0.08))return;nz('highpass',3200,0.7,0.06,0.16,0.07);nz('highpass',2600,0.7,0.2,0.12,0.05);},
  whoosh(p){if(!can('whoosh',0.08))return;osc('sine',p*0.5,p,0.02,0.4,0.13);osc('sine',p*0.75,p*1.5,0.08,0.35,0.06);},
  stomp(){if(!can('stomp',0.06))return;nz('lowpass',500,1,0,0.05,0.25);nz('lowpass',450,1,0.14,0.05,0.22);},
  step(){if(!can('step',0.11))return;nz('lowpass',380,1,0,0.035,0.09);},
  buy(){if(!can('buy',0.12))return;const b=pitch();[1,1.25,1.5,2].forEach((m,i)=>osc('triangle',b*m,0,i*0.07,0.22,0.16));osc('sine',b*3,0,0.3,0.5,0.05);},
  place(p){if(!can('place',0.08))return;osc('sine',p*0.5,p*0.45,0,0.2,0.22);osc('sine',p,0,0.05,0.5,0.08);nz('bandpass',900,3,0,0.03,0.12);},
  star(){if(!can('star',0.15))return;osc('sine',1318.5,0,0,0.6,0.09);osc('sine',1760,0,0.09,0.7,0.08);osc('triangle',2637,0,0.18,0.4,0.03);},
  reveal(){if(!can('reveal',0.2))return;osc('sine',520,800,0,0.3,0.15);osc('triangle',1046.5,0,0.22,0.5,0.1);osc('triangle',1318.5,0,0.32,0.6,0.08);},
  ret(){if(!can('ret',0.08))return;osc('sine',700,420,0,0.35,0.12);nz('highpass',3000,0.7,0.05,0.12,0.05);},
  tick(){if(!can('tick',0.06))return;osc('sine',880,700,0,0.05,0.04);},
  hop(){if(!can('hop',0.12))return;osc('square',300,600,0,0.08,0.03);nz('lowpass',500,1,0.3,0.05,0.18);},
  patan(){if(!can('patan',0.1))return;nz('lowpass',320,1,0,0.18,0.45);osc('sine',95,60,0,0.25,0.35);},
  chord(){if(!can('chord',0.5))return;[523.25,659.25,783.99,987.8].forEach((f,i)=>osc('sine',f,0,i*0.12,1.6,0.07));},
  bloom(){if(!can('bloom',0.5))return;[392,523.25,659.25,783.99,1046.5].forEach((f,i)=>osc('triangle',f,0,i*0.09,0.9,0.06));},
  lull(){if(!can('lull',2))return;[659.25,587.33,523.25,587.33,659.25,659.25,659.25].forEach((f,i)=>osc('sine',f,0,i*0.34,0.45,0.08));},
  chair(){if(!can('chair',0.15))return;nz('bandpass',700,4,0,0.06,0.18);nz('bandpass',600,4,0.1,0.05,0.12);}
};

// ============================================================ world state
let phase='shop';         // shop | transform | living | farewell | enter
let round=1,seed=1,starWindow=false,revealed=false,livingSwaps=0,livingT=0,order=[];
let lanterns=null,customers=null,chairs=[],stars={},keeper=null,keeperHome={x:0.9,z:0.1};
let shadows=[],rings=[],reach=0,dispReach=0,tf=0,trT=0,fwT=0,pendT=0,enterT=0;
let timers=[],time=0,idleT=0,quietT=0,hint=null,hintDone=false,target=null,saveFlag=false,saveFailed=false;
let particles=[],ripples=[],evlog=[];
let wobLamp=0,lampFlash=0;
function kHome(){return (phase==='living'||phase==='transform'||phase==='farewell')?{x:0.86,z:0.74}:keeperHome;}
function later(dt,fn){timers.push({t:time+dt,fn});}
function log(ev,extra){evlog.push({t:+time.toFixed(2),ev:ev,x:extra||null});if(evlog.length>300)evlog.shift();}

function mkLantern(id,type,color,slot){return {id,type,color,slot,st:'shelf',x:0,z:0,spot:-1,resSpot:-1,owner:-1,buyer:-1,
  returned:false,everLit:false,beam:0,run:-1,ft:0,rt:0,fx:0,fz:0,placeT:1,pop:1,
  sq:0,sqV:0,rim:0,rimV:0,sway:0,swayV:0,swayKick:0,swayAmt:0,wob:0,int:0,glow:0,lastSpot:-1};}
function mkCustomer(id,kind){return {id,kind,x:0,z:0,pose:'wait',endPose:'stand',path:[],onArrive:null,facing:1,walkT:0,stepAcc:0,
  q:-1,seat:-1,lantern:-1,busy:false,shadowed:false,shadeBy:null,vis:1,face:'n',faceT:0,lookDown:0,hopT:-1,wob:0,gone:false,
  blinkT:2+Math.random()*3,blink:0,speed:0.3,sit:0};}
function cust(id){return customers[id]||null;}
function lan(id){return lanterns[id]||null;}

function newRound(sd,entering){
  seed=sd>>>0;R=mkRng(seed);
  const types=shuffle(TYPES),cols=shuffle(LIGHT_COLS);
  lanterns=types.map((t,i)=>mkLantern(i,t,cols[i],i));
  const kinds=shuffle(KINDS).slice(0,3);
  customers=kinds.map((k,i)=>mkCustomer(i,k));
  const qo=shuffle([0,1,2]);
  const browse=R()<0.5?Math.floor(R()*3):-1;
  customers.forEach((c,i)=>{c.q=qo[i];});
  // optionally one customer waits browsing on the floor instead of in line
  if(browse>=0){const c=customers[browse];const old=c.q;c.q=-1;for(const o of customers)if(o.q>old)o.q--;
    const p=[{x:0.12,z:0.95},{x:0.88,z:0.95},{x:0.5,z:0.98}][Math.floor(R()*3)];c.x=p.x;c.z=p.z;c.facing=p.x<0.5?1:-1;}
  for(const c of customers){if(c.q>=0){const p=queuePos(c.q);c.x=p.x;c.z=p.z;c.facing=1;}}
  const cp=shuffle(CHAIR_POS);chairs=[{x:cp[0].x,z:cp[0].z,a:-Math.PI/2,carried:false,wob:0},{x:cp[1].x,z:cp[1].z,a:-Math.PI/2,carried:false,wob:0}];
  starWindow=R()<0.25;tieRight=R()<0.5;stars={};shadows=[];rings=[];reach=0;dispReach=0;tf=0;pendT=0;
  order=[];revealed=false;livingSwaps=0;livingT=0;timers=[];hint=null;hintDone=false;idleT=0;
  keeper={kind:'keeper',x:keeperHome.x,z:keeperHome.z,path:[],onArrive:null,busy:false,facing:-1,walkT:0,wob:0,carry:null,arms:0,face:'smile',faceT:0,speed:0.42,stepAcc:0};
  if(entering){
    phase='enter';enterT=0;
    lanterns.forEach((l,i)=>{l.pop=0;l.popDelay=0.5+i*0.25;});
    customers.forEach((c,i)=>{const gx=c.x,gz=c.z,gq=c.q;c.x=-0.45;c.z=L.queueZ;c.pose='walk';c.busy=true;
      later(0.6+i*0.55,()=>{walkTo(c,[{x:gx,z:gz}],()=>{c.pose='wait';c.busy=false;c.facing=1;if(gq<0)c.facing=gx<0.5?1:-1;});});
      c.path=[];c.pose='wait';});
  }else phase='shop';
  log('round',{seed,types:lanterns.map(l=>l.type).join(',')});
}

// ============================================================ geometry of objects on screen
function hands(c){const k=scl(c.z)*KIND_H[c.kind];return {x:SX(c.x,c.z)+c.facing*24*k,y:SY(c.z)-4*k-(c.hopT>=0?hopH(c):0),sz:0.4*L.u*(0.72+0.3*c.z)};}
function hopH(c){return Math.sin(clamp(c.hopT/0.45,0,1)*Math.PI)*0.28*L.u*(0.72+0.3*c.z);}
function shelfPos(l){const i=l.slot;return {x:slotX(i),y:L.shelfBase,sz:slotSz(i)};}
function placedPos(x,z){return {x:SX(x,z),y:SY(z),sz:0.6*L.u*(0.72+0.3*z)};}
function lanternScreen(l){
  if(l.st==='shelf'||l.st==='lit'){const p=shelfPos(l);if(target&&target.l===l&&!busyAny){p.y-=Math.abs(Math.sin(time*4.2))*0.07*L.u;}p.sz*=lerp(0.2,1,outBack(l.pop));return p;}
  if(l.st==='fly'){const a=shelfPos(l),b=hands(cust(l.buyer));const t=ease(l.ft);return {x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)-Math.sin(t*Math.PI)*0.8*L.u,sz:lerp(a.sz,b.sz,t)};}
  if(l.st==='carried'){const c=cust(l.owner>=0?l.owner:l.buyer);if(!c)return shelfPos(l);return hands(c);}
  if(l.st==='placed'){const p=placedPos(l.x,l.z);if(target&&target.l===l&&!busyAny)p.y-=Math.abs(Math.sin(time*4.2))*0.06*L.u;return p;}
  if(l.st==='return'){const a=placedPos(l.fx,l.fz),b=shelfPos(l);const t=ease(l.rt);return {x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)-Math.sin(t*Math.PI)*0.9*L.u,sz:lerp(a.sz,b.sz,t)};}
  return shelfPos(l);
}
function floorUnderSlot(i){return {x:toPX(slotX(i),0.03),z:0.03};}

// ============================================================ light logic
function placedL(){return lanterns.filter(l=>l.st==='placed');}
function computeShadows(list){
  const sh=[],rg=[];
  for(const i of list)for(const j of list){if(i===j)continue;const d=pd(i.x,i.z,j.x,j.z);if(d>0.8||d<0.01)continue;
    const dir=mdir(i.x,i.z,j.x,j.z);sh.push({ox:i.x,oz:i.z,dx:dir.x,dz:dir.z,len:0.34,half:0.42,body:i.id,light:j.id});}
  for(const l of list)if(l.type==='thick'){const Rr=RAD.thick;rg.push({x:l.x,z:l.z,r1:Rr*0.5,r2:Rr*0.74,id:l.id});}
  return {sh,rg};
}
function shadowAtIn(x,z,sh,rg){
  for(const w of sh){const vx=x-w.ox,vz=(z-w.oz)*DZ;const al=vx*w.dx+vz*w.dz;if(al<0.025||al>w.len)continue;
    const pp=Math.abs(vx*w.dz-vz*w.dx);if(pp<al*Math.tan(w.half)+0.015)return w;}
  for(const r of rg){const d=pd(x,z,r.x,r.z);if(d>=r.r1&&d<=r.r2)return {ring:r.id,light:r.id,body:r.id};}
  return null;
}
function shadowAt(x,z){return shadowAtIn(x,z,shadows,rings);}
function litAt(x,z,list){let v=0;for(const l of list){const d=pd(x,z,l.x,l.z)/RAD[l.type];if(d<1)v+=1-d*d;}return v;}
function computeReach(list){let r=0,stripe=false;for(const l of list){r+=SPOTS[l.spot]?SPOTS[l.spot].reach:0.2;if(l.type==='stripe')stripe=true;}return r+(stripe?0.25:0);}
function computeStars(list){const out={};
  for(let a=0;a<list.length;a++)for(let b=a+1;b<list.length;b++){const p=list[a],q=list[b];const d=pd(p.x,p.z,q.x,q.z);const R1=RAD[p.type],R2=RAD[q.type];
    if(d<R1+R2&&d>0.01){let t=(d*d+R1*R1-R2*R2)/(2*d);t=clamp(t,d*0.25,d*0.75)/d;const k=Math.min(p.id,q.id)+'-'+Math.max(p.id,q.id);
      out[k]={x:lerp(p.x,q.x,t),z:lerp(p.z,q.z,t),k};}}
  return out;}
function evaluateWorld(reason){
  const list=placedL();
  const s=computeShadows(list);shadows=s.sh;rings=s.rg;
  const ns=computeStars(list);
  for(const k in ns){if(stars[k]){ns[k].age=stars[k].age;}else{ns[k].age=reason==='restore'?5:0;if(reason!=='restore'){sfx.star();burstAt(SX(ns[k].x,ns[k].z),SY(ns[k].z),'gold',5);
      log('star',{k,x:+ns[k].x.toFixed(2),z:+ns[k].z.toFixed(2),order:order.map(i=>lanterns[i].type).join('>')});}}}
  stars=ns;
  reach=computeReach(list);
  for(const c of customers){if(c.busy||c.gone||c.path.length)continue;const sh=shadowAt(c.x,c.z);
    if(reason==='return'&&c.shadowed&&!sh)reveal(c);
    c.shadowed=!!sh;c.shadeBy=sh;}
  if(reason!=='restore')scheduleChairs();
  if(phase==='shop'||phase==='living')saveFlag=true;
}
function reveal(c){setFace(c,'joy',2.2);c.hopT=0;sfx.reveal();const p=headPos(c);burstAt(p.x,p.y,'gold',6);revealed=true;log('reveal',{kind:c.kind});}
function headPos(c){const k=scl(c.z)*KIND_H[c.kind];return {x:SX(c.x,c.z),y:SY(c.z)-(c.sit>0.5?56:78)*k};}

// ============================================================ characters
function walkTo(c,pts,cb){c.path=pts.map(p=>({x:p.x,z:p.z}));c.onArrive=cb||null;}
function setFace(c,f,d){c.face=f;c.faceT=d;}
function updWalker(c,dt){
  if(!c.path.length)return false;
  const tg=c.path[0];const d=pd(c.x,c.z,tg.x,tg.z);const st=c.speed*dt;
  const ox=c.x,oz=c.z;
  if(d<=st){c.x=tg.x;c.z=tg.z;c.path.shift();}
  else{const dir=mdir(tg.x,tg.z,c.x,c.z);c.x+=dir.x*st;c.z+=dir.z*st/DZ;}
  const dx=c.x-ox;if(Math.abs(dx)>0.0004)c.facing=dx>0?1:-1;
  c.walkT+=dt*7;c.stepAcc+=dt;if(c.stepAcc>0.3){c.stepAcc=0;sfx.step();}
  // stepping over a dark ring
  if(c.hopT<0&&c.kind!=='keeper'){for(const r of rings){const d0=pd(ox,oz,r.x,r.z),d1=pd(c.x,c.z,r.x,r.z);const rr=(r.r1+r.r2)/2;
    if((d0-rr)*(d1-rr)<0){c.hopT=0;sfx.hop();log('hop',{kind:c.kind});break;}}}
  if(!c.path.length){const cb=c.onArrive;c.onArrive=null;c.walkT=0;if(cb)cb();}
  return true;
}
function updCustomer(c,dt){
  if(c.gone)return;
  const walking=updWalker(c,dt);
  if(walking&&c.pose!=='wait')c.pose=c.path.length?'walk':c.pose;
  const wantSit=(c.pose==='sit'||c.pose==='bench')&&!c.path.length;
  c.sit=lerp(c.sit,wantSit?1:0,clamp(dt*8,0,1));
  if(c.hopT>=0){c.hopT+=dt;if(c.hopT>0.45)c.hopT=-1;}
  if(c.faceT>0){c.faceT-=dt;if(c.faceT<=0)c.face=c.shadowed?'n':'smile';}
  c.blinkT-=dt;if(c.blinkT<0){c.blink=0.14;c.blinkT=2.5+Math.random()*3;}if(c.blink>0)c.blink-=dt;
  c.wob*=Math.pow(0.05,dt);
  const lit=litAt(c.x,c.z,placedL());
  const tv=c.shadowed&&!c.path.length?0.42:(lit>0.12||phase==='living'?1:0.82);
  c.vis=lerp(c.vis,tv,clamp(dt*4,0,1));
  if(c.pose==='wait'&&!c.path.length&&Math.random()<dt*0.25){c.hopT=c.hopT<0?-1:c.hopT;c.tap=0.3;sfx.step();}
  if(c.tap>0)c.tap-=dt;
}
function updKeeper(dt){
  const k=keeper;updWalker(k,dt);
  if(k.carry){const ch=k.carry;ch.x=k.x+k.facing*0.05;ch.z=k.z+0.01;}
  k.wob*=Math.pow(0.05,dt);if(k.faceT>0){k.faceT-=dt;if(k.faceT<=0)k.face='smile';}
}
// ---------------------------------------------------------- chairs moved out of shadow by the keeper
function scheduleChairs(){
  if(!(phase==='shop'||phase==='living'))return;
  if(keeper.busy){keeper.recheck=true;return;}
  const list=placedL();if(!list.length)return;
  for(const ch of chairs){
    if(!shadowAt(ch.x,ch.z))continue;
    const dest=bestChairSpot(ch,list);if(!dest)continue;
    keeper.busy=true;keeper.recheck=false;
    walkTo(keeper,[{x:ch.x-0.04,z:ch.z+0.01}],()=>{keeper.carry=ch;ch.carried=true;sfx.chair();keeper.arms=1;
      walkTo(keeper,[dest],()=>{keeper.carry=null;ch.carried=false;ch.x=dest.x;ch.z=dest.z;keeper.arms=0;ch.wob=0.25;sfx.chair();
        log('chair_moved',{x:+dest.x.toFixed(2),z:+dest.z.toFixed(2)});
        walkTo(keeper,[kHome()],()=>{keeper.busy=false;keeper.facing=-1;scheduleChairs();});});});
    return;
  }
}
function bestChairSpot(ch,list){
  let best=null,bv=-1e9;const cands=[];
  SPOTS.forEach((s,i)=>{if(s.living&&phase!=='living')return;cands.push({x:s.x,z:s.z+0.02,spot:i});});
  for(let x=0.12;x<=0.89;x+=0.155)for(let z=0.2;z<=0.95;z+=0.15)cands.push({x,z});
  for(const p of cands){
    if(shadowAtIn(p.x,p.z,shadows,rings))continue;
    const lit=litAt(p.x,p.z,list);if(lit<0.12)continue;
    let bad=false;for(const l of lanterns){if((l.st==='placed'&&pd(p.x,p.z,l.x,l.z)<0.1)||(l.resSpot>=0&&pd(p.x,p.z,SPOTS[l.resSpot].x,SPOTS[l.resSpot].z)<0.1)){bad=true;break;}}
    for(const o of chairs)if(o!==ch&&pd(p.x,p.z,o.x,o.z)<0.12)bad=true;
    for(const c of customers)if(!c.gone&&pd(p.x,p.z,c.x,c.z)<0.06)bad=true;
    if(phase==='living'){for(const s of SEATS)if(pd(p.x,p.z,s.x,s.z)<0.14)bad=true;}
    if(bad)continue;
    const v=lit*0.6-pd(p.x,p.z,ch.x,ch.z)*0.8+(p.spot!=null?0.25:0);
    if(v>bv){bv=v;best={x:p.x,z:p.z};}
  }
  return best;
}

// ============================================================ selling / placing / returning
function busyAnyFn(){
  for(const c of customers)if(c.busy&&!c.gone)return true;
  for(const l of lanterns)if(l.st==='lit'||l.st==='fly'||l.st==='carried'||l.st==='return')return true;
  return keeper.busy;
}
let busyAny=false;
function pickBuyer(l){
  const free=customers.filter(c=>!c.busy&&!c.gone&&c.lantern<0);
  if(!free.length)return null;
  const q=free.filter(c=>c.q>=0).sort((a,b)=>a.q-b.q);
  if(q.length&&phase==='shop')return q[0];
  const fp=floorUnderSlot(l.slot);
  free.sort((a,b)=>pd(a.x,a.z,fp.x,fp.z)-pd(b.x,b.z,fp.x,fp.z));
  return free[0];
}
function kick(l,s){l.sq=-0.2*s;l.sqV=-1.5*s;l.rimV=-9*s;l.swayKick=0.09;l.swayAmt=(Math.random()<0.5?-1:1)*2.6*s;}
function sell(l){
  const buyer=pickBuyer(l);
  l.st='lit';l.beam=0;l.run=-1;l.everLit=true;l.returned=false;kick(l,1);
  sfx.katan();sfx.paper();sfx.whoosh(pitch());
  const p=lanternScreen(l);burstAt(p.x,p.y-p.sz*0.55,l.color,5);
  log('tap_sell',{type:l.type,slot:l.slot});
  if(!buyer){later(1.2,()=>{if(l.st==='lit'){l.st='shelf';}});return;}
  buyer.busy=true;l.buyer=buyer.id;
  if(buyer.q>=0){const oq=buyer.q;buyer.q=-1;for(const o of customers)if(o.q>oq&&!o.busy){o.q--;const qp=queuePos(o.q);walkTo(o,[qp],()=>{o.pose='wait';o.facing=1;});}}
  buyer.facing=SX(floorUnderSlot(l.slot).x,0)>SX(buyer.x,buyer.z)?1:-1;
  later(0.2,()=>{if(l.st==='lit')l.run=0;});
  later(0.58,()=>{if(l.st!=='lit')return;setFace(buyer,'o',0.4);buyer.lookDown=1;sfx.stomp();buyer.tap=0.35;log('feet',{kind:buyer.kind});});
  later(0.92,()=>{if(l.st!=='lit')return;setFace(buyer,'smile',1.4);buyer.hopT=0;});
  later(1.12,()=>{if(l.st!=='lit')return;l.st='fly';l.ft=0;buyer.lookDown=0;sfx.paper();});
}
function onCarried(l){
  const b=cust(l.buyer);
  l.st='carried';b.lantern=l.id;l.owner=b.id;order.push(l.id);
  sfx.buy();const h=hands(b);burstAt(h.x,h.y-20,l.color,6);log('buy',{type:l.type,kind:b.kind});
  const plan=planSpot(l,b);l.resSpot=plan.spot;
  const sp=SPOTS[plan.spot];const pts=[];
  if(plan.via){pts.push(plan.via);log('follow_line',{kind:b.kind});}
  pts.push({x:sp.x,z:sp.z+0.015});
  b.pose='walk';
  walkTo(b,pts,()=>placeL(l,b,plan.spot));
}
function freeSpot(i,l){
  const s=SPOTS[i];if(s.living&&phase!=='living')return false;
  for(const o of lanterns){if(o===l)continue;if((o.st==='placed'&&o.spot===i)||o.resSpot===i)return false;}
  for(const ch of chairs)if(pd(ch.x,ch.z,s.x,s.z)<0.09)return false;
  return true;
}
function closestOnLine(ax,az,bx,bz,px,pz){const vx=bx-ax,vz=(bz-az)*DZ;const wx=px-ax,wz=(pz-az)*DZ;let t=(vx*wx+vz*wz)/(vx*vx+vz*vz||1);t=clamp(t,0.05,0.7);return {x:ax+(bx-ax)*t,z:az+(bz-az)*t};}
function planSpot(l,b){
  const list=placedL().filter(o=>o!==l);
  const stripe=list.find(o=>o.type==='stripe'&&o.placeT>0.5);
  if(stripe&&l.type!=='stripe'&&freeSpot(0,l)){
    const via=closestOnLine(stripe.x,stripe.z,0.5,0.02,b.x,b.z);
    return {spot:0,via};
  }
  let best=-1,bv=-1e9;
  const fp=floorUnderSlot(l.slot);const proj={x:fp.x,z:0.55};
  const sh=computeShadows(list);
  for(let i=0;i<SPOTS.length;i++){
    if(!freeSpot(i,l))continue;
    const s=SPOTS[i];
    let v;
    if(list.length){v=litAt(s.x,s.z,list);if(shadowAtIn(s.x,s.z,sh.sh,sh.rg))v-=0.3;if(v<=0.001)v=-1+(-pd(s.x,s.z,proj.x,proj.z));}
    else v=-pd(s.x,s.z,proj.x,proj.z);
    if(l.type==='stripe'&&s.back)v-=3;
    if(i===l.lastSpot)v-=0.05; // a re-sold lantern likes a new place
    v+=(tieRight?1:-1)*(s.x-0.5)*0.002;
    if(v>bv){bv=v;best=i;}
  }
  if(best<0)best=0;
  return {spot:best,via:null};
}
let tieRight=true;
function placeL(l,b,spot){
  if(l.st!=='carried'||l.owner!==b.id){b.busy=false;b.pose='stand';return;}
  const prevSpot=l.lastSpot;l.st='placed';l.spot=spot;l.lastSpot=spot;l.resSpot=-1;l.x=SPOTS[spot].x;l.z=SPOTS[spot].z;l.placeT=0;kick(l,0.6);
  sfx.place(pitch());const p=placedPos(l.x,l.z);burstAt(p.x,p.y-p.sz*0.5,l.color,5);
  log('place',{type:l.type,spot,order:order.map(i=>lanterns[i].type).join('>')});
  if(phase==='living'&&prevSpot>=0){livingSwaps++;log('living_swap');}
  evaluateWorld('place');
  const idle=idleFor(l,b);
  walkTo(b,idle.pts,()=>{
    b.pose=idle.pose;b.busy=false;
    if(idle.seat!=null){b.seat=idle.seat;b.facing=SEATS[idle.seat].f;}
    if(idle.pose==='sit'){log('sit_ring',{kind:b.kind});b.facing=l.x<b.x?-1:1;}
    if(l.type==='stripe'&&phase==='shop')log('stripe_walk_back',{kind:b.kind});
    if(idle.hide){setFace(b,'squint',0.9);b.facing=(l.x>b.x)?1:-1;}
    evaluateWorld('arrive');
  });
  if(!idle.pts.length){}
}
function idleFor(l,b){
  if(phase!=='shop'){
    let s=b.seat;const taken=customers.filter(c=>c!==b&&!c.gone).map(c=>c.seat);
    if(s<0||taken.indexOf(s)>=0){for(let i=0;i<SEATS.length;i++)if(taken.indexOf(i)<0){s=i;break;}}
    return {pts:[SEATS[s]],pose:'bench',seat:s};
  }
  let pts,pose='stand',hide=false;
  if(l.type==='round'){pts=[clampPos({x:l.x+(0.5-l.x)*0.12,z:l.z+0.12})];pose='sit';}
  else if(l.type==='stripe'){const side=l.x<0.5?-1:1;pts=[{x:0.5+side*0.12,z:0.045}];}
  else{const d=mdir(0.5,1.3,l.x,l.z);pts=[clampPos({x:l.x+d.x*0.3,z:l.z+d.z*0.3/DZ})];}
  const others=placedL().filter(o=>o!==l);
  if(others.length){
    const end=pts[pts.length-1];
    let anyone=!!shadowAt(end.x,end.z);
    for(const c of customers){if(c===b||c.gone||c.busy||c.path.length)continue;if(shadowAt(c.x,c.z))anyone=true;}
    if(!anyone){
      if(l.type!=='stripe'){
        const i=others.slice().sort((a,o)=>pd(a.x,a.z,l.x,l.z)-pd(o.x,o.z,l.x,l.z))[0];
        const p=shadePos(l,i);if(p){pts=[p];hide=true;}
      }else{
        let bestC=null,bd=9,bo=null;
        for(const c of customers){if(c===b||c.gone||c.busy||c.path.length||c.lantern<0)continue;const o=lan(c.lantern);if(!o||o.st!=='placed')continue;
          const d=pd(c.x,c.z,l.x,l.z);if(d<bd){bd=d;bestC=c;bo=o;}}
        if(bestC){const p=shadePos(bo,l);if(p){const c=bestC;const keep=c.pose;c.busy=true;setFace(c,'squint',1.2);
          later(0.5,()=>{walkTo(c,[p],()=>{c.pose=keep==='sit'?'sit':'stand';c.busy=false;c.facing=bo.x>c.x?1:-1;log('hide_shade',{kind:c.kind});evaluateWorld('arrive');});c.pose='walk';});}}
      }
    }
  }
  return {pts,pose,hide};
}
function shadePos(body,light){ // a spot in the shadow of `body` cast by `light`
  const dir=mdir(body.x,body.z,light.x,light.z);
  const as=body.type==='thick'?[0.29,0.31,0.27]:[0.13,0.17,0.21,0.1];
  const offs=[0,0.05,-0.05,0.08,-0.08];
  let fallback=null;
  for(const a of as)for(const o of offs){
    const vx=dir.x*a-dir.z*o,vz=dir.z*a+dir.x*o;
    const p=clampPos({x:body.x+vx,z:body.z+vz/DZ});if(!shadowAt(p.x,p.z))continue;
    if(!fallback)fallback=p;
    // keep the face visible: not hidden behind any lantern on screen
    let hidden=false;const hx=SX(p.x,p.z),hy=SY(p.z)-70*scl(p.z);
    for(const l of lanterns){if(l.st!=='placed')continue;if(l.z<=p.z)continue;const q=placedPos(l.x,l.z);
      if(Math.abs(hx-q.x)<q.sz*0.45+16*scl(p.z)&&hy>q.y-q.sz*1.15&&hy<q.y)hidden=true;}
    if(!hidden)return p;
  }
  return fallback;
}
function retLantern(l){
  l.st='return';l.rt=0;l.fx=l.x;l.fz=l.z;kick(l,0.8);sfx.ret();
  const o=cust(l.owner);if(o)o.lantern=-1;
  l.owner=-1;l.spot=-1;
  log('tap_return',{type:l.type});
}
function onReturned(l){l.st='shelf';l.returned=true;kick(l,0.7);sfx.katan();evaluateWorld('return');log('returned',{type:l.type});}

// ============================================================ big transitions
function startTransform(){
  phase='transform';trT=0;tf=0;sfx.chord();log('light_reached_shelf');
  keeper.busy=true;walkTo(keeper,[{x:0.5,z:0.05}],()=>{keeper.arms=1;keeper.facing=1;});
}
function updTransform(dt){
  const prev=tf;trT+=dt;
  if(trT>1.0)tf=clamp((trT-1.0)/3.2,0,1);
  if(prev<0.28&&tf>=0.28){sfx.katan();sfx.patan();log('board_to_floor');}
  if(prev<0.6&&tf>=0.6){sfx.patan();log('shelf_open_bench');}
  if(prev<0.9&&tf>=0.9){sfx.bloom();burstAt(L.cx,(L.shelfTop+L.shelfBase)/2,'gold',8);if(starWindow)log('star_window');}
  if(trT>4.4&&!updTransform.seated){
    updTransform.seated=true;keeper.arms=0;
    walkTo(keeper,[kHome()],()=>{keeper.busy=false;keeper.facing=-1;});
    const cs=customers.filter(c=>!c.gone).sort((a,b)=>a.x-b.x);
    cs.forEach((c,i)=>{c.seat=i===0?0:i===1?1:2;c.busy=true;c.q=-1;
      later(i*0.35,()=>{c.pose='walk';walkTo(c,[SEATS[c.seat]],()=>{c.pose='bench';c.facing=SEATS[c.seat].f;c.busy=false;c.shadowed=false;setFace(c,'joy',1.5);});});});
  }
  if(updTransform.seated&&customers.every(c=>c.gone||c.pose==='bench')&&!keeper.busy){
    updTransform.seated=false;phase='living';livingT=0;log('living_room');sfx.bloom();evaluateWorld('living');saveFlag=true;
  }
}
function startFarewell(){
  phase='farewell';fwT=0;sfx.lull();log('farewell');lampFlash=1;
  const cs=customers.filter(c=>!c.gone);
  const ls=lanterns.slice().sort((a,b)=>(a.st==='placed'?0:1)-(b.st==='placed'?0:1));
  cs.forEach((c,i)=>{const l=ls[i];c.busy=true;
    later(0.5+i*0.9,()=>{
      const goal=l.st==='placed'?{x:l.x+0.03,z:l.z+0.03}:floorUnderSlot(l.slot);
      c.pose='walk';
      walkTo(c,[goal],()=>{
        if(l.st==='placed'){const o=cust(l.owner);if(o&&o!==c&&o.lantern===l.id)o.lantern=-1;}
        if(l.st==='shelf'){l.buyer=c.id;}
        l.st='carried';l.owner=c.id;l.buyer=c.id;c.lantern=l.id;setFace(c,'joy',3);sfx.buy();
        walkTo(c,[{x:-0.05,z:L.queueZ},{x:-0.5,z:L.queueZ}],()=>{c.gone=true;l.gone=true;});
      });
    });});
}
function updFarewell(dt){
  fwT+=dt;
  if(customers.every(c=>c.gone)){
    if(updFarewell.closeT==null){updFarewell.closeT=0;sfx.katan();}
    updFarewell.closeT+=dt;tf=clamp(1-updFarewell.closeT/1.6,0,1);
    if(updFarewell.closeT>2.0){updFarewell.closeT=null;round++;newRound((seed*1664525+1013904223+round)>>>0,true);sfx.patan();saveFlag=true;}
  }
}

// ============================================================ target (one invitation at a time)
function computeTarget(){
  if(phase!=='shop'&&phase!=='living')return null;
  if(busyAny)return null;
  if(phase==='shop'&&reach>=1)return null;
  const shelf=lanterns.filter(l=>l.st==='shelf');
  const ret=shelf.find(l=>l.returned);
  if(ret)return {kind:'lantern',l:ret};
  if(phase==='shop'){
    if(!revealed){for(const c of customers){if(c.shadowed&&c.shadeBy){const j=lan(c.shadeBy.light);if(j&&j.st==='placed')return {kind:'lantern',l:j};}}}
    if(shelf.length){shelf.sort((a,b)=>Math.abs(a.slot-1)-Math.abs(b.slot-1));return {kind:'lantern',l:shelf[0]};}
    const pl=placedL();return pl.length?{kind:'lantern',l:pl[pl.length-1]}:null;
  }
  if(shelf.length){shelf.sort((a,b)=>Math.abs(a.slot-1)-Math.abs(b.slot-1));return {kind:'lantern',l:shelf[0]};}
  if(livingSwaps<1&&livingT<22){const pl=placedL();pl.sort((a,b)=>order.lastIndexOf(a.id)-order.lastIndexOf(b.id));return pl.length?{kind:'lantern',l:pl[0]}:null;}
  return {kind:'lamp'};
}
function targetScreen(t){
  if(!t)return null;
  if(t.kind==='lamp')return {x:L.lampX,y:L.lampY};
  const p=lanternScreen(t.l);return {x:p.x,y:p.y-p.sz*0.5};
}

// ============================================================ input
let downCount=0;
function onDown(e){
  if(e.cancelable)e.preventDefault();
  if(e.isPrimary===false)return;
  downCount++;
  audioUnlock();
  idleT=0;quietT=0;hint=null;hintDone=false;
  const r=cv.getBoundingClientRect();
  handleTap(e.clientX-r.left,e.clientY-r.top);
}
function hitLantern(x,y){
  const cand=[];
  for(const l of lanterns){if(l.gone)continue;const p=lanternScreen(l);const h=p.sz*1.08,w=p.sz*0.82;
    const cxp=p.x,cyp=p.y-h*0.5;const rx=Math.max(w*0.62,30),ry=Math.max(h*0.62,34);
    const dx=(x-cxp)/rx,dy=(y-cyp)/ry;const d=dx*dx+dy*dy;if(d<=1)cand.push({l,d,y:p.y});}
  cand.sort((a,b)=>a.d-b.d);return cand.length?cand[0].l:null;
}
function handleTap(x,y){
  const l=hitLantern(x,y);
  if(l){
    if(phase==='shop'||phase==='living'){
      if(l.st==='shelf'){sell(l);return;}
      if(l.st==='placed'&&l.placeT>0.35){retLantern(l);return;}
    }
    l.wob=0.18;l.sqV-=0.6;sfx.tick();return;
  }
  if(Math.hypot(x-L.lampX,y-L.lampY)<L.lampR*1.5){
    if(phase==='living'&&target&&target.kind==='lamp'){startFarewell();return;}
    wobLamp=0.15;sfx.tick();return;
  }
  for(const c of customers){if(c.gone)continue;const k=scl(c.z)*KIND_H[c.kind];const px=SX(c.x,c.z),py=SY(c.z);
    if(Math.abs(x-px)<26*k&&y<py+4&&y>py-100*k){c.wob=0.2;sfx.tick();return;}}
  {const k=scl(keeper.z)*KIND_H.keeper;const px=SX(keeper.x,keeper.z),py=SY(keeper.z);if(Math.abs(x-px)<26*k&&y<py+4&&y>py-100*k){keeper.wob=0.2;sfx.tick();return;}}
  for(const ch of chairs){const px=SX(ch.x,ch.z),py=SY(ch.z);const k=scl(ch.z);if(Math.abs(x-px)<22*k&&Math.abs(y-py+18*k)<26*k){ch.wob=0.25;sfx.tick();return;}}
  ripples.push({x,y,t:0});if(ripples.length>6)ripples.shift();sfx.tick();
}

// ============================================================ particles
function burstAt(x,y,col,n){for(let i=0;i<n;i++){if(particles.length>=24)particles.shift();const a=-Math.PI/2+(Math.random()-0.5)*2.2;const sp=(0.6+Math.random()*0.8)*L.u*1.2;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:0.8+Math.random()*0.3,col,r:(0.06+Math.random()*0.05)*L.u,rot:Math.random()*TAU});}}

// ============================================================ update
function update(dt){
  time+=dt;
  for(let i=0;i<timers.length;i++){const t=timers[i];if(t.t<=time){timers.splice(i,1);i--;try{t.fn();}catch(e){}}}
  busyAny=busyAnyFn();
  for(const l of lanterns){
    l.sqV+=(-170*l.sq-11*l.sqV)*dt;l.sq+=l.sqV*dt;
    l.rimV+=(-140*l.rim-10*l.rimV)*dt;l.rim+=l.rimV*dt;
    if(l.swayKick>0){l.swayKick-=dt;if(l.swayKick<=0)l.swayV+=l.swayAmt;}
    l.swayV+=(-38*l.sway-2.4*l.swayV)*dt;l.sway+=l.swayV*dt;
    l.wob*=Math.pow(0.03,dt);
    if(l.pop<1){if(l.popDelay>0)l.popDelay-=dt;else{l.pop=Math.min(1,l.pop+dt/0.5);if(l.pop>=1){kick(l,0.6);sfx.paper();}}}
    if(l.st==='lit'){l.beam=Math.min(1,l.beam+dt/0.22);if(l.run>=0)l.run=Math.min(1,l.run+dt/0.36);}
    else l.beam=Math.max(0,l.beam-dt/0.4);
    if(l.st==='fly'){l.ft+=dt/0.55;if(l.ft>=1){l.ft=1;onCarried(l);}}
    if(l.st==='return'){l.rt+=dt/0.7;if(l.rt>=1){l.rt=1;onReturned(l);}}
    if(l.st==='placed')l.placeT=Math.min(1,l.placeT+dt/0.6);
    const ti=(l.st==='placed'||l.st==='carried'||l.st==='fly'||(l.st==='lit'&&l.run>=0.95)||l.st==='return')&&!l.gone?1:0;
    l.int=lerp(l.int,ti*(l.st==='return'?1-l.rt:1),clamp(dt*6,0,1));
  }
  for(const c of customers)updCustomer(c,dt);
  updKeeper(dt);
  if(keeper.recheck&&!keeper.busy){keeper.recheck=false;scheduleChairs();}
  // chairs face the nearest star, else the nearest light
  const pl=placedL();
  for(const ch of chairs){
    ch.wob*=Math.pow(0.05,dt);if(ch.carried)continue;
    let tx=null,tz=null,bd=9;
    for(const k in stars){const s=stars[k];const d=pd(s.x,s.z,ch.x,ch.z);if(d<bd){bd=d;tx=s.x;tz=s.z;}}
    if(tx==null){for(const l of pl){const d=pd(l.x,l.z,ch.x,ch.z);if(d<bd){bd=d;tx=l.x;tz=l.z;}}}
    const ta=tx==null?Math.PI/2:Math.atan2((tz-ch.z)*DZ,tx-ch.x);
    let da=ta-ch.a;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;ch.a+=da*clamp(dt*3,0,1);
  }
  for(const k in stars)stars[k].age+=dt;
  dispReach=lerp(dispReach,phase==='shop'?Math.min(reach,1):(phase==='enter'?0:1),clamp(dt*1.5,0,1));
  if(phase==='shop'){
    if(reach>=1&&!busyAny){pendT+=dt;if(pendT>1.3){pendT=0;startTransform();}}else pendT=0;
  }else if(phase==='transform')updTransform(dt);
  else if(phase==='living'){livingT+=dt;
    if(!busyAny&&lanterns.every(l=>l.st==='placed')&&quietT>45)startFarewell();}
  else if(phase==='farewell')updFarewell(dt);
  else if(phase==='enter'){enterT+=dt;if(enterT>1&&customers.every(c=>!c.busy)&&lanterns.every(l=>l.pop>=1)){phase='shop';saveFlag=true;log('ready');}}
  // guidance
  target=computeTarget();
  quietT+=dt;
  if(target){idleT+=dt;if(idleT>4&&!hintDone&&!hint){hint={t:0};hintDone=true;log('hint');}}else idleT=0;
  if(hint){hint.t+=dt;if(hint.t>1.8)hint=null;}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=L.u*1.6*dt;p.vx*=0.97;p.rot+=dt*2;if(p.t>p.life)particles.splice(i,1);}
  for(let i=ripples.length-1;i>=0;i--){ripples[i].t+=dt;if(ripples[i].t>0.45)ripples.splice(i,1);}
  wobLamp*=Math.pow(0.05,dt);lampFlash=Math.max(0,lampFlash-dt*0.5);
  if(saveFlag){saveFlag=false;save();}
}

// ============================================================ drawing
function drawLamp(){
  const x=L.lampX,y=L.lampY,r=L.lampR*(1+Math.sin(time*1.6)*0.02);
  const isT=target&&target.kind==='lamp';
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(time*9)*wobLamp);
  const glowA=0.18+0.12*(phase==='living'?1:dispReach)+(isT?0.15*(0.5+0.5*Math.sin(time*4)):0)+lampFlash*0.2;
  const g=ctx.createRadialGradient(0,0,r*0.4,0,0,r*2.4);g.addColorStop(0,rgba('gold',glowA));g.addColorStop(1,rgba('gold',0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*2.4,0,TAU);ctx.fill();
  ctx.fillStyle=C.plum;ctx.beginPath();ctx.arc(0,0,r*1.08,0,TAU);ctx.fill();
  ctx.fillStyle=rgba('gold',0.95);ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
  ctx.rotate(time*0.08);
  rosette(ctx,r*0.95,8,C.amber,C.teal,C.cream);
  ctx.restore();
  if(isT){ctx.strokeStyle=rgba('gold',0.5+0.4*Math.sin(time*4));ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r*1.35+Math.sin(time*4)*3,0,TAU);ctx.stroke();}
}
function drawShelf(){
  const u=L.u,x0=L.cx-L.shelfHalf,x1=L.cx+L.shelfHalf,top=L.shelfTop-0.1*u,base=L.shelfBase,pw=0.13*u;
  const open=ease((tf-0.62)/0.38);
  // opening behind the shelf (lamp light comes through)
  if(open>0){
    ctx.save();
    const ow=(x1-x0-2*pw)*open;
    const g=ctx.createLinearGradient(0,top,0,base);g.addColorStop(0,rgba('gold',0.55*open));g.addColorStop(1,rgba('amber',0.35*open));
    ctx.fillStyle=g;ctx.fillRect(L.cx-ow/2,top,ow,base-top);
    ctx.translate(L.cx,(top+base)/2);
    if(starWindow){ctx.fillStyle=rgba('cream',0.85*open);starPath(ctx,8,(base-top)*0.42,(base-top)*0.2,-Math.PI/2);ctx.fill();
      ctx.fillStyle=rgba('gold',0.9*open);starPath(ctx,8,(base-top)*0.25,(base-top)*0.12,-Math.PI/2+time*0.1);ctx.fill();}
    else{ctx.globalAlpha=open*0.7;rosette(ctx,(base-top)*0.4,8,rgba('cream',0.6),rgba('teal',0.6),rgba('gold',0.9));ctx.globalAlpha=1;}
    ctx.restore();
  }
  // back panel (two halves slide aside when opening)
  const half=(x1-x0)/2*(1-open);
  ctx.fillStyle='#2e1a3e';
  ctx.fillRect(x0,top,half,base-top);ctx.fillRect(x1-half,top,half,base-top);
  // light climbing the shelf (reach)
  if(open<1&&dispReach>0.01){
    ctx.save();ctx.beginPath();ctx.rect(x0,top,half,base-top);ctx.rect(x1-half,top,half,base-top);ctx.clip();
    const hgt=(base-top)*dispReach;
    const g=ctx.createLinearGradient(0,base,0,base-hgt);g.addColorStop(0,rgba('amber',0.5));g.addColorStop(1,rgba('gold',0.12));
    ctx.fillStyle=g;ctx.fillRect(x0,base-hgt,x1-x0,hgt);
    ctx.fillStyle=rgba('gold',0.32);const n=Math.ceil((x1-x0)/(0.32*u));
    for(let i=0;i<n;i++){const cx=x0+(i+0.5)*(x1-x0)/n;for(let yy=base-0.15*u;yy>base-hgt;yy-=0.36*u){
      ctx.beginPath();ctx.moveTo(cx,yy-0.12*u);ctx.lineTo(cx+0.08*u,yy);ctx.lineTo(cx,yy+0.12*u);ctx.lineTo(cx-0.08*u,yy);ctx.closePath();ctx.fill();}}
    if(dispReach>0.97){ctx.fillStyle=rgba('cream',0.25+0.2*Math.sin(time*8));ctx.fillRect(x0,top,x1-x0,0.12*u);}
    ctx.restore();
  }
  // top board -> falls to floor as rug
  const bp=ease(tf/0.28);
  if(bp<1){
    const by=lerp(top,SY(0.27),bp),bw=lerp(x1-x0,widthAt(0.27)*0.38,bp),bh=lerp(0.13*u,0.05*u,bp);
    ctx.fillStyle=C.plum;ctx.fillRect(L.cx-bw/2,by,bw,bh);ctx.fillStyle=rgba('gold',0.8);ctx.fillRect(L.cx-bw/2,by+bh-3,bw,3);
    // kaleido teeth on the board
    ctx.fillStyle=rgba('amber',0.7);const n=9;for(let i=0;i<n;i++){const cx=L.cx-bw/2+(i+0.5)*bw/n;ctx.beginPath();ctx.moveTo(cx-bw/n*0.3,by+bh);ctx.lineTo(cx,by+bh+0.08*u*(1-bp));ctx.lineTo(cx+bw/n*0.3,by+bh);ctx.fill();}
  }
  // side panels -> fall outward into benches
  const sp=(tf-0.28)/0.34;
  if(sp<1){
    const t=sp<=0?0:outBack(sp);
    for(const side of[-1,1]){
      const xo=side<0?x0:x1,xi=side<0?x0+pw:x1-pw;
      const up=[[xo,top],[xi,top],[xi,base],[xo,base]];
      const bx=side<0?0.085:0.915;const sh=0.16*u;
      const bq=[[SX(bx-0.035*side,0.36),SY(0.36)-sh],[SX(bx+0.035*side,0.36),SY(0.36)-sh],[SX(bx+0.035*side,0.11),SY(0.11)-sh*0.8],[SX(bx-0.035*side,0.11),SY(0.11)-sh*0.8]];
      ctx.fillStyle=C.plum;ctx.beginPath();
      for(let i=0;i<4;i++){const px=lerp(up[i][0],bq[i][0],t),py=lerp(up[i][1],bq[i][1],t);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
      ctx.closePath();ctx.fill();ctx.strokeStyle=rgba('gold',0.7);ctx.lineWidth=2;ctx.stroke();
    }
  }
  // bottom board (stays; later a low table)
  ctx.fillStyle=C.plum;ctx.fillRect(x0-0.04*u,base-0.06*u,x1-x0+0.08*u,0.14*u);
  ctx.fillStyle=rgba('gold',0.75);ctx.fillRect(x0-0.04*u,base-0.06*u,x1-x0+0.08*u,3);
  ctx.fillStyle=rgba('teal',0.55);for(let i=0;i<14;i++){const cx=x0+(i+0.5)*(x1-x0)/14;ctx.beginPath();ctx.arc(cx,base+0.02*u,0.025*u,0,TAU);ctx.fill();}
}
function drawRugAndBenchesFloor(){
  const p=ease((tf-0.2)/0.1);
  if(p<=0)return;
  // rug from the shelf board
  const z0=0.21,z1=0.33,xa=0.31,xb=0.69;
  ctx.globalAlpha=p;
  ctx.fillStyle=C.plum;quad(xa,z0,xb,z0,xb,z1,xa,z1);ctx.fill();
  ctx.strokeStyle=rgba('gold',0.7);ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle=rgba('amber',0.6);
  for(let i=0;i<8;i++){const x=lerp(xa,xb,(i+0.5)/8);const px=SX(x,(z0+z1)/2),py=SY((z0+z1)/2);const w=widthAt(0.27)*(xb-xa)/16,h=(z1-z0)*L.band*0.4;
    ctx.beginPath();ctx.moveTo(px,py-h);ctx.lineTo(px+w*0.8,py);ctx.lineTo(px,py+h);ctx.lineTo(px-w*0.8,py);ctx.closePath();ctx.fill();}

  if(c.blink>0||f==='joy'){ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(-6,0,3,Math.PI*1.1,Math.PI*1.9);ctx.moveTo(9,0);ctx.arc(6,0,3,Math.PI*1.1,Math.PI*1.9);ctx.stroke();}
  else if(f==='squint'){ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(-9,-1);ctx.lineTo(-3,1);ctx.moveTo(9,-1);ctx.lineTo(3,1);ctx.stroke();}
  else{const er=f==='o'?3.2:2.6;ctx.beginPath();ctx.arc(-6+gx,gy,er,0,TAU);ctx.arc(6+gx,gy,er,0,TAU);ctx.fill();
    if(vis>0.6){ctx.fillStyle=C.cream;ctx.beginPath();ctx.arc(-5+gx,gy-1,0.9,0,TAU);ctx.arc(7+gx,gy-1,0.9,0,TAU);ctx.fill();}}
  if(kind==='grandpa'){ctx.strokeStyle=C.ink;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(-6,0,4.6,0,TAU);ctx.moveTo(10.6,0);ctx.arc(6,0,4.6,0,TAU);ctx.stroke();}
  // mouth
  ctx.strokeStyle=C.ink;ctx.lineWidth=2.2;ctx.beginPath();
  if(f==='o'){ctx.fillStyle=C.ink;ctx.arc(0,8,2.6,0,TAU);ctx.fill();}
  else if(f==='joy'||f==='smile'){ctx.arc(0,5,f==='joy'?6:4.5,Math.PI*0.15,Math.PI*0.85);ctx.stroke();if(f==='joy'){ctx.fillStyle=rgba('peach',0.9);ctx.beginPath();ctx.arc(0,8.5,2.2,0,Math.PI);ctx.fill();}}
  else if(f==='squint'){ctx.moveTo(-3,9);ctx.lineTo(3,9);ctx.stroke();}
  else{ctx.moveTo(-3,8);ctx.quadraticCurveTo(0,9.5,3,8);ctx.stroke();}
  // cheeks
  ctx.fillStyle=rgba('peach',0.55*vis);ctx.beginPath();ctx.arc(-10,5,2.8,0,TAU);ctx.arc(10,5,2.8,0,TAU);ctx.fill();
}
function drawChair(ch){
  const k=scl(ch.z);const lift=ch.carried?24*k:0;
  const x=SX(ch.x,ch.z),y=SY(ch.z)-lift;
  const fl=(ax,az)=>{const vx=ax*widthAt(ch.z),vy=az/DZ*L.band;const n=Math.hypot(vx,vy)||1;return [vx/n,vy/n*0.55];};
  const F=fl(Math.cos(ch.a),Math.sin(ch.a)),P=fl(-Math.sin(ch.a),Math.cos(ch.a));
  const dx=F[0],dy=F[1],px=P[0],py=P[1];
  const sd=15*k,swd=15*k,seatH=20*k,backH=22*k;
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(time*30)*ch.wob*0.2);
  if(!ch.carried){ctx.fillStyle=rgba('ink',0.45);ctx.beginPath();ctx.ellipse(0,0,18*k,6*k,0,0,TAU);ctx.fill();}
  const c=(a,b)=>[a*dx*sd+b*px*swd,a*dy*sd+b*py*swd];
  const corners=[c(1,1),c(1,-1),c(-1,-1),c(-1,1)];
  ctx.strokeStyle=C.ink;ctx.lineWidth=Math.max(2,3*k);
  for(const p of corners){ctx.beginPath();ctx.moveTo(p[0],p[1]-seatH);ctx.lineTo(p[0],p[1]);ctx.stroke();}
  const back=()=>{const b1=c(-1,1),b2=c(-1,-1);ctx.fillStyle='#3a2149';ctx.beginPath();ctx.moveTo(b1[0],b1[1]-seatH);ctx.lineTo(b2[0],b2[1]-seatH);ctx.lineTo(b2[0],b2[1]-seatH-backH);ctx.lineTo(b1[0],b1[1]-seatH-backH);ctx.closePath();ctx.fill();ctx.strokeStyle=rgba('amber',0.9);ctx.lineWidth=2;ctx.stroke();
    const m=c(-1,0);ctx.fillStyle=rgba('amber',0.9);ctx.save();ctx.translate(m[0],m[1]-seatH-backH*0.55);ctx.scale(0.8,1);starPath(ctx,4,6*k,2.4*k,0);ctx.fill();ctx.restore();};
  if(dy>0)back();
  ctx.fillStyle=C.plum;ctx.beginPath();corners.forEach((p,i)=>{i?ctx.lineTo(p[0],p[1]-seatH):ctx.moveTo(p[0],p[1]-seatH);});ctx.closePath();ctx.fill();ctx.strokeStyle=rgba('amber',0.9);ctx.lineWidth=2;ctx.stroke();
  if(dy<=0)back();
  ctx.restore();
}
function drawHint(){
  if(!hint)return;const ts=targetScreen(target);if(!ts)return;
  const t=hint.t;let x=ts.x,y=ts.y;const u=L.u;
  let ox=0.6*u,oy=0.7*u,press=0,a=1;
  if(t<0.6){const e=ease(t/0.6);ox*=1-e;oy*=1-e;a=e;}else if(t<1.0){ox=0;oy=0;press=Math.sin((t-0.6)/0.4*Math.PI);}else{const e=ease((t-1.0)/0.8);ox=0.3*u*e;oy=0.4*u*e;a=1-e;}
  if(t>0.6&&t<1.2){const rr=(t-0.6)/0.6;ctx.strokeStyle=rgba('cream',0.8*(1-rr));ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,0.1*u+rr*0.3*u,0,TAU);ctx.stroke();}
  ctx.save();ctx.globalAlpha=a;ctx.translate(x+ox+0.05*u,y+oy+0.08*u);const s=u/110*(1-press*0.12);ctx.scale(s,s);ctx.rotate(-0.35);
  ctx.fillStyle=C.cream;ctx.strokeStyle=C.ink;ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-7,-34);ctx.arc(0,-34,7,Math.PI,0);ctx.lineTo(7,-6);ctx.lineTo(14,-10);ctx.arc(19,-8,5,Math.PI,0);ctx.lineTo(24,-2);ctx.lineTo(29,-4);ctx.arc(32,0,4,Math.PI,0);
  ctx.lineTo(36,22);ctx.quadraticCurveTo(30,44,8,44);ctx.quadraticCurveTo(-14,44,-18,22);ctx.lineTo(-22,6);ctx.quadraticCurveTo(-20,0,-14,4);ctx.lineTo(-7,12);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
}
function draw(){
  const d=L.dpr;ctx.setTransform(d,0,0,d,0,0);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.drawImage(bgCanvas,0,0,L.W,L.H);
  drawLamp();
  drawShelf();
  drawRugAndBenchesFloor();
  ctx.save();ctx.beginPath();ctx.rect(0,L.floorTop-1,L.W,L.H);ctx.clip();
  drawFloorLights();
  drawShadows();
  drawStars();
  ctx.restore();
  drawBeams();
  // shelf lanterns
  for(const l of lanterns)if(l.st==='shelf'||l.st==='lit')drawLantern(l);
  // sorted floor objects
  const objs=[];
  for(const l of lanterns){if(l.st==='placed'){const p=placedPos(l.x,l.z);objs.push({y:p.y,f:()=>drawLantern(l)});}}
  for(const ch of chairs)objs.push({y:SY(ch.z)+(ch.carried?0.5:0),f:()=>drawChair(ch)});
  for(const c of customers){if(c.gone)continue;objs.push({y:SY(c.z)+0.1,f:()=>{drawPerson(c,false);const l=c.lantern>=0?lan(c.lantern):null;if(l&&(l.st==='carried'))drawLantern(l);}});}
  objs.push({y:SY(keeper.z)+0.1,f:()=>drawPerson(keeper,true)});
  objs.push({y:SY(0.11),f:()=>drawBench(-1)});objs.push({y:SY(0.11),f:()=>drawBench(1)});
  objs.sort((a,b)=>a.y-b.y);for(const o of objs)o.f();
  for(const l of lanterns)if(l.st==='fly'||l.st==='return')drawLantern(l);
  // particles: a few big light flakes
  for(const p of particles){const a=1-p.t/p.life;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=rgba(p.col,0.9*a);starPath(ctx,4,p.r,p.r*0.38,0);ctx.fill();ctx.restore();}
  for(const r of ripples){const t=r.t/0.45;ctx.strokeStyle=rgba('cream',0.45*(1-t));ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,6+t*16,0,TAU);ctx.stroke();}
  drawHint();
}

// ============================================================ save / load (device only)
function save(){
  if(!(phase==='shop'||phase==='living'))return;
  try{
    const d={v:1,round,seed,phase,rev:revealed?1:0,sw:livingSwaps,tie:tieRight?1:0,swin:starWindow?1:0,order:order.slice(-12),
      lan:lanterns.map(l=>{const placed=l.st==='placed';return {t:l.type,c:l.color,s:l.slot,w:placed?'p':'s',sp:placed?l.spot:-1,o:placed?l.owner:-1,r:(l.returned||l.st==='return')?1:0,e:l.everLit?1:0,ls:l.lastSpot};}),
      cus:customers.map(c=>{let x=c.x,z=c.z;if(c.path.length){const e=c.path[c.path.length-1];x=e.x;z=e.z;}
        const l=c.lantern>=0?lan(c.lantern):null;const own=l&&l.st==='placed'&&l.owner===c.id?c.lantern:-1;
        let p=c.pose;if(p==='walk')p=phase==='living'&&c.seat>=0?'bench':'stand';if(p==='wait'&&c.q<0)p='stand';
        return {k:c.kind,x:+x.toFixed(4),z:+z.toFixed(4),p,q:c.q,st:c.seat,l:own,sh:c.shadowed?1:0};}),
      ch:chairs.map(ch=>({x:+ch.x.toFixed(4),z:+ch.z.toFixed(4)}))};
    localStorage.setItem(STORE,JSON.stringify(d));saveFailed=false;
  }catch(e){saveFailed=true;}
}
const fin=(v,a,b)=>typeof v==='number'&&isFinite(v)&&v>=a&&v<=b;
function validate(d){
  if(!d||typeof d!=='object'||d.v!==1)return false;
  if(!fin(d.round,1,1e9)||!fin(d.seed,0,4294967295))return false;
  if(d.phase!=='shop'&&d.phase!=='living')return false;
  if(!Array.isArray(d.lan)||d.lan.length!==3||!Array.isArray(d.cus)||d.cus.length!==3||!Array.isArray(d.ch)||d.ch.length!==2)return false;
  const ts=new Set(),ss=new Set(),sp=new Set();
  for(const l of d.lan){if(!l||TYPES.indexOf(l.t)<0||LIGHT_COLS.indexOf(l.c)<0||!fin(l.s,0,2)||(l.s|0)!==l.s)return false;ts.add(l.t);ss.add(l.s);
    if(l.w!=='p'&&l.w!=='s')return false;
    if(l.w==='p'){if(!fin(l.sp,0,SPOTS.length-1)||(l.sp|0)!==l.sp||sp.has(l.sp))return false;if(SPOTS[l.sp].living&&d.phase!=='living')return false;sp.add(l.sp);if(!fin(l.o,0,2))return false;}}
  if(ts.size!==3||ss.size!==3)return false;
  const ks=new Set();
  for(let i=0;i<3;i++){const c=d.cus[i];if(!c||KINDS.indexOf(c.k)<0||!fin(c.x,-0.6,1.6)||!fin(c.z,-0.2,2.2))return false;ks.add(c.k);
    if(['wait','stand','sit','bench'].indexOf(c.p)<0)return false;if(!fin(c.q,-1,2)||!fin(c.st,-1,3)||!fin(c.l,-1,2))return false;
    if(c.p==='bench'&&(d.phase!=='living'||c.st<0))return false;
    if(c.l>=0){const l=d.lan[c.l];if(l.w!=='p'||l.o!==i)return false;}}
  if(ks.size!==3)return false;
  for(const l of d.lan)if(l.w==='p'&&d.cus[l.o].l!==d.lan.indexOf(l))return false;
  for(const ch of d.ch)if(!ch||!fin(ch.x,0,1)||!fin(ch.z,0,1.2))return false;
  return true;
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(STORE);}catch(e){return null;}
  if(!raw)return null;
  try{const d=JSON.parse(raw);if(validate(d))return d;}catch(e){}
  try{localStorage.removeItem(STORE);}catch(e){}
  log('save_invalid_reset');
  return null;
}
function applyState(d){
  newRound(d.seed,false);
  round=d.round;tieRight=!!d.tie;starWindow=!!d.swin;revealed=!!d.rev;livingSwaps=d.sw|0;
  lanterns=d.lan.map((s,i)=>{const l=mkLantern(i,s.t,s.c,s.s);l.everLit=!!s.e;l.returned=!!s.r&&s.w==='s';l.lastSpot=fin(s.ls,-1,9)?s.ls:-1;
    if(s.w==='p'){l.st='placed';l.spot=s.sp;l.x=SPOTS[s.sp].x;l.z=SPOTS[s.sp].z;l.owner=s.o;l.placeT=1;l.int=1;}return l;});
  customers=d.cus.map((s,i)=>{const c=mkCustomer(i,s.k);c.x=s.x;c.z=s.z;c.pose=s.p;c.q=s.p==='wait'?s.q:-1;c.seat=s.st;c.lantern=s.l;c.shadowed=!!s.sh;
    if(c.pose==='wait'&&c.q>=0){const p=queuePos(c.q);c.x=p.x;c.z=p.z;}
    if(c.pose==='bench'){const st=SEATS[c.seat];c.x=st.x;c.z=st.z;c.facing=st.f;}
    c.sit=(c.pose==='sit'||c.pose==='bench')?1:0;c.face='smile';return c;});
  chairs=d.ch.map(s=>({x:s.x,z:s.z,a:-Math.PI/2,carried:false,wob:0}));
  order=Array.isArray(d.order)?d.order.filter(v=>fin(v,0,2)):[];
  phase=d.phase;tf=phase==='living'?1:0;{const h=kHome();keeper.x=h.x;keeper.z=h.z;}
  evaluateWorld('restore');
  for(const c of customers){c.shadowed=!!shadowAt(c.x,c.z)&&c.pose!=='bench';c.shadeBy=shadowAt(c.x,c.z);}
  dispReach=phase==='living'?1:Math.min(1,reach);
  log('restored',{phase});
}

// ============================================================ loop & lifecycle
let raf=0,last=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  dt*=api.timeScale;
  try{let rem=dt;while(rem>1e-6){const st=Math.min(0.025,rem);update(st);rem-=st;}draw();}catch(e){if(!frame.err){frame.err=1;console.warn(e);}}
}
function start(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame);}}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();save();if(AC&&AC.state==='running')AC.suspend().catch(()=>{});}
  else{if(AC&&audioOK)AC.resume().catch(()=>{});start();}
});
window.addEventListener('pagehide',()=>{save();});
let rsz=0;
function onResize(){if(rsz)return;rsz=requestAnimationFrame(()=>{rsz=0;resize();});}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',onResize);
cv.addEventListener('pointerdown',onDown,{passive:false});
['pointerup','pointercancel','pointerleave','lostpointercapture'].forEach(n=>cv.addEventListener(n,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
['touchstart','touchmove','touchend'].forEach(n=>document.addEventListener(n,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
['gesturestart','gesturechange','gestureend','contextmenu','dblclick','selectstart'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
window.addEventListener('wheel',e=>e.preventDefault(),{passive:false});

// test / inspection hook (no UI)
const api={timeScale:1,
  snap(){return {phase,round,seed,reach:+reach.toFixed(2),tf:+tf.toFixed(2),revealed,livingSwaps,starWindow,saveFailed,downCount,
    target:target?(target.kind==='lamp'?'lamp':'lantern:'+target.l.type):null,targetXY:targetScreen(target),hint:!!hint,
    lanterns:lanterns.map(l=>{const p=lanternScreen(l);return {id:l.id,type:l.type,color:l.color,slot:l.slot,st:l.st,spot:l.spot,x:+l.x.toFixed(2),z:+l.z.toFixed(2),sx:Math.round(p.x),sy:Math.round(p.y-p.sz*0.54),sz:Math.round(p.sz)};}),
    customers:customers.map(c=>({kind:c.kind,pose:c.pose,x:+c.x.toFixed(2),z:+c.z.toFixed(2),busy:c.busy,shadowed:c.shadowed,vis:+c.vis.toFixed(2),face:c.face,lantern:c.lantern,gone:c.gone,
      head:(()=>{const h=headPos(c);return {x:Math.round(h.x),y:Math.round(h.y)};})()})),
    chairs:chairs.map(ch=>({x:+ch.x.toFixed(2),z:+ch.z.toFixed(2),a:+ch.a.toFixed(2)})),
    stars:Object.keys(stars).map(k=>({k,x:+stars[k].x.toFixed(2),z:+stars[k].z.toFixed(2)})),
    lamp:{x:L.lampX,y:L.lampY},busy:busyAny,keeperBusy:keeper.busy,particles:particles.length,log:evlog.slice()};}
};
window.__gf=api;

// ============================================================ boot
resize();
const saved=load();
if(saved){try{applyState(saved);}catch(e){newRound((Date.now()%2147483647)>>>0,false);}}
else{newRound(((Date.now()^(Math.random()*1e9))%2147483647)>>>0,false);}
start();
})();
</script>
