<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<title>びよーん、ぱたん！ひとまい屋根のリレー楽団</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#ffffff;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;position:fixed;inset:0}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#sa{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);
  padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
// =====================================================================
//  びよーん、ぱたん！ひとまい屋根のリレー楽団
//  一枚布の取っ手を一本指で引き、三人へリレーして屋根を張る。
//  受け手が引き手になり、前の引き手は拍手係へ。三人目で屋根が完成し、
//  同じ取っ手が「反動演奏台」に変わる。弾いた音型を三人がまねて一曲を締め、
//  布を畳んで別の順番で再開する。
//  色は 赤・青・黄・黒・白 の平らな面のみ（グラデーション・半透明なし）。
// =====================================================================

const COL = { W:'#ffffff', R:'#e3241b', B:'#1f4ed6', Y:'#ffd200', K:'#111111' };
const CLOTH = [COL.R, COL.Y, COL.B];
const BPM = 108, STEP = 60 / BPM / 2;            // 8分音符
const MAX_PARTICLES = 70, MAX_RINGS = 26, MAX_VOICES = 44;
const STAGE_HITS = 6;

const cv = document.getElementById('c');
const g = cv.getContext('2d');
const saEl = document.getElementById('sa');

let W = 0, H = 0, DPR = 1, X0 = 0, Y0 = 0, UW = 0, UH = 0;
let kh = 100, handH = 114, cw = 42, shR = 72, grabR = 50;
const Lp = {};

const nowP = () => performance.now() / 1000;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function distSeg(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay, l2 = dx*dx + dy*dy;
  let t = l2 > 0 ? ((px-ax)*dx + (py-ay)*dy) / l2 : 0; t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + dx*t), py - (ay + dy*t));
}
function inPoly(px, py, pts){
  let ins = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++){
    const a = pts[i], b = pts[j];
    if (((a.y > py) !== (b.y > py)) && (px < (b.x - a.x) * (py - a.y) / (b.y - a.y) + a.x)) ins = !ins;
  }
  return ins;
}
const ease = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

// ---------------------------------------------------------------- 人物
// 0: 左（赤）  1: 手前中央（白黒しま）  2: 右（黄）
const KEYS = [110, 146.83, 196];                 // 最初の受け手で曲の調が決まる
const PENTA = [0, 2, 4, 7, 9, 12];
const BASS = [
  [[0,0],[6,7],[8,0],[14,4]],                    // 左から: 低くどっしり
  [[0,0],[4,7],[10,9],[12,0]],                   // 手前から: はずむ
  [[0,12],[3,7],[6,12],[10,9],[13,7]]            // 右から: 高く跳ねる
];
const kids = [
  { id:0, shirt:COL.R, ring:COL.R, home:'h0', sf:52,  heavyDef:true,  defStomp:[0,4,8,12] },
  { id:1, shirt:'stripe', ring:COL.K, home:'h1', sf:84,  heavyDef:false, defStomp:[0,6,8,14] },
  { id:2, shirt:COL.Y, ring:COL.Y, home:'h2', sf:128, heavyDef:false, defStomp:[2,5,10,13] }
];
for (const k of kids){
  Object.assign(k, { spot:k.home, pos:{x:0,y:0}, role:'wait', lean:0, jump:0, cheer:0, squash:0,
    lift:0, liftLeg:0, clapT:0, kneeT:0, wob:0, stomps:[], clapSteps:[], sitting:false, reach:0, seed:Math.random()*6 });
}
const benches = [ { id:'b0', bounce:0, wob:0, shaded:false }, { id:'b1', bounce:0, wob:0, shaded:false } ];

// ---------------------------------------------------------------- 状態
let phase = 'relay';            // relay | toStage | stage | finale | fold
let corners = [{kind:'pole'}];
let holder = -1;
let order = [];
let cycle = 0;
let opening = -1, keyRoot = 0, musicOn = false;
let stageHits = 0, stageRec = [], finalePending = false, finale = null;
let fold = null, toStage = null, toStageAt = 0;
let lastUnison = -99;
let poleWob = 0, flash = 0;
const memory = { orders:[], lastRebound:[], prevFinal:-1 };
const roofVib = { x:0, y:0, vx:0, vy:0 };
let stripVib = 0;
const handle = { x:0, y:0, fx:0, fy:0, drag:false, squash:0, hop:0, bounce:null, hover:null, pressT:0 };
let activePid = null;
let lastInput = nowP();
const demo = { active:false, t0:0, shownRelay:false, shownStage:false, x:0, y:0, ox:0, oy:0, press:0 };
let firstTouchDone = false;
const rings = [], parts = [];
const vq = [];                  // 予約した見た目の反応
const pend = [];                // 拍に吸着させる予約
let gs = 0, nextStepTime = nowP() + 0.1;

// ---------------------------------------------------------------- 配置
function layout(){
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const cs = getComputedStyle(saEl);
  const st = parseFloat(cs.paddingTop) || 0, sr = parseFloat(cs.paddingRight) || 0;
  const sb = parseFloat(cs.paddingBottom) || 0, sl = parseFloat(cs.paddingLeft) || 0;
  X0 = sl; Y0 = st; UW = Math.max(100, W - sl - sr); UH = Math.max(100, H - st - sb);
  const portrait = UH > UW * 1.15;
  kh = portrait ? Math.min(UW * 0.27, UH * 0.15) : Math.min(UW * 0.19, UH * 0.2);
  handH = kh * 1.3; cw = kh * 0.42; shR = kh * 0.72; grabR = Math.max(44, kh * 0.5);
  const P = portrait ? { pt:.12, pb:.40, ky:.63, kx:.27, cy:.85 } : { pt:.07, pb:.42, ky:.69, kx:.28, cy:.92 };
  Lp.poleTop  = { x:X0 + UW*.5, y:Y0 + UH*P.pt };
  Lp.poleBase = { x:X0 + UW*.5, y:Y0 + UH*P.pb };
  Lp.hook     = { x:Lp.poleTop.x + kh*0.06, y:Lp.poleTop.y + kh*0.66 };
  Lp.h0 = { x:X0 + UW*P.kx,     y:Y0 + UH*P.ky };
  Lp.h2 = { x:X0 + UW*(1-P.kx), y:Y0 + UH*P.ky };
  Lp.h1 = { x:X0 + UW*.5,       y:Y0 + UH*P.cy };
  Lp.b0 = { x:Math.max(X0 + kh*0.38, Lp.h0.x - kh*0.66), y:Lp.h0.y - kh*0.1 };
  Lp.b1 = { x:Math.min(X0 + UW - kh*0.38, Lp.h2.x + kh*0.66), y:Lp.h2.y - kh*0.1 };
  Lp.horizon = Lp.poleBase.y - kh*0.22;
  for (const k of kids){ const f = spotFeet(k.spot); k.pos.x = f.x; k.pos.y = f.y; }
}

function spotSit(id){ return id === 'b0' || id === 'b1'; }
function stageFeet(){
  let sx = 0, sy = 0, n = 0;
  for (const c of corners){ if (c.kind === 'kid') continue; const f = rawFloor(c); sx += f.x; sy += f.y; n++; }
  if (!n) return { x:Lp.h1.x, y:Lp.h1.y };
  return { x:clamp(sx/n, X0 + kh*0.6, X0 + UW - kh*0.6), y:clamp(sy/n - kh*0.12, Lp.poleBase.y + kh*0.55, Y0 + UH - kh*0.12) };
}
function spotFeet(id){
  if (id === 'st') return stageFeet();
  return Lp[id] || Lp.h1;
}
function spotHand(id){ const f = spotFeet(id); return { x:f.x, y:f.y - handH * (spotSit(id) ? 0.98 : 1) }; }
function kidJumpY(k){ return k.jump > 0 ? Math.sin(Math.PI * (1 - k.jump)) * kh * 0.26 : 0; }
function kidHand(k){
  return { x:k.pos.x + Math.sin(k.lean) * kh * 0.3, y:k.pos.y - handH * (k.sitting ? 0.98 : 1) - kidJumpY(k) };
}
function rawAir(c){
  if (c.kind === 'pole') return Lp.poleTop;
  if (c.kind === 'kid') return kidHand(kids[c.k]);
  return spotHand(c.spot);
}
function rawFloor(c){
  if (c.kind === 'pole') return Lp.poleBase;
  if (c.kind === 'kid') return kids[c.k].pos;
  return spotFeet(c.spot);
}
function cornerAir(c, i){
  const p = rawAir(c);
  if (fold){ const e = ease(clamp(fold.p, 0, 1)); return { x:lerp(p.x, Lp.poleTop.x, e), y:lerp(p.y, Lp.poleTop.y, e) }; }
  return p;
}
function cornerFloor(c){
  const p = rawFloor(c);
  if (fold){ const e = ease(clamp(fold.p, 0, 1)); return { x:lerp(p.x, Lp.poleBase.x, e), y:lerp(p.y, Lp.poleBase.y, e) }; }
  return p;
}
function airCentroid(){
  let sx = 0, sy = 0; for (let i = 0; i < corners.length; i++){ const p = cornerAir(corners[i], i); sx += p.x; sy += p.y; }
  return { x:sx / corners.length, y:sy / corners.length };
}
function stageCenterRest(){ const f = stageFeet(); return { x:f.x, y:f.y - handH - kh*0.44 }; }
function fanCenter(){
  const ac = airCentroid();
  let c = ac;
  if (phase === 'toStage' && toStage){ const s = stageCenterRest(); const e = ease(clamp(toStage.p, 0, 1)); c = { x:lerp(ac.x, s.x, e), y:lerp(ac.y, s.y, e) }; }
  else if (phase === 'stage' || phase === 'finale'){ c = stageCenterRest(); }
  else if (phase === 'fold' && fold && fold.from){ const e = ease(clamp(fold.p,0,1)); c = { x:lerp(fold.from.x, Lp.poleTop.x, e), y:lerp(fold.from.y, Lp.poleTop.y, e) }; }
  let px = 0, py = 0;
  if (phase === 'stage' || phase === 'finale'){
    const r = handleRest(); px = (handle.x - r.x) * 0.5; py = (handle.y - r.y) * 0.5;
  }
  return { x:c.x + roofVib.x + px, y:c.y + roofVib.y + py };
}
function handleRest(){
  if (phase === 'stage' || phase === 'finale' || phase === 'toStage'){
    const k = kids[holder]; if (k){ const h = kidHand(k); return { x:h.x, y:h.y - kh * 0.1 }; }
  }
  if (phase === 'fold'){ return fold && fold.hfrom ? { x:lerp(fold.hfrom.x, Lp.hook.x, ease(clamp(fold.p,0,1))), y:lerp(fold.hfrom.y, Lp.hook.y, ease(clamp(fold.p,0,1))) } : Lp.hook; }
  if (holder >= 0){ const h = kidHand(kids[holder]); return { x:h.x, y:h.y - kh * 0.1 }; }
  return Lp.hook;
}
function stripStart(){
  if (phase === 'stage' || phase === 'finale' || phase === 'toStage') return fanCenter();
  return cornerAir(corners[corners.length - 1], corners.length - 1);
}
function canGrab(){
  if (phase === 'relay') return order.length < 3 && !toStageAt;
  if (phase === 'stage') return !finalePending;
  return false;
}

// ---------------------------------------------------------------- 音
let AC = null, master = null, dlyIn = null, noiseBuf = null, voices = 0;
let dragOsc = null;
function ensureAudio(){
  if (AC){ if (AC.state === 'suspended'){ try { AC.resume().catch(()=>{}); } catch(e){} } return; }
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    AC = new A();
    master = AC.createGain(); master.gain.value = 0.85;
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    master.connect(comp); comp.connect(AC.destination);
    dlyIn = AC.createGain(); dlyIn.gain.value = 1;
    const d = AC.createDelay(1.2); d.delayTime.value = STEP * 1.5;
    const fb = AC.createGain(); fb.gain.value = 0.36;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    dlyIn.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(master);
    const len = Math.floor(AC.sampleRate * 0.6);
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const ch = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const b = AC.createBuffer(1, 1, 22050); const s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0);
    if (AC.state === 'suspended'){ AC.resume().catch(()=>{}); }
  } catch(e){ AC = null; }
}
function audioReady(n){ return AC && AC.state === 'running' && voices + (n || 1) <= MAX_VOICES; }
function at(t){ return AC.currentTime + Math.max(0, t - nowP()) + 0.005; }
function outNode(pan){
  if (AC.createStereoPanner){ const p = AC.createStereoPanner(); p.pan.value = clamp(pan || 0, -0.9, 0.9); p.connect(master); return p; }
  return master;
}
function track(src){ voices++; src.onended = () => { voices--; }; }
function envG(T, a, peak, d){
  const gn = AC.createGain(); peak = Math.max(0.0002, peak);
  gn.gain.setValueAtTime(0.0001, T); gn.gain.exponentialRampToValueAtTime(peak, T + a);
  gn.gain.exponentialRampToValueAtTime(0.0001, T + a + d);
  return gn;
}
function panX(x){ return W ? (x / W) * 2 - 1 : 0; }
function noiseHit(T, type, f, q, a, d, vol, dest){
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const gn = envG(T, a, vol, d); s.connect(fl); fl.connect(gn); gn.connect(dest);
  s.start(T, Math.random() * 0.3); s.stop(T + a + d + 0.05); track(s);
}
function sStomp(t, f, heavy, vol, x){
  if (!audioReady(2)) return; const T = at(t), dest = outNode(panX(x));
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(f * 2.7, T); o.frequency.exponentialRampToValueAtTime(f, T + 0.07);
  const gn = envG(T, 0.004, vol * (heavy ? 0.95 : 0.62), heavy ? 0.42 : 0.2);
  o.connect(gn); gn.connect(dest); o.start(T); o.stop(T + 0.55); track(o);
  noiseHit(T, 'bandpass', f * 9, 1.2, 0.002, 0.04, vol * 0.25, dest);
}
function sKnee(t, vol, x){
  if (!audioReady(2)) return; const T = at(t), dest = outNode(panX(x));
  noiseHit(T, 'lowpass', 1300, 0.7, 0.002, 0.07, vol * 0.5, dest);
  const o = AC.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(340, T); o.frequency.exponentialRampToValueAtTime(190, T + 0.06);
  const gn = envG(T, 0.003, vol * 0.28, 0.08); o.connect(gn); gn.connect(dest); o.start(T); o.stop(T + 0.15); track(o);
}
function sClap(t, vol, x){
  if (!audioReady(3)) return; const T = at(t), dest = outNode(panX(x));
  for (let i = 0; i < 3; i++) noiseHit(T + i * 0.011, 'bandpass', 1500, 0.9, 0.001, i === 2 ? 0.12 : 0.02, vol * 0.55, dest);
}
function sBench(t, vol, x){
  if (!audioReady(2)) return; const T = at(t), dest = outNode(panX(x));
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(96, T); o.frequency.exponentialRampToValueAtTime(46, T + 0.18);
  const gn = envG(T, 0.004, vol * 0.85, 0.48); o.connect(gn); gn.connect(dest); o.start(T); o.stop(T + 0.6); track(o);
  noiseHit(T, 'lowpass', 500, 0.8, 0.002, 0.06, vol * 0.3, dest);
}
function sPluck(t, f, dec, bright, vol, x, wet){
  if (!audioReady(3)) return; const T = at(t), dest = outNode(panX(x));
  const o1 = AC.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f;
  const o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2.003;
  const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = 2;
  fl.frequency.setValueAtTime(500 + bright * 5200, T); fl.frequency.exponentialRampToValueAtTime(260 + bright * 300, T + dec);
  const gn = envG(T, 0.003, vol, dec);
  o1.connect(fl); o2.connect(fl); fl.connect(gn); gn.connect(dest);
  if (wet > 0 && dlyIn){ const ws = AC.createGain(); ws.gain.value = wet * 0.7; gn.connect(ws); ws.connect(dlyIn); }
  o1.start(T); o2.start(T); o1.stop(T + dec + 0.05); o2.stop(T + dec + 0.05); track(o1); track(o2);
}
function sTone(t, type, f, f2, a, d, vol, x){
  if (!audioReady(1)) return; const T = at(t), dest = outNode(panX(x));
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, T);
  if (f2 && f2 !== f) o.frequency.exponentialRampToValueAtTime(f2, T + a + d);
  const gn = envG(T, a, vol, d); o.connect(gn); gn.connect(dest); o.start(T); o.stop(T + a + d + 0.05); track(o);
}
function sBlip(x, f){ sTone(nowP(), 'sine', f || 620, (f || 620) * 1.3, 0.004, 0.08, 0.12, x); }
function sSuccess(t, x){                         // 受け渡し成功: 上がる三和音 + ぱたん
  const r = (keyRoot || 146.83) * 2;
  [0, 4, 7, 12].forEach((s, i) => sTone(t + i * 0.07, 'triangle', r * Math.pow(2, s/12), 0, 0.005, 0.32, 0.22, x));
  sTone(t + 0.3, 'sine', r * 4, r * 4, 0.003, 0.5, 0.12, x);
  sBench(t, 0.6, x);
}
function sRoofDone(t){                           // 屋根完成: 大きな和音のファンファーレ
  const r = keyRoot || 146.83;
  [[0,7,12],[2,9,14],[4,12,16]].forEach((ch, j) => ch.forEach(s =>
    sTone(t + j * 0.18, 'triangle', r * 2 * Math.pow(2, s/12), 0, 0.01, 0.55, 0.13, W/2)));
  sTone(t + 0.54, 'sine', r * 8, r * 8, 0.004, 0.9, 0.12, W/2);
  sBench(t + 0.54, 0.9, W/2);
}
function sFinal(t){
  const r = keyRoot || 146.83;
  [0, 4, 7, 12, 16, 19].forEach(s => sTone(t, 'triangle', r * Math.pow(2, s/12), 0, 0.01, 1.4, 0.12, W/2));
  sPluck(t, r, 1.6, 0.8, 0.28, W/2, 0.7);
  sBench(t, 1.0, W/2);
  for (let i = 0; i < 3; i++) sClap(t + i * 0.03, 0.9, kids[i].pos.x);
}
function sFold(t){ sTone(t, 'sine', 900, 200, 0.02, 0.9, 0.14, W/2); sPluck(t + 0.8, (keyRoot || 110), 0.5, 0.2, 0.18, W/2, 0.3); }
function dragToneOn(){
  if (!audioReady(2) || dragOsc) return;
  const T = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = (keyRoot || 98);
  const o2 = AC.createOscillator(); o2.type = 'triangle'; o2.frequency.value = (keyRoot || 98) * 0.5;
  const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 400; fl.Q.value = 3;
  const gn = AC.createGain(); gn.gain.setValueAtTime(0.0001, T); gn.gain.exponentialRampToValueAtTime(0.05, T + 0.05);
  o.connect(fl); o2.connect(fl); fl.connect(gn); gn.connect(master);
  o.start(T); o2.start(T); track(o); track(o2);
  dragOsc = { o, o2, fl, gn };
}
function dragToneSet(tn){
  if (!dragOsc || !AC) return; const T = AC.currentTime, base = keyRoot || 98;
  dragOsc.o.frequency.setTargetAtTime(base * (1 + tn * 0.9), T, 0.03);
  dragOsc.o2.frequency.setTargetAtTime(base * 0.5 * (1 + tn * 0.9), T, 0.03);
  dragOsc.fl.frequency.setTargetAtTime(380 + tn * 2200, T, 0.04);
  dragOsc.gn.gain.setTargetAtTime(0.04 + tn * 0.11, T, 0.04);
}
function dragToneOff(){
  if (!dragOsc || !AC) { dragOsc = null; return; }
  const T = AC.currentTime, d = dragOsc;
  try { d.gn.gain.cancelScheduledValues(T); d.gn.gain.setTargetAtTime(0.0001, T, 0.03); d.o.stop(T + 0.2); d.o2.stop(T + 0.2); } catch(e){}
  dragOsc = null;
}

// ---------------------------------------------------------------- 見た目の反応
function ring(x, y, color, maxR, dur, lw){
  if (rings.length >= MAX_RINGS) rings.shift();
  rings.push({ x, y, c:color, r0:kh * 0.08, r1:maxR, t:0, dur:dur || 0.5, lw:lw || kh * 0.07 });
}
function burst(x, y, n, sp){
  for (let i = 0; i < n; i++){
    if (parts.length >= MAX_PARTICLES) parts.shift();
    const a = Math.random() * Math.PI * 2, v = (0.4 + Math.random()) * (sp || kh * 3);

  g.save(); g.translate(head.x, head.y); g.rotate(lean);
  g.beginPath(); g.arc(0, 0, hrr, Math.PI * 1.02, Math.PI * 1.98); g.closePath(); g.fill();
  if (k.id === 0){ g.fillRect(-hrr * 1.05, -hrr * 0.2, hrr * 0.4, hrr * 0.9); g.fillRect(hrr * 0.65, -hrr * 0.2, hrr * 0.4, hrr * 0.9); }
  else if (k.id === 1){ g.beginPath(); g.arc(-hrr * 0.95, -hrr * 0.55, hrr * 0.32, 0, Math.PI * 2); g.arc(hrr * 0.95, -hrr * 0.55, hrr * 0.32, 0, Math.PI * 2); g.fill(); }
  else { g.beginPath(); g.moveTo(hrr * 0.6, -hrr * 0.7); g.lineTo(hrr * 1.5, -hrr * 0.2); g.lineTo(hrr * 0.85, hrr * 0.05); g.closePath(); g.fill(); }
  g.restore();
  // 手
  for (const h of [hl, hr]){
    g.fillStyle = COL.W; g.beginPath(); g.arc(h.x, h.y, s * 0.055, 0, Math.PI * 2); g.fill();
    g.lineWidth = Math.max(2, s * 0.028); g.strokeStyle = COL.K; g.stroke();
  }
  // 受け手の印（引いて近づけた時だけ）
  if (k.reach > 0.05){
    const h = kidHand(k);
    g.lineWidth = s * 0.06 * k.reach; g.strokeStyle = COL.K;
    g.beginPath(); g.arc(h.x, h.y - s * 0.12, s * (0.24 + 0.03 * Math.sin(t * 12)), 0, Math.PI * 2); g.stroke();
    g.lineWidth = s * 0.035 * k.reach; g.strokeStyle = COL.Y; g.stroke();
  }
}
function drawHandle(t){
  const st = (phase === 'stage' || phase === 'finale');
  const sq = Math.max(handle.squash, demo.press * 0.4);
  const hop = Math.sin(handle.hop * Math.PI) * kh * 0.18;
  const idleHop = canGrab() && !handle.drag ? Math.max(0, Math.sin(t * 4.2)) * kh * 0.05 : 0;
  const x = handle.x, y = handle.y - hop - idleHop;
  const w = kh * 0.62 * (1 + 0.28 * sq), h = kh * 0.22 * (1 - 0.38 * sq);
  if (canGrab() && !handle.drag){
    const pr = grabR * (0.95 + 0.12 * Math.sin(t * 5));
    g.lineWidth = kh * 0.07; g.strokeStyle = COL.K; g.beginPath(); g.arc(x, y, pr, 0, Math.PI * 2); g.stroke();
    g.lineWidth = kh * 0.04; g.strokeStyle = (Math.sin(t * 5) > 0) ? COL.Y : COL.R; g.stroke();
  }
  g.fillStyle = st ? COL.R : COL.Y;
  const r = h / 2;
  g.beginPath();
  g.moveTo(x - w / 2 + r, y - h / 2); g.lineTo(x + w / 2 - r, y - h / 2); g.arc(x + w / 2 - r, y, r, -Math.PI / 2, Math.PI / 2);
  g.lineTo(x - w / 2 + r, y + h / 2); g.arc(x - w / 2 + r, y, r, Math.PI / 2, Math.PI * 1.5); g.closePath();
  g.fill(); g.lineWidth = Math.max(3, kh * 0.04); g.strokeStyle = COL.K; g.stroke();
  g.fillStyle = st ? COL.Y : COL.R;
  g.beginPath(); g.arc(x - w / 2 + r, y, r * 0.55, 0, Math.PI * 2); g.arc(x + w / 2 - r, y, r * 0.55, 0, Math.PI * 2); g.fill();
  g.fillStyle = COL.K; g.fillRect(x - kh * 0.02, y - h / 2, kh * 0.04, h);
}
function drawDemoHand(){
  if (!demo.active) return;
  const s = kh, x = demo.x + s * 0.08, y = demo.y + s * 0.12;
  const lw = Math.max(2.5, s * 0.035);
  g.fillStyle = COL.W; g.strokeStyle = COL.K; g.lineWidth = lw; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(x - s * 0.04, y - s * 0.02); g.lineTo(x - s * 0.04, y - s * 0.24); g.arc(x, y - s * 0.24, s * 0.04, Math.PI, 0); g.lineTo(x + s * 0.04, y); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x - s * 0.1, y); g.lineTo(x + s * 0.16, y); g.lineTo(x + s * 0.16, y + s * 0.18); g.quadraticCurveTo(x + s * 0.03, y + s * 0.3, x - s * 0.1, y + s * 0.18); g.closePath(); g.fill(); g.stroke();
  if (demo.press){ g.lineWidth = s * 0.04; g.beginPath(); g.arc(x, y - s * 0.27, s * 0.12, 0, Math.PI * 2); g.stroke(); }
}
function render(t){
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBackground();
  drawShade();
  for (const b of benches) drawBench(b);
  drawPole();
  drawStakes();
  drawRoof(t);
  const ks = kids.slice().sort((a, b) => a.pos.y - b.pos.y);
  for (const k of ks) drawKid(k, t);
  drawHandle(t);
  for (const r of rings){
    const p = r.t / r.dur, rr = lerp(r.r0, r.r1, Math.sqrt(p)), lw = r.lw * (1 - p);
    if (lw < 0.5) continue;
    if (r.c === COL.Y){ g.lineWidth = lw + 3; g.strokeStyle = COL.K; g.beginPath(); g.arc(r.x, r.y, rr, 0, Math.PI * 2); g.stroke(); }
    g.lineWidth = lw; g.strokeStyle = r.c; g.beginPath(); g.arc(r.x, r.y, rr, 0, Math.PI * 2); g.stroke();
  }
  for (const p of parts){
    const sc = p.s * (1 - p.t / p.life);
    g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.c; g.fillRect(-sc, -sc, sc * 2, sc * 2); g.restore();
  }
  drawDemoHand();
}

// ---------------------------------------------------------------- ループ
let raf = 0, lastT = nowP(), running = false;
function frame(){
  raf = 0;
  if (!running) return;
  const t = nowP(), dt = Math.min(0.05, Math.max(0, t - lastT)); lastT = t;
  try { update(dt, t); render(t); } catch(err){ console.warn(err); }
  raf = requestAnimationFrame(frame);
}
function start(){ if (running) return; running = true; lastT = nowP(); nextStepTime = Math.max(nextStepTime, nowP() + 0.05); raf = requestAnimationFrame(frame); }
function stop(){ running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (activePid !== null) releaseDrag(true);
    stop();
    if (AC && AC.state === 'running'){ try { AC.suspend().catch(()=>{}); } catch(e){} }
  } else {
    vq.length = 0; nextStepTime = nowP() + 0.05;
    if (AC && AC.state !== 'running'){ try { AC.resume().catch(()=>{}); } catch(e){} }
    lastInput = nowP();
    start();
  }
});
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));

// テスト用の読み取り口（ゲームの進行には使わない）
window.__gf = {
  state(){ return {
    phase, holder, order:order.slice(), corners:corners.map(c => c.kind + (c.spot ? ':' + c.spot : '')), cycle, stageHits,
    handle:{ x:handle.x, y:handle.y, drag:handle.drag, squash:handle.squash }, rest:handleRest(),
    kids:kids.map(k => ({ role:k.role, spot:k.spot, sitting:k.sitting, x:k.pos.x, y:k.pos.y, hand:kidHand(k), stomps:k.stomps.map(s => s.s), claps:k.clapSteps.slice() })),
    benches:benches.map(b => ({ shaded:b.shaded, pos:spotFeet(b.id) })), opening, keyRoot, musicOn, memory:JSON.parse(JSON.stringify(memory)),
    audio: AC ? AC.state : 'none', voices, parts:parts.length, rings:rings.length, demo:demo.active, kh, firstTouchDone, canGrab:canGrab()
  }; }
};

layout();
for (const k of kids){ const f = spotFeet(k.spot); k.pos.x = f.x; k.pos.y = f.y; }
handle.x = Lp.hook.x; handle.y = Lp.hook.y;
start();
})();
</script>
