<script>
(function(){
'use strict';
// =====================================================================
//  すりっ、ぱかっ！きんこのころころ遊び部屋
//  ヒビをなぞる → 扉・部品の大きさが長さで決まる → 玉の流れが変わる
// =====================================================================
var cvs=document.getElementById('c'), ctx=cvs.getContext('2d'), saEl=document.getElementById('sa');
var TAU=Math.PI*2, BR=17, GRAV=1500, NBALL=10, MAXP=150, MAXBURST=26, SUB=1/240;
var COLS=['#ff2f7d','#ffb000','#14d5c0','#3a7cff','#a64cff','#4bd93a'];
var FILM='#19181d', FILM2='#121116';
var SILVER='#dfe4ee', GOLD='#ffd45a';

function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function rngMake(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function hex2rgb(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}

// ---------- 色帯パターン（下層） ----------
var bandPat=null;
(function(){
  var S=240,P=40,c=document.createElement('canvas');c.width=c.height=S;
  var g=c.getContext('2d'),id=g.createImageData(S,S),d=id.data,rgb=COLS.map(hex2rgb);
  for(var y=0;y<S;y++)for(var x=0;x<S;x++){
    var k=Math.floor((x+y)/P)%6,cc=rgb[k],f=(x+y)%P;
    var sh=f<3?0.78:(f>P-4?0.88:1);
    var n=((Math.imul(x*7+y*13,2654435761)>>>24)/255-0.5)*18;
    var i=(y*S+x)*4;
    d[i]=clamp(cc[0]*sh+n,0,255);d[i+1]=clamp(cc[1]*sh+n,0,255);d[i+2]=clamp(cc[2]*sh+n,0,255);d[i+3]=255;
  }
  g.putImageData(id,0,0);
  bandPat=ctx.createPattern(c,'repeat');
})();

// ---------- 状態 ----------
var L=null;                // レイアウト（ワールド座標）
var dpr=1;
var phase='closed', phaseT=0, openAmt=0;
var balls=[];
var cr={};                 // ヒビ
var part={slide:{q:0,v:0},gear:{q:0,v:0},outlet:{q:0,v:0},bridge:{q:0,v:0},slope:{q:0,v:0}};
var gate={open:0,until:-1,held:false,was:false,cnt:0,lastDrop:-9};
var tray={st:'rest',t:0,dx:0,dy:0,rot:0,released:false};
var lift={phase:0,speed:0,tick:0,stalled:false};
var gearAng=0, sprAng=0;
var bells={};
var cyc={n:0,seed:0,nOff:0,b1Off:0,b2Off:0,pitch:{}};
var parts=[], bursts=[];
var now=0, lastInput=0;
var flags={};
var wob={safe:0,tray:0,lift:0};
var ringZip=-1, keyT=0, ringAvailT=-10;
var guide={tgt:null,focus:null,key:'',t:0};
var demo={active:false,t:0,key:'',shown:{},lastT:-99,path:null,kind:''};
var ptr={id:null,x:0,y:0,lx:0,ly:0,crack:null,press:0,vx:0,vy:0,down:false};
var running=true, hidden=false, raf=0, lastTs=0;
var SEG=[], CIR=[], perf=[], perfN=0, tapT=0, tapLat=-1, hits={};
var bgCanvas=null;

// =====================================================================
//  レイアウト
// =====================================================================
function computeLayout(){
  var cw=Math.max(1,window.innerWidth||document.documentElement.clientWidth||1);
  var ch=Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
  var asp=ch/cw, portrait=asp>=1.15, W, H;
  if(portrait){W=clamp(1100/asp,600,760);H=W*asp;}else{H=1100;W=H/asp;}
  var s=cw/W, cs=getComputedStyle(saEl);
  var o={W:W,H:H,s:s,cw:cw,ch:ch,portrait:portrait};
  o.iT=(parseFloat(cs.paddingTop)||0)/s; o.iR=(parseFloat(cs.paddingRight)||0)/s;
  o.iB=(parseFloat(cs.paddingBottom)||0)/s; o.iL=(parseFloat(cs.paddingLeft)||0)/s;
  var r=BR;
  o.lx=W-o.iR-50; o.lh=22;
  o.y0=o.iT+114;
  o.poolBot=H-o.iB-14; o.liftBot=o.poolBot-26;
  o.poolL=o.lx-58; o.poolR=o.lx+34;
  o.floorR=H-o.iB-96; o.fs=0.045;
  o.TW=172; o.TH=82;
  o.bs=0.07;
  o.Nr=25; o.B1r=23; o.B2r=21; o.Wr=17;
  o.Be={x:o.lx-40,y:0};
  // B2 はプール入口の上、床を転がる玉はその下をくぐる
  o.B2y=o.floorR-(2*r+10+o.B2r);
  o.Be.y=o.B2y-o.B2r-2*r-12;
  var fY=function(x){return o.floorR-(o.poolL-x)*o.fs;};
  var bY=function(x){return o.Be.y-(o.Be.x-x)*o.bs;};
  o.fY=fY;o.bY=bY;
  var R=Math.min(0.31*W,portrait?0.165*H:0.19*H,215), tries=0;
  // 縦向き：投入口は右上・取り出し口は左下（玉道3段）／横向き：投入口は右横・取り出し口は右下（玉道2段）
  var SLOT=portrait?[0.47,-0.88]:[0.906,-0.423];
  var F3U=portrait?[-0.30,0.95]:[0.48,0.84];
  for(;;){
    tries++;
    var cx=portrait?Math.max(R+o.iL+24,0.4*W):Math.max(R+o.iL+70,0.25*W);
    var F3x=cx+F3U[0]*R;
    var S0x=portrait?F3x-(2*r+6)-6:F3x-4;
    var xc=Math.min(o.lx-48-o.TW/2, portrait?1e9:S0x+0.42*(o.lx-S0x));
    var xL=xc-o.TW/2, xR=xc+o.TW/2;
    var B1x=xc+cyc.b1Off;
    var B1y=bY(B1x)-(2*r+o.B1r+16);
    var trayBot=B1y-o.B1r-2*r-14, trayTop=trayBot-o.TH;
    var slotX=cx+SLOT[0]*R;
    var railDx=(o.lx-52)-slotX;
    var cyMin=portrait?o.y0+2*r+13+Math.max(0.035*railDx,10)-SLOT[1]*R:o.y0+r+11+0.05*railDx-SLOT[1]*R;
    var cy=cyMin;
    var s0off=portrait?F3U[1]*R+2*r+16:F3U[1]*R+14;
    var S0y=cy+s0off;
    var Lh=(xL-28)-S0x;
    var avail=trayTop-46-S0y;
    var th=Math.atan2(avail,Lh);
    if(th<0.1&&tries<8&&R>110){R*=0.94;continue;}
    if(th>0.22){
      var extra=avail-Lh*Math.tan(0.22);
      cy+=extra*0.85; S0y=cy+s0off; avail=trayTop-46-S0y; th=Math.atan2(avail,Lh);
    }
    th=clamp(th,0.08,0.22);
    o.R=R;o.cx=cx;o.cy=cy;o.xc=xc;o.xL=xL;o.xR=xR;o.trayTop=trayTop;o.trayBot=trayBot;
    o.B1={x:B1x,y:B1y,r:o.B1r};
    o.th=th;o.dir={x:Math.cos(th),y:Math.sin(th)};
    o.S0={x:S0x,y:S0y};
    o.Lgeo=Lh/Math.cos(th);
    break;
  }
  var U=function(u,v){return {x:o.cx+u*o.R,y:o.cy+v*o.R};};
  o.U=U;
  o.slot=U(SLOT[0],SLOT[1]);
  o.Rs={x:o.lx-30,y:o.y0+r+5};
  o.Dp={x:o.lx-30-r-5,y:o.y0+1};
  o.F3=U(F3U[0],F3U[1]);
  o.stopX=portrait?o.F3.x+1:o.F3.x-1;
  o.inner=[];
  if(portrait){
    o.Re={x:o.slot.x+10,y:o.slot.y-r-8};
    var c1a=U(0.82,-0.48),c1b=U(-0.62,-0.12);
    o.inner=[[{x:c1a.x+8,y:c1a.y-90},{x:c1a.x+8,y:c1a.y+2}]];
    var wAx=c1b.x-2*r-18;
    var c2a={x:wAx+4,y:U(0,0.15).y},c2b=U(0.48,0.40);
    var wBx=c2b.x+2*r+18;
    var c3a={x:wBx-4,y:U(0,0.62).y};
    o.chute=[[c1a,c1b],[c2a,c2b],[c3a,o.F3]];
    o.hood={x:o.slot.x-r-14,y0:o.Re.y-2*r-36,y1:o.Re.y-6};
    var s1h=function(x){return c1a.y+(x-c1a.x)*(c1b.y-c1a.y)/(c1b.x-c1a.x);};
    var hwx=o.hood.x+r+24;
    o.Wb={x:hwx,y:Math.min(o.Re.y+2*r+12,s1h(hwx)-2*r-6-o.Wr-10),r:o.Wr};
    o.walls=[[{x:wAx,y:c1b.y-50},{x:wAx,y:c2a.y+2}],[{x:wBx,y:c2b.y-50},{x:wBx,y:c3a.y+2}]];
    var exx=o.stopX+r+5,k3=(c3a.y-o.F3.y)/(c3a.x-o.F3.x);
    o.E2={x:exx,y:o.F3.y+(exx-o.F3.x)*k3-r-5};
    o.alcoveWallX=o.S0.x-2;
    o.doorSide=-1;
    o.win=U(-0.05,-0.30);
    o.ag=-0.2;
  }else{
    o.Re={x:o.slot.x+4,y:o.slot.y-4};
    var d1a=U(0.86,0.22),d1b=U(-0.62,0.40);
    var wAx2=d1b.x-2*r-18;
    var d2a={x:wAx2+4,y:U(0,0.66).y};
    o.chute=[[d1a,d1b],[d2a,o.F3]];
    o.walls=[[{x:wAx2,y:d1b.y-50},{x:wAx2,y:d2a.y+2}]];
    o.inner=[[U(0.97,-0.34),U(0.97,0.5)]];
    o.Wb=placeW(o,d1a,d1b);o.hood=null;
    var ex2=o.stopX-r-5,k4=(o.F3.y-d2a.y)/(o.F3.x-d2a.x);
    o.E2={x:ex2,y:o.F3.y+(ex2-o.F3.x)*k4-r-5};
    o.alcoveWallX=null;
    o.doorSide=1;
    o.win=U(-0.28,-0.22);
    o.ag=-1.2;
  }
  // 並んで待つ玉が見える細長い窓（取り出し口の手前）
  var lc=o.chute[o.chute.length-1],qa=lc[0],qb=lc[1],ql=Math.hypot(qb.x-qa.x,qb.y-qa.y),qd={x:(qb.x-qa.x)/ql,y:(qb.y-qa.y)/ql};
  var qn={x:qd.y,y:-qd.x};if(qn.y>0){qn.x=-qn.x;qn.y=-qn.y;}
  var qe={x:o.E2.x-qd.x*(2*r+10),y:o.E2.y-qd.y*(2*r+10)};
  var qs={x:qe.x-qd.x*Math.min(ql*0.62,5.2*r),y:qe.y-qd.y*Math.min(ql*0.62,5.2*r)};
  o.qwin={a:qs,b:qe,h:r+4};
  // 歯車の扉
  o.Dg={x:o.cx+Math.cos(o.ag)*o.R,y:o.cy+Math.sin(o.ag)*o.R};
  o.rgMax=portrait?Math.min(36,((o.lx-44)-o.Dg.x-8)/2):46;
  o.rgMin=Math.min(16,o.rgMax*0.6);
  // 棚（開放時に受け皿が持ち上がる先）
  o.shelfXc=o.lx-46-o.TW/2; o.shelfBot=o.y0-r-14;
  // ---- すべり台の長さの較正（実際の物理で着地点を求める）
  o.Lmax=o.Lgeo;
  var target=o.xc+8;
  if(landX(o,o.Lgeo,o.trayTop-r)>target){
    var lo=40,hi=o.Lgeo;
    for(var it=0;it<18;it++){var mid=(lo+hi)/2;if(landX(o,mid,o.trayTop-r)>target)hi=mid;else lo=mid;}
    o.Lmax=lo;
  }
  // ---- 手前のベル N：短いすべり台の玉が落ちる所
  var tanT=Math.tan(o.th), kS=0.22;
  var slideY=function(x){return o.S0.y+(x-o.S0.x)*tanT;};
  var Se={x:o.xR-8,y:o.trayTop-10};
  var flapY=function(x){return Se.y+(Se.x-x)*kS;};
  var nMax=o.xL-96;
  var Nx=clamp(landX(o,o.Lmax*0.3,flapY(o.S0.x+o.Lmax*0.3)+2*r)+cyc.nOff,Math.min(o.S0.x+70,nMax),nMax);
  // 坂がすべり台の下を通れる所まで N を右へ
  while(Nx<nMax&&flapY(Nx+6)-slideY(Nx+6)<2*r+26)Nx+=6;
  var Ny=Math.max(flapY(Nx+6)+2*r+16+o.Nr,slideY(Nx)+o.Nr*1.3+2*r+24);
  if(Ny>bY(Nx)-2*r-o.Nr-30)Ny=bY(Nx)-2*r-o.Nr-30;
  o.N={x:Nx,y:Ny,r:o.Nr};
  // 受け皿の手前は常に N へ流れる短い斜面（Ss→Rm）。部屋では Rm→Se へ坂が伸びて口をおおう
  var Ss={x:Nx+46,y:flapY(Nx+46)};
  var Rm={x:o.xL-8,y:flapY(o.xL-8)};
  o.Ss=Ss;o.Rm=Rm;o.Se=Se;o.sLen=Math.hypot(Se.x-Rm.x,Se.y-Rm.y);
  o.sDir={x:(Se.x-Rm.x)/o.sLen,y:(Se.y-Rm.y)/o.sLen};
  var lo2=20,hi2=o.Lmax,tx2=Math.min(Ss.x+24,Rm.x-10),yHit=flapY(tx2)-r-4;
  if(landX(o,hi2,yHit)<tx2)lo2=hi2;
  else for(var it2=0;it2<16;it2++){var m2=(lo2+hi2)/2;if(landX(o,m2,yHit)>tx2)hi2=m2;else lo2=m2;}
  o.Lmin=clamp((lo2-0.1*o.Lmax)/0.9,24,o.Lmax*0.6);
  o.sPlate={x:o.xL-17,y0:o.trayTop+10,y1:o.trayBot-2};
  // ---- 橋：N の左下から玉運びへ
  o.Bs={x:Nx-o.Nr-50,y:0}; o.Bs.y=bY(o.Bs.x);
  o.bLen=Math.hypot(o.Be.x-o.Bs.x,o.Be.y-o.Bs.y);
  o.bDir={x:(o.Be.x-o.Bs.x)/o.bLen,y:(o.Be.y-o.Bs.y)/o.bLen};
  // ---- ベル B2
  var b2x=clamp(o.B1.x+64+cyc.b2Off,o.B1.x+30,o.poolL-26);
  o.B2={x:b2x,y:fY(b2x)-(2*r+10+o.B2r),r:o.B2r};
  return o;
}

// レールから落ちた玉が内側のベル W の左肩に当たる位置
function placeW(o,sa,sb){
  var r=BR,wy=o.Re.y+2*r+10;
  // レールを転がって落ちる玉を実際の物理で追い、W の高さでの x を求める
  var b={x:o.Dp.x,y:o.Dp.y,vx:-70,vy:0},rail={ax:o.Rs.x,ay:o.Rs.y,bx:o.Re.x,by:o.Re.y,r:4,e:0.12},hx=o.Re.x-20;
  for(var i=0;i<4000;i++){b.vy+=GRAV*SUB;b.x+=b.vx*SUB;b.y+=b.vy*SUB;collideSeg(b,rail);
    var sp=Math.hypot(b.vx,b.vy);if(sp>820){b.vx*=820/sp;b.vy*=820/sp;}
    if(b.y>=wy-o.Wr-r*0.6){hx=b.x;break;}}
  var wx=hx+10;
  var s1=function(x){return sa.y+(x-sa.x)*(sb.y-sa.y)/(sb.x-sa.x);};
  wy=Math.min(wy,s1(wx)-2*r-6-o.Wr-10);
  return {x:wx,y:wy,r:o.Wr};
}
// すべり台だけの簡易シミュレーションで着地 x を求める
function landX(o,len,yT){
  var dx=o.dir.x,dy=o.dir.y,nx=dy,ny=-dx;
  var b={x:o.S0.x+dx*(BR+6)+nx*(BR+6),y:o.S0.y+dy*(BR+6)+ny*(BR+6),vx:0,vy:0};
  var sg={ax:o.S0.x,ay:o.S0.y,bx:o.S0.x+dx*len,by:o.S0.y+dy*len,r:5,e:0.15};
  for(var i=0;i<3000;i++){
    b.vy+=GRAV*SUB;b.x+=b.vx*SUB;b.y+=b.vy*SUB;
    collideSeg(b,sg);
    var sp=Math.hypot(b.vx,b.vy);if(sp>820){b.vx*=820/sp;b.vy*=820/sp;}
    if(b.y>=yT)return b.x;
  }
  return b.x;
}

// =====================================================================
//  ヒビ
// =====================================================================
function noiseFn(rng,closed){
  var a=[];for(var i=0;i<3;i++)a.push({f:closed?(3+Math.floor(rng()*4)+i*3):(2+rng()*4+i*3),p:rng()*TAU,m:0.55/(i+1)});
  return function(t){var s=0;for(var k=0;k<a.length;k++)s+=Math.sin(t*a[k].f+a[k].p)*a[k].m;return s;};
}
function buildPath(ctrl,rng,amp,du,closed){
  var nf=noiseFn(rng,closed),n=ctrl.length,segs=closed?n:n-1,lens=[],total=0,i,k;
  for(i=0;i<segs;i++){var a=ctrl[i],b=ctrl[(i+1)%n];var l=Math.hypot(b[0]-a[0],b[1]-a[1]);lens.push(l);total+=l;}
  var dense=[],acc=0;
  for(i=0;i<segs;i++){
    var A=ctrl[i],B=ctrl[(i+1)%n],l2=lens[i]||1e-6,m=Math.max(2,Math.ceil(l2/0.008));
    var nx=-(B[1]-A[1])/l2,ny=(B[0]-A[0])/l2;
    for(k=0;k<m;k++){
      var t=k/m,gt=(acc+l2*t)/total;
      var env=closed?1:Math.min(1,gt*5,(1-gt)*5+0.15);
      var off=nf(gt*TAU)*amp*env;
      dense.push([A[0]+(B[0]-A[0])*t+nx*off,A[1]+(B[1]-A[1])*t+ny*off]);
    }
    acc+=l2;
  }
  if(closed)dense.push(dense[0].slice());else dense.push(ctrl[n-1].slice());
  var out=[dense[0].slice()],need=du;
  for(i=1;i<dense.length;i++){
    var p=dense[i-1],q=dense[i],ll=Math.hypot(q[0]-p[0],q[1]-p[1]),t0=0;
    while(ll-t0>=need){t0+=need;var tt=t0/ll;out.push([p[0]+(q[0]-p[0])*tt,p[1]+(q[1]-p[1])*tt]);need=du;}
    need-=(ll-t0);
  }
  if(closed&&out.length>3){var f=out[0],la=out[out.length-1];if(Math.hypot(f[0]-la[0],f[1]-la[1])<du*0.6)out.pop();}
  return out;
}
function makeCrack(id,frame,defs,refS){
  var du=7/refS,cells=[],paths=[];
  for(var pi=0;pi<defs.length;pi++){
    var pd=defs[pi],pts=buildPath(pd.ctrl,pd.rng,pd.amp,du,pd.closed),st=cells.length,np=pts.length;
    for(var i=0;i<np;i++){
      var a,b;
      if(pd.closed){a=pts[(i-1+np)%np];b=pts[(i+1)%np];}else{a=pts[Math.max(0,i-1)];b=pts[Math.min(np-1,i+1)];}
      var dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;

  var bl=Math.hypot(be[0],be[1]);if(bl>0.5){be[0]*=0.5/bl;be[1]*=0.5/bl;}

function isAvail(c){
  if(!c)return false;
  if(phase==='closed'){
    if(c===cr.ring)return flags.ringAvail&&ringZip<0;
    if(c===cr.outlet)return tray.st==='rest';
    return c===cr.slide||c===cr.gear;
  }
  if(phase==='open'){
    if(c===cr.outlet)return tray.st==='rest';
    return c===cr.bridge||c===cr.slope;
  }
  return false;
}
function tolW(){return Math.max(40,42/L.s);}
function nearestCell(c,x,y){
  var f=frameOf(c),best=-1,bd=1e18,cs=c.cells;
  for(var i=0;i<c.N;i++){var px=f.ox+cs[i].u*f.s-x,py=f.oy+cs[i].v*f.s-y,d=px*px+py*py;if(d<bd){bd=d;best=i;}}
  return {i:best,d:Math.sqrt(bd)};
}
var lastScrSnd=0, lastBurstT=0;
function scratchAt(c,x,y){
  var n=nearestCell(c,x,y);
  if(n.i<0||n.d>tolW()*1.5)return 0;
  var cs=c.cells,P=c.paths[cs[n.i].pi],len=P.e-P.s,got=0,f=frameOf(c);
  for(var k=-2;k<=2;k++){
    var j=n.i+k;
    if(P.closed){j=P.s+(((j-P.s)%len)+len)%len;}else if(j<P.s||j>=P.e)continue;
    var cl=cs[j];
    if(!cl.t){cl.t=1;cl.sc=Math.max(cl.sc,0.4);c.cnt++;got++;
      var w=cellW(c,f,j);
      for(var q=0;q<2;q++)spawnChip(w.x,w.y);
    }
  }
  if(got){
    var wasZero=(c.cnt===got);
    c.p=c.cnt/c.N;
    var pt=part[c.id];if(pt)pt.v+=0.35;
    if(now-lastScrSnd>0.05){lastScrSnd=now;sScratch(c.p);}
    var wc=cellW(c,f,n.i);
    if(now-lastBurstT>0.12){lastBurstT=now;addBurst(wc.x,wc.y,26,GOLD,7,0.32);}
    if(wasZero){sPop(0.2);addBurst(wc.x,wc.y,40,GOLD,10,0.4);}
    onCrackProgress(c);
  }
  return got;
}
function scratchAlong(c,x0,y0,x1,y1){
  var d=Math.hypot(x1-x0,y1-y0),n=Math.max(1,Math.ceil(d/5)),g=0;
  for(var i=1;i<=n;i++)g+=scratchAt(c,x0+(x1-x0)*i/n,y0+(y1-y0)*i/n);
  return g;
}
function onCrackProgress(c){
  if(c===cr.slide&&c.p>=0.97&&!flags.slideFull){flags.slideFull=true;success(L.S0.x+L.dir.x*L.Lmax,L.S0.y+L.dir.y*L.Lmax);}
  if(c===cr.gear&&c.p>=0.97&&!flags.gearFull){flags.gearFull=true;var g=gearCenter();success(g.x,g.y);}
  if(c===cr.bridge&&c.p>=0.97&&!flags.bridgeFull){flags.bridgeFull=true;success(L.Be.x,L.Be.y);}
  if(c===cr.slope&&c.p>=0.97&&!flags.slopeFull){flags.slopeFull=true;success(L.Se.x,L.Se.y);}
  if(c===cr.outlet&&c.p>=0.97&&!flags.outletFull){flags.outletFull=true;success(L.xc,L.trayBot+20);}
  if(c===cr.ring&&c.p>=0.86&&ringZip<0&&phase==='closed'){ringZip=0;detachPtr();sZip();}
}

function collideSeg(b,s){
  var dx=s.bx-s.ax,dy=s.by-s.ay,l2=dx*dx+dy*dy,t=l2>0?((b.x-s.ax)*dx+(b.y-s.ay)*dy)/l2:0;
  t=t<0?0:(t>1?1:t);
  var qx=s.ax+dx*t,qy=s.ay+dy*t,ex=b.x-qx,ey=b.y-qy,d2=ex*ex+ey*ey,m=BR+s.r;
  if(d2>=m*m)return -1;
  var d=Math.sqrt(d2),nx,ny;
  if(d<1e-4){var l=Math.sqrt(l2)||1;nx=dy/l;ny=-dx/l;if(ny>0){nx=-nx;ny=-ny;}}else{nx=ex/d;ny=ey/d;}
  b.x=qx+nx*m;b.y=qy+ny*m;
  var vn=b.vx*nx+b.vy*ny;
  if(vn<0){
    b.vx-=(1+s.e)*vn*nx;b.vy-=(1+s.e)*vn*ny;
    var tx=-ny,ty=nx,vt=b.vx*tx+b.vy*ty;b.vx-=vt*tx*0.0012;b.vy-=vt*ty*0.0012;
    return -vn;
  }

function buildColliders(){

function physics(dt){
  var n=Math.min(8,Math.max(1,Math.ceil(dt/SUB))),h=dt/n,i,j,b,s,k;
  for(var st=0;st<n;st++){
    for(i=0;i<balls.length;i++){b=balls[i];if(b.st!==0)continue;b.vy+=GRAV*h;b.x+=b.vx*h;b.y+=b.vy*h;}
    for(i=0;i<balls.length;i++){
      b=balls[i];if(b.st!==0)continue;
      for(k=0;k<SEG.length;k++){
        s=SEG[k];var imp=collideSeg(b,s);
        if(imp>0){
          if(imp>260&&s.tag)sKnock(imp);
          if(s.tag==='bridge')b.onBridge=true;
        }
      }
      for(k=0;k<CIR.length;k++){
        var c=CIR[k],ex=b.x-c.x,ey=b.y-c.y,d2=ex*ex+ey*ey,m=BR+c.r;
        if(d2<m*m){
          var d=Math.sqrt(d2)||1e-4,nx=ex/d,ny=ey/d;
          b.x=c.x+nx*m;b.y=c.y+ny*m;
          var vn=b.vx*nx+b.vy*ny;
          if(vn<0){
            b.vx-=(1+c.e)*vn*nx;b.vy-=(1+c.e)*vn*ny;
            b.vx+=(Math.random()-0.5)*12;
            if(-vn>60)bellHit(c.b,-vn,b);
          }
        }
      }
    }
    for(i=0;i<balls.length;i++){
      var a=balls[i];if(a.st!==0)continue;
      for(j=i+1;j<balls.length;j++){
        var c2=balls[j];if(c2.st!==0)continue;
        var dx=c2.x-a.x,dy=c2.y-a.y,dd=dx*dx+dy*dy,mm=4*BR*BR;
        if(dd<mm&&dd>1e-6){
          var dl=Math.sqrt(dd),nx2=dx/dl,ny2=dy/dl,ov=(2*BR-dl)*0.5;
          a.x-=nx2*ov;a.y-=ny2*ov;c2.x+=nx2*ov;c2.y+=ny2*ov;
          var rv=(c2.vx-a.vx)*nx2+(c2.vy-a.vy)*ny2;
          if(rv<0){var im=-(1.2)*rv/2;a.vx-=im*nx2;a.vy-=im*ny2;c2.vx+=im*nx2;c2.vy+=im*ny2;}
        }
      }
    }
  }
  for(i=0;i<balls.length;i++){
    b=balls[i];if(b.st!==0)continue;
    var sp=Math.hypot(b.vx,b.vy);if(sp>820){b.vx*=820/sp;b.vy*=820/sp;sp=820;}
    b.ang+=b.vx*dt/BR;
    // 詰まり・画面外の保険

  }
}

function toWorld(e){return {x:e.clientX/L.s,y:e.clientY/L.s};}
function gateWin(){return part.outlet.q<0.6?0.45:1.3;}
function detachPtr(){if(ptr.crack===cr.outlet){gate.held=false;gate.until=now+gateWin();}ptr.crack=null;}
function findCrack(x,y){
  var best=null,bd=tolW(),list=[cr.slide,cr.gear,cr.ring,cr.outlet,cr.bridge,cr.slope];
  for(var i=0;i<list.length;i++){var c=list[i];if(!isAvail(c))continue;var n=nearestCell(c,x,y);
    var d=n.d+(c.cnt>=c.N?18:0);if(d<bd){bd=d;best=c;}}
  return best;
}
function attach(c,x,y){
  ptr.crack=c;
  if(c===cr.outlet){gate.held=true;}
  scratchAlong(c,x,y,x,y);
}
function onDown(e){
  if(e.cancelable)e.preventDefault();
  aInit();lastInput=now;demo.active=false;tapT=performance.now();
  if(ptr.id!==null)return;               // 二本目以降の指は無視
  ptr.id=e.pointerId;try{cvs.setPointerCapture(e.pointerId);}catch(_){}
  var p=toWorld(e);ptr.x=ptr.lx=p.x;ptr.y=ptr.ly=p.y;ptr.down=true;ptr.press=1;ptr.vx=ptr.vy=0;
  if(phase==='open'){var kp=keyPos();if(Math.hypot(p.x-kp.x,p.y-kp.y-20)<80){startClose();return;}}
  if(phase==='closed'||phase==='open'){
    var c=findCrack(p.x,p.y);
    if(c){attach(c,p.x,p.y);return;}
    // 出口の帯を触った（すでに削ってあれば開く）
    if(tray.st==='rest'&&cr.outlet.cnt>0&&Math.abs(p.x-L.xc)<L.TW/2+20&&Math.abs(p.y-(L.trayBot+18))<44){gate.until=now+gateWin();wob.tray=1;return;}
  }
  // 対象外：小さく揺れるだけ
  var b;
  for(var k in bells){b=bells[k];if(Math.hypot(p.x-b.x,p.y-b.y)<b.r+26&&!(k==='W'&&openAmt<0.5)){b.sv+=1.2;sWobble();return;}}
  if(Math.hypot(p.x-L.cx,p.y-L.cy)<L.R&&openAmt<0.5){wob.safe=1;sWobble();return;}
  if(p.x>L.xL-10&&p.x<L.xR+10&&p.y>L.trayTop-10&&p.y<L.trayBot+40){wob.tray=1;sWobble();return;}
  if(Math.abs(p.x-L.lx)<44&&p.y>L.y0-40&&p.y<L.liftBot+30){wob.lift=1;sWobble();return;}
}
function onMove(e){
  if(e.pointerId!==ptr.id)return;
  if(e.cancelable)e.preventDefault();
  lastInput=now;
  var p=toWorld(e);
  ptr.vx=lerp(ptr.vx,p.x-ptr.x,0.5);ptr.vy=lerp(ptr.vy,p.y-ptr.y,0.5);
  ptr.lx=ptr.x;ptr.ly=ptr.y;ptr.x=p.x;ptr.y=p.y;
  if(phase!=='closed'&&phase!=='open'){ptr.crack=null;return;}
  if(ptr.crack&&!isAvail(ptr.crack))ptr.crack=null;
  if(ptr.crack){
    var n=nearestCell(ptr.crack,p.x,p.y),alt=findCrack(p.x,p.y);
    // 指が別のヒビの上へ移ったら、そちらを削る
    if(alt&&alt!==ptr.crack&&nearestCell(alt,p.x,p.y).d+14<n.d){detachPtr();attach(alt,p.x,p.y);}
    else if(n.d<=tolW()*1.6){scratchAlong(ptr.crack,ptr.lx,ptr.ly,p.x,p.y);}
    else{detachPtr();}
  }
  if(!ptr.crack){var c=findCrack(p.x,p.y);if(c)attach(c,p.x,p.y);}
}
function onUp(e){
  if(e.type==='pointerup')aInit();
  if(e.pointerId!==ptr.id)return;
  if(ptr.crack){var pt=part[ptr.crack.id];if(pt)pt.v+=1.6;}
  detachPtr();
  ptr.id=null;ptr.down=false;
  try{cvs.releasePointerCapture(e.pointerId);}catch(_){}
}
cvs.addEventListener('pointerdown',onDown,{passive:false});
cvs.addEventListener('pointermove',onMove,{passive:false});
cvs.addEventListener('pointerup',onUp,{passive:false});
cvs.addEventListener('pointercancel',onUp,{passive:false});

function buildBg(){

  var g=c.getContext('2d');g.setTransform(dpr*L.s,0,0,dpr*L.s,0,0);

  g.fillStyle=gr;g.fillRect(0,0,L.W,L.H);

  for(var x=40;x<L.W;x+=70){g.beginPath();g.moveTo(x,0);g.lineTo(x,L.fY(x)-6);g.stroke();}
  // 床
  g.beginPath();g.moveTo(-10,L.fY(-10));g.lineTo(L.poolL,L.floorR);g.lineTo(L.poolL,L.H);g.lineTo(-10,L.H);g.closePath();g.fillStyle=FILM2;g.fill();
  g.save();g.clip();g.globalAlpha=0.18;g.fillStyle=bandPat;
  for(var x2=-20;x2<L.poolL;x2+=58){g.beginPath();g.moveTo(x2,L.fY(x2)+10);g.lineTo(x2+28,L.fY(x2+28)+10);g.lineTo(x2+8,L.H);g.lineTo(x2-20,L.H);g.closePath();g.fill();}
  g.restore();
  // 隅の放射刻線
  g.strokeStyle='rgba(255,212,90,0.12)';g.lineWidth=px(1.4);
  var cs2=[[0,0],[L.W,0]];
  for(var k=0;k<cs2.length;k++){for(var a=0;a<10;a++){var an=(k?Math.PI*0.5:0)+a/9*Math.PI*0.5;g.beginPath();g.moveTo(cs2[k][0]+Math.cos(an)*30,cs2[k][1]+Math.sin(an)*30);g.lineTo(cs2[k][0]+Math.cos(an)*95,cs2[k][1]+Math.sin(an)*95);g.stroke();}}
  bgCanvas=c;

function lineSeg(ax,ay,bx,by){ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();}
function drawBoard(ax,ay,bx,by,th,gold){
  ctx.lineCap='round';
  ctx.strokeStyle=SILVER;ctx.lineWidth=th+px(3);lineSeg(ax,ay,bx,by);
  ctx.strokeStyle=bandPat;ctx.lineWidth=th;lineSeg(ax,ay,bx,by);
  if(gold!==false){var dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy)||1,nx=dy/l*-th*0.22,ny=-dx/l*-th*0.22;
    ctx.strokeStyle='rgba(255,220,110,0.95)';ctx.lineWidth=px(1.6);lineSeg(ax-nx,ay-ny,bx-nx,by-ny);}
}
function drawCrack(c,alpha,hi){
  var f=frameOf(c),cs=c.cells,lw=px(1);
  for(var pi=0;pi<c.paths.length;pi++){
    var P=c.paths[pi],len=P.e-P.s;if(len<2)continue;
    // 起点（閉じたヒビは未削りの所から）
    var st=P.s;if(P.closed){for(var q=P.s;q<P.e;q++)if(cs[q].sc<0.02){st=q;break;}}
    var idx=[];for(var k=0;k<len;k++){idx.push(P.closed?P.s+((st-P.s+k)%len):P.s+k);}
    if(P.closed)idx.push(idx[0]);
    // 細いヒビ
    ctx.beginPath();var pen=false;
    for(k=0;k<idx.length;k++){var cl=cs[idx[k]];var x=f.ox+cl.u*f.s+cl.nx*cl.j,y=f.oy+cl.v*f.s+cl.ny*cl.j;
      if(cl.sc<0.5){if(!pen){ctx.moveTo(x,y);pen=true;}else ctx.lineTo(x,y);}else pen=false;}
    ctx.lineCap='round';ctx.lineJoin='round';
    if(hi){ctx.strokeStyle='rgba(255,226,140,'+(0.45+0.4*Math.sin(now*6))+')';ctx.lineWidth=lw*7;ctx.stroke();}
    ctx.strokeStyle='rgba(214,220,234,'+alpha+')';ctx.lineWidth=lw*(hi?2.4:1.7);ctx.stroke();
    if(hi){ctx.setLineDash([px(6),px(12)]);ctx.lineDashOffset=-now*px(40);ctx.strokeStyle='rgba(255,250,220,0.95)';ctx.lineWidth=lw*3;ctx.stroke();ctx.setLineDash([]);}
    // 削った所（色帯の露出面）
    var run=[];
    for(k=0;k<=idx.length;k++){
      var c2=k<idx.length?cs[idx[k]]:null;
      if(c2&&c2.sc>0.02){run.push(c2);continue;}
      if(run.length){drawRun(run,f,lw);run=[];}
    }
  }
}
function drawRun(run,f,lw){
  var i,n=run.length,c,L2=[],R2=[];
  var ws=1/L.s;
  for(i=0;i<n;i++){c=run[i];var x=f.ox+c.u*f.s,y=f.oy+c.v*f.s,w=c.w*ws*c.sc*(n===1?0.8:1);
    L2.push(x+c.nx*w,y+c.ny*w);R2.push(x-c.nx*w*0.85,y-c.ny*w*0.85);}
  if(n===1){var c0=run[0],cx0=f.ox+c0.u*f.s,cy0=f.oy+c0.v*f.s;ctx.beginPath();ctx.arc(cx0,cy0,c0.w*ws*c0.sc,0,TAU);ctx.fillStyle=bandPat;ctx.fill();ctx.strokeStyle=SILVER;ctx.lineWidth=lw*1.3;ctx.stroke();return;}
  ctx.beginPath();ctx.moveTo(L2[0],L2[1]);
  for(i=1;i<n;i++)ctx.lineTo(L2[i*2],L2[i*2+1]);
  for(i=n-1;i>=0;i--)ctx.lineTo(R2[i*2],R2[i*2+1]);
  ctx.closePath();ctx.fillStyle=bandPat;ctx.fill();
  ctx.strokeStyle=SILVER;ctx.lineWidth=lw*1.4;ctx.stroke();
  ctx.beginPath();for(i=0;i<n;i++){c=run[i];var gx=f.ox+c.u*f.s+c.nx*c.w*ws*0.1,gy=f.oy+c.v*f.s+c.ny*c.w*ws*0.1;if(i)ctx.lineTo(gx,gy);else ctx.moveTo(gx,gy);}
  ctx.strokeStyle=GOLD;ctx.lineWidth=lw*2.4;ctx.stroke();
  // 刻線（削りの勢い）
  ctx.strokeStyle='rgba(255,236,170,0.55)';ctx.lineWidth=lw*1;
  for(i=1;i<n-1;i+=3){c=run[i];var hx=f.ox+c.u*f.s,hy=f.oy+c.v*f.s,w2=c.w*ws*c.sc;lineSeg(hx+c.nx*w2*0.4,hy+c.ny*w2*0.4,hx+c.nx*w2*0.9+c.ny*3,hy+c.ny*w2*0.9-c.nx*3);}
}
function drawBall(b){
  var r=BR;
  ctx.beginPath();ctx.arc(b.x,b.y,r,0,TAU);ctx.fillStyle=b.col;ctx.fill();
  ctx.strokeStyle=SILVER;ctx.lineWidth=px(1.6);ctx.stroke();
  ctx.beginPath();ctx.arc(b.x,b.y,r*0.62,b.ang,b.ang+2.2);ctx.strokeStyle='rgba(25,24,29,0.75)';ctx.lineWidth=px(3);ctx.stroke();
  ctx.beginPath();ctx.arc(b.x,b.y,r*0.62,b.ang+Math.PI,b.ang+Math.PI+1.4);ctx.strokeStyle=GOLD;ctx.lineWidth=px(2.2);ctx.stroke();
  ctx.beginPath();ctx.arc(b.x-r*0.35,b.y-r*0.38,r*0.2,0,TAU);ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fill();

function bellPath(r){
  ctx.beginPath();ctx.moveTo(-0.28*r,0.1*r);
  ctx.bezierCurveTo(-0.85*r,0.1*r,-0.8*r,1.0*r,-1.08*r,1.9*r);
  ctx.lineTo(1.08*r,1.9*r);
  ctx.bezierCurveTo(0.8*r,1.0*r,0.85*r,0.1*r,0.28*r,0.1*r);ctx.closePath();
}
function drawBell(b,hangTo){
  var r=b.r,top=b.y-1.25*r;
  ctx.strokeStyle='rgba(223,228,238,0.7)';ctx.lineWidth=px(2);lineSeg(b.x,hangTo,b.x,top);
  ctx.save();ctx.translate(b.x,top);ctx.rotate(b.sw);
  if(b.flash>0){ctx.beginPath();ctx.arc(0,1.1*r,r*(1.5+b.flash*0.6),0,TAU);ctx.fillStyle='rgba(255,212,90,'+(0.35*b.flash)+')';ctx.fill();}
  bellPath(r);ctx.fillStyle=bandPat;ctx.fill();ctx.strokeStyle=SILVER;ctx.lineWidth=px(2.2);ctx.stroke();
  ctx.strokeStyle=GOLD;ctx.lineWidth=px(1.8);ctx.beginPath();ctx.moveTo(-0.7*r,1.25*r);ctx.quadraticCurveTo(0,1.05*r,0.7*r,1.25*r);ctx.stroke();
  ctx.beginPath();ctx.arc(0,2.0*r,0.22*r,0,TAU);ctx.fillStyle=GOLD;ctx.fill();
  ctx.beginPath();ctx.arc(0,0.02*r,0.2*r,0,TAU);ctx.fillStyle=SILVER;ctx.fill();

function drawGear(x,y,r,ang,teeth,alpha){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.globalAlpha=alpha==null?1:alpha;
  ctx.beginPath();
  for(var i=0;i<teeth;i++){var a0=i/teeth*TAU,a1=(i+0.5)/teeth*TAU,ro=r,ri=r*0.8,da=TAU/teeth*0.12;
    ctx.lineTo(Math.cos(a0-da)*ri,Math.sin(a0-da)*ri);ctx.lineTo(Math.cos(a0+da)*ro,Math.sin(a0+da)*ro);
    ctx.lineTo(Math.cos(a1-da)*ro,Math.sin(a1-da)*ro);ctx.lineTo(Math.cos(a1+da)*ri,Math.sin(a1+da)*ri);}
  ctx.closePath();ctx.fillStyle=bandPat;ctx.fill();ctx.strokeStyle=SILVER;ctx.lineWidth=px(2);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,r*0.5,0,TAU);ctx.fillStyle=FILM;ctx.fill();ctx.strokeStyle=GOLD;ctx.lineWidth=px(2);ctx.stroke();
  for(var k=0;k<3;k++){var a=k/3*TAU;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*0.15,Math.sin(a)*r*0.15);ctx.lineTo(Math.cos(a)*r*0.48,Math.sin(a)*r*0.48);ctx.stroke();}
  ctx.beginPath();ctx.arc(0,0,r*0.13,0,TAU);ctx.fillStyle=SILVER;ctx.fill();
  ctx.restore();
}
function drawInterior(){
  var o=L,R=o.R,cx=o.cx,cy=o.cy;
  ctx.beginPath();ctx.arc(cx,cy,R*0.995,0,TAU);ctx.fillStyle='#0c0b10';ctx.fill();
  ctx.save();ctx.clip();ctx.globalAlpha=0.22+0.12*openAmt;ctx.fillStyle=bandPat;ctx.fillRect(cx-R,cy-R,2*R,2*R);ctx.globalAlpha=1;
  // 内側の刻線
  ctx.strokeStyle='rgba(255,212,90,0.25)';ctx.lineWidth=px(1.4);
  for(var a=0;a<24;a++){var an=a/24*TAU;lineSeg(cx+Math.cos(an)*R*0.2,cy+Math.sin(an)*R*0.2,cx+Math.cos(an)*R*0.95,cy+Math.sin(an)*R*0.95);}
  ctx.restore();
  for(var i=0;i<o.chute.length;i++){var c=o.chute[i];drawBoard(c[0].x,c[0].y,c[1].x,c[1].y,px(7)+6);}
  for(i=0;i<o.walls.length;i++){var w=o.walls[i];drawBoard(w[0].x,w[0].y,w[1].x,w[1].y,7,false);}
  for(i=0;i<o.inner.length;i++){var iw=o.inner[i];drawBoard(iw[0].x,iw[0].y,iw[1].x,iw[1].y,6,false);}
  drawBell(bells.W,cy-R*0.95);

  if(openAmt<1){
    var wc=o.win,wr=0.16*R;
    ctx.save();ctx.beginPath();ctx.arc(wc.x,wc.y,wr,0,TAU);ctx.clip();
    ctx.globalAlpha=1-openAmt;
    var pos=[[-0.55,-0.25],[0.0,0.45],[0.55,-0.2]];
    for(var k=0;k<3;k++){var ic=cyc.icons[k],ix=wc.x+pos[k][0]*wr,iy=wc.y+pos[k][1]*wr;
      if(ic===0)drawGear(ix,iy,wr*0.32,now*0.3,8);
      else if(ic===1){drawBoard(ix-wr*0.3,iy-wr*0.12,ix+wr*0.3,iy+wr*0.12,5);}
      else{ctx.save();ctx.translate(ix,iy-wr*0.2);bellPath(wr*0.2);ctx.fillStyle=bandPat;ctx.fill();ctx.strokeStyle=SILVER;ctx.lineWidth=px(1.4);ctx.stroke();ctx.restore();}}
    ctx.globalAlpha=1;ctx.restore();
  }

}
function blobPath(pts,f){ctx.beginPath();for(var i=0;i<pts.length;i++){var p=pts[i],q=pts[(i+1)%pts.length];var x=f.ox+p[0]*f.s,y=f.oy+p[1]*f.s,mx=f.ox+(p[0]+q[0])/2*f.s,my=f.oy+(p[1]+q[1])/2*f.s;if(!i)ctx.moveTo(mx,my);else ctx.quadraticCurveTo(x,y,mx,my);}var p0=pts[0],p1=pts[1];ctx.quadraticCurveTo(f.ox+p0[0]*f.s,f.oy+p0[1]*f.s,f.ox+(p0[0]+p1[0])/2*f.s,f.oy+(p0[1]+p1[1])/2*f.s);ctx.closePath();}
function capsule(q,rev){

    else if(b.st===0&&Math.hypot(b.x-old.E2.x,b.y-old.E2.y)<40)k='door';cls.push(k);}}
  if(phase==='opening'){tray.st='rest';tray.dx=tray.dy=tray.rot=0;phase='open';openAmt=1;for(var q=0;q<balls.length;q++)if(balls[q].st===2){balls[q].st=0;cls[q]='pool';}}
  if(phase==='closing'){for(var q2=0;q2<balls.length;q2++){cls[q2]='pool';balls[q2].st=0;}cls[0]='door';finishClose();}
  else{tray.st='rest';tray.dx=tray.dy=tray.rot=0;}
  // 解放状態を保つ（ヒビの削り具合はセル単位なので再計算不要）
  var keep={};for(var kk in cr)keep[kk]=cr[kk];
  L=computeLayout();resizeCanvas();setupBells();
  if(old){
    var rebuildBridge=true;
    // 橋と坂のヒビは座標系がレイアウト依存なので作り直して削り率を移す
    var saved={};['bridge','slope'].forEach(function(id){saved[id]=keep[id]?keep[id].p:0;});
    var seed=cyc.seed;var tmp={};for(var k2 in cr)tmp[k2]=cr[k2];
    genCracks(seed);
    for(var k3 in tmp){if(k3==='bridge'||k3==='slope')continue;cr[k3]=tmp[k3];}
    ['bridge','slope'].forEach(function(id){var c=cr[id],n=Math.round(saved[id]*c.N);for(var j=0;j<n;j++){c.cells[j].t=1;c.cells[j].sc=1;}c.cnt=n;c.p=n/c.N;});
    var sp=homeSpots(NBALL),si=0,ti=0;
    for(var m=0;m<balls.length;m++){var bb=balls[m];if(cls[m]==='lift')continue;bb.vx=bb.vy=0;bb.still=0;
      if(cls[m]==='tray'){bb.x=L.xL+BR+4+(ti%4)*(2*BR+4);bb.y=L.trayBot-20-BR-Math.floor(ti/4)*2*BR;ti++;}
      else if(cls[m]==='door'){bb.x=L.E2.x;bb.y=L.E2.y;}
      else{var s2=sp[si++]||sp[0];bb.x=s2.x;bb.y=s2.y-Math.floor(si/NBALL)*40;}}
  }
}
var rzT=0;
function onResize(){clearTimeout(rzT);rzT=setTimeout(function(){try{relayout();}catch(e){console.warn(e);}},80);}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);
function setHidden(h){
  if(h===hidden)return;hidden=h;
  if(h){running=false;cancelAnimationFrame(raf);ptr.id=null;detachPtr();try{if(AC&&AC.suspend)AC.suspend();}catch(e){}}
  else{running=true;lastTs=0;try{if(AC&&AC.resume){var p=AC.resume();if(p&&p.catch)p.catch(function(){});}}catch(e){}raf=requestAnimationFrame(frame);}
}
document.addEventListener('visibilitychange',function(){setHidden(document.visibilityState==='hidden');});
window.addEventListener('pagehide',function(){setHidden(true);});
window.addEventListener('pageshow',function(){setHidden(document.visibilityState==='hidden');});

// ---------- 開始 ----------
cyc.seed=(Math.random()*1e9)|0;
(function(){var r=rngMake(cyc.seed);cyc.nOff=(r()-0.5)*26;cyc.b1Off=(r()-0.5)*30;cyc.b2Off=(r()-0.5)*40;pickPitches(r);})();
L=computeLayout();resizeCanvas();setupBells();genCracks(cyc.seed);resetCycleFlags();resetBalls();
raf=requestAnimationFrame(frame);

// 自動テスト用の読み取り口（画面には何も出さない）
window.__kinko={
  info:function(){return {phase:phase,cycle:cyc.n,slide:cr.slide.p,gear:cr.gear.p,ring:cr.ring.p,outlet:cr.outlet.p,bridge:cr.bridge.p,slope:cr.slope.p,
    tray:trayCount(),liftSpeed:lift.speed,stalled:lift.stalled,gate:gate.open,ringAvail:flags.ringAvail,flags:JSON.parse(JSON.stringify(flags)),
    balls:balls.map(function(b){return [Math.round(b.x),Math.round(b.y),b.st];}),L:{W:L.W,H:L.H,s:L.s,cx:L.cx,cy:L.cy,R:L.R,xc:L.xc,trayTop:L.trayTop,trayBot:L.trayBot,N:L.N,B1:L.B1,B2:L.B2,Bs:L.Bs,Be:L.Be,S0:L.S0,Lmin:L.Lmin,Lmax:L.Lmax,th:L.th,E2:L.E2,lx:L.lx,y0:L.y0,Ss:L.Ss,Se:L.Se}};},
  cells:function(id){var c=cr[id],f=frameOf(c),o=[];for(var i=0;i<c.N;i++){var w=cellW(c,f,i);o.push([w.x*L.s,w.y*L.s,c.cells[i].t]);}return o;},
  target:function(){return guide.tgt?(guide.tgt.key?'key':guide.tgt.c.id):null;},
  keyScreen:function(){var k=keyPos();return [k.x*L.s,(k.y+20)*L.s];},
  demo:function(){return demo.active;},
  perf:function(){var a=perf.slice().sort(function(x,y){return x-y;});return {n:perfN,avg:a.reduce(function(x,y){return x+y;},0)/Math.max(1,a.length),p95:a[Math.floor(a.length*0.95)]||0,parts:parts.length,bursts:bursts.length,dpr:dpr,w:cvs.width,h:cvs.height};},
  audio:function(){return AC?AC.state:'none';},
  tapLatency:function(){return tapLat;},
  hits:function(){return JSON.parse(JSON.stringify(hits));},
  where:function(){var o={pool:0,lift:0,rail:0,inside:0,tray:0,other:0};for(var i=0;i<balls.length;i++){var b=balls[i];
    if(b.st===1)o.lift++;else if(inTrayB(b))o.tray++;else if(insideSafe(b))o.inside++;else if(b.y<L.y0+3*BR&&b.x>L.slot.x-40)o.rail++;else if(b.x>L.poolL-12*BR&&b.y>L.fY(b.x)-3.2*BR)o.pool++;else o.other++;}return o;},
  t:function(){return now;}
};
})();
