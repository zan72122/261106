<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
// ====================================================================
//  helpers / palette (LCD: black-green glass, yellow-green, amber, dark grey)
// ====================================================================
const PI=Math.PI, TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const rnd=(a,b)=>a+Math.random()*(b-a);
const COL={
  body:'#262b26', bodyHi:'#353b34', bodyLo:'#161a16',
  glass:'#0c1711', glass2:'#13241a',
  green:'#b9e24e', amber:'#f2b53a', grey:'#3b443b',
  ghost:'rgba(160,210,110,0.075)', shadow:'rgba(0,0,0,0.5)',
  padLime:'#d7ec82', padAmber:'#f5c95a', padPale:'#d3ddc6', ink:'#1b211b'
};
const cv=document.getElementById('c');
const cx=cv.getContext('2d');
const saEl=document.getElementById('sa');

// LCD logical size
const LW=400, LH=260;
const FLOOR=200, LAND=120, STH=28;
const TYPES=['b','s','p']; // b: coat->bridge, s: skirt->stairs, p: pants->stools

// ====================================================================
//  layout
// ====================================================================
let W=1,H=1,DPR=1;
const Lo={lx:0,ly:0,lw:400,lh:260,k:1,px:0,py:0,pw:100,ph:100,bw:80,bh:100,portrait:true};
function layout(){
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  const cs=getComputedStyle(saEl);
  const st=parseFloat(cs.paddingTop)||0, sr=parseFloat(cs.paddingRight)||0,
        sb=parseFloat(cs.paddingBottom)||0, sl=parseFloat(cs.paddingLeft)||0;
  const ax=sl, ay=st, aw=W-sl-sr, ah=H-st-sb;
  const m=clamp(Math.min(aw,ah)*0.03,8,24);
  const portrait=ah>aw*1.05;
  let lw,lh;
  if(portrait){
    lw=aw-2*m; lh=lw*LH/LW;
    if(lh>ah*0.52){lh=ah*0.52; lw=lh*LW/LH;}
  }else{
    lh=Math.min(ah*0.64,(aw-2*m)*LH/LW); lw=lh*LW/LH;
  }
  Lo.portrait=portrait;
  Lo.lw=lw; Lo.lh=lh; Lo.k=lw/LW;
  Lo.lx=ax+(aw-lw)/2; Lo.ly=ay+m+(portrait?Math.min(ah*0.03,30):0);
  Lo.px=ax+m; Lo.pw=aw-2*m; Lo.py=Lo.ly+lh+m*1.4; Lo.ph=ay+ah-m-Lo.py;
  const slotW=Lo.pw/3;
  let bh=Math.min(Lo.ph*0.8, slotW*1.5);
  let bw=Math.min(slotW*0.84, bh*0.92);
  bh=Math.min(bh,bw*1.45);
  Lo.bw=bw; Lo.bh=bh;
  if(portrait){
    // keep the composition together and centred instead of a huge empty tray
    const need=Math.min(Lo.ph,bh*1.4+2*m);
    const spare=Lo.ph-need;
    Lo.ph=need;
    const off=spare*0.45;
    Lo.ly+=off; Lo.py+=off;
  }
  if(drag) cancelDrag();
}

// ====================================================================
//  audio (Web Audio synthesis, created on first touch)
// ====================================================================
let AC=null, master=null, noiseBuf=null, audioWanted=false;
function audioInit(){
  audioWanted=true;
  try{
    if(!AC){
      const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      AC=new C(); master=AC.createGain(); master.gain.value=0.55; master.connect(AC.destination);
      const n=Math.floor(AC.sampleRate*0.5); noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
      const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended' && !document.hidden) AC.resume().catch(()=>{});
    if(!AC.__unlocked){ AC.__unlocked=true; const s=AC.createBufferSource(); s.buffer=AC.createBuffer(1,1,22050); s.connect(AC.destination); s.start(0); }
  }catch(e){}
}
function tone(f,dur,type,vol,delay,slide){
  if(!AC||AC.state!=='running') return;
  try{
    const t=AC.currentTime+(delay||0);
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function noise(dur,vol,delay,freq,q){
  if(!AC||AC.state!=='running'||!noiseBuf) return;
  try{
    const t=AC.currentTime+(delay||0);
    const s=AC.createBufferSource(); s.buffer=noiseBuf;
    const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||1200; f.Q.value=q||1.2;
    const g=AC.createGain(); g.gain.setValueAtTime(vol||0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+0.02);
  }catch(e){}
}
const SFX={
  press(){ tone(180,0.07,'triangle',0.22,0,0.6); noise(0.03,0.12,0,2600,2); },
  click(f){ tone(f,0.025,'square',0.07); },
  patan(){ noise(0.06,0.35,0,700,0.8); tone(110,0.09,'triangle',0.3,0,0.5); noise(0.05,0.28,0.09,500,0.8); tone(90,0.1,'triangle',0.25,0.09,0.5); },
  step(f){ tone(f||900,0.018,'square',0.035); },
  jump(h){ tone(330+h*8,0.12,'triangle',0.12,0,1.9); },
  land(){ noise(0.04,0.12,0,400,1); },
  success(type){ const b={b:523,s:659,p:784}[type]||600; tone(b,0.07,'square',0.08,0); tone(b*1.5,0.07,'square',0.08,0.07); tone(b*2,0.12,'square',0.08,0.14); },
  fanfare(order){ const map={b:523,s:659,p:784}; let d=0; for(const o of order){ tone(map[o],0.11,'square',0.09,d); d+=0.12; } tone(1047,0.22,'square',0.09,d); tone(1319,0.3,'square',0.07,d+0.12); tone(1568,0.45,'square',0.07,d+0.24); },
  flip(){ for(let i=0;i<8;i++) tone(400+i*90,0.03,'square',0.06,i*0.05); noise(0.35,0.08,0,1800,0.7); },
  fold(){ for(let i=0;i<7;i++) tone(1100-i*110,0.03,'square',0.06,i*0.06); },
  lamp(){ tone(1568,0.25,'sine',0.12); tone(2093,0.35,'sine',0.08,0.06); },
  give(){ tone(880,0.06,'square',0.08); tone(1175,0.1,'square',0.08,0.07); },
  cancel(){ tone(300,0.12,'triangle',0.12,0,1.6); },
  hat(){ tone(700,0.08,'triangle',0.12,0,1.5); tone(1050,0.12,'triangle',0.1,0.08,1.3); },
  note(f){ tone(f,0.14,'triangle',0.11); }
};

// ====================================================================
//  persistence (album) - optional, fully guarded
// ====================================================================
const SKEY='gf261106-18-album';
let album=[];
function validEntry(e){
  if(!e||typeof e!=='object') return false;
  if(typeof e.o!=='string'||e.o.length!==3) return false;
  const s=e.o.split('').sort().join(''); if(s!=='bps') return false;
  if(e.h!==0&&e.h!==1) return false;
  return true;
}
function loadAlbum(){
  try{
    const raw=window.localStorage.getItem(SKEY); if(!raw) return [];
    const a=JSON.parse(raw); if(!Array.isArray(a)) return [];
    return a.filter(validEntry).slice(-6).map(e=>({o:e.o,h:e.h}));
  }catch(e){ return []; }
}
function saveAlbum(){ try{ window.localStorage.setItem(SKEY,JSON.stringify(album)); }catch(e){} }
album=loadAlbum();

// ====================================================================
//  stage state
// ====================================================================
const S={};
const history={orders:{}, starts:[]};
const visits={};
let padOrder=['b','s','p'];
const padPos={b:0,s:1,p:2};
const padAnim={b:{press:0,raise:0,cx:0,wob:0},s:{press:0,raise:0,cx:0,wob:0},p:{press:0,raise:0,cx:0,wob:0}};
let stageCount=0, undressCount=0, hatSince=0;
// restored album steers the suggested order toward ones not yet made
for(const e of album) history.orders[e.o]=(history.orders[e.o]||0)+1;
if(Object.keys(history.orders).length>=6) history.orders={};
function resetStage(first){
  S.has={b:false,s:false,p:false};
  S.prog={b:0,s:0,p:0};
  S.order=[];
  S.lamp=0; S.lampFlick=0;
  S.stoolL='floor'; S.stoolR='floor';
  S.stoolLp={x:48,y:FLOOR}; S.stoolRp={x:340,y:FLOOR};
  S.home=first?336:Math.round(rnd(304,352));
  S.stoolRx=S.home<330?S.home+30:S.home-34;
  S.stoolRp.x=S.stoolRx;
  S.connected=false; S.flip=null; S.flipped=false; S.box=null; S.plankOut=null;
  S.seams=[]; S.hems=[]; S.duet=null; S.big=false; S.bigT=-1; S.memo=false; S.memoT=-1; S.memoNew=-1;
  S.hat=false; S.posing=0; S.lightPat=0; S.call=0;
  if(!first){
    // shuffle pad order (positions animate)
    const a=TYPES.slice(); for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t;}
    padOrder=a;
  }
  padOrder.forEach((t,i)=>padPos[t]=i);
}
resetStage(true);
S.next='b'; S.fold=null; S.rise=null; S.pendingWear=null;

function triedPrefix(prefix){ // permutations not yet completed which start with prefix
  const perms=['bsp','bps','sbp','spb','pbs','psb'].filter(p=>p.startsWith(prefix));
  return perms.filter(p=>!history.orders[p]);
}
function suggestStart(){
  let c=TYPES.filter(t=>triedPrefix(t).length>0); if(!c.length) c=TYPES.slice();
  const last=history.starts[history.starts.length-1]; const c2=c.filter(t=>t!==last); if(c2.length) c=c2;
  return c[Math.floor(Math.random()*c.length)];
}
function suggestNext(){
  const pre=S.order.join('');
  const rem=TYPES.filter(t=>!S.has[t]);
  if(!rem.length) return null;
  let cand=rem.filter(t=>triedPrefix(pre+t).length>0);
  if(!cand.length) cand=rem;
  if(!pre && cand.length>1 && history.starts.length){ const last=history.starts[history.starts.length-1]; const c2=cand.filter(t=>t!==last); if(c2.length) cand=c2; }
  return cand[Math.floor(Math.random()*cand.length)];
}

// ====================================================================
//  navigation graph
// ====================================================================
function nodePos(id){
  switch(id){
    case 'RF': return [S.home,FLOOR];
    case 'RE': return [290,FLOOR];
    case 'BM': return [196,FLOOR];
    case 'LE': return [110,FLOOR];
    case 'SF': return [86,FLOOR];
    case 'LF': return [66,FLOOR];
    case 'S1': return [99,180];
    case 'S2': return [113,160];
    case 'S3': return [127,140];
    case 'S4': return [144,LAND];
    case 'LA': return [182,LAND];
    case 'LR': return [210,LAND];
    case 'LS': return S.stoolL==='land'?[226,LAND-STH]:[48,FLOOR-STH];
    case 'RS': return S.stoolR==='bridge'?[252,FLOOR-STH]:[S.stoolRx,FLOOR-STH];
  }
  return [66,FLOOR];
}
function edgeList(){
  const e=[['RF','RE'],['LE','SF'],['SF','LF']];
  if(S.has.b && S.prog.b>0.95) e.push(['RE','BM'],['BM','LE']);
  if(S.has.s && S.prog.s>0.95) e.push(['SF','S1'],['S1','S2'],['S2','S3'],['S3','S4'],['S4','LA'],['LA','LR']);
  if(S.has.p && S.prog.p>0.95){
    e.push(S.stoolL==='land'?['LA','LS']:['LF','LS']);
    e.push(S.stoolR==='bridge'?['BM','RS']:['RF','RS']);
  }
  return e;
}
const GIRL_NO={RF:1,RE:1,BM:1,RS:1};
const DRESS_NO={LS:1,LR:1};
function findPath(c,from,to){
  if(from===to) return [];
  const e=edgeList(), adj={};
  const no=c.kind==='g'?GIRL_NO:DRESS_NO;
  for(const [a,b] of e){ if(no[a]||no[b]) continue; (adj[a]=adj[a]||[]).push(b); (adj[b]=adj[b]||[]).push(a); }
  const prev={}; prev[from]=null; const q=[from];
  while(q.length){ const n=q.shift(); if(n===to) break; for(const m of (adj[n]||[])){ if(!(m in prev)){prev[m]=n;q.push(m);} } }
  if(!(to in prev)) return null;
  const p=[]; let n=to; while(n!==from){p.unshift(n); n=prev[n];}
  return p;
}
function edgeExists(a,b){ for(const [x,y] of edgeList()) if((x===a&&y===b)||(x===b&&y===a)) return true; return false; }
function reachable(c){
  const out=[]; const all=['RF','RE','BM','LE','SF','LF','S1','S2','S3','S4','LA','LR','LS','RS'];
  for(const n of all){ if(n===c.node) continue; const p=findPath(c,c.node,n); if(p) out.push(n); }
  return out;
}

// ====================================================================
//  characters
// ====================================================================
function mkChar(kind,node){
  const p=nodePos(node);
  return {kind,node,x:p[0],y:p[1],leg:null,path:[],q:[],act:null,face:kind==='g'?1:-1,ph:0,carry:null,
    sx:p[0],sy:p[1],after:[],idleT:1.2,expr:'smile',walkPh:0,lookX:0,lookY:0,pose:0};
}
const girl=mkChar('g','LF');
const dress=mkChar('d','RF');
girl.garment=null;

function startLeg(c,to,opts){
  const p=nodePos(to); opts=opts||{};
  const dx=p[0]-c.x, dy=p[1]-c.y, dist=Math.hypot(dx,dy);
  let jump=opts.jump, h=opts.h||0, dur;
  const stair=/^S\d$/.test(to)||/^S\d$/.test(c.node);
  if(jump===undefined) jump=(to==='LS'||to==='RS'||c.node==='LS'||c.node==='RS');
  if(jump){ dur=opts.dur||0.42; h=h||14; }
  else if(stair){ jump=true; h=5; dur=0.24; }
  else{
    let sp=c.kind==='g'?(girl.garment==='b'?66:52):76;
    if(S.big) sp*=1.25;
    dur=Math.max(0.12,dist/sp);
  }
  if(dx!==0) c.face=dx>0?1:-1;
  c.leg={x0:c.x,y0:c.y,x1:p[0],y1:p[1],t:0,dur,jump,h,to};
  if(jump) SFX.jump(h);
}
function hopTo(c,node,h){
  c.path=[]; c.q=[]; c.act=null;
  const p=nodePos(node);
  const d=Math.hypot(p[0]-c.x,p[1]-c.y);
  c.leg={x0:c.x,y0:c.y,x1:p[0],y1:p[1],t:0,dur:clamp(d/220,0.3,0.7),jump:true,h:h||Math.max(14,d*0.25),to:node};
  if(p[0]!==c.x) c.face=p[0]>c.x?1:-1;
  SFX.jump(10);
}
function goTo(c,node){ c.q.push({go:node}); }
function replaceQ(c,list){ c.q=list.slice(); c.path=[]; c.act=null; c.idleT=0.6; }
function visit(c,node){
  const k=node; visits[k]=(visits[k]||0)+1;
  const p=nodePos(node); lampPulse(p[0]);
}

function updChar(c,dt){
  c.ph+=dt;
  if(c.leg){
    const L=c.leg; L.t+=dt; const u=clamp(L.t/L.dur,0,1);
    c.x=lerp(L.x0,L.x1,u); c.y=lerp(L.y0,L.y1,u);
    if(L.jump) c.y-=Math.sin(u*PI)*L.h;
    else c.walkPh+=dt*(c.kind==='g'&&girl.garment==='b'?7:10);
    if(u>=1){
      c.node=L.to; c.x=L.x1; c.y=L.y1; c.leg=null; visit(c,c.node);
      if(L.jump) SFX.land(); else SFX.step(c.kind==='g'?1300:900);
    }
    return;
  }
  if(c.act){
    c.act.t+=dt;
    if(c.act.name==='jump'||c.act.name==='stomp'){ /* visual only */ }
    if(c.act.t>=c.act.dur){ const a=c.act; c.act=null; if(a.end) a.end(); }
    return;
  }
  if(c.path.length){
    const nx=c.path[0];
    if(!edgeExists(c.node,nx)){ c.path=[]; return; }
    c.path.shift(); startLeg(c,nx); return;
  }
  if(c.q.length){
    const a=c.q.shift();
    if(a.go){ const p=findPath(c,c.node,a.go); if(p) c.path=p; }
    else if(a.act){ c.act={name:a.act,t:0,dur:a.dur||0.5,end:a.end}; if(a.act==='jump') SFX.jump(8); }
    else if(a.wait){ c.act={name:'wait',t:0,dur:a.wait}; }
    else if(a.fn){ a.fn(); }
    return;
  }
  // idle
  c.idleT-=dt;
  if(c.idleT>0) return;
  if(S.big||S.fold) { c.idleT=0.5; return; }
  if(S.duet){ c.idleT=0.2; return; }
  if(c.kind==='g') girlIdle(c); else dressIdle(c);
}
function girlIdle(c){
  const g=girl.garment;
  if(g==='b'){
    // big strides on her side
    const opts=['LF','LE','SF'].filter(n=>n!==c.node);
    if(c.node==='LA'||/^S/.test(c.node)) opts.push('S4','LA');
    const t=opts[Math.floor(Math.random()*opts.length)];
    goTo(c,t); c.q.push({wait:rnd(0.6,1.2)}); c.idleT=0.2;
  }else if(g==='s'){
    c.q.push({act:'spin',dur:1.1},{wait:rnd(0.7,1.4)}); c.idleT=0.2;
  }else if(g==='p'){
    if(S.has.p && Math.random()<0.5 && findPath(c,c.node,'LS')){ goTo(c,'LS'); c.q.push({act:'jump',dur:0.45},{act:'jump',dur:0.45}); }
    else c.q.push({act:'jump',dur:0.45},{wait:rnd(0.5,1.2)});
    c.idleT=0.2;
  }else{
    c.q.push({act:'bob',dur:0.8}); c.idleT=rnd(1.2,2.2);
  }
}
function dressIdle(c){
  if(!S.order.length && !S.fold){
    if(c.node!=='RF'){ goTo(c,'RF'); c.idleT=0.3; return; }
    c.q.push({act:'wave',dur:1.4}); c.idleT=rnd(0.4,1.0); return;
  }
  const r=reachable(c).filter(n=>!/^S[123]$/.test(n));
  if(!r.length){ c.q.push({act:'wave',dur:1}); c.idleT=1; return; }
  r.sort((a,b)=>(visits[a]||0)-(visits[b]||0)+(Math.random()-0.5)*1.5);
  goTo(c,r[0]);
  c.q.push({act:r[0]==='RS'?'jump':'wave',dur:0.6},{wait:rnd(1.4,2.8)});
  c.idleT=0.2;
}

// ====================================================================
//  effects & particles
// ====================================================================
const parts=[]; const MAXP=48;
function shards(x,y,n,col){
  for(let i=0;i<n;i++){
    if(parts.length>=MAXP) parts.shift();
    const a=rnd(0,TAU), s=rnd(30,90);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,a:rnd(0,PI),va:rnd(-8,8),life:rnd(0.4,0.8),t:0,col:col||1,len:rnd(3,6)});
  }
}
const topLamps=new Array(12).fill(0); // pulse
function lampIndex(x){ return clamp(Math.floor((x-14)/31),0,11); }
function lampPulse(x){ topLamps[lampIndex(x)]=1; }
function lampLevel(i){
  // memory of visited places
  let v=0;
  for(const k in visits){ const p=nodePos(k); if(lampIndex(p[0])===i) v+=visits[k]; }
  return v>=14?3:v>=6?2:v>=2?1:0;
}

// ====================================================================
//  core actions: wear / build / connect / undress
// ====================================================================
let idleT=0, everInput=false, demo=null, demoDone=false, lureUndress=false;
function wear(type){
  if(S.fold){ S.pendingWear=type; return; }
  if(S.big && !S.memo){ forceMemo(); return; } // impatient tap: finish the pose into the album first

function hemPath(type){
  const gx=girl.x, gy=girl.y-4;
  if(type==='b') return [[[gx,gy],[gx+8,FLOOR],[116,FLOOR],[274,FLOOR]]];
  if(type==='s') return [[[gx,gy],[86,FLOOR],[92,180],[106,180],[106,160],[120,160],[120,140],[134,140],[134,LAND],[236,LAND]]];
  // pants: two stools
  const l=S.has.s?[226,LAND]:[48,FLOOR], r=S.has.b?[252,FLOOR]:[S.stoolRx,FLOOR];
  return [[[gx,gy],[l[0],l[1]-STH]],[[gx,gy],[gx,gy+2],[r[0],gy+2],[r[0],r[1]-STH]]];
}
function polyLen(p){ let s=0; for(let i=1;i<p.length;i++) s+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]); return s; }
function startHem(type){
  const paths=hemPath(type);

    const pts=paths[i]; const len=polyLen(pts);
    S.hems.push({type,pts,len,t:0,dur:clamp(len/260,0.45,1.0),lastSeg:-1,main:i===0,build:i===0});

}
function updHems(dt){
  for(let i=S.hems.length-1;i>=0;i--){
    const h=S.hems[i]; h.t+=dt;
    const u=clamp(h.t/h.dur,0,1);
    if(!h.flick){
      const seg=Math.floor(u*h.len/9);
      if(seg!==h.lastSeg){
        h.lastSeg=seg;
        // pitch: length and height
        const pt=pointAt(h.pts,u);
        const f=420+seg*38+(FLOOR-pt[1])*6;
        SFX.click(f);
      }
    }
    if(u>=1){
      S.hems.splice(i,1);
      if(h.build){ S.prog[h.type]=0.001; S.building=S.building||{}; S.building[h.type]=0; SFX.patan(); const e=h.pts[h.pts.length-1]; shards(e[0],e[1],6,2); }
    }
  }

  for(const t of TYPES){
    if(S.has[t] && S.prog[t]>0 && S.prog[t]<1){
      S.prog[t]=Math.min(1,S.prog[t]+dt/0.45);

}
function pointAt(pts,u){
  const L=polyLen(pts)*u; let s=0;
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    if(s+d>=L){ const v=d?(L-s)/d:0; return [lerp(pts[i-1][0],pts[i][0],v),lerp(pts[i-1][1],pts[i][1],v)]; }
    s+=d;
  }
  return pts[pts.length-1];
}
function partialPoly(pts,u){
  const L=polyLen(pts)*u; let s=0; const out=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
    if(s+d>=L){ const v=d?(L-s)/d:0; out.push([lerp(pts[i-1][0],pts[i][0],v),lerp(pts[i-1][1],pts[i][1],v)]); return out; }
    out.push(pts[i]); s+=d;
  }

}

function connectReact(type){

  }

    replaceQ(dress,[{go:'RS'},{act:'jump',dur:0.45},{act:'jump',dur:0.45}]);
  }

    addSeam(252,FLOOR);
    replaceQ(dress,[{go:'BM'},{act:'stomp',dur:0.5,end:()=>SFX.patan()},{go:'RS'}]);

function updDuet(dt){

function updFlip(dt){

  B.t+=dt;
  // phases: 0 wait(0.6) 1 fold into box(0.5) 2 travel to girl(1.1) 3 pop costume(0.4) 4 travel back(0.9) 5 unfold(0.4)
  const D=[0.6,0.5,1.1,0.45,0.9,0.4];
  while(B.phase<6 && B.t>=D[B.phase]){
    B.t-=D[B.phase]; B.phase++;

    if(B.phase===2){ B.tx=girl.x+(girl.x<100?18:-18); B.ty=girl.y; B.sx=B.x0; B.sy=B.y0; }
    if(B.phase===3){ SFX.give(); shards(B.x,B.y-10,6,2); deliver(B.type); maybeHat(0.45); }
    if(B.phase===4){ }
    if(B.phase===5){ SFX.patan(); }
    if(B.phase===6){ S.box=null; shards(B.x0,B.y0,4,2); return; }
  }

}

let drag=null, activeId=null;
function padRect(type){
  const i=padAnim[type].cx;
  const slotW=Lo.pw/3;
  const cxp=Lo.px+slotW*(i+0.5);
  const cyp=Lo.py+Lo.ph*0.5;
  return {x:cxp-Lo.bw/2,y:cyp-Lo.bh/2,w:Lo.bw,h:Lo.bh,cx:cxp,cy:cyp};
}
function toScreen(x,y){ return [Lo.lx+x*Lo.k, Lo.ly+y*Lo.k]; }

function hitPad(x,y){
  for(const t of TYPES){
    const r=padRect(t); const pad=Math.max(8,Lo.bw*0.06);
    if(x>=r.x-pad&&x<=r.x+r.w+pad&&y>=r.y-pad&&y<=r.y+r.h+pad) return t;
  }
  return null;
}
function hitGirl(x,y){
  const [gx,gy]=girlScreen(); const k=Lo.k;
  const rw=Math.max(32,18*k), rh=Math.max(40,30*k);
  return Math.abs(x-gx)<rw && Math.abs(y-gy)<rh;
}
function onDown(e){
  e.preventDefault();

  activeId=e.pointerId;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  everInput=true; idleT=0; if(demo){demo=null; demoDone=true;}
  const x=e.clientX, y=e.clientY;
  const t=hitPad(x,y);
  if(t){
    drag={kind:'wear',type:t,sx:x,sy:y,x,y,t0:performance.now(),moved:0,snap:0};
    padAnim[t].press=1; SFX.press();
    girl.lookAt=t;
    return;
  }
  if(girl.garment && !S.fold && hitGirl(x,y)){
    drag={kind:'undress',type:girl.garment,sx:x,sy:y,x,y,t0:performance.now(),moved:0,snap:0};
    SFX.press(); girl.expr='o';

}
function onMove(e){
  if(e.pointerId!==activeId||!drag) return;
  e.preventDefault();
  drag.x=e.clientX; drag.y=e.clientY;
  drag.moved=Math.max(drag.moved,Math.hypot(drag.x-drag.sx,drag.y-drag.sy));

}
function onUp(e){
  if(AC&&AC.state!=='running') audioInit();

  const d=drag; drag=null;

  if(d.kind==='wear'){
    padAnim[d.type].press=Math.min(padAnim[d.type].press,0.99);
    const dt=performance.now()-d.t0;
    const [gx,gy]=girlScreen();
    const near=Math.hypot(d.x-gx,d.y-gy)<Math.max(90,60*Lo.k);
    const tap=d.moved<14 && dt<900;

  }else{
    const [gx,gy]=girlScreen();
    const inPad=d.y>Lo.py-10;
    const [bx,by]=toScreen(20,190);
    const nearBox=Math.hypot(d.x-bx,d.y-by)<Math.max(60,40*Lo.k);

  }
}

function update(dt){
  idleT+=dt;
  for(const t of TYPES){
    const a=padAnim[t];
    const held=drag&&drag.kind==='wear'&&drag.type===t;
    a.press=held?1:Math.max(0,a.press-dt*5);
    a.raise=Math.max(0,a.raise-dt*0.9);
    a.wob=Math.max(0,a.wob-dt*2.5);
    a.cx=lerp(a.cx,padPos[t],1-Math.pow(0.001,dt));
  }
  if(drag&&drag.kind==='wear'){
    const [gx,gy]=girlScreen();
    const d=Math.hypot(drag.x-gx,drag.y-gy), R=Math.max(130,90*Lo.k);
    drag.snap=lerp(drag.snap,d<R?1:0,1-Math.pow(0.0001,dt));
  }
  updHems(dt);
  if(S.stoolLmove){ const m=S.stoolLmove; m.t+=dt/0.5; const u=ease(m.t); S.stoolLp={x:lerp(m.x0,m.x1,u),y:lerp(m.y0,m.y1,u)-Math.sin(u*PI)*30}; if(m.t>=1){S.stoolLp={x:m.x1,y:m.y1};S.stoolLmove=null;SFX.patan();} }
  if(S.stoolRmove){ const m=S.stoolRmove; m.t+=dt/0.5; const u=ease(m.t); S.stoolRp={x:lerp(m.x0,m.x1,u),y:lerp(m.y0,m.y1,u)-Math.sin(u*PI)*30}; if(m.t>=1){S.stoolRp={x:m.x1,y:m.y1};S.stoolRmove=null;SFX.patan();} }
  updFlip(dt);
  updDuet(dt);
  updBig(dt);
  updFold(dt);
  updChar(girl,dt); updChar(dress,dt);
  if(S.rise){ S.rise.t+=dt; if(S.rise.t>1.6) S.rise=null; }

let now=0;
function drawLCD(){
  const k=Lo.k;

  rrect(Lo.lx-bz,Lo.ly-bz,Lo.lw+bz*2,Lo.lh+bz*2,bz*1.2); cx.fillStyle=COL.bodyLo; cx.fill();

  gr.addColorStop(0,COL.glass2); gr.addColorStop(1,COL.glass);
  cx.fillStyle=gr; cx.fillRect(Lo.lx,Lo.ly,Lo.lw,Lo.lh);
  cx.save(); cx.beginPath(); cx.rect(Lo.lx,Lo.ly,Lo.lw,Lo.lh); cx.clip();
  cx.setTransform(DPR*k,0,0,DPR*k,DPR*Lo.lx,DPR*Lo.ly);
  cx.lineJoin='miter'; cx.lineCap='square';
  LWID=3.4;

  // --- top memory lamps (places the two have visited) ---

    const x=26+i*31, lv=lampLevel(i), pulse=topLamps[i]>0.3;
    const big=S.memo||S.big? (Math.floor(now*6+i*(1+S.lightPat%3))%3===0):false;
    const st=(pulse||big)?2:(lv>0?1:0);
    ln(st,x-4,8,x+4,8,2.6);
    for(let r=0;r<3;r++){ ln(r<lv||big?st:0,x-5+r*5,12,x-6+r*6,17,1.8); }
  }

  // --- static stage ---

  thickLine(1,270,392,FLOOR,14); ln(1,270,FLOOR,270,232,2.4);

  // costume box at left
  const lid=lureUndress?(0.5+0.5*Math.sin(now*6)):(drag&&drag.kind==='undress'?1:(S.fold?Math.min(1,S.fold.t*3):(S.rise?Math.max(0,1-S.rise.t):0)));

  for(let i=0;i<rays.length;i++){
    const r=rays[i];

    if(S.big||S.memo) on=(Math.floor(now*5+i*(S.lightPat+1))%2)?2:1;

function drawPartition(){
  const x=380, w=12, y1=128, y2=FLOOR;
  let sc=1, back=S.flipped;
  if(S.flip){ const u=S.flip.t/0.7; sc=Math.cos(u*PI); back=u>0.5; }
  const hw=w*Math.abs(sc);
  cx.save();
  const lit=back?2:1;
  sp(lit,[x-hw,y1,x+hw,y1,x+hw,y2,x-hw,y2],true,2.8);
  if(hw>3){
    if(!back){ for(let yy=y1+10;yy<y2-4;yy+=12) ln(1,x-hw+3,yy,x+hw-3,yy,1.6); }
    else{
      // back side: stage-light pattern (diamonds)
      for(let yy=y1+12;yy<y2-6;yy+=18){
        const on=(S.big||S.memo)?(Math.floor(now*6+yy)%2?2:1):2;
        sp(on,[x,yy-6,x+hw*0.6,yy,x,yy+6,x-hw*0.6,yy],true,1.8);
      }
    }
  }
  cx.restore();
}
function drawTravelBox(){
  const B=S.box;
  if(B.phase===0){ // plank glows before lifting
    if(Math.floor(now*10)%2) ln(2,B.x0-12,B.y0,B.x0+12,B.y0,3);
    return;
  }
  let f=1;
  if(B.phase===1) f=ease(B.t/0.5);
  if(B.phase===5) f=1-ease(B.t/0.4);
  // plank (f=0) -> box (f=1)
  cx.save(); cx.translate(B.x,B.y);
  const hgt=14*f;
  sp(2,[-12,-hgt,-12,0,12,0,12,-hgt],false,3);
  if(f>0.5) ln(2,-12,-hgt*0.5,12,-hgt*0.5,1.6);
  if(B.phase>=1&&B.phase<=2){ drawGlyph(B.type,0,-hgt-4,0.7,Math.floor(now*8)%2?2:1); }
  if(B.phase===3){ const u=ease(B.t/0.45); drawGlyph(B.type,0,-hgt-4-u*16,0.9,2); }
  cx.restore();
}
function drawAlbum(){
  const n=album.length;
  if(!S.memo){
    // tiny dots: how many stages are in the album
    for(let i=0;i<6;i++) ln(i<n?1:0,330+i*10,24,334+i*10,24,2.2);
    return;
  }
  // memorial frame: corner brackets blink like an LCD album page
  const t=S.memoClock;
  const on=Math.floor(t*3)%2?2:1;
  sp(on,[6,30,6,6,30,6],false,3.4); sp(on,[370,6,394,6,394,30],false,3.4);
  sp(on,[6,230,6,254,30,254],false,3.4); sp(on,[370,254,394,254,394,230],false,3.4);
  // album strip
  for(let i=0;i<6;i++){
    const x=i<3?28+i*52:236+(i-3)*52, y=30;
    sp(0,[x,y,x+44,y,x+44,y+30,x,y+30],true,2);
    const e=album[i]; if(!e) continue;
    const blink=(i===S.memoNew && Math.floor(t*5)%2===0);
    const st=blink?0:(i===S.memoNew?2:1);
    sp(st,[x,y,x+44,y,x+44,y+30,x,y+30],true,2);
    for(let j=0;j<3;j++){
      const ox=x+8+j*14, oy=y+20, c=e.o[j];
      if(c==='b') ln(st,ox-5,oy,ox+5,oy,2);
      else if(c==='s') sp(st,[ox-5,oy,ox-5,oy-4,ox,oy-4,ox,oy-8,ox+5,oy-8],false,2);
      else sp(st,[ox-4,oy,ox-4,oy-6,ox+4,oy-6,ox+4,oy],false,2);
    }
    if(e.h) sp(st,[x+34,y+8,x+40,y+8,x+38,y+4,x+36,y+4],true,1.6);
  }
}

// ====================================================================
//  draw pad (physical light-colored costume buttons)
// ====================================================================
function rrect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath();
}
function padShapePath(type,w,h,press,ext){
  // centered at 0,0 ; returns via cx path
  const u=w/2, v=h/2;
  cx.beginPath();
  if(type==='b'){
    const hem=0.46+ext*0.1;
    const P=[[-0.18,-0.46],[0.18,-0.46],[0.46,-0.30],[0.5,0.12],[0.34,0.14],[0.31,-0.08],[0.33,hem],[-0.33,hem],[-0.31,-0.08],[-0.34,0.14],[-0.5,0.12],[-0.46,-0.30]];
    P.forEach((p,i)=>{ const X=p[0]*w, Y=p[1]*h; i?cx.lineTo(X,Y):cx.moveTo(X,Y); });
  }else if(type==='s'){
    const sp2=ext*0.08;
    cx.moveTo(-0.28*w,-0.38*h); cx.lineTo(0.28*w,-0.38*h);
    cx.lineTo((0.5+sp2)*w,0.36*h);
    const n=6; for(let i=0;i<=n;i++){ const X=lerp(0.5+sp2,-0.5-sp2,i/n)*w; const Y=(i%2?0.28:0.38)*h; cx.lineTo(X,Y); }
    cx.closePath();
  }else{
    const cf=ext*0.06;
    const P=[[-0.36,-0.42],[0.36,-0.42],[0.44+cf,0.46],[0.08-cf*0.5,0.46],[0,0.0],[-0.08+cf*0.5,0.46],[-0.44-cf,0.46]];
    P.forEach((p,i)=>{ const X=p[0]*w, Y=p[1]*h; i?cx.lineTo(X,Y):cx.moveTo(X,Y); });
    cx.closePath();
  }
}
function drawPadItem(type,x,y,w,h,opts){
  const fill={b:COL.padLime,s:COL.padAmber,p:COL.padPale}[type];
  const press=opts.press||0, ext=opts.ext||0;
  cx.save(); cx.translate(x,y);
  cx.scale(1+press*0.07,1-press*0.1);
  if(opts.rot) cx.rotate(opts.rot);
  // shadow
  if(!opts.flat){ cx.save(); cx.translate(0,(1-press)*h*0.05+2); padShapePath(type,w,h,press,ext); cx.fillStyle='rgba(0,0,0,0.45)'; cx.fill(); cx.restore(); }
  padShapePath(type,w,h,press,ext);
  cx.fillStyle=fill; cx.fill();
  cx.lineWidth=Math.max(2,w*0.035); cx.strokeStyle=opts.glow?COL.amber:COL.ink; cx.lineJoin='round'; cx.stroke();
  // details
  cx.lineWidth=Math.max(1.5,w*0.022); cx.strokeStyle='rgba(27,33,27,0.55)';
  cx.beginPath();
  if(type==='b'){ cx.moveTo(-0.1*w,-0.46*h); cx.lineTo(0,-0.28*h); cx.lineTo(0.1*w,-0.46*h); cx.moveTo(0,-0.28*h); cx.lineTo(0,(0.44+ext*0.1)*h);
    cx.stroke(); cx.fillStyle='rgba(27,33,27,0.55)'; for(let i=0;i<3;i++){ cx.fillRect(0.05*w,(-0.16+i*0.18)*h,w*0.05,w*0.05);} }
  else if(type==='s'){ for(let i=1;i<6;i++){ const X0=lerp(-0.26,0.26,i/6)*w, X1=lerp(-0.5-ext*0.08,0.5+ext*0.08,i/6)*w; cx.moveTo(X0,-0.36*h); cx.lineTo(X1,0.3*h);} cx.moveTo(-0.28*w,-0.28*h); cx.lineTo(0.28*w,-0.28*h); cx.stroke(); }
  else { cx.moveTo(-0.36*w,-0.3*h); cx.lineTo(0.36*w,-0.3*h); cx.moveTo(0,-0.42*h); cx.lineTo(0,-0.1*h); cx.stroke(); }
  cx.restore();
}
function drawPad(){
  cx.setTransform(DPR,0,0,DPR,0,0);
  // housing tray
  rrect(Lo.px,Lo.py,Lo.pw,Lo.ph,Math.min(28,Lo.ph*0.12)); cx.fillStyle=COL.bodyHi; cx.fill();
  rrect(Lo.px+4,Lo.py+4,Lo.pw-8,Lo.ph-8,Math.min(24,Lo.ph*0.1)); cx.fillStyle=COL.bodyLo; cx.fill();
  const lure=currentLure();
  for(const t of TYPES){
    const r=padRect(t), a=padAnim[t];
    // socket
    rrect(r.cx-r.w*0.56,r.cy-r.h*0.54,r.w*1.12,r.h*1.08,r.w*0.16); cx.fillStyle='#202520'; cx.fill();
    const isLure=lure===t;
    const dragging=drag&&drag.kind==='wear'&&drag.type===t&&drag.moved>14;
    const targetUndress=drag&&drag.kind==='undress'&&drag.type===t;
    let yo=0, rot=0;
    if(isLure){ yo=-Math.abs(Math.sin(now*4.2))*r.h*0.07; rot=Math.sin(now*4.2)*0.05; }
    else rot=Math.sin(now*1.3+r.cx)*0.008;
    if(a.raise>0){ yo-=Math.sin(Math.min(1,(1-a.raise)*3)*PI)*r.h*0.18; }
    if(a.wob>0) rot+=Math.sin(a.wob*20)*0.12*a.wob;
    if(isLure && !dragging){
      cx.save(); cx.globalAlpha=0.35+0.25*Math.sin(now*6);
      rrect(r.cx-r.w*0.58,r.cy-r.h*0.56,r.w*1.16,r.h*1.12,r.w*0.18); cx.lineWidth=Math.max(3,r.w*0.05); cx.strokeStyle=COL.amber; cx.stroke(); cx.restore();
    }
    if(targetUndress){
      cx.save(); cx.globalAlpha=0.5+0.3*Math.sin(now*10);
      rrect(r.cx-r.w*0.58,r.cy-r.h*0.56,r.w*1.16,r.h*1.12,r.w*0.18); cx.lineWidth=Math.max(3,r.w*0.05); cx.strokeStyle=COL.green; cx.stroke(); cx.restore();
    }
    const worn=girl.garment===t;
    const scaleW=r.w*0.9, scaleH=r.h*0.82;
    if(dragging){
      // empty socket outline
      cx.save(); cx.translate(r.cx,r.cy); padShapePath(t,scaleW,scaleH,0,0); cx.setLineDash([6,6]); cx.lineWidth=2; cx.strokeStyle='rgba(215,236,130,0.4)'; cx.stroke(); cx.restore();
    }else{
      cx.save(); if(worn&&!a.press&&!isLure) cx.globalAlpha=0.55;
      drawPadItem(t,r.cx,r.cy+yo+a.press*r.h*0.04,scaleW,scaleH,{press:a.press,ext:a.press,rot,glow:isLure});
      cx.restore();
    }
  }
  // dragged costume follows the finger (with magnet near the girl)
  if(drag&&drag.kind==='wear'&&drag.moved>14){
    const [gx,gy]=girlScreen();
    const s=drag.snap;
    const x=lerp(drag.x,gx,s*0.6), y=lerp(drag.y-Lo.bh*0.25,gy,s*0.6);
    const sz=lerp(Lo.bw*0.7,Math.max(36,28*Lo.k),s);
    drawPadItem(drag.type,x,y,sz,sz*1.2,{press:0,ext:0.5+0.5*Math.sin(now*12),rot:Math.sin(now*8)*0.06});
  }
  if(drag&&drag.kind==='undress'){
    const sz=Math.max(44,Lo.bw*0.55);
    drawPadItem(drag.type,drag.x,drag.y-sz*0.3,sz,sz*1.2,{press:0,ext:0,rot:Math.sin(now*8)*0.08});
  }
}
function drawHand(){
  if(!demo) return;
  cx.setTransform(DPR,0,0,DPR,0,0);
  const r=padRect('b'); const [gx,gy]=girlScreen();
  const t=demo.t;
  let u=0, alpha=1, x, y;
  if(t<0.5){ u=0; alpha=t/0.5; } else if(t<2.2){ u=ease((t-0.6)/1.5); } else { u=1; alpha=1-(t-2.2)/0.6; }
  x=lerp(r.cx,gx,u); y=lerp(r.cy,gy+20,u);
  cx.save(); cx.globalAlpha=clamp(alpha,0,1);
  if(u>0.02&&u<0.98) drawPadItem('b',x,y-Lo.bh*0.2,Lo.bw*0.5,Lo.bw*0.6,{flat:true});
  const s=Math.max(26,Lo.bw*0.28);
  cx.translate(x+s*0.2,y+s*0.3);
  cx.fillStyle='#f4ead2'; cx.strokeStyle=COL.ink; cx.lineWidth=3;
  rrect(-s*0.35,0,s*0.7,s*0.8,s*0.25); cx.fill(); cx.stroke();
  rrect(-s*0.12,-s*0.6,s*0.24,s*0.8,s*0.12); cx.fill(); cx.stroke();
  cx.restore();
}
function drawBody(){
  cx.setTransform(DPR,0,0,DPR,0,0);
  cx.fillStyle=COL.body; cx.fillRect(0,0,W,H);
  // subtle speaker grille marks on housing (no text)
  cx.fillStyle=COL.bodyLo;
  const gy=Lo.ly+Lo.lh+Math.max(6,10*Lo.k)+4;
  for(let i=0;i<5;i++) cx.fillRect(Lo.lx+Lo.lw-60+i*10,gy,5,3);
}

// ====================================================================
//  look targets
// ====================================================================
function updLooks(){
  const l=currentLure();
  let tx,ty;
  if(drag&&drag.kind==='wear'){ tx=drag.x; ty=drag.y; }
  else if(l==='undress'){ const p=toScreen(20,180); tx=p[0]; ty=p[1]; }
  else if(l){ const r=padRect(l); tx=r.cx; ty=r.cy; }
  else if(S.duet||S.big){ const p=toScreen(dress.x,dress.y-40); tx=p[0]; ty=p[1]; }
  else { const p=toScreen(S.lamp?196:dress.x,S.lamp?40:dress.y-40); tx=p[0]; ty=p[1]; }
  for(const c of [girl,dress]){
    let ax=tx,ay=ty;
    if(c===dress&&(S.duet||S.big)){ const p=toScreen(girl.x,girl.y-30); ax=p[0]; ay=p[1]; }
    const p=toScreen(c.x,c.y-40);
    const dx=ax-p[0], dy=ay-p[1], d=Math.hypot(dx,dy)||1;
    c.lookX=lerp(c.lookX,dx/d*2,0.15); c.lookY=lerp(c.lookY,dy/d*1.5,0.15);
  }
  dress.pose=(S.order.length?['bsp','bps','sbp','spb','pbs','psb'].indexOf(S.order.join('')):0);
  if(dress.pose<0) dress.pose=0;
  girl.pose=dress.pose;
}

// ====================================================================
//  loop
// ====================================================================
let last=0, rafId=0, running=false;
function frame(ts){
  rafId=0;
  if(!running) return;
  const t=ts/1000;
  let dt=last?t-last:0.016; last=t;
  dt=clamp(dt,0,0.05);
  now+=dt;
  update(dt);
  updLooks();
  drawBody(); drawLCD(); drawPad(); drawHand();
  rafId=requestAnimationFrame(frame);
}
function start(){ if(running) return; running=true; last=0; rafId=requestAnimationFrame(frame); }
function stop(){ running=false; if(rafId) cancelAnimationFrame(rafId); rafId=0; }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ stop(); cancelDrag(); try{ if(AC&&AC.state==='running') AC.suspend(); }catch(e){} }
  else { last=0; start(); try{ if(AC&&audioWanted) AC.resume().catch(()=>{}); }catch(e){} }
});
window.addEventListener('pagehide',()=>{ stop(); });
window.addEventListener('pageshow',()=>{ if(!document.hidden) start(); });

layout();
for(const t of TYPES) padAnim[t].cx=padPos[t];
start();

// test hooks (automation only; no UI)
window.__gf={S,girl,dress,album:()=>album,padRect,girlScreen,toScreen,wear,undress:doUndress,
  lure:currentLure,demo:()=>demo, parts:()=>parts.length,
  state:()=>({order:S.order.slice(),has:Object.assign({},S.has),lamp:S.lamp,flipped:S.flipped,big:S.big,memo:S.memo,
    girl:{node:girl.node,garment:girl.garment,act:girl.act&&girl.act.name},dress:{node:dress.node,act:dress.act&&dress.act.name,carry:dress.carry},
    stoolL:S.stoolL,stoolR:S.stoolR,next:S.next,hat:S.hat,fold:!!S.fold,box:S.box&&S.box.phase,duet:S.duet&&S.duet.kind,padOrder:padOrder.slice(),home:S.home,seams:S.seams.length})};
})();
