<title>びよん、すうっ！かべの穴から風のひこうき</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#f1ece1;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none}
#safe{position:absolute;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

<script src="../../gf-playlog.js" defer></script>

<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
(function(){
'use strict';
/* ============================================================
   びよん、すうっ！かべの穴から風のひこうき
   壁の切れ目を一本指で引いて窓を開ける。窓の形 → 顔・風・紙玉・飛行機。
   画風: リソグラフ（紺・朱赤・黄 + 紙色、版ズレ）
   ============================================================ */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const safeEl=document.getElementById('safe');
const TAU=Math.PI*2;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const hyp=Math.hypot;

const INK={paper:'#f1ece1',paper2:'#f6f2e8',navy:'#26407a',red:'#e3533a',yellow:'#f5c52e',black:'#2a2522',skin:'#f6d9c4'};
// 版ズレ（内部色のみ。濃紺の外形はずらさない）
const OFF={red:[1.6,-1.1],yellow:[-1.4,1.3],navy:[0.8,0.7],none:[0,0]};

function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------------- layout ---------------- */
let DPR=1,VW=0,VH=0,S=300;
const L={wall:{x:0,y:0,w:100,h:100},portrait:true};
function wx(u){return L.wall.x+u*L.wall.w;}
function wy(v){return L.wall.y+v*L.wall.h;}
const FLOORV=0.885;
function floorY(){return wy(FLOORV);}

function readSafe(){
  const cs=getComputedStyle(safeEl);
  return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
}
function doLayout(){
  VW=Math.max(200,window.innerWidth);VH=Math.max(200,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  const sa=readSafe();
  const portrait=VH>VW*1.08;
  L.portrait=portrait;L.safe=sa;
  if(portrait){
    const top=sa.t+Math.max(46,VH*0.07);
    const floorH=Math.max(140,VH*0.2)+sa.b;
    L.wall={x:sa.l+10,y:top,w:VW-sa.l-sa.r-20,h:VH-top-floorH};
    const fb=VH-sa.b-(L.wall.y+L.wall.h);
    L.uncle={x:sa.l+Math.min(VW*0.19,110),y:L.wall.y+L.wall.h+fb*0.5,r:clamp(fb*0.27,32,70),standing:false};
    L.pile={x0:sa.l+VW*0.42,x1:VW-sa.r-22,y:L.wall.y+L.wall.h+fb*0.74};
  }else{
    const top=sa.t+Math.max(42,VH*0.065);
    const floorH=Math.max(92,VH*0.13)+sa.b;
    const col=Math.max(140,VW*0.16)+sa.l;
    L.wall={x:col,y:top,w:VW-col-sa.r-18,h:VH-top-floorH};
    L.uncle={x:sa.l+(col-sa.l)*0.5,y:L.wall.y+L.wall.h*0.56,r:clamp((col-sa.l)*0.3,34,64),standing:true};
    const fb=VH-sa.b-(L.wall.y+L.wall.h);
    L.pile={x0:L.wall.x+L.wall.w*0.38,x1:L.wall.x+L.wall.w-10,y:L.wall.y+L.wall.h+fb*0.55};
  }
  S=Math.min(L.wall.w,L.wall.h);
  L.rollY=L.wall.y-Math.min(22,(L.wall.y-sa.t)*0.45);
  L.rollR=Math.min(14,(L.wall.y-sa.t)*0.3);
  L.tab={x:L.wall.x+L.wall.w-Math.max(26,S*0.07),y:L.wall.y+Math.max(18,S*0.045)};
  L.frontFloor=L.wall.y+L.wall.h;
  buildCaches();
  wallDirty=true;
}

/* ---------------- textures ---------------- */
let bgC,roomC,wallTexC,wlC,wlX,laceTile,pats={};
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;}
function mkHalftone(col,size,dot,alpha){
  const s=Math.max(2,Math.round(size*DPR));const c=mkCanvas(s,s);const g=c.getContext('2d');
  g.globalAlpha=alpha;g.fillStyle=col;g.beginPath();g.arc(s/2,s/2,dot*DPR,0,TAU);g.fill();
  g.beginPath();g.arc(0,0,dot*DPR,0,TAU);g.arc(s,0,dot*DPR,0,TAU);g.arc(0,s,dot*DPR,0,TAU);g.arc(s,s,dot*DPR,0,TAU);g.fill();
  return c;
}
function patFor(g,tile){
  const p=g.createPattern(tile,'repeat');
  try{if(p&&p.setTransform&&typeof DOMMatrix!=='undefined')p.setTransform(new DOMMatrix([1/DPR,0,0,1/DPR,0,0]));}catch(e){}
  return p;
}
let noiseTile=null;
function mkNoise(){
  const n=160;const c=mkCanvas(n,n);const g=c.getContext('2d');const id=g.createImageData(n,n);const r=rng(77);
  for(let i=0;i<n*n;i++){const v=r();const k=i*4;
    if(v<0.06){id.data[k]=38;id.data[k+1]=64;id.data[k+2]=122;id.data[k+3]=Math.floor(r()*40);}
    else if(v<0.1){id.data[k]=227;id.data[k+1]=83;id.data[k+2]=58;id.data[k+3]=Math.floor(r()*26);}
    else if(v<0.16){id.data[k]=120;id.data[k+1]=100;id.data[k+2]=70;id.data[k+3]=Math.floor(r()*18);}
    else id.data[k+3]=0;}
  g.putImageData(id,0,0);return c;
}
function speckle(g,w,h){ // 印刷ムラ
  if(!noiseTile)noiseTile=mkNoise();
  g.save();g.setTransform(1,0,0,1,0,0);g.fillStyle=g.createPattern(noiseTile,'repeat');g.fillRect(0,0,w*DPR,h*DPR);
  const r=rng(31);g.globalCompositeOperation='multiply';
  for(let i=0;i<14;i++){const x=r()*w*DPR,y=r()*h*DPR,rad=(40+r()*140)*DPR;const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,'rgba(230,215,190,0.18)');gr.addColorStop(1,'rgba(230,215,190,0)');g.fillStyle=gr;g.fillRect(x-rad,y-rad,rad*2,rad*2);}
  g.restore();
}
function inkF(g,path,col,k,alpha){const o=OFF[k||'none'];g.save();g.globalCompositeOperation='multiply';if(alpha!=null)g.globalAlpha=alpha;g.translate(o[0],o[1]);g.fillStyle=col;g.fill(path);g.restore();}
function inkS(g,path,col,w,k,alpha){const o=OFF[k||'none'];g.save();g.globalCompositeOperation='multiply';if(alpha!=null)g.globalAlpha=alpha;g.translate(o[0],o[1]);g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.stroke(path);g.restore();}
function line(g,path,w,col){g.strokeStyle=col||INK.navy;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.stroke(path);}
function pC(x,y,r){const p=new Path2D();p.arc(x,y,Math.max(0.1,r),0,TAU);return p;}
function pE(x,y,rx,ry,rot){const p=new Path2D();p.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU);return p;}
function pR(x,y,w,h,r){const p=new Path2D();r=Math.min(r||0,w/2,h/2);p.moveTo(x+r,y);p.arcTo(x+w,y,x+w,y+h,r);p.arcTo(x+w,y+h,x,y+h,r);p.arcTo(x,y+h,x,y,r);p.arcTo(x,y,x+w,y,r);p.closePath();return p;}
function pPoly(pts,close){const p=new Path2D();p.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)p.lineTo(pts[i],pts[i+1]);if(close!==false)p.closePath();return p;}
function pSmooth(pts,ox,oy){ox=ox||0;oy=oy||0;const n=pts.length/2;const p=new Path2D();
  let mx=(pts[(n-1)*2]+pts[0])/2-ox,my=(pts[(n-1)*2+1]+pts[1])/2-oy;p.moveTo(mx,my);
  for(let i=0;i<n;i++){const x=pts[i*2]-ox,y=pts[i*2+1]-oy;const j=((i+1)%n)*2;const nx=(pts[i*2]+pts[j])/2-ox,ny=(pts[i*2+1]+pts[j+1])/2-oy;p.quadraticCurveTo(x,y,nx,ny);}
  p.closePath();return p;}
function pLine(x1,y1,x2,y2){const p=new Path2D();p.moveTo(x1,y1);p.lineTo(x2,y2);return p;}

function buildCaches(){
  pats={};
  const tY=mkHalftone(INK.yellow,5,1.5,0.9),tR=mkHalftone(INK.red,5,1.3,0.8),tN=mkHalftone(INK.navy,5,1.2,0.7),tRl=mkHalftone(INK.red,4,0.9,0.55),tNl=mkHalftone(INK.navy,4,0.8,0.5);
  pats.tiles={tY,tR,tN,tRl,tNl};
  pats.y=patFor(ctx,tY);pats.r=patFor(ctx,tR);pats.n=patFor(ctx,tN);pats.rl=patFor(ctx,tRl);pats.nl=patFor(ctx,tNl);
  buildBg();buildRoom();buildWallTex();buildLace();
  wlC=mkCanvas(L.wall.w*DPR,L.wall.h*DPR);wlX=wlC.getContext('2d');
}
function gctx(c){const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);return g;}
function buildBg(){
  bgC=mkCanvas(VW*DPR,VH*DPR);const g=gctx(bgC);const W=L.wall;
  g.fillStyle=INK.paper;g.fillRect(0,0,VW,VH);
  const pY=patFor(g,pats.tiles.tY),pR2=patFor(g,pats.tiles.tR),pN=patFor(g,pats.tiles.tN);
  // 工房の壁（左右・上）: 黄の網点に紺のストライプ（重なりで深緑）
  g.save();g.globalCompositeOperation='multiply';g.globalAlpha=0.35;g.fillStyle=pY;g.fillRect(0,0,VW,W.y+W.h);g.restore();
  for(let x=-20;x<VW+20;x+=46){inkF(g,pR(x,0,10,W.y+W.h,0),INK.navy,'navy',0.08);}
  // 床（工房側）
  const fy=W.y+W.h;
  inkF(g,pR(0,fy,VW,VH-fy,0),INK.red,'red',0.22);
  g.save();g.globalCompositeOperation='multiply';g.globalAlpha=0.45;g.fillStyle=pR2;g.fillRect(0,fy,VW,VH-fy);g.restore();
  for(let i=1;i<6;i++){const yy=fy+(VH-fy)*Math.pow(i/6,1.3);line(g,pLine(0,yy,VW,yy),1.2,'rgba(38,64,122,0.35)');}
  for(let x=0;x<VW;x+=70){line(g,pLine(x,fy,x-40,VH),1,'rgba(38,64,122,0.2)');}
  // 壁の影
  inkF(g,pR(W.x-4,W.y+6,W.w+12,W.h,4),INK.navy,'none',0.18);
  // 巾木
  inkF(g,pR(W.x-6,fy-2,W.w+12,8,2),INK.navy,'navy',0.7);
  // 横の棚（landscape: おじさんの背後）
  if(!L.portrait){
    const sx=L.safe.l+8,sw=W.x-sx-16;
    for(let k=0;k<2;k++){const sy=W.y+W.h*(0.18+k*0.3);
      inkF(g,pR(sx,sy,sw,7,2),INK.navy,'navy',0.8);
      for(let j=0;j<4;j++){const rx=sx+8+j*(sw-16)/4,rr=Math.min(13,sw/10);const col=[INK.yellow,INK.red,INK.yellow,INK.navy][(j+k)%4];
        inkF(g,pR(rx,sy-rr*2.2,rr*1.6,rr*2.2,3),col,j%2?'red':'yellow',0.9);line(g,pR(rx,sy-rr*2.2,rr*1.6,rr*2.2,3),1.2);}
    }
  }else{
    // portrait: 小さな作業台
    const ux=L.pile.x0-20;
  }
  speckle(g,VW,VH);
}
function buildRoom(){
  const W=L.wall;roomC=mkCanvas(W.w*DPR,W.h*DPR);const g=gctx(roomC);const w=W.w,h=W.h;
  g.fillStyle='#f4ecd8';g.fillRect(0,0,w,h);
  const pY=patFor(g,pats.tiles.tY),pN=patFor(g,pats.tiles.tNl),pR2=patFor(g,pats.tiles.tR);
  // 奥の壁: 黄の網点＋紺ストライプ = 深緑のストライプ
  g.save();g.globalCompositeOperation='multiply';g.globalAlpha=0.55;g.fillStyle=pY;g.fillRect(0,0,w,h*FLOORV);g.restore();
  for(let x=S*0.03;x<w;x+=S*0.16){inkF(g,pR(x,0,S*0.05,h*FLOORV,0),INK.yellow,'yellow',0.55);inkF(g,pR(x,0,S*0.05,h*FLOORV,0),INK.navy,'navy',0.28);}
  // 奥の窓（風のもと）
  const ww=Math.min(w*0.3,S*0.42),wh=h*0.1,wxp=w*0.5-ww/2,wyp=h*0.02;
  inkF(g,pR(wxp,wyp,ww,wh,4),INK.paper2,'none',1);
  g.save();g.globalCompositeOperation='multiply';g.globalAlpha=0.5;g.fillStyle=pN;g.fill(pR(wxp,wyp,ww,wh,4));g.restore();
  for(let i=0;i<3;i++){inkF(g,pE(wxp+ww*(0.25+i*0.25),wyp+wh*0.5,ww*0.08,wh*0.18),INK.paper2,'none',1);}
  line(g,pR(wxp,wyp,ww,wh,4),2);line(g,pLine(wxp+ww/2,wyp,wxp+ww/2,wyp+wh),1.5);
  // 棚
  const sy=h*0.155;inkF(g,pR(w*0.04,sy,w*0.92,S*0.022,2),INK.red,'red',0.9);line(g,pR(w*0.04,sy,w*0.92,S*0.022,2),1.5);
  for(let x of [0.08,0.5,0.92]){line(g,pLine(w*x,sy+S*0.022,w*x,sy+S*0.06),2);}
  // 物干しひも
  const ly=h*0.275;const lp=new Path2D();lp.moveTo(w*0.02,ly-4);lp.quadraticCurveTo(w*0.5,ly+S*0.03,w*0.98,ly-4);line(g,lp,1.4);
  // 植木（深緑 = 黄＋紺の重ね刷り）
  const px=w*0.06,py=h*FLOORV;
  for(let i=0;i<4;i++){const lf=pE(px+S*0.03+(i-1.5)*S*0.02,py-S*0.12-i%2*S*0.03,S*0.025,S*0.06,(i-1.5)*0.4);inkF(g,lf,INK.yellow,'yellow',1);inkF(g,lf,INK.navy,'navy',0.55);}
  inkF(g,pR(px,py-S*0.07,S*0.06,S*0.07,3),INK.red,'red',1);line(g,pR(px,py-S*0.07,S*0.06,S*0.07,3),1.4);
  // 床
  inkF(g,pR(0,h*FLOORV,w,h*(1-FLOORV),0),INK.red,'red',0.3);
  g.save();g.globalCompositeOperation='multiply';g.globalAlpha=0.5;g.fillStyle=pR2;g.fillRect(0,h*FLOORV,w,h);g.restore();
  line(g,pLine(0,h*FLOORV,w,h*FLOORV),2);
  // ラグ
  const rg=pE(w*0.5,h*(FLOORV+0.06),w*0.36,h*0.035);inkF(g,rg,INK.yellow,'yellow',0.95);inkF(g,pE(w*0.5,h*(FLOORV+0.06),w*0.28,h*0.022),INK.navy,'navy',0.35);
  speckle(g,w,h);
}
function buildWallTex(){
  const W=L.wall;wallTexC=mkCanvas(W.w*DPR,W.h*DPR);const g=gctx(wallTexC);const w=W.w,h=W.h;
  g.fillStyle='#f7f2e6';g.fillRect(0,0,w,h);
  // 控えめな網点の帯
  const pY=patFor(g,pats.tiles.tY);
  g.save();g.globalCompositeOperation='multiply';g.globalAlpha=0.22;g.fillStyle=pY;
  for(let y=0;y<h;y+=S*0.24){g.fillRect(0,y,w,S*0.11);}g.restore();
  // 朱赤の小花模様
  const st=S*0.12;const r=rng(5);
  for(let y=st*0.5;y<h;y+=st){for(let x=((Math.round(y/st))%2)*st*0.5+st*0.25;x<w;x+=st){
    const p=new Path2D();for(let k=0;k<4;k++){const a=k*TAU/4+0.4;p.moveTo(x+Math.cos(a)*S*0.012+S*0.006,y+Math.sin(a)*S*0.012);p.arc(x+Math.cos(a)*S*0.012,y+Math.sin(a)*S*0.012,S*0.006,0,TAU);}
    inkF(g,p,INK.red,'red',0.5);inkF(g,pC(x,y,S*0.004),INK.navy,'navy',0.4);
  }}
  // 紙の継ぎ目
  for(let x=w/3;x<w-10;x+=w/3){line(g,pLine(x,0,x,h),0.8,'rgba(38,64,122,0.18)');}
  speckle(g,w,h);
}
function buildLace(){
  const s=Math.max(18,S*0.1);const n=Math.round(s*DPR);laceTile=mkCanvas(n,n);const g=laceTile.getContext('2d');g.scale(DPR,DPR);
  g.fillStyle='#000';const c=s/2;
  g.beginPath();g.arc(c,c,s*0.15,0,TAU);g.fill();
  for(let k=0;k<6;k++){const a=k*TAU/6;g.beginPath();g.ellipse(c+Math.cos(a)*s*0.3,c+Math.sin(a)*s*0.3,s*0.12,s*0.065,a,0,TAU);g.fill();}
  for(const [x,y] of [[0,0],[s,0],[0,s],[s,s]]){g.beginPath();g.arc(x,y,s*0.1,0,TAU);g.fill();}
  for(const [x,y] of [[c,0],[0,c],[s,c],[c,s]]){g.beginPath();g.arc(x,y,s*0.035,0,TAU);g.fill();}
}

/* ---------------- audio (Web Audio 合成) ---------------- */
const AU={c:null,m:null,nb:null,wind:null,st:null,ok:false};
function audioInit(){
  if(AU.c){if(AU.c.state==='suspended'&&!document.hidden){try{AU.c.resume();}catch(e){}}return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const c=new AC();AU.c=c;
    const m=c.createGain();m.gain.value=0.75;const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;m.connect(comp);comp.connect(c.destination);AU.m=m;
    const len=Math.floor(c.sampleRate*1.5),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;last=last*0.6+w*0.4;d[i]=last;}AU.nb=b;
    // 風（連続ノイズ）
    const ns=c.createBufferSource();ns.buffer=b;ns.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=0.7;const g=c.createGain();g.gain.value=0;ns.connect(bp);bp.connect(g);g.connect(m);ns.start();AU.wind={bp,g};
    // 伸び（びよーん）＋擦れ
    const o=c.createOscillator();o.type='triangle';o.frequency.value=200;const og=c.createGain();og.gain.value=0;o.connect(og);og.connect(m);o.start();
    const o2=c.createOscillator();o2.type='sine';o2.frequency.value=300;const og2=c.createGain();og2.gain.value=0;o2.connect(og2);og2.connect(m);o2.start();
    const ns2=c.createBufferSource();ns2.buffer=b;ns2.loop=true;const hp=c.createBiquadFilter();hp.type='bandpass';hp.frequency.value=2600;hp.Q.value=1.2;const rg=c.createGain();rg.gain.value=0;ns2.connect(hp);hp.connect(rg);rg.connect(m);ns2.start(0,0.4);
    AU.st={o,og,o2,og2,rg,hp};
    AU.ok=true;
    if(c.state==='suspended'){try{c.resume();}catch(e){}}

  const maj=Math.max(w.hw,w.hh);

  else{SFX.pop(maj);burst(wx(w.u)+(dg.sx||0)*w.hw*S,wy(w.v)+(dg.sy||0)*w.hh*S,4,0.5);}
  if(invite&&dg.changed){const k=invite.kind==='edge'&&invite.w===w?'w'+w.id+invite.dir.x+invite.dir.y:(invite.kind==='slit'&&dg.fresh&&w.s===invite.i?'w'+w.id+invite.dir.x+invite.dir.y:null);

}
function tapOther(x,y){

/* ---------------- winds ---------------- */
function targets(){
  const list=[];
  G.chimes.forEach((c,i)=>list.push({k:'chime',o:c,x:wx(c.u),y:wy(c.v),r:S*0.075}));
  G.lans.forEach((l,i)=>list.push({k:'lan',o:l,x:wx(l.u),y:wy(l.v)+l.liftPx,r:S*0.07}));
  G.wheels.forEach((w,i)=>list.push({k:'wheel',o:w,x:wx(w.u),y:wy(w.v),r:S*0.075}));
  return list;
}
function computeWinds(){
  winds=[];const tg=targets();
  for(const w of G.wins){
    if(w.closing)continue;const el=elong(w);if(el<1.3)continue;
    const horiz=w.hw>w.hh;const maj=Math.max(w.hw,w.hh)*S;
    const s=clamp((el-1.2)/1.5,0,1)*clamp(maj/(S*0.13),0.35,1);
    if(s<0.05)continue;
    const dir=horiz?{x:w.px||(w.u<0.5?1:-1),y:0}:{x:0,y:w.py||-1};
    const cx=wx(w.u),cy=wy(w.v);const ox=cx+dir.x*w.hw*S*0.8,oy=cy+dir.y*w.hh*S*0.8;
    const len=S*(0.22+0.5*s)+maj*0.95;
    let best=null,bs=1e9;
    for(const t of tg){
      const ac=(t.x-cx)*dir.x+(t.y-cy)*dir.y;if(ac<=S*0.01)continue; // 窓より前方のみ
      const vx=t.x-ox,vy=t.y-oy;let d=hyp(vx,vy);if(d>len*1.15+t.r)continue;
      const along=vx*dir.x+vy*dir.y;let ang;
      if(along<t.r){ // 窓の先端付近・内側：真横の距離で判定
        const perp=Math.abs((t.x-cx)*dir.y-(t.y-cy)*dir.x);const half=(dir.x?w.hh:w.hw)*S+t.r;if(perp>half)continue;ang=0;d=Math.max(0,along);}
      else{ang=Math.acos(clamp(along/d,-1,1));if(ang>0.72)continue;}
      const sc=d*(1+ang*1.6);if(sc<bs){bs=sc;best=t;}}
    let ex,ey,cxp,cyp,hitS=0;
    if(best){ex=best.x;ey=best.y;const d=hyp(ex-ox,ey-oy);cxp=ox+dir.x*d*0.55;cyp=oy+dir.y*d*0.55;hitS=s*(1-0.35*clamp(d/(len*1.15),0,1));}
    else{ex=ox+dir.x*len;ey=oy+dir.y*len;cxp=(ox+ex)/2;cyp=(oy+ey)/2;}
    // 到達方向
    let tx=ex-cxp,ty=ey-cyp;const tl=hyp(tx,ty)||1;tx/=tl;ty/=tl;
    winds.push({w,ox,oy,cx:cxp,cy:cyp,ex,ey,dir,s,hit:best,hitS,ax:tx,ay:ty,len,horiz});
  }
}
function bez(wd,t){const a=1-t;return {x:a*a*wd.ox+2*a*t*wd.cx+t*t*wd.ex,y:a*a*wd.oy+2*a*t*wd.cy+t*t*wd.ey};}

/* ---------------- decorations ---------------- */
function updateDecor(dt){
  for(const c of G.chimes){c.fx=0;c.fy=0;c.hit=0;}
  for(const l of G.lans){l.fl=0;l.fs=0;l.hit=0;}
  for(const wh of G.wheels){wh.inb=[];}
  for(const wd of winds){if(!wd.hit)continue;const o=wd.hit.o,s=wd.hitS;
    if(wd.hit.k==='chime'){o.fx+=wd.ax*s;o.fy+=wd.ay*s;o.hit=Math.max(o.hit,s);
      if(wd.horiz&&s>0.15&&!D().chime)disc('chime',wd.w);}
    else if(wd.hit.k==='lan'){o.fl+=-wd.ay*s;o.fs+=wd.ax*s;o.hit=Math.max(o.hit,s);
      if(!wd.horiz&&s>0.15&&!D().lantern)disc('lantern',wd.w);}
    else if(wd.hit.k==='wheel'){o.inb.push({x:wd.ax,y:wd.ay,s,w:wd.w});}
  }
  for(const c of G.chimes){
    for(let i=0;i<3;i++){const tgt=clamp(c.fx*0.9,-1,1)+Math.sin(T*(9+i*2.3)+i)*Math.abs(c.fx)*0.22;
      const a=(tgt-c.sw[i])*(26-i*3)-c.vw[i]*3.2;c.vw[i]+=a*dt;c.sw[i]+=c.vw[i]*dt;c.sw[i]=clamp(c.sw[i],-1.2,1.2);}
    c.up=lerp(c.up,clamp(-c.fy,-1,1),dt*4);
    if(c.hit>0.12){c.ringT-=dt;if(c.ringT<=0){c.ringT=0.22+Math.random()*0.35/(0.4+c.hit);if(thr('chime',0.12))SFX.chime(c.ni++,c.hit);}}
  }
  for(const l of G.lans){
    const tl=clamp(l.fl,-1,1.2);const a=(tl-l.lift)*14-l.vl*3.5;l.vl+=a*dt;l.lift+=l.vl*dt;
    const ts=clamp(l.fs*0.6,-0.6,0.6)+Math.sin(T*3+l.u*9)*0.05*Math.abs(l.fl);const b=(ts-l.sway)*12-l.vs*2.5;l.vs+=b*dt;l.sway+=l.vs*dt;
    l.liftPx=-l.lift*S*0.07;
    if(l.fl>0.2&&l.lift>0.3&&!l.lifted){l.lifted=true;SFX.lift();}
    if(l.lift<0.12)l.lifted=false;
  }
  for(const wh of G.wheels){
    // 方向のまとまり
    const cl=[];for(const a of wh.inb){let f=false;for(const c of cl){if(a.x*c.x+a.y*c.y>Math.cos(0.6)){f=true;break;}}if(!f)cl.push(a);}
    wh.clusters=cl.length;
    let tor=0,tot=0;for(let i=0;i<wh.inb.length;i++){tot+=wh.inb[i].s;for(let j=i+1;j<wh.inb.length;j++){const a=wh.inb[i],b=wh.inb[j];tor+=(a.x*b.y-a.y*b.x)*a.s*b.s;}}
    let tgt=0;if(cl.length>=2){tgt=tor*16;if(Math.abs(tgt)<2.5)tgt=(tgt>=0?1:-1)*(2.5+tot*2);} // 二方向で回る
    tgt+=Math.sign(tgt||1)*(cl.length>=3?6:0);
    if(F&&F.wheel===wh)tgt=Math.sign(tgt||1)*16;
    wh.om=lerp(wh.om,tgt,dt*(cl.length>=2?2.2:1.2));
    wh.wob=lerp(wh.wob||0,cl.length===1?Math.sin(T*8)*0.25*tot:0,dt*5);
    wh.ang+=wh.om*dt;
    wh.tickA+=Math.abs(wh.om*dt);if(wh.tickA>TAU/6){wh.tickA=0;if(thr('tick'+wh.u,0.06))SFX.tick(700+Math.abs(wh.om)*25);}
    if(Math.abs(wh.om)>2&&cl.length>=2){wh.spinT+=dt;if(wh.spinT>0.4&&!D().spin)disc('spin',wh.inb[0].w);}else wh.spinT=0;
  }
}

/* ---------------- residents ---------------- */
const unc={look:{x:0,y:0},lx:0,ly:0,happy:0,nod:0,trace:0,blink:2,bt:0};
function coverage(x,y,rad){let n=0,k=0;const pts=[[0,0],[1,0],[-1,0],[0,1],[0,-1],[0.7,0.7],[-0.7,0.7],[0.7,-0.7],[-0.7,-0.7]];
  let best=null,bc=0;
  for(const [a,b] of pts){k++;const px=x+a*rad,py=y+b*rad;const w=anyInside(px,py);if(w){n++;}}
  for(const w of G.wins){if(!w.closing&&inWin(w,x,y)<=1){best=w;break;}}
  return {f:n/k,w:best};}
function faceR(){return S*0.082;}
function updateResidents(dt){
  const fr=faceR();const ux=L.uncle.x,uy=L.uncle.y;
  const vis=[];
  G.res.forEach((r,i)=>{
    const x=wx(r.u),y=wy(r.v);const c=coverage(x,y,fr*0.75);r.cov=c.f;r.win=c.w;
    const was=r.vis;r.vis=c.f>=0.45;
    if(r.vis&&!was){r.wave=1.8;SFX.face(r.kind);fx.push({k:'ring',x,y,t:0,life:0.5,r:fr*1.4,col:'yellow'});if(!D().face)disc('face',r.win);}
    const wowNow=r.vis&&r.win&&elong(r.win)>=1.75;

    r.flut=lerp(r.flut,fl,dt*4);r.fdir=lerp(r.fdir,fd,dt*4);

    if(vis.length===3&&cand.length===3)np={a:-1,key:'all',m:vis.slice()};
    else if(cand.length){cand.sort((p,q)=>Math.abs(G.res[p[0]].u-G.res[p[1]].u)-Math.abs(G.res[q[0]].u-G.res[q[1]].u));const [a,b]=cand[0];const ka=G.res[a].kind,kb=G.res[b].kind;np={a,b,key:Math.min(ka,kb)+'-'+Math.max(ka,kb),m:[a,b]};}
  }
  if(np&&(!pair||pair.key!==np.key||pair.m.join()!==np.m.join())){pair={...np,t:0,beat:-1};if(!D().pair)disc('pair',null);else SFX.success();
    if(!G.disc.pairKinds)G.disc.pairKinds={};G.disc.pairKinds[np.key]=1;}
  if(!np&&pair){pair=null;hearts=[];}
  if(pair){pair.t+=dt;const bt=Math.floor(pair.t/0.55);if(bt!==pair.beat){pair.beat=bt;SFX.game(pair.key==='all'?bt%5+2:(pair.key==='0-1'?(bt%2?4:2):pair.key==='1-2'?(bt%4):bt%3+3));
      if(pair.key==='0-2'&&bt%5===0)spawnHeart();}}
  // ポーズ

    r.bt-=dt;if(r.bt<-0.12){r.bt=2+Math.random()*3;}
    const x=wx(r.u),y=wy(r.v);
    let lx=ux-x,ly=uy-y;let aL=0.15,aR=0.15,hop=0,mouth=r.vis?0.4:0;
    if(F&&F.t>2.2){const pl=nearestPlane(x,y);if(pl){lx=pl.x-x;ly=pl.y-y;}aL=2.5+Math.sin(T*9+i)*0.2;aR=2.5+Math.sin(T*9+i+1)*0.2;mouth=1;hop=Math.abs(Math.sin(T*6+i))*0.25;}
    else if(pair&&pair.m.indexOf(i)>=0){

      const me=pair.m.indexOf(i);const t=pair.t;
      if(pair.key==='0-1'){const bt=Math.floor(t/0.55);const act=(bt%2)===me;if(act){aR=2.4+Math.sin(t*14)*0.45;mouth=0.9;}}
      else if(pair.key==='1-2'){const ph=(t*1.8+me*0.5)%1;hop=Math.max(0,Math.sin(ph*TAU))*0.6;aL=aR=1.2+hop*1.5;mouth=0.7;}
      else if(pair.key==='0-2'){aL=aR=0.9+Math.sin(t*5+me*3)*0.3;mouth=0.7;}

      r.idleWave-=dt;if(r.idleWave<0){r.idleWave=4+Math.random()*3;r.wave=1.2;}
      if(G.kid.ball&&G.kid.ball.st!=='hand'){const bx=wx(G.kid.ball.u),by=floorY();lx=lerp(lx,bx-x,0.6);ly=lerp(ly,by-y,0.6);}
    }else{lx=Math.sin(T*0.5+i)*30;ly=10;}
    if(r.wow){mouth=1;}
    const ll=hyp(lx,ly)||1;r.lx=lerp(r.lx,lx/ll,dt*8);r.ly=lerp(r.ly,ly/ll,dt*8);

function spawnHeart(){if(!pair||pair.m.length<2||hearts.length>2)return;const a=G.res[pair.m[0]],b=G.res[pair.m[1]];const flip=(Math.floor(pair.t/2.75)%2)===1;hearts.push({a:flip?b:a,b:flip?a:b,t:0});}
function nearestPlane(x,y){if(!F)return null;let best=null,bd=1e9;for(const s of F.sheets){if(s.pos){const d=hyp(s.pos.x-x,s.pos.y-y);if(d<bd){bd=d;best=s.pos;}}}return best;}

/* ---------------- kid & paper ball ---------------- */
function lowWins(){const fy=floorY();return G.wins.filter(w=>!w.closing&&inWin(w,wx(w.u),fy-S*0.025)<=1&&inWin(w,wx(w.u),fy-S*0.07)<=1);}
function ballFits(w,u,d){const x=wx(u),r=d*S/2,cy=floorY()-r;const pts=[[0,-1],[0.7,-0.7],[-0.7,-0.7],[1,0],[-1,0],[0.8,0.45],[-0.8,0.45],[0,0]];
  for(const [a,b] of pts){if(inWin(w,x+a*r*0.92,cy+b*r*0.92)>1)return false;}return true;}
function updateKid(dt){
  const k=G.kid;k.t+=dt;const spd=0.32*S/L.wall.w;
  if(F){k.cheer=1;return;}k.cheer=Math.max(0,k.cheer-dt);
  const lw=lowWins();
  let tw=null;if(lw.length){tw=lw.reduce((a,b)=>Math.abs(a.u-k.u)<Math.abs(b.u-k.u)?a:b);}
  if(k.ball&&k.ball.st==='front'){
    const b=k.ball;b.t+=dt;b.vy+=S*3.2*dt;b.y+=b.vy*dt;b.x+=b.vx*dt;b.rot+=b.vx*dt/(BALL[b.sz]*S/2);
    const gy=L.pile.y-BALL[b.sz]*S*0.5*0.7;if(b.y>gy){b.y=gy;if(b.vy>S*0.4){SFX.thud();}b.vy=-b.vy*0.35;if(Math.abs(b.vy)<S*0.15)b.vy=0;}
    b.vx=lerp(b.vx,(b.tx-b.x)*2.2,dt*2);
    if(b.t>1.6&&Math.abs(b.tx-b.x)<4){G.balls.push(b.sz);if(G.balls.length>9)G.balls.shift();k.ball=null;saveDirty=true;}
    if(b.t>4){G.balls.push(b.sz);if(G.balls.length>9)G.balls.shift();k.ball=null;saveDirty=true;}
    return;
  }
  switch(k.state){
    case 'idle':
      if(k.ball&&k.ball.st!=='hand'){k.ball=null;}
      if(tw){k.target=tw;k.state='go';}
      else{k.u=lerp(k.u,k.home,dt*0.6);}
      break;
    case 'go':{
      if(!tw){k.state='idle';k.ball=null;break;}k.target=tw;
      const side=k.u<=tw.u?-1:1;const goal=clamp(tw.u+side*(tw.hw*S*0.3+S*0.05)/L.wall.w,0.04,0.96);
      const d=goal-k.u;k.u+=clamp(d,-spd*dt,spd*dt);k.hop=Math.abs(Math.sin(k.t*9))*0.15;
      if(Math.abs(d)<0.004){k.state='hold';k.t=0;k.ball={sz:G.kidNext%3,u:k.u,st:'hand',rot:0};}
      break;}
    case 'hold':
      if(!tw){k.state='idle';k.ball=null;break;}
      if(k.t>0.8){k.state='roll';k.t=0;k.ball.st='roll';k.ball.u=k.u;SFX.roll();}
      break;
    case 'roll':{
      const b=k.ball;if(!tw){b.st='back';k.state='back';break;}
      const d=tw.u-b.u;const step=clamp(d,-spd*1.3*dt,spd*1.3*dt);b.u+=step;b.rot+=step*L.wall.w/(BALL[b.sz]*S/2);
      const edgeDist=Math.abs(d)*L.wall.w;
      if(edgeDist<tw.hw*S*0.35+2){
        if(ballFits(tw,tw.u,BALL[b.sz])){passBall(tw);}
        else{b.st='stuck';k.state='stuck';k.stuckWin=tw;k.blocked=true;k.t=0;SFX.bump();}
      }
      break;}
    case 'stuck':{
      const b=k.ball;if(!tw||tw!==k.stuckWin){if(tw&&!k.stuckWin){}b.st='back';k.state='back';break;}
      // 窓の手前で止まる：穴と紙玉を見比べる
      k.look=Math.sin(k.t*2.4);
      const side=k.u<tw.u?-1:1;b.u=lerp(b.u,tw.u+side*0.01,dt*2);
      if(ballFits(tw,tw.u,BALL[b.sz])){b.st='roll';k.state='roll';SFX.roll();}
      break;}
    case 'back':{
      const b=k.ball;if(!b){k.state='idle';break;}const d=k.u-b.u;b.u+=clamp(d,-spd*dt,spd*dt);b.rot+=clamp(d,-spd*dt,spd*dt)*L.wall.w/(BALL[b.sz]*S/2);
      if(Math.abs(d)<0.01){b.st='hand';k.state=tw?'hold':'idle';k.t=0;if(!tw)k.ball=null;}
      break;}
    case 'wait':

  }
}
function passBall(w){
  const k=G.kid,b=k.ball;const sz=b.sz;

  const slot=L.pile.x1-(G.balls.length%9)*S*0.11-S*0.05;

/* ---------------- discoveries ---------------- */
const DISC_LOG=[];

/* ---------------- flight (三つの風路の合流) ---------------- */
let convT=0;
function updateFlightTrigger(dt){
  if(F||curtain)return;
  const wh=G.wheels.find(w=>w.clusters>=3);
  if(wh&&G.armed){convT+=dt;if(convT>0.6)startFlight(wh);}
  else convT=Math.max(0,convT-dt*2);
}
function planeShapeFromWin(w){
  const horiz=w.hw>=w.hh;const maj=Math.max(w.hw,w.hh),mn=Math.min(w.hw,w.hh);
  const pts=shapePts(0,0,w.hw,w.hh,w.n,18,w.seed);
  const out=[];
  for(let i=0;i<pts.length;i+=2){let x=pts[i],y=pts[i+1];let u,v;
    if(horiz){u=x*(w.px>=0?1:-1);v=y;}else{u=-y*(w.py<=0?1:-1);v=x;}
    u/=maj;v/=maj;out.push(u,v);}
  return {flat:out,el:maj/mn,maj};
}
function planeVert(flat,f){ // f: 0=平らな紙 1=折れた飛行機
  const o=new Array(flat.length);
  for(let i=0;i<flat.length;i+=2){const u=flat[i],v=flat[i+1];const tap=0.14+0.86*(1-u)/2;o[i]=u*(1+0.12*f);o[i+1]=v*lerp(1,tap*1.15,f);}
  return o;
}
function startFlight(wh){
  convT=0;

  // 合流に使った窓を先に
  const feeding=new Set(wh.inb.map(a=>a.w));
  list.sort((a,b)=>(feeding.has(b)?1:0)-(feeding.has(a)?1:0));
  const use=list.slice(0,6);
  const used={shelf:[],line:[],rug:[],hand:[]};
  // 既に着地している場所は避ける（遊びの記憶）
  for(const p of G.planes){if(p.st&&used[p.st])used[p.st].push(p.si);}
  const sheets=use.map((w,i)=>{
    const ps=planeShapeFromWin(w);const el=ps.el;
    let type=el>=2.4?'shelf':el>=1.7?'line':el>=1.25?'hand':'rug';
    let dest=null,si=-1;
    if(type==='hand'){const free=G.res.map((r,j)=>j).filter(j=>used.hand.indexOf(j)<0);if(free.length){free.sort((a,b)=>Math.abs(G.res[a].u-w.u)-Math.abs(G.res[b].u-w.u));si=free[0];used.hand.push(si);dest={u:G.res[si].u+0.05*(si%2?1:-1)*S/L.wall.w*1.4,v:G.res[si].v+0.17*S/L.wall.h};}else type='rug';}
    if(!dest){let arr=G.spots[type];let idx=arr.map((s,j)=>j).filter(j=>used[type].indexOf(j)<0);
      if(!idx.length){idx=arr.map((s,j)=>j);}
      idx.sort((a,b)=>Math.abs(arr[a].u-w.u)-Math.abs(arr[b].u-w.u));si=idx[0];used[type].push(si);
      const sp0=arr[si];dest={u:sp0.u+(used[type].filter(x=>x===si).length-1)*0.03,v:sp0.v};}
    const col=(G.flights*2+i)%4;
    const dur=type==='shelf'?1.5:type==='line'?1.8:type==='hand'?2.0:2.5;
    return {w,flat:ps.flat,el,maj:ps.maj,col,start:2.6+i*0.5,dur,from:{u:w.u,v:w.v},hw:w.hw,hh:w.hh,n:w.n.slice(),seed:w.seed,horiz:w.hw>=w.hh,px:w.px,py:w.py,to:dest,type,si,st:'wait',pos:null};
  });

}
function updateFlight(dt){

  else{F.laceR=maxR;}
  let allDone=true;
  F.sheets.forEach((s,i)=>{
    const lt=t-s.start;if(lt<0){allDone=false;return;}
    if(s.st==='wait'){s.st='pop';SFX.open();}
    if(lt<0.35){s.st='pop';}

    // 位置
    const fx0=wx(s.from.u),fy0=wy(s.from.v),tx=wx(s.to.u),ty=wy(s.to.v);
    if(s.st==='fly'){const p=(lt-0.9)/s.dur;const e=s.type==='rug'?p:ease(p)*0.85+p*0.15;const lift=s.type==='shelf'?0.15:s.type==='rug'?0.32:0.25;

}
function landPlane(s){

    parts.push({k:'w',ox:wd.ox,oy:wd.oy,cx:wd.cx,cy:wd.cy,ex:wd.ex,ey:wd.ey,t:0,sp:(0.55+Math.random()*0.5)*(0.6+wd.s),off:(Math.random()-0.5)*2,spread:Math.max(wd.w.hw,wd.w.hh)*S*0.25+S*0.02,rot:Math.random()*6,vr:(Math.random()-0.5)*12,col:['red','yellow','navy','paper'][Math.floor(Math.random()*4)],sz:S*(0.009+Math.random()*0.011),hit:!!wd.hit});}}

/* ---------------- guidance (言葉なしの誘い) ---------------- */
function slitPt(i){const s=G.slits[i];return {x:wx(s.u),y:wy(s.v)};}
function winEdgePt(w,dir){const b=boxPx(w);return {x:b.cx+dir.x*b.rx*0.97,y:b.cy+dir.y*b.ry*0.97};}
function feedFor(tx,ty,exclude){

  for(const w of G.wins){if(w.closing||exclude.has(w))continue;if(inWin(w,tx,ty)<=1.1)continue;const x=wx(w.u),y=wy(w.v);const dx=tx-x,dy=ty-y;let dir=null,d=0;
    if(Math.abs(dy)<lim&&Math.abs(dx)>S*0.12){dir={x:Math.sign(dx),y:0};d=Math.abs(dx);}
    else if(Math.abs(dx)<lim&&Math.abs(dy)>S*0.12){dir={x:0,y:Math.sign(dy)};d=Math.abs(dy);}
    if(!dir||room(w,dir)<S*0.08)continue;

    const along=dir.x?w.hw:w.hh,perp=dir.x?w.hh:w.hw;if(along<perp*0.9)d+=S*0.5;
    if((invFail['w'+w.id+dir.x+dir.y]||0)>=2)continue;

  G.slits.forEach((s,i)=>{if(s.open)return;const x=wx(s.u),y=wy(s.v);const dx=tx-x,dy=ty-y;let dir=null,d=0;
    if(Math.abs(dy)<lim&&Math.abs(dx)>S*0.1){dir={x:Math.sign(dx),y:0};d=Math.abs(dx)+S*0.05;}
    else if(Math.abs(dx)<lim&&Math.abs(dy)>S*0.1){dir={x:0,y:Math.sign(dy)};d=Math.abs(dy)+S*0.05;}
    if(!dir||(invFail['s'+i+dir.x+dir.y]||0)>=2)return;c.push({kind:'slit',i,dir,d});});

}
function mkInvite(c){if(!c)return null;if(c.kind==='slit'){const p=slitPt(c.i);return {kind:'slit',i:c.i,x:p.x,y:p.y,dir:c.dir};}
  const p=winEdgePt(c.w,c.dir);return {kind:'edge',w:c.w,x:p.x,y:p.y,dir:c.dir};}
function faceSlitOf(ri){return G.slits.findIndex(s=>s.kind==='face'&&s.rid===ri);}
function computeInvite(){
  const d=G.disc;const open=G.wins.filter(w=>!w.closing);
  if(G.kid.state==='stuck'&&G.kid.stuckWin&&G.wins.indexOf(G.kid.stuckWin)>=0)return mkInvite({kind:'edge',w:G.kid.stuckWin,dir:{x:0,y:-1}});
  if(!open.length){const i=faceSlitOf(1);return mkInvite({kind:'slit',i:i>=0&&!G.slits[i].open?i:G.slits.findIndex(s=>!s.open),dir:{x:1,y:0}});}
  if(!d.face){const w=open[0];return mkInvite({kind:'edge',w,dir:{x:1,y:0}});}
  if(!d.wow||!d.chime){
    // 顔の見える窓を横へ長く → 横の吊り紙へ
    let best=null;
    for(const c of G.chimes){const f=feedFor(wx(c.u),wy(c.v),new Set());if(f&&(!best||f.d<best.d))best=f;}
    const fw=G.res.find(r=>r.vis&&r.win);
    if(!d.wow&&fw){const c=G.chimes.reduce((a,b)=>Math.abs(a.u-fw.u)<Math.abs(b.u-fw.u)?a:b);return mkInvite({kind:'edge',w:fw.win,dir:{x:Math.sign(c.u-fw.win.u)||1,y:0}});}
    if(best)return mkInvite(best);
  }
  if(!d.lantern){let best=null;for(const l of G.lans){const f=feedFor(wx(l.u),wy(l.v),new Set());if(f&&f.dir.y<0&&(!best||f.d<best.d))best=f;}if(best)return mkInvite(best);}
  if(!d.ball||!d.ballCmp){

    const lw=lowWins();
    if(!lw.length){let bi=-1,bd=9;G.slits.forEach((s,i)=>{if(!s.open&&s.kind==='low'){const dd=Math.abs(s.u-k.u);if(dd<bd){bd=dd;bi=i;}}});
      if(bi<0){bi=G.slits.findIndex(s=>!s.open&&s.v>0.7);}
      if(bi>=0)return mkInvite({kind:'slit',i:bi,dir:{x:0,y:-1}});}
    else if(!d.ball||k.state==='roll'||k.state==='go'||k.state==='hold'){/* 見守る */}
  }
  if(!d.pair){const v=G.res.map((r,i)=>i).filter(i=>G.res[i].vis);
    const others=G.res.map((r,i)=>i).filter(i=>!G.res[i].vis);
    if(others.length){others.sort((a,b)=>(v.length?Math.abs(G.res[a].u-G.res[v[0]].u)-Math.abs(G.res[b].u-G.res[v[0]].u):0));
      const ri=others[0];const si=faceSlitOf(ri);if(si>=0&&!G.slits[si].open)return mkInvite({kind:'slit',i:si,dir:{x:0,y:-1}});
      const r=G.res[ri];const w=G.wins.find(w=>w.s===si);if(w)return mkInvite({kind:'edge',w,dir:Math.abs(r.u-w.u)*L.wall.w>Math.abs(r.v-w.v)*L.wall.h?{x:Math.sign(r.u-w.u)||1,y:0}:{x:0,y:Math.sign(r.v-w.v)||-1}});}}
  // 紙飾り：二つの風、三つの風

const invFail={};

function tracePoint(){if(!trace||!trace.w.pts)return null;const n=trace.w.pts.length/2;const i=Math.floor((trace.t%1)*n)%n;return {x:trace.w.pts[i*2],y:trace.w.pts[i*2+1]};}

/* ---------------- drawing ---------------- */
function drawSlit(sl,i,inv){

}
function drawRoll(){
  const W=L.wall;const y=L.rollY,r=L.rollR;
  const p=pR(W.x-6,y-r,W.w+12,r*2,r);inkF(ctx,p,INK.yellow,'yellow',1);
  for(let x=W.x+10;x<W.x+W.w;x+=S*0.08)line(ctx,pLine(x,y-r*0.8,x+S*0.02,y+r*0.8),1,'rgba(227,83,58,0.45)');

function drawDemo(){

function drawFrontBalls(){

  for(let i=0;i<n;i++){const sz=G.balls[i];const d=BALL[sz]*S*0.7;const x=L.pile.x1-i*S*0.11-S*0.05;drawBall(clamp(x,L.pile.x0,L.pile.x1),L.pile.y-d*0.5,d,i*1.3);}

function drawWindParts(){
  // 風の筋
  for(const wd of winds){const steps=14;const p=new Path2D();const ph=(T*1.6)%1;
    for(let k=0;k<2;k++){const off=(k?-1:1)*Math.max(wd.w.hw,wd.w.hh)*S*0.12;let first=true;
      for(let i=0;i<=steps;i++){const t=i/steps;const q=bez(wd,t);const nx=-(wd.ey-wd.oy),ny=(wd.ex-wd.ox);const nl=hyp(nx,ny)||1;const o=off*(1-t*0.5)+Math.sin(t*9-T*8+k)*S*0.008;
        const X=q.x+nx/nl*o,Y=q.y+ny/nl*o;if(first){p.moveTo(X,Y);first=false;}else p.lineTo(X,Y);}}
    ctx.save();ctx.setLineDash([S*0.05,S*0.06]);ctx.lineDashOffset=-T*S*0.6*(0.5+wd.s);ctx.globalAlpha=0.35+wd.s*0.4;line(ctx,p,1.4,INK.navy);ctx.restore();}
  for(const p of parts){
    let x,y;if(p.k==='w'){const t=Math.min(1,p.t);const a=1-t;x=a*a*p.ox+2*a*t*p.cx+t*t*p.ex;y=a*a*p.oy+2*a*t*p.cy+t*t*p.ey;
      const nx=-(p.ey-p.oy),ny=(p.ex-p.ox);const nl=hyp(nx,ny)||1;const o=p.off*p.spread*(0.5+t)+Math.sin(p.t*12+p.rot)*S*0.008;x+=nx/nl*o;y+=ny/nl*o;
      if(p.t>1){const e=(p.t-1)/0.15;x+=(Math.random()-0.5)*S*0.02*e;}}
    else{x=p.x;y=p.y;}
    const al=p.k==='w'?clamp(Math.min(p.t*5,(1.15-p.t)*5),0,1):1;
    ctx.save();ctx.translate(x,y);ctx.rotate(p.rot);ctx.globalAlpha=al;const r=pR(-p.sz,-p.sz*0.6,p.sz*2,p.sz*1.2,1);
    const c=p.col==='paper'?INK.paper2:INK[p.col];inkF(ctx,r,c,p.col==='paper'?'none':p.col,1);line(ctx,r,0.8);ctx.restore();}
}
function drawFx(){
  for(const p of fx){const q=p.t/p.life;
    if(p.k==='ring'){ctx.save();ctx.globalAlpha=1-q;inkS(ctx,pC(p.x,p.y,p.r*(0.5+q)),p.col?INK[p.col]:INK.navy,p.col?4:1.5,p.col||'none',1);ctx.restore();}
    else if(p.k==='bit'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=1-q*q;const r=pR(-p.sz,-p.sz*0.6,p.sz*2,p.sz*1.2,1);inkF(ctx,r,INK[p.col],p.col,1);ctx.restore();}}
  // 壁越しのハート
  for(const h of hearts){const ax=wx(h.a.u),ay=wy(h.a.v)+S*0.05,bx=wx(h.b.u),by=wy(h.b.v)+S*0.05;const t=ease(h.t);const x=lerp(ax,bx,t),y=lerp(ay,by,t)-Math.sin(t*Math.PI)*S*0.18;const s=S*0.03*(1+Math.sin(t*Math.PI)*0.4);
    const p=new Path2D();p.moveTo(x,y+s*0.9);p.bezierCurveTo(x-s*1.6,y-s*0.2,x-s*0.6,y-s*1.3,x,y-s*0.4);p.bezierCurveTo(x+s*0.6,y-s*1.3,x+s*1.6,y-s*0.2,x,y+s*0.9);
    inkF(ctx,p,INK.red,'red',1);line(ctx,p,1.4);}
}
function drawTrace(){
  if(!trace||!trace.w.pts||G.wins.indexOf(trace.w)<0)return;const pts=trace.w.pts;const n=pts.length/2;const head=trace.t*n;
  for(let k=0;k<10;k++){const i=Math.floor(head-k*0.9);if(i<0)break;const j=(i%n)*2;const a=1-k/10;
    inkF(ctx,pC(pts[j],pts[j+1],S*(0.012+(trace.big?0.006:0))*a+1),INK.yellow,'yellow',a);}
  const tp=tracePoint();if(tp)inkF(ctx,pC(tp.x,tp.y,S*0.016),INK.red,'red',0.9);

function drawFlight(){
  if(!F)return;
  for(const s of F.sheets){if(!s.pos||s.st==='landed'||s.st==='wait')continue;const lt=F.t-s.start;
    const f=s.st==='pop'?0:s.st==='fold'?ease((lt-0.35)/0.55):1;
    const base=Math.max(s.hw,s.hh)*S;const tgt=clamp(base*0.8,S*0.11,S*0.26);const len=(s.st==='fly'?tgt*s.pos.sc:lerp(base,tgt,f))*(s.st==='pop'?lerp(0.9,1.04,ease(lt/0.35)):1);
    const pts=planeVert(s.flat,f);
    drawPlane(pts,s.pos.x,s.pos.y,len,s.pos.ang,s.col,s.st==='fly'?s.pos.bank:f*0.5,f);
  }
  if(F.stage==='gather'){const x=wx(F.mx),y=wy(F.my);inkF(ctx,pC(x,y,S*0.11*(0.5+F.t)),INK.yellow,'yellow',0.25);}
}
function renderWallLayer(){
  const g=wlX;const W=L.wall;
  g.setTransform(DPR,0,0,DPR,0,0);g.globalCompositeOperation='source-over';g.clearRect(0,0,W.w,W.h);g.drawImage(wallTexC,0,0,W.w,W.h);
  g.globalCompositeOperation='destination-out';
  for(const w of G.wins){if(w.pts)g.fill(pSmooth(w.pts,W.x,W.y));}
  // 切れ目のすき間（向こうがちらりと見える）
  if(!F)for(const sl of G.slits){if(sl.open)continue;const x=wx(sl.u)-W.x,y=wy(sl.v)-W.y,len=S*0.045,hw=sl.peek?S*0.017:S*0.006;const ca=Math.cos(sl.a),sa=Math.sin(sl.a);
    const p=new Path2D();p.moveTo(x-ca*len,y-sa*len);p.quadraticCurveTo(x-sa*hw*2,y+ca*hw*2,x+ca*len,y+sa*len);p.quadraticCurveTo(x+sa*hw*2,y-ca*hw*2,x-ca*len,y-sa*len);g.fill(p);}
  if(F&&F.laceR>0){g.save();g.setTransform(1,0,0,1,0,0);g.beginPath();g.arc((wx(F.mx)-W.x)*DPR,(wy(F.my)-W.y)*DPR,F.laceR*DPR,0,TAU);g.clip();g.fillStyle=g.createPattern(laceTile,'repeat');g.fillRect(0,0,W.w*DPR,W.h*DPR);g.restore();}
  g.globalCompositeOperation='source-over';
}
function render(){
  const W=L.wall;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.drawImage(bgC,0,0,VW,VH);

  if(F||curtain){ctx.rect(W.x,W.y,W.w,W.h);}
  else{ // 見える部分（窓・切れ目）だけ描く
    for(const w of G.wins){if(!w.pts)continue;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(let i=0;i<w.pts.length;i+=2){const x=w.pts[i],y=w.pts[i+1];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
      const gx=Math.max(x0-4,W.x),gy=Math.max(y0-4,W.y);ctx.rect(gx,gy,Math.min(x1+4,W.x+W.w)-gx,Math.min(y1+4,W.y+W.h)-gy);}
    for(const sl of G.slits){if(sl.open)continue;const r=S*0.05;ctx.rect(wx(sl.u)-r,wy(sl.v)-r,r*2,r*2);}
  }

  ctx.drawImage(roomC,W.x,W.y,W.w,W.h);drawBack();
  ctx.restore();
  // 壁

  const lace=F?clamp(F.laceR/(hyp(W.w,W.h)*0.6),0,1):0;
  ctx.globalAlpha=1-lace*0.62;ctx.drawImage(wlC,W.x,W.y,W.w,W.h);ctx.globalAlpha=1;
  line(ctx,pR(W.x,W.y,W.w,W.h,2),2);
  // 窓の縁と切れ目
  ctx.save();if(curtain){ctx.beginPath();ctx.rect(W.x-20,curtain.y,W.w+40,VH);ctx.clip();}
  if(!F){G.slits.forEach((sl,i)=>{if(!sl.open)drawSlit(sl,i,invite&&invite.kind==='slit'&&invite.i===i);});}

/* ---------------- save / load ---------------- */
const KEY='gf261106_6_wall_v1';
let storageOK=true;
function serialize(){
  return {ver:1,seed:G.seed,first:G.first,
    slits:G.slits.map(s=>[+s.u.toFixed(4),+s.v.toFixed(4)]),
    wins:G.wins.filter(w=>!w.closing).map(w=>({s:w.s,u:+w.u.toFixed(4),v:+w.v.toFixed(4),hw:+w.hw.toFixed(4),hh:+w.hh.toFixed(4),n:w.n.map(x=>+x.toFixed(3)),px:w.px,py:w.py})),
    balls:G.balls.slice(-9),planes:G.planes.slice(-12),disc:G.disc,kidNext:G.kidNext,flights:G.flights};
}
function save(){if(!storageOK)return;try{localStorage.setItem(KEY,JSON.stringify(serialize()));}catch(e){storageOK=false;}}
const fin=(x,a,b)=>typeof x==='number'&&isFinite(x)&&x>=a&&x<=b;
function validate(o){
  if(!o||typeof o!=='object'||o.ver!==1)return false;
  if(!fin(o.seed,0,4294967296))return false;
  if(!Array.isArray(o.slits)||o.slits.length!==8)return false;
  for(const s of o.slits){if(!Array.isArray(s)||!fin(s[0],0,1)||!fin(s[1],0,1))return false;}
  if(!Array.isArray(o.wins)||o.wins.length>8)return false;
  const used=new Set();
  for(const w of o.wins){if(!w||!Number.isInteger(w.s)||w.s<0||w.s>7||used.has(w.s))return false;used.add(w.s);
    if(!fin(w.u,0,1)||!fin(w.v,0,1)||!fin(w.hw,0.02,0.7)||!fin(w.hh,0.02,0.7))return false;
    if(!Array.isArray(w.n)||w.n.length!==4||!w.n.every(x=>fin(x,1,3)))return false;
    if(![-1,0,1].includes(w.px)||![-1,0,1].includes(w.py))return false;}
  if(!Array.isArray(o.balls)||o.balls.length>9||!o.balls.every(b=>b===0||b===1||b===2))return false;
  if(!Array.isArray(o.planes)||o.planes.length>12)return false;
  for(const p of o.planes){if(!p||!Array.isArray(p.p)||p.p.length<6||p.p.length>80||!p.p.every(x=>fin(x,-3,3)))return false;
    if(!Number.isInteger(p.c)||p.c<0||p.c>3||!fin(p.u,0,1)||!fin(p.v,0,1)||!fin(p.s,0.01,0.5)||!fin(p.r,-4,4))return false;}
  if(!o.disc||typeof o.disc!=='object')return false;
  if(!Number.isInteger(o.kidNext)||o.kidNext<0||o.kidNext>2)return false;
  if(!Number.isInteger(o.flights)||o.flights<0)return false;
  return true;
}
let loadResult='fresh';
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){storageOK=false;loadResult='denied';return null;}
  if(raw==null){loadResult='fresh';return null;}
  try{const o=JSON.parse(raw);if(validate(o)){loadResult='restored';return o;}}catch(e){}
  loadResult='corrupt';return null;
}
function applySave(o){
  genLayout(o.seed,!!o.first);
  o.slits.forEach((s,i)=>{G.slits[i].u=s[0];G.slits[i].v=s[1];});
  G.wins=[];
  for(const sw of o.wins){const w=mkWin(sw.s,sw.u,sw.v,sw.hw,sw.hh);w.n=sw.n.slice();w.px=sw.px;w.py=sw.py;
    w.d.u=sw.u;w.d.v=sw.v;w.d.hw=sw.hw;w.d.hh=sw.hh;w.g.u=sw.u;w.g.v=sw.v;w.g.hw=sw.hw;w.g.hh=sw.hh;
    G.wins.push(w);G.slits[sw.s].open=true;}
  G.balls=o.balls.slice();G.planes=o.planes.map(p=>({p:p.p.slice(),c:p.c,u:p.u,v:p.v,s:p.s,r:p.r,st:typeof p.st==='string'?p.st:null,si:Number.isInteger(p.si)?p.si:-1}));
  G.disc={};for(const k in o.disc){if(o.disc[k]===1)G.disc[k]=1;}
  G.kidNext=o.kidNext;G.flights=o.flights;G.armed=false;
  wallDirty=true;
}

/* ---------------- main loop ---------------- */
let raf=0,lastTs=0,running=false;
function update(dt){
  T+=dt;
  updateWins(dt);
  computeWinds();
  updateDecor(dt);
  updateResidents(dt);
  updateKid(dt);
  updateFlightTrigger(dt);
  updateFlight(dt);
  updateCurtain(dt);
  updateParts(dt);
  updateGuide(dt);
  audioFrame(dt);
  if(saveDirty){saveT+=dt;if(saveT>0.6&&!drag){saveT=0;saveDirty=false;save();}}
}
function frame(ts){
  if(!running)return;
  raf=requestAnimationFrame(frame);
  const dt=lastTs?Math.min(0.05,Math.max(0,(ts-lastTs)/1000)):0.016;lastTs=ts;
  const t0=performance.now();update(dt);const t1=performance.now();render();perf.u=perf.u*0.9+(t1-t0)*0.1;perf.r=perf.r*0.9+(performance.now()-t1)*0.1;
}
const perf={u:0,r:0};
function start(){if(running)return;running=true;lastTs=0;raf=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(raf);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();if(drag){pointerId=null;onUp(true);}if(saveDirty){saveDirty=false;save();}if(AU.c&&AU.c.state==='running'){try{AU.c.suspend();}catch(e){}}}
  else{start();if(AU.c&&AU.c.state==='suspended'){try{AU.c.resume();}catch(e){}}}
});
window.addEventListener('pagehide',()=>{if(saveDirty)save();});
let rzT=0;
function onResize(){doLayout();fixLowSlits();for(const w of G.wins){w.pts=null;}updateWins(0);wallDirty=true;}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>{onResize();});

// 起動
doLayout();
const saved=load();
if(saved){applySave(saved);}else{freshWorld(1,true);}
wallDirty=true;
updateWins(0);
start();

// 検証用フック（ゲーム内で通信や表示には使わない）
window.__gf={G,get winds(){return winds;},get invite(){return invite;},get demo(){return demo;},get F(){return F;},get pair(){return pair;},get curtain(){return curtain;},
  L,get S(){return S;},wx,wy,floorY,DISC_LOG,get loadResult(){return loadResult;},get storageOK(){return storageOK;},save,serialize,
  get T(){return T;},get running(){return running;},audio:()=>AU.c?AU.c.state:'none',counts:()=>({parts:parts.length,fx:fx.length}),perf:()=>({u:+perf.u.toFixed(2),r:+perf.r.toFixed(2)})};
})();
