<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
// =====================================================================
//  かちん、ぱたん！タイルのおへやとひっくり広場  (arrange_craft / mosaic)
//  三つの陶片の部屋（パン・絵付け・音楽）を一本指で寄せる → 接した境目が共有家具に
//  パン+絵付け=共有棚 / 絵付け+音楽=共用窓 / パン+音楽=呼び鈴カウンター
//  離す→ぱたんと畳まれ持ち物が戻る / 三室を角・一列で接する→丸い・長い食卓
//  食卓で三人が持ち寄り交流→壁が外へ倒れて広場へ反転（棚→食卓・窓→ベンチ・カウンター→演奏台）
//  広場の取っ手を引くと仕切りが起きて初期配置へ戻る（記憶は残る）
// =====================================================================
const cv=document.getElementById('c');
const g=cv.getContext('2d');
const saEl=document.getElementById('sa');
let W=0,H=0,DPR=1,S=120,BAND=10,CX=0,CY=0,SA={t:0,r:0,b:0,l:0};
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, hyp=Math.hypot;
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R0=mulberry(2611061717);
const rnd=()=>R0();

// ---------- palette: grout + 4 main colours expanded to 7 tones ----------
const C={grout:'#1b2131',ver:'#d2452b',coral:'#ec8b6b',teal:'#23998b',dteal:'#16625d',yel:'#efb12d',white:'#f4f0e5',gray:'#cdc6b4'};
const GROUT_A=a=>'rgba(27,33,49,'+a+')';
const WHITE_A=a=>'rgba(255,253,245,'+a+')';

// ---------- helpers ----------
function pathPts(c,p){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();}
function jit(n,seed,amt){const r=mulberry(seed),a=[];for(let i=0;i<n;i++)a.push(1-amt*0.6+r()*amt);return a;}
function blob(cx,cy,rx,ry,j,rot){const n=j.length,p=[];rot=rot||0;for(let i=0;i<n;i++){const a=rot+i*TAU/n;p.push(cx+Math.cos(a)*rx*j[i],cy+Math.sin(a)*ry*j[i]);}return p;}
function tf(p,col,lw){pathPts(g,p);g.fillStyle=col;g.fill();if(lw>0){g.lineWidth=lw;g.strokeStyle=C.grout;g.lineJoin='round';g.stroke();}}
function gloss(x,y,r,a){g.fillStyle=WHITE_A(a==null?0.45:a);g.beginPath();g.ellipse(x,y,Math.max(0.5,r),Math.max(0.5,r*0.55),-0.5,0,TAU);g.fill();}
function quadRect(x0,y0,x1,y1){return [x0,y0,x1,y0,x1,y1,x0,y1];}
const J9=jit(9,11,0.18),J11=jit(11,12,0.14),J7=jit(7,13,0.22),J12=jit(12,14,0.08),J8=jit(8,15,0.2),J10=jit(10,16,0.16);
function LW(){return Math.max(1.2,S*0.011);}

// ---------- offscreen canvases ----------
function mk(w,h,scale){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*scale));c.height=Math.max(1,Math.ceil(h*scale));const x=c.getContext('2d');x.scale(scale,scale);return [c,x];}
function texTile(c,p,col,r,rng){
  pathPts(c,p);c.fillStyle=col;c.fill();
  let cx=0,cy=0;const n=p.length/2;for(let i=0;i<p.length;i+=2){cx+=p[i];cy+=p[i+1];}cx/=n;cy/=n;
  c.save();pathPts(c,p);c.clip();
  c.fillStyle='rgba(255,255,255,0.10)';c.beginPath();c.ellipse(cx-r*0.25,cy-r*0.3,r*0.8,r*0.55,0,0,TAU);c.fill();
  c.fillStyle='rgba(16,20,36,0.17)';c.beginPath();c.ellipse(cx+r*0.5,cy+r*0.55,r*0.85,r*0.5,0,0,TAU);c.fill();
  if(rng()<0.35){ // 貫入
    c.strokeStyle='rgba(27,33,49,0.26)';c.lineWidth=0.6;c.beginPath();
    let x=cx+(rng()-0.5)*r,y=cy+(rng()-0.5)*r;c.moveTo(x,y);
    for(let k=0;k<3;k++){x+=(rng()-0.5)*r*0.9;y+=(rng()-0.5)*r*0.9;c.lineTo(x,y);}c.stroke();
  }
  if(rng()<0.32){c.fillStyle='rgba(255,255,255,0.33)';c.beginPath();c.ellipse(cx-r*0.32,cy-r*0.34,r*0.2,r*0.1,-0.6,0,TAU);c.fill();}
  c.restore();
  c.lineWidth=Math.max(1,r*0.13);c.strokeStyle=C.grout;c.lineJoin='round';pathPts(c,p);c.stroke();
}
function tileAt(c,cx,cy,r,col,rng){
  const n=5+((rng()*3)|0),a0=rng()*TAU,p=[];
  for(let k=0;k<n;k++){const a=a0+k*TAU/n+(rng()-0.5)*0.55;let rr=r*(0.8+rng()*0.26);if(rng()<0.1)rr*=0.72;p.push(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*0.95);}
  texTile(c,p,col,r,rng);
}
function mosaicArea(c,x0,y0,w,h,sp,colFn,rng){
  const rowH=sp*0.84;let row=0;
  for(let y=y0-sp*0.2;y<y0+h+sp*0.5;y+=rowH*(0.9+rng()*0.2),row++){
    const off=(row%2)*sp*0.5+(rng()-0.5)*sp*0.3;
    for(let x=x0-sp+off;x<x0+w+sp;x+=sp*(0.82+rng()*0.32)){
      const cx=x+(rng()-0.5)*sp*0.22,cy=y+(rng()-0.5)*sp*0.22;
      const col=colFn(cx,cy,rng);if(!col)continue;
      tileAt(c,cx,cy,sp*0.6*(0.9+rng()*0.16),col,rng);
    }
  }
}
// decorative object built from tiles (polygon split into pieces)
function texPoly(c,p,col,rng,r){texTile(c,p,col,r||S*0.05,rng);}
function texWedges(c,cx,cy,r0,r1,a0,a1,n,cols,rng){
  for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/n,b=a0+(a1-a0)*(i+1)/n;const j=()=>1+(rng()-0.5)*0.08;
    const p=[cx+Math.cos(a)*r0*j(),cy+Math.sin(a)*r0*j(),cx+Math.cos(a)*r1*j(),cy+Math.sin(a)*r1*j(),cx+Math.cos(b)*r1*j(),cy+Math.sin(b)*r1*j(),cx+Math.cos(b)*r0*j(),cy+Math.sin(b)*r0*j()];
    texTile(c,p,cols[i%cols.length],(r1-r0)*0.8,rng);}
}

// ---------- rooms ----------
const RD=[
  {key:'bake', floor:[C.yel,C.yel,C.white,C.gray,C.yel], wall:[C.ver,C.coral,C.ver,C.ver], seed:101},
  {key:'paint',floor:[C.white,C.gray,C.white,C.white], wall:[C.teal,C.dteal,C.teal], seed:202},
  {key:'music',floor:[C.coral,C.white,C.coral,C.coral,C.gray], wall:[C.yel,C.yel,C.white,C.yel], seed:303},
];
const rooms=RD.map((d,i)=>({i,d,x:0,y:0,u:0,v:0,tx:0,ty:0,sx:0,sy:0,drag:false,snapping:false,held:false,press:0,sq:0,sqv:0,tex:null,shard:null}));
function shardPts(seed){
  const r=mulberry(seed),p=[],n=7;
  const corners=[[0,0],[1,0],[1,1],[0,1]];
  for(let s=0;s<4;s++){const a=corners[s],b=corners[(s+1)%4];
    for(let k=0;k<n;k++){const t=k/n;let x=lerp(a[0],b[0],t),y=lerp(a[1],b[1],t);
      const inset=(k===0?0.018:0.004+r()*0.012);
      x+= (x<0.5?1:-1)*(Math.abs(x-0.5)>0.49?inset:0); y+=(y<0.5?1:-1)*(Math.abs(y-0.5)>0.49?inset:0);
      p.push(x,y);}}
  return p;
}
function genRoom(rm){
  const d=rm.d,sc=DPR;
  const sh=shardPts(d.seed);rm.shard=sh;
  const P=sh.map(v=>v*S);
  const [fc,f]=mk(S,S,sc);
  const rng=mulberry(d.seed+7);
  f.save();pathPts(f,P);f.clip();
  f.fillStyle=C.grout;f.fillRect(0,0,S,S);
  mosaicArea(f,0,0,S,S,S/9.5,(x,y,r)=>d.floor[(r()*d.floor.length)|0],rng);
  // soft inner shadow near the walls
  const gr=f.createLinearGradient(0,BAND,0,BAND+S*0.09);gr.addColorStop(0,'rgba(27,33,49,0.38)');gr.addColorStop(1,'rgba(27,33,49,0)');
  f.fillStyle=gr;f.fillRect(0,BAND,S,S*0.09);
  decor(f,rm.i,rng);
  f.restore();
  const [wc,w]=mk(S,S,sc);
  w.save();pathPts(w,P);w.rect(BAND,BAND,S-2*BAND,S-2*BAND);w.clip('evenodd');
  w.fillStyle=C.grout;w.fillRect(0,0,S,S);
  const rng2=mulberry(d.seed+9);
  mosaicArea(w,0,0,S,S,BAND*1.0,(x,y,r)=>{if(x>BAND*1.05&&x<S-BAND*1.05&&y>BAND*1.05&&y<S-BAND*1.05)return null;return d.wall[(r()*d.wall.length)|0];},rng2);
  w.strokeStyle='rgba(255,255,255,0.18)';w.lineWidth=1.5;w.strokeRect(BAND*0.3,BAND*0.3,S-BAND*0.6,S-BAND*0.6);
  w.strokeStyle=C.grout;w.lineWidth=2.5;w.strokeRect(BAND,BAND,S-2*BAND,S-2*BAND);
  w.restore();
  rm.tex={floor:fc,wall:wc};
}
function decor(c,i,rng){
  const X=v=>S*(0.5+v);
  if(i===0){ // oven + basket
    const ox=X(-0.22),oy=X(-0.17);
    texWedges(c,ox,oy,S*0.085,S*0.16,PI,TAU,7,[C.ver,C.coral,C.ver],rng);
    c.fillStyle=C.grout;c.beginPath();c.arc(ox,oy,S*0.085,PI,TAU);c.closePath();c.fill();
    for(let k=0;k<4;k++){const fx=ox-S*0.06+k*S*0.04;texPoly(c,[fx-S*0.018,oy,fx,oy-S*0.05-rng()*S*0.02,fx+S*0.018,oy],k%2?C.yel:C.coral,rng,S*0.02);}
    for(let k=0;k<4;k++){const bx=ox-S*0.16+k*S*0.08;texPoly(c,quadRect(bx,oy+S*0.005,bx+S*0.08,oy+S*0.06),k%2?C.gray:C.white,rng,S*0.035);}
    const bx=X(0.25),by=X(0.33);
    const bp=blob(bx,by,S*0.13,S*0.055,J12);texTile(c,bp,C.coral,S*0.05,rng);
    c.strokeStyle=GROUT_A(0.5);c.lineWidth=1;for(let k=-3;k<=3;k++){c.beginPath();c.moveTo(bx+k*S*0.03,by-S*0.045);c.lineTo(bx+k*S*0.03+S*0.012,by+S*0.05);c.stroke();}
  }else if(i===1){ // easel + rack + pots
    const ex=X(0.25),ey=X(-0.2);
    c.strokeStyle=C.grout;c.lineWidth=S*0.03;c.lineCap='round';
    c.beginPath();c.moveTo(ex-S*0.08,ey+S*0.2);c.lineTo(ex,ey-S*0.12);c.lineTo(ex+S*0.08,ey+S*0.2);c.stroke();
    c.strokeStyle=C.dteal;c.lineWidth=S*0.018;c.stroke();
    texPoly(c,quadRect(ex-S*0.11,ey-S*0.12,ex+S*0.11,ey+S*0.06),C.white,rng,S*0.06);
    texWedges(c,ex,ey-S*0.03,S*0.02,S*0.07,0,TAU,6,[C.teal,C.yel,C.ver],rng);
    texPoly(c,quadRect(X(-0.42),X(0.335),X(-0.06),X(0.375)),C.yel,rng,S*0.03);
    const cols=[C.ver,C.teal,C.yel];
    for(let k=0;k<3;k++){const px=X(-0.33+k*0.075),py=X(-0.3);texTile(c,blob(px,py,S*0.03,S*0.026,J8),C.gray,S*0.02,rng);texTile(c,blob(px,py-S*0.008,S*0.02,S*0.012,J8),cols[k],S*0.015,rng);}
  }else{ // chimes + drum
    const cx=X(0.22),cy=X(-0.36);
    texPoly(c,quadRect(cx-S*0.15,cy,cx+S*0.15,cy+S*0.025),C.dteal,rng,S*0.03);
    for(let k=0;k<5;k++){const bx=cx-S*0.12+k*S*0.06,L=S*(0.17-k*0.022);texPoly(c,quadRect(bx-S*0.018,cy+S*0.03,bx+S*0.018,cy+S*0.03+L),k%2?C.white:C.yel,rng,S*0.025);}
    const dx=X(-0.26),dy=X(0.3);
    texPoly(c,[dx-S*0.1,dy-S*0.02,dx+S*0.1,dy-S*0.02,dx+S*0.09,dy+S*0.08,dx-S*0.09,dy+S*0.08],C.ver,rng,S*0.05);
    texTile(c,blob(dx,dy-S*0.02,S*0.1,S*0.035,J12),C.white,S*0.05,rng);
    c.strokeStyle=C.grout;c.lineWidth=1.5;for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(dx+k*S*0.04,dy+S*0.01);c.lineTo(dx+k*S*0.04+S*0.02,dy+S*0.075);c.stroke();}
  }
}
let bgIn=null,bgOut=null;
function genBg(out){
  const [c,x]=mk(W,H,1);
  x.fillStyle=C.grout;x.fillRect(0,0,W,H);
  const rng=mulberry(out?7771:5551);const sp=Math.max(24,S/6.2);
  if(!out){
    const cols=['rgba(22,98,93,0.26)','rgba(35,153,139,0.14)','rgba(22,98,93,0.18)','rgba(205,198,180,0.06)'];
    mosaicArea(x,0,0,W,H,sp,(cx,cy,r)=>r()<0.18?null:cols[(r()*cols.length)|0],rng);
  }else{
    const sx=W*0.86,sy=H*0.1;
    mosaicArea(x,0,0,W,H,sp*1.1,(cx,cy,r)=>{
      const ds=hyp(cx-sx,cy-sy);
      if(ds<sp*1.5)return r()<0.5?C.yel:'rgba(244,240,229,0.9)';
      if(ds<sp*2.5)return r()<0.6?'rgba(210,69,43,0.85)':'rgba(236,139,107,0.8)';
      const ring=Math.floor(hyp(cx-W/2,cy-H*0.55)/(sp*2.6));
      if(ring%3===0&&r()<0.6)return r()<0.5?'rgba(244,240,229,0.55)':'rgba(205,198,180,0.5)';
      return r()<0.55?'rgba(35,153,139,0.62)':(r()<0.6?'rgba(22,98,93,0.7)':'rgba(35,153,139,0.45)');
    },rng);
    x.fillStyle='rgba(255,240,200,0.06)';x.fillRect(0,0,W,H);
  }
  return c;
}

// ---------- persons ----------
const PD=[
  {who:'baker',room:0,body:C.ver,legs:C.gray,hat:'chef',hair:C.dteal,home:[0.02,0.2],pitch:1.0},
  {who:'painter',room:1,body:C.yel,legs:C.teal,hat:'beret',hair:C.ver,home:[0.04,0.2],pitch:1.26},
  {who:'musician',room:2,body:C.dteal,legs:C.gray,hat:'cap',hair:C.yel,home:[-0.02,0.2],pitch:1.5},
];
const persons=PD.map((d,i)=>({i,d,rx:d.home[0],ry:d.home[1],trx:d.home[0],try_:d.home[1],seat:0,seatT:0,face:1,gx:0,gy:0.3,look:null,mood:0,moodT:0,act:null,reach:null,reachT:0,jumpT:1,blink:2+i,lookFront:0,waveT:3+i*1.7,walk:0,bob:0,fx:0,fy:0,hF:{x:0,y:0},hB:{x:0,y:0},shF:{x:0,y:0},shB:{x:0,y:0},head:{x:0,y:0},ground:0}));
function setMood(p,m,t){p.mood=m;p.moodT=t||1.2;}
function doAct(p,k,d,amp){p.act={k,t:0,d,amp:amp||0};}
function reachTo(p,pt,t){p.reach={x:pt.x,y:pt.y};p.reachT=t||0.6;}

// ---------- items (conserved: 4 breads, 3 plates) ----------
const items=[];
for(let k=0;k<4;k++)items.push({id:'b'+k,kind:'bread',owner:0,idx:k,shape:[0,1,2,0][k],holder:{t:'home'},x:0,y:0,fly:false,d0:0});
for(let k=0;k<3;k++)items.push({id:'p'+k,kind:'plate',owner:1,idx:k,strokes:[],holder:{t:'home'},x:0,y:0,fly:false,d0:0});
const byId=id=>items.find(it=>it.id===id);
const plates=items.filter(it=>it.kind==='plate'),breads=items.filter(it=>it.kind==='bread');
const BREAD_HOME=[[0.19,0.3],[0.29,0.31],[0.24,0.26],[0.33,0.26]];
const PLATE_HOME=[[-0.36,0.315],[-0.25,0.315],[-0.14,0.315]];
function setHolder(it,h){it.holder=h;it.fly=true;const t=holderPos(it);it.d0=Math.max(1,hyp(t.x-it.x,t.y-it.y));}
function breadOn(pl){return breads.find(b=>b.holder.t==='plate'&&b.holder.id===pl.id)||null;}
function locWho(it){const h=it.holder;
  if(h.t==='home')return it.owner; if(h.t==='hand')return h.who; if(h.t==='f')return 'f:'+h.key;
  if(h.t==='plate')return locWho(byId(h.id)); return h.t;}

// ---------- furniture ----------
const KIND_IN={bp:'shelf',bm:'counter',pm:'window'},KIND_OUT={bp:'otable',bm:'stage',pm:'bench'};
const furn={};
[['bp',0,1],['bm',0,2],['pm',1,2]].forEach(([k,a,b])=>{furn[k]={key:k,a,b,active:false,vis:0,visV:0,preview:0,info:null,busy:0,autoT:0,beatT:0,beatN:0,chain:0,lastRing:-9,bell:0,wig:0,t0:0,fold:0};});
const FK=['bp','bm','pm'];
function keyOf(i,j){const a=Math.min(i,j),b=Math.max(i,j);return a===0&&b===1?'bp':a===0?'bm':'pm';}
function sideOf(f,pi){return pi===f.a?-1:1;} // sign along n (n points a->b)
function along(inf){return inf.axis==='h'?{x:0,y:1}:{x:1,y:0};}
function fpos(f,s,o){const inf=f.info,al=along(inf);return {x:inf.cx+inf.nx*s*S+al.x*o*S,y:inf.cy+inf.ny*s*S+al.y*o*S};}
function toLocal(inf,x,y){const al=along(inf);const dx=x-inf.cx,dy=y-inf.cy;return {u:dx*inf.nx+dy*inf.ny,w:dx*al.x+dy*al.y};}

const tri={active:false,type:null,geo:null,vis:0,step:0,busy:0,wig:0,dish:null};

// ---------- global state ----------
let mode='in';      // 'in' | 'flipping' | 'plaza' | 'folding'
let flipT=0;        // 0 indoor .. 1 plaza
let gt=0, lastInput=0, started=false;
const mem={bread:0,plate:0,song:[0,2,4,2,5,4],painted:-1};
function newCyc(old){const c={d1:0,d2:0,d3:0,d4:0,d5:0,plazaMoved:0,plazaPlayed:0};if(old)['d1','d2','d3','d4','d5'].forEach(k=>c[k]=old[k]);return c;}
let cyc=newCyc();
const disc={shelf:0,dirs:{},window:0,patKinds:{},counter:0,maxChain:0,fold:0,reconnect:0,hub:0,line:0,plaza:0,plazaKinds:{},plazaPlays:0,foldBack:0,improv:0};
const evlog=[];function logEv(e){evlog.push([+gt.toFixed(2),e]);if(evlog.length>300)evlog.shift();}
let foldedKeys={}; // keys folded in this cycle (for reconnect detection)

      noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.8),AC.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
      const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);try{s.start(0);}catch(e){}

function tone(f,dur,type,vol,delay,f2){

    if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur*0.8);
    gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+0.006);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(gn);gn.connect(master);o.start(t);o.stop(t+dur+0.05);}catch(e){}
}
function noise(dur,vol,ft,freq,delay,q,f2){
  if(!AC||AC.state!=='running'||!noiseBuf)return;

}
const PENT=[0,2,4,7,9];

// ---------- layout ----------
function readSA(){const cs=getComputedStyle(saEl);SA={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}
function bounds(){return {x0:SA.l+S/2+2,x1:W-SA.r-S/2-2,y0:SA.t+S/2+2,y1:H-SA.b-S/2-2};}
function inBounds(x,y){const b=bounds();return x>=b.x0-0.6&&x<=b.x1+0.6&&y>=b.y0-0.6&&y<=b.y1+0.6;}

function initialUV(){
  const aw=W-SA.l-SA.r,ah=H-SA.t-SA.b,land=aw>ah;
  const lng=land?aw:ah,sht=land?ah:aw;const gap=(lng-3*S)/4;
  const al=[0,-S-gap,S+gap];const off=land?[0.38,-0.45,-0.32]:[0.14,-0.62,0.62];const sh=(sht-S)/2;
  return [0,1,2].map(i=>land?[al[i]/S,off[i]*sh/S]:[off[i]*sh/S,al[i]/S]);
}
function uvToXY(){rooms.forEach(r=>{r.x=CX+r.u*S;r.y=CY+r.v*S;});}
function xyToUV(r){r.u=(r.x-CX)/S;r.v=(r.y-CY)/S;}
function anyOverlap(){for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){const a=rooms[i],b=rooms[j];if(Math.abs(a.x-b.x)<S-2&&Math.abs(a.y-b.y)<S-2)return true;}return false;}
function fitLayout(){
  const aw=W-SA.l-SA.r,ah=H-SA.t-SA.b;
  const bb=()=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;rooms.forEach(r=>{x0=Math.min(x0,r.u-0.5);x1=Math.max(x1,r.u+0.5);y0=Math.min(y0,r.v-0.5);y1=Math.max(y1,r.v+0.5);});return {x0,x1,y0,y1};};
  let b=bb();
  if((b.x1-b.x0)*S>aw+1||(b.y1-b.y0)*S>ah+1){const tb={w:(b.y1-b.y0)*S,h:(b.x1-b.x0)*S};if(tb.w<=aw+1&&tb.h<=ah+1)rooms.forEach(r=>{const t=r.u;r.u=r.v;r.v=t;});b=bb();}
  const cu=(b.x0+b.x1)/2,cv2=(b.y0+b.y1)/2;const hu=aw/S/2,hv=ah/S/2;
  let su=0,sv=0;if(b.x0<-hu)su=-hu-b.x0;if(b.x1>hu)su=hu-b.x1;if(b.y0<-hv)sv=-hv-b.y0;if(b.y1>hv)sv=hv-b.y1;
  rooms.forEach(r=>{r.u+=su;r.v+=sv;});uvToXY();rooms.forEach(r=>{clampB(r);xyToUV(r);});
  if(anyOverlap()){const iu=initialUV();rooms.forEach((r,i)=>{r.u=iu[i][0];r.v=iu[i][1];});uvToXY();}
}
function resize(){

// ---------- geometry of contacts ----------
function cinfo(A,B){
  const dx=B.x-A.x,dy=B.y-A.y,adx=Math.abs(dx),ady=Math.abs(dy),gx=adx-S,gy=ady-S;let o;
  if(gx>=gy){const sx=dx>=0?1:-1;o={axis:'h',nx:sx,ny:0,gap:gx,ov:S-ady,cx:A.x+sx*(S/2+Math.max(0,gx)/2),cy:(Math.max(A.y,B.y)-S/2+Math.min(A.y,B.y)+S/2)/2};}
  else{const sy=dy>=0?1:-1;o={axis:'v',nx:0,ny:sy,gap:gy,ov:S-adx,cx:(Math.max(A.x,B.x)-S/2+Math.min(A.x,B.x)+S/2)/2,cy:A.y+sy*(S/2+Math.max(0,gy)/2)};}
  o.gx=gx;o.gy=gy;return o;
}
function touch(inf,len){return inf.gap<=(len?7:3)&&inf.gap>=-4&&inf.ov>=S*(len?0.1:0.18);}
function detectTri(len){
  const tol=len?0.2:0.12;
  for(let X=0;X<3;X++){const o=[0,1,2].filter(j=>j!==X);const A=rooms[X];
    const i1=cinfo(A,rooms[o[0]]),i2=cinfo(A,rooms[o[1]]);
    if(!touch(i1,len)||!touch(i2,len))continue;
    if(i1.axis!==i2.axis){
      const hI=i1.axis==='h'?i1:i2,vI=i1.axis==='h'?i2:i1;const Yh=rooms[i1.axis==='h'?o[0]:o[1]],Zv=rooms[i1.axis==='h'?o[1]:o[0]];
      if(Math.abs(Yh.y-A.y)<S*tol&&Math.abs(Zv.x-A.x)<S*tol&&Math.abs(Math.abs(Yh.x-Zv.x)-S)<S*(tol+0.05)&&Math.abs(Math.abs(Yh.y-Zv.y)-S)<S*(tol+0.05))
        return {type:'hub',x:A.x+hI.nx*S/2,y:A.y+vI.ny*S/2,corner:X};
    }else if(i1.nx*i2.nx+i1.ny*i2.ny<0){
      const ax=i1.axis;const perp=r=>ax==='h'?Math.abs(r.y-A.y):Math.abs(r.x-A.x);
      if(perp(rooms[o[0]])<S*tol*1.3&&perp(rooms[o[1]])<S*tol*1.3){
        const ord=[0,1,2].sort((p,q)=>ax==='h'?rooms[p].x-rooms[q].x:rooms[p].y-rooms[q].y);
        return {type:'line',axis:ax,mid:X,order:ord};
      }
    }
  }
  return null;
}
function sidePositions(O,off){const r=[[O.x+S,O.y],[O.x-S,O.y],[O.x,O.y+S],[O.x,O.y-S]];if(off){[0.45,-0.45].forEach(o=>{r.push([O.x+S,O.y+o*S],[O.x-S,O.y+o*S],[O.x+o*S,O.y+S],[O.x+o*S,O.y-S]);});}return r;}
function groupOf(j,ex){const gp=[j];let ch=true;while(ch){ch=false;for(let k=0;k<3;k++){if(k===ex||gp.includes(k))continue;if(gp.some(m=>touch(cinfo(rooms[m],rooms[k]),true))){gp.push(k);ch=true;}}}return gp;}
// room i wants (x,y) beside room j; if that is off-screen, j's connected group may slide over a little
function fitCand(i,j,x,y){
  if(inBounds(x,y)&&!overlapsAny(i,x,y))return {x,y,dx:0,dy:0,grp:null};
  const b=bounds();const cx=clamp(x,b.x0,Math.max(b.x0,b.x1)),cy=clamp(y,b.y0,Math.max(b.y0,b.y1));const dx=cx-x,dy=cy-y;

function nearestFree(i){const R=rooms[i],b=bounds();let best=null,bd=1e9;

function computeSnap(i){

    if(was.includes(j)&&inf.gap>4)continue; // pulled away on purpose: let it rest apart

      if(inf.axis==='h'){const tx=O.x+inf.nx*S,d=R.y-O.y;const ty=Math.abs(d)<S*0.22?O.y:O.y+clamp(d,-S*0.72,S*0.72);consider(j,tx,ty,1);}

function lCompletions(){ // positions that would make 3 rooms meet at one corner

}
function lineCompletions(){
  const out=[];
  for(let i=0;i<3;i++){const o=[0,1,2].filter(j=>j!==i);const A=rooms[o[0]],B=rooms[o[1]],ab=cinfo(A,B);if(!touch(ab))continue;
    let pts=[];if(ab.axis==='h')pts=[[Math.min(A.x,B.x)-S,A.y],[Math.max(A.x,B.x)+S,A.y]];else pts=[[A.x,Math.min(A.y,B.y)-S],[A.x,Math.max(A.y,B.y)+S]];
    pts.forEach(p=>{const c=fitCand(i,o[0],p[0],p[1]);if(c)out.push({i,x:c.x,y:c.y,c,d:hyp(c.x-rooms[i].x,c.y-rooms[i].y)});});}
  return out.sort((a,b)=>a.d-b.d);

function bestSide(R,O,excludeTouch){
  let best=null,bd=1e9;
  sidePositions(O,true).forEach((p,k)=>{const c=fitCand(R.i,O.i,p[0],p[1]);if(!c)return;const d=hyp(c.x-R.x,c.y-R.y);if(d<2)return;
    if(excludeTouch){const t=[0,1,2].find(j=>j!==R.i&&j!==O.i);const q=rooms[t];const qx=q.x+(c.grp&&c.grp.includes(t)?c.dx:0),qy=q.y+(c.grp&&c.grp.includes(t)?c.dy:0);if(touch(cinfo({x:qx,y:qy},{x:c.x,y:c.y})))return;}

// ---------- holders ----------
function roomPt(ri,rx,ry){const r=rooms[ri];return {x:r.x+rx*S,y:r.y+ry*S};}
function triSlot(k){
  const geo=tri.geo;if(!geo)return {x:CX,y:CY};
  if(geo.type==='hub'){if(k==='c')return {x:geo.x,y:geo.y};const pi=k;const r=rooms[pi];const dx=r.x-geo.x,dy=r.y-geo.y,l=hyp(dx,dy)||1;return {x:geo.x+dx/l*S*0.1,y:geo.y+dy/l*S*0.1};}
  const tl=lineTable();
  if(k==='c')k=geo.mid;
  const r=rooms[k];return geo.axis==='h'?{x:r.x,y:tl.y}:{x:tl.x,y:r.y+S*0.02};
}
function holderPos(it){
  const h=it.holder;
  switch(h.t){
    case 'home':{const hp=it.kind==='bread'?BREAD_HOME[it.idx]:PLATE_HOME[it.idx];return roomPt(it.owner,hp[0],hp[1]);}
    case 'hand':{const p=persons[h.who];let k=0;for(const o of items){if(o===it)break;if(o.holder.t==='hand'&&o.holder.who===h.who)k++;}return {x:p.hF.x,y:p.hF.y-k*S*0.035};}
    case 'f':{const f=furn[h.key];if(!f.info)return {x:it.x,y:it.y};return fpos(f,h.s,h.o||0);}
    case 'plate':{const pl=byId(h.id);return {x:pl.x,y:pl.y-S*0.022};}
    case 'tri':return triSlot(h.k);
    case 'path':{const pts=h.pts,n=pts.length/2-1;const tt=clamp((gt-h.t0)/h.dur,0,1)*n;const k=Math.min(n-1,Math.floor(tt)),fr=tt-k;return {x:lerp(pts[k*2],pts[k*2+2],ease(fr)),y:lerp(pts[k*2+1],pts[k*2+3],ease(fr))};}
    case 'pt':return {x:h.x,y:h.y};

function updateItems(dt){

    const t=holderPos(it);

// ---------- persons update ----------

function seamRel(pi,f,plaza){

function personTargets(){

  if(tri.active&&tri.geo){
    persons.forEach(p=>{const s=triSeatRel(p.i);p.trx=s.rx;p.try_=s.ry;p.seatT=plaza?1:0;p.look=triCenter();});

}
function updatePersons(dt){

      if(!conn&&!p.act&&mode==='in'){doAct(p,'wave',1.3);p.waveLook=nearestRoom(p.i);}}

// ---------- guidance (one target at a time) ----------
let guide=null,guideT=0,hint=null,hintShown=false;
function guidePoint(gd){
  if(!gd)return null;

  if(gd.k==='f'){const f=furn[gd.f];return f.info?fpos(f,0,0):null;}
  if(gd.k==='tri')return triCenter();
  if(gd.k==='handle')return {x:handle.x,y:handle.y};

}
function awayPos(R,O){const dx=R.x-O.x,dy=R.y-O.y;const ax=Math.abs(dx)>Math.abs(dy);const p={x:R.x+(ax?Math.sign(dx)*S*0.55:0),y:R.y+(ax?0:Math.sign(dy)*S*0.55)};

function wouldTri(i,x,y){const r=rooms[i],ox=r.x,oy=r.y;r.x=x;r.y=y;const t=detectTri(false);r.x=ox;r.y=oy;return t;}

    for(let j=0;j<3;j++){if(j===i)continue;if(cinfo(rooms[j],{x,y}).gap<S*mg)ok=false;}if(!ok)continue;const d=hyp(x-rooms[i].x,y-rooms[i].y);if(d<S*0.3)continue;if(d<bd){bd=d;best={x,y};}}

function leaveTri(){for(const i of [2,0,1]){const fs=freeSpot(i);if(fs)return {k:'room',i,to:fs};}

function wouldTriC(i,c){const sv=rooms.map(r=>[r.x,r.y]);rooms[i].x=c.x;rooms[i].y=c.y;if(c.grp)c.grp.forEach(k=>{rooms[k].x+=c.dx;rooms[k].y+=c.dy;});const t=detectTri(false);rooms.forEach((r,k)=>{r.x=sv[k][0];r.y=sv[k][1];});return t;}

function computeGuide(){

  if(mode==='plaza'){
    if(!cyc.plazaMoved){
      if(tri.active){const lv=leaveTri();if(lv)return lv;}
      else{const ps=pairSpot(2,0)||pairSpot(2,1)||pairSpot(0,1);const fs=ps?null:freeSpot(2);if(ps||fs)return {k:'room',i:ps&&!pairSpot(2,0)&&!pairSpot(2,1)?0:2,to:ps||fs};}

  return best||{k:'room',i:0,to:bestSide(rooms[0],rooms[1])};
}

// ---------- input (single active pointer; extra fingers ignored) ----------
let ptr=null;
function hitRoom(x,y){let best=null;for(const r of rooms){if(Math.abs(x-r.x)<S/2+4&&Math.abs(y-r.y)<S/2+4){if(!best||r.drag)best=r;}}return best;}
function hitFurn(x,y){
  if(mode==='plaza'&&handle.vis>0.5&&hyp(x-handle.x,y-handle.y)<handle.r*1.25)return {k:'handle'};
  if(tri.active&&tri.vis>0.5&&tri.geo){
    if(tri.geo.type==='hub'){if(hyp(x-tri.geo.x,y-tri.geo.y)<S*0.26)return {k:'tri'};}
    else{const t=lineTable();if(t.h){if(x>t.x0&&x<t.x1&&Math.abs(y-t.y)<S*0.12)return {k:'tri'};}else if(y>t.y0&&y<t.y1&&Math.abs(x-t.x)<S*0.12)return {k:'tri'};}

    if(k==='bm'&&mode==='in'){if(hyp(x-f.info.cx,y-(f.info.cy-S*0.04))<Math.max(30,S*0.12))return {k:'bell',f};}

function pressRoom(r){

let loadResult='none';

  const isInt=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
  if(!isInt(d.mb,0,2)||!isInt(d.mp,0,2))return null;
  if(!Array.isArray(d.ms)||d.ms.length>12||!d.ms.every(v=>isInt(v,-2,16)))return null;
  if(!Array.isArray(d.pl)||d.pl.length!==3)return null;

// ---------- update ----------
function updateRooms(dt){
  for(const r of rooms){
    if(r.drag){
      const k=1-Math.exp(-dt*32);const px=r.x,py=r.y;r.x+=(r.tx-r.x)*k;r.y+=(r.ty-r.y)*k;clampB(r);
      // shallow overlap: slide along the other room's edge; finger pushed deep inside: float over it
      let deep=false;for(const o of rooms){if(o===r)continue;const pxx=S-Math.abs(r.x-o.x),pyy=S-Math.abs(r.y-o.y);if(pxx>0&&pyy>0&&Math.min(pxx,pyy)>S*0.42)deep=true;}
      if(deep||r.hover){r.hover=overlapsAny(r.i,r.x,r.y);}
      if(!r.hover){
        for(let it=0;it<4;it++){let any=false;for(const o of rooms){if(o===r)continue;const dx=r.x-o.x,dy=r.y-o.y,pxx=S-Math.abs(dx),pyy=S-Math.abs(dy);
          if(pxx>0&&pyy>0){any=true;if(pxx<pyy)r.x+=(dx>=0?1:-1)*pxx;else r.y+=(dy>=0?1:-1)*pyy;}}clampB(r);if(!any)break;}
        if(overlapsAny(r.i,r.x,r.y)){r.hover=true;}
      }
    }else if(r.snapping){
      const k=1-Math.exp(-dt*(mode==='folding'?6:18));r.x+=(r.sx-r.x)*k;r.y+=(r.sy-r.y)*k;
      if(hyp(r.sx-r.x,r.sy-r.y)<0.6){r.x=r.sx;r.y=r.sy;r.snapping=false;r.sqv-=4.5;xyToUV(r);markSave();sfx.kotsun(persons[r.i].d.pitch*0.7);}
    }
    r.sqv+=(-r.sq*280-r.sqv*13)*dt;r.sq+=r.sqv*dt;r.sq=clamp(r.sq,-0.4,0.4);
    r.press+=((r.held?1:0)-r.press)*Math.min(1,dt*14);
  }
}
function updateFurn(dt){
  for(const k of FK){const f=furn[k];
    const tgt=f.active?1:f.preview;
    f.visV+=((tgt-f.vis)*160-f.visV*16)*dt;f.vis+=f.visV*dt;if(!f.active&&f.vis<0.01&&f.preview<0.01){f.vis=0;f.visV=0;}

    if(f.wig>0)f.wig=Math.max(0,f.wig-dt*3);
    if(f.bell>0)f.bell=Math.max(0,f.bell-dt*1.6);

    if(!f.active||mode!=='in')continue;

    if(k==='pm'){f.beatT-=dt;if(f.beatT<=0){f.beatT=0.62;const ph=f.beatN%12;if(ph<8)windowBeat(f);f.beatN++;}}
  }
  tri.vis+=((tri.active?1:0)-tri.vis)*Math.min(1,dt*6);
  if(tri.wig>0)tri.wig=Math.max(0,tri.wig-dt*3);
  if(tri.busy>0&&tri.busy<90)tri.busy-=dt;
}
function updateMode(dt){
  if(mode==='flipping'){flipT=Math.min(1,flipT+dt/1.8);if(flipT>=1){mode='plaza';cyc.plazaMoved=0;cyc.plazaPlayed=0;disc.plaza++;tri.busy=0;tri.step=0;plazaT=3;markSave();logEv('plaza');

  handle.vis+=((mode==='plaza'?1:0)-handle.vis)*Math.min(1,dt*4);

function updateParts(dt){

      if(p.t>=p.life){parts.splice(i,1);if(p.cb)try{p.cb();}catch(e){}continue;}}

function update(dt){

    mem:JSON.parse(JSON.stringify(mem)),cyc:Object.assign({},cyc),disc:JSON.parse(JSON.stringify(disc)),guide:guide?Object.assign({},guide):null,hint:!!hint,
    parts:parts.length,storageOK,loadResult,audio:AC?AC.state:'none',handle:{x:handle.x,y:handle.y,r:handle.r,vis:handle.vis}}),
  log:()=>evlog.slice(),
  snapPos:(i,j)=>bestSide(rooms[i],rooms[j]),
  free:(i,x,y)=>!overlapsAny(i,x,y)&&inBounds(x,y),
  place:(i,x,y)=>{if(overlapsAny(i,x,y)||!inBounds(x,y))return false;const r=rooms[i];r.x=x;r.y=y;r.sx=x;r.sy=y;r.snapping=true;return true;},
  lPos:()=>lCompletions(),
  linePos:()=>lineCompletions(),
};
})();
</script>
